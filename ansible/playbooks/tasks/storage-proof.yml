---
# Prove the QNAP CSI driver can still actually SERVE a volume after the upgrade.
#
# ── Why this is not redundant with the csinode gate ──────────────────────────
# `csinode.spec.drivers` being non-empty proves the driver REGISTERED. It does
# not prove it can provision, attach, stage and mount — and those are separate
# code paths that talk to the NAS, to iscsid and to multipathd. k8s-lab4 sat
# Ready with drivers registered and could not mount a thing; k8s-lab5 had a
# correct multipath.conf that multipathd had never loaded. Both would have
# passed a registration check.
#
# The QNAP driver is also the component with the worst history in this repo AND
# the one with a hard version ceiling, so "does storage still work" is exactly
# the question worth asking after each hop — while there is still a hop left to
# not take.
#
# ⚠️ Cleanup runs in `always`. qnap-iscsi is reclaimPolicy: Retain, so a
# deleted test PVC leaks the PV *and* the backend LUN on the NAS. The PV is
# flipped to Delete BEFORE the claim is removed so the backend volume goes too.

- name: "storage proof | clear any previous attempt"
  ansible.builtin.command: >-
    kubectl -n default delete pod {{ proof_name }} --ignore-not-found --wait=true
  changed_when: false

- name: "storage proof | clear any previous claim"
  ansible.builtin.command: >-
    kubectl -n default delete pvc {{ proof_name }} --ignore-not-found --wait=true
  changed_when: false

- name: Provision, mount and read back a real volume
  block:
    - name: "storage proof | render"
      ansible.builtin.set_fact:
        proof_manifest: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: {{ proof_name }}
            namespace: default
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: qnap-iscsi
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: {{ proof_name }}
            namespace: default
          spec:
            restartPolicy: Never
            # ── PodSecurity `restricted` (added 2026-09-02) ───────────────
            # `default` enforces restricted:v1.35 as of commit baecdb8
            # (2026-08-31, "PSA for the argocd and default namespaces").
            # This pod predates that and had NO securityContext at all, so
            # from that day the API server refused to create it and EVERY
            # join and role change failed at this gate. It failed SAFE -- the
            # node stays cordoned, which is the whole design -- but it means
            # no node could complete onboarding. Found on the k8s-7 join.
            #
            # The pod is made compliant rather than moved to a permissive
            # namespace, and that is deliberate: a proof that needs an
            # exemption proves less than the real workloads it stands in for.
            # All four things restricted demands are things a `dd` + `md5sum`
            # never needed anyway.
            #
            # ⚠️ runAsUser is NOT optional alongside runAsNonRoot. busybox's
            # image USER is root, and `runAsNonRoot: true` with no uid fails
            # at container CREATE with "container has runAsNonRoot and image
            # will run as root" -- which surfaces as a pod that never starts,
            # i.e. exactly like a storage failure, on a node whose storage is
            # fine.
            #
            # ⚠️ fsGroup is what makes /data WRITABLE to a non-root uid: the
            # volume arrives owned by root. Kubelet only applies it if the
            # driver permits, so this was checked against the driver rather
            # than assumed --
            #   kubectl get csidriver csi.trident.qnap.io \
            #     -o jsonpath='{.spec.fsGroupPolicy}'   -> ReadWriteOnceWithFSType
            # and this claim is ReadWriteOnce with fsType ext4, which is the
            # case that policy covers. If that driver value ever becomes
            # `None`, this proof fails with EACCES on a healthy node.
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile: { type: RuntimeDefault }
          {% if proof_node is defined and proof_node %}
            # Pinned so the proof tests THIS node's storage path rather than
            # wherever the scheduler happens to place it. Set by the Cilium
            # migration, where the whole question is whether the node that just
            # changed CNI can still mount a LUN. nodeName also bypasses the
            # scheduler, so it works while the node is still cordoned.
            nodeName: {{ proof_node }}
          {% endif %}
            tolerations:
              - operator: Exists
            containers:
              - name: proof
                image: busybox:1.37
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: [ALL] }
                command: [/bin/sh, -c]
                args:
                  - |
                    set -e
                    mount | grep /data
                    dd if=/dev/urandom of=/data/proof.bin bs=1M count=16
                    sync
                    md5sum /data/proof.bin
                    df -h /data
                    echo "STORAGE PROOF PASSED"
                volumeMounts:
                  - { name: proof, mountPath: /data }
            volumes:
              - name: proof
                persistentVolumeClaim: { claimName: {{ proof_name }} }

    - name: "storage proof | apply"
      ansible.builtin.shell: "kubectl apply -f -"
      args:
        stdin: "{{ proof_manifest }}"
      changed_when: true

    - name: "storage proof | wait for the pod to finish"
      ansible.builtin.command: >-
        kubectl -n default get pod {{ proof_name }} -o jsonpath={.status.phase}
      register: proof_phase
      changed_when: false
      until: proof_phase.stdout | trim in ['Succeeded', 'Failed']
      retries: 40
      delay: 10

    - name: "storage proof | read the verdict"
      ansible.builtin.command: "kubectl -n default logs {{ proof_name }}"
      register: proof_log
      changed_when: false
      failed_when: "'STORAGE PROOF PASSED' not in proof_log.stdout"

    - name: "storage proof | PASSED"
      ansible.builtin.debug:
        msg: >-
          QNAP CSI still provisions, attaches, stages and mounts on
          {{ k3s_version }}. {{ proof_log.stdout_lines | select('search', 'mpath|Filesystem|/data') | list | join(' | ') }}

  always:
    # Flip to Delete BEFORE removing the claim, or Retain leaks the PV and the
    # backend LUN and you are cleaning up with tridentctl later.
    # ⚠️ RETRIES ARE LOAD-BEARING (added 2026-09-02). This is an `always`
    # block, so it also runs when the play failed BEFORE the volume was bound
    # -- which is what happened on the k8s-7 join: the PVC was created, the
    # POD was rejected by PodSecurity, and this task read an EMPTY volumeName
    # a fraction of a second later. Empty volumeName skips the flip to Delete
    # AND the leak check, so the claim was deleted while Trident was still
    # provisioning and the PV was left Released with reclaimPolicy Retain --
    # a leaked PV and a leaked LUN, produced by the cleanup code itself.
    # qnap-iscsi is `volumeBindingMode: Immediate`, so the binding does not
    # wait for a consumer and a short wait always resolves it.
    - name: "storage proof | find the PV"
      ansible.builtin.command: >-
        kubectl -n default get pvc {{ proof_name }} -o jsonpath={.spec.volumeName}
      register: proof_pv
      changed_when: false
      failed_when: false
      until: (proof_pv.stdout | trim | length) > 0
      retries: 12
      delay: 5
      # ⚠️ ignore_errors, not just failed_when. Exhausting `until` marks a task
      # failed no matter what failed_when says, and a failure HERE -- inside
      # `always` -- would skip the pod and claim deletions below and leak the
      # very objects this block exists to remove. The 60s wait is best-effort:
      # if the PVC never existed (the apply itself failed) it costs a minute
      # and then cleanup carries on, which is the correct trade.
      ignore_errors: true

    # ⚠️ shell + single quotes, NOT command. ansible.builtin.command runs no
    # shell and shlex-splits, which STRIPS the double quotes out of the JSON
    # patch -- kubectl then gets {spec:{persistentVolumeReclaimPolicy:Delete}},
    # rejects it, and (with failed_when: false) the failure is invisible. The
    # PV stays Retain and the backend LUN leaks. Caught by the self-test's own
    # leak check, which is the only reason this was noticed at all.
    - name: "storage proof | make the PV self-deleting"
      ansible.builtin.shell: >-
        kubectl patch pv {{ proof_pv.stdout | trim }}
        -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'
      changed_when: true
      when: (proof_pv.stdout | trim | length) > 0

    - name: "storage proof | remove the pod"
      ansible.builtin.command: >-
        kubectl -n default delete pod {{ proof_name }} --ignore-not-found --wait=true
      changed_when: true
      failed_when: false

    - name: "storage proof | remove the claim"
      ansible.builtin.command: >-
        kubectl -n default delete pvc {{ proof_name }} --ignore-not-found --wait=true
      changed_when: true
      failed_when: false

    # 3 minutes, not 60s. Trident has to delete the LUN on the NAS before the PV
    # object goes, and on the 1.34 hop that took longer than the old 12x5s
    # window -- so the play reported "WARNING: PV still exists, check with
    # tridentctl" for a volume that was in fact reclaimed moments later. A leak
    # check that cries wolf is worse than none: it trains you to ignore the one
    # time it is real.
    - name: "storage proof | confirm nothing leaked"
      ansible.builtin.command: "kubectl get pv {{ proof_pv.stdout | trim }}"
      register: proof_gone
      changed_when: false
      failed_when: false
      until: proof_gone.rc != 0
      retries: 36
      delay: 5
      when: (proof_pv.stdout | trim | length) > 0

    - name: "storage proof | leak check result"
      ansible.builtin.debug:
        msg: >-
          {{ 'Test PV reclaimed, backend LUN released.' if proof_gone.rc | default(1) != 0
             else 'WARNING: PV ' ~ (proof_pv.stdout | trim) ~ ' still exists -- check with tridentctl.' }}
      when: (proof_pv.stdout | trim | length) > 0
