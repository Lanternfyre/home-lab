---
# Rotate the `tarjei` login/sudo password across the fleet.
#
#   ansible-playbook playbooks/70-rotate-node-password.yml --ask-become-pass
#
# `--ask-become-pass` is the CURRENT password. The prompt below asks for the NEW
# one. They are different things and the play needs both -- the old one to get
# in, the new one to set.
#
# ── Why this exists ─────────────────────────────────────────────────────────
# The edge node was built with a stronger password than the seven home nodes,
# and Ansible supplies ONE become password per run. Any play that spans the
# whole fleet -- 60-wireguard.yml must, because it renders each side's peer list
# from every node's key -- therefore cannot authenticate everywhere at once.
# Levelling the fleet up to the stronger password fixes that permanently.
#
# ── Why it is NOT in site.yml ───────────────────────────────────────────────
# Same reason 30-upgrade.yml and 40-add-node.yml are not: a converge must never
# be able to change the credential the operator uses to reach the cluster. This
# is a deliberate operation with a verification window.
#
# ── 🔴 THE TWO WAYS THIS GOES WRONG, AND WHAT STOPS THEM ───────────────────
#
# 1. A BAD HASH LOCKS YOU OUT OF EVERY NODE AT ONCE.
#    Mitigated three ways: the prompt CONFIRMS the password (a typo cannot pass
#    silently); `serial: 1` means one node is touched at a time; and the change
#    is immediately proven by re-authenticating with the NEW password before the
#    play moves on. `any_errors_fatal` then stops the run, so a bad rotation
#    costs you one node, not seven.
#
# 2. ANSIBLE AUTHENTICATES WITH THE PASSWORD IT IS CHANGING.
#    Every `become` task runs sudo with the password from --ask-become-pass. The
#    moment the password changes, further sudo on that host fails with the old
#    one. So the change is the LAST privileged task using the old credential,
#    and everything after it explicitly overrides `ansible_become_password` to
#    the new value. Getting this wrong does not corrupt anything -- it just
#    fails confusingly halfway -- but it is why the play is shaped this way.
#
# ⚠️ SSH KEYS ARE NOT TOUCHED. This changes the login/sudo password only. If
# your SSH access is key-based (it is), you are not locked out of the box even
# if the password is wrong -- you would simply be unable to sudo, and could fix
# it from the console or with the old password if it never applied.
#
# ── Recovery, if the verification fails on a node ───────────────────────────
# The old password still works IF the change task did not report `changed`. If
# it did change and verification still failed, use the provider console (or an
# existing root session) and run `passwd tarjei`. Do not re-run this play
# blindly against that host.

- name: Rotate the node login password
  # Defaults to the seven home nodes. The edge node is EXCLUDED because it
  # already carries the target password -- including it would fail at gathering
  # facts, since --ask-become-pass supplies the OLD one.
  #
  # Override deliberately if you ever need to rotate the edge too:
  #   -e target=k3s_edge
  hosts: "{{ target | default('k3s_nodes:!k3s_edge') }}"

  # ONE NODE AT A TIME. This is the difference between losing sudo on one
  # machine and losing it on the whole cluster.
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: true

  vars_prompt:
    - name: new_node_password
      prompt: "NEW password for '{{ lookup('env', 'USER') }}' on the target nodes"
      # Not echoed, and asked twice. A mistyped password that reached the hash
      # would be indistinguishable from a correct one until you tried to log in.
      private: true
      confirm: true

  tasks:
    - name: "guard | the new password must be long enough to be worth the rotation"
      ansible.builtin.assert:
        that:
          - new_node_password | length >= 12
        fail_msg: >-
          The new password is {{ new_node_password | length }} characters. This
          rotation exists to level the fleet UP to the edge node's stronger
          password -- setting a weak one here would spread the weaker credential
          to seven machines instead. Twelve characters is the floor.
        success_msg: "new password accepted ({{ new_node_password | length }} chars)"
      run_once: true
      no_log: true

    - name: "detect | confirm the account exists before changing it"
      ansible.builtin.command: "id -u {{ ansible_user }}"
      register: acct
      changed_when: false
      check_mode: false

    # ⚠️ THE LAST TASK THAT USES THE OLD CREDENTIAL.
    # `update_password: always` because the whole point is to overwrite an
    # existing password; the default (on_create) would silently do nothing on an
    # account that already exists, and the play would then "succeed" having
    # changed nothing.
    - name: "fix | set the new password"
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        password: "{{ new_node_password | password_hash('sha512') }}"
        update_password: always
      no_log: true
      register: pw_changed

    # ── Everything below authenticates with the NEW password ────────────────
    # Proven, not assumed. A hash that does not match what the user typed
    # produces a node you cannot sudo on, and the only signal would be the next
    # playbook failing days later.
    - name: "verify | sudo works with the NEW password"
      ansible.builtin.command: "id -u"
      vars:
        ansible_become_password: "{{ new_node_password }}"
      register: newpw_check
      changed_when: false
      # An explicit failed_when so a non-zero rc reads as what it is, rather
      # than as a generic task failure.
      failed_when: newpw_check.rc != 0
      no_log: true

    - name: "verify | report"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: password rotated and PROVEN -- sudo
          re-authenticated with the new credential
          (uid {{ newpw_check.stdout | default('?') }}).
          {{ 'No change was needed.' if not pw_changed.changed else '' }}

- name: What to do next
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: "report"
      ansible.builtin.debug:
        msg: >-
          Fleet password rotated. From now on --ask-become-pass takes the NEW
          password everywhere, including the edge node, so fleet-wide plays
          (60-wireguard.yml in particular, which must never be run with
          --limit) work in a single invocation. Re-run
          `ansible-playbook playbooks/90-preflight.yml` -- it needs no sudo --
          if you want a quick reachability check before the next real run.
