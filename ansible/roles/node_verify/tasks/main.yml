---
# Assertions, not configuration. Run after node_baseline and as a gate before
# uncordoning any node.
#
# DESIGN RULE, learned the hard way on 2026-08-01: assert BEHAVIOUR and VALUES,
# never file presence.
#   - /etc/sysctl.d/99-inotify.conf existed on all five nodes and had never
#     worked (value split across two lines).
#   - /etc/multipath.conf existed on k8s-4 and k8s-5 and was WRONG (missing
#     find_multipaths no), so neither could stage a QNAP volume.
# Both would have passed a "does the file exist" check. Neither passes these.
#
# SECOND DESIGN RULE, learned on 2026-08-02: every probe here carries
# `check_mode: false`. Ansible skips `command:`/`shell:` under --check and
# returns an EMPTY stdout, so `--check --diff` made this role assert
# `"" >= 1048576` and fail on all five nodes -- against sysctls that were
# correct. A verification role that cannot verify under --check is not a
# verification role. Nothing below writes anything, so running for real is
# always right.

# ── Is this node in the cluster at all? ─────────────────────────────────────
#
# Since 2026-08-19 the inventory can legitimately contain a node that has NOT
# joined yet: adding a host to k3s_nodes is the FIRST step of onboarding, and
# 40-add-node.yml is the second. Before this probe existed, `site.yml --tags
# verify` failed on such a node with `k3s ctr images pull` returning rc=2 --
# "command not found" dressed up as a broken container runtime.
#
# That is the "a gate placed before its own remedy blocks the repair" shape
# this repo has hit four times: the role that tells you whether a node is ready
# to join refused to run until the node had joined.
#
# ⚠️ This is the ONE file-presence check in a role whose stated design rule is
# to assert values and never file presence, and it is deliberate: the question
# "is k3s installed here" has no behavioural form -- every behavioural probe
# requires the binary that is missing. It is narrow on purpose. A node WITH
# k3s installed still gets every assertion at full strength, so this cannot
# mask a broken cluster member; it only distinguishes "not joined yet" from
# "joined and broken", which are different problems with different fixes.
- name: "Is k3s installed on this node yet?"
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary
  check_mode: false

- name: "Say so plainly when it is not"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} has NO k3s installed, so it is not a cluster
      member. The OS baseline assertions below still run at full strength --
      they are exactly what must pass BEFORE joining. The cluster-membership
      checks (containerd pull, csinode drivers) are skipped because they cannot
      mean anything yet. Join it with:
        ansible-playbook playbooks/40-add-node.yml --ask-become-pass
          -e target={{ inventory_hostname }}
  when: not k3s_binary.stat.exists

- name: DNS resolves external registries
  ansible.builtin.command: getent ahostsv4 registry.k8s.io registry-1.docker.io
  register: dns_check
  changed_when: false
  failed_when: dns_check.rc != 0
  check_mode: false

# The check that actually matters: it exercises CONTAINERD's resolver path,
# which is what broke on k8s-4.home, not the host's.
- name: containerd can pull an image
  ansible.builtin.command: /usr/local/bin/k3s ctr images pull docker.io/library/busybox:1.37
  register: pull_check
  changed_when: false
  failed_when: pull_check.rc != 0
  check_mode: false
  when: k3s_binary.stat.exists

- name: Read effective sysctl values
  ansible.builtin.command: "sysctl -n {{ item.key }}"
  register: sysctl_values
  changed_when: false
  check_mode: false
  loop: "{{ node_sysctls | dict2items }}"

- name: Assert sysctls are actually in effect
  ansible.builtin.assert:
    that: "item.stdout | int >= item.item.value | int"
    fail_msg: >-
      {{ item.item.key }} is {{ item.stdout }}, expected >= {{ item.item.value }}.
      The file existing is not enough -- check for a value split across lines.
    success_msg: "{{ item.item.key }} = {{ item.stdout }}"
  loop: "{{ sysctl_values.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Read multipath.conf
  ansible.builtin.slurp:
    src: /etc/multipath.conf
  register: multipath_content
  check_mode: false

# This exact assertion would have caught k8s-4 and k8s-5 before they were ever
# allowed to schedule a PVC-bearing pod.
- name: Assert multipath.conf actually sets find_multipaths
  ansible.builtin.assert:
    that:
      - "'find_multipaths' in (multipath_content.content | b64decode)"
      - "(multipath_content.content | b64decode) is search('find_multipaths\\s+' ~ node_multipath_find_multipaths)"
    fail_msg: >-
      /etc/multipath.conf on {{ inventory_hostname }} does not set
      "find_multipaths {{ node_multipath_find_multipaths }}". multipath-tools
      defaults to strict, so a single-path QNAP LUN gets no device-mapper entry
      and Trident fails to stage it with "multipath device not found when it is
      expected". THE FILE EXISTING IS NOT ENOUGH.
    success_msg: "multipath.conf sets find_multipaths {{ node_multipath_find_multipaths }}"

# The assertion above reads the FILE. That is not the same as multipathd having
# LOADED it, and the difference is not academic: on 2026-08-02 lab5 passed the
# content check with a correct multipath.conf written at 08:39 that multipathd
# -- last started 2026-07-31 -- had never read. The node still failed to stage a
# qnap-iscsi volume ("multipath device not found when it is expected"). A
# green verify run on a node that cannot mount a PVC is the exact failure this
# role exists to prevent, so assert the DAEMON, not just the file.
- name: Read multipath.conf mtime, multipathd start time, and live mpath devices
  ansible.builtin.shell: |
    set -e
    conf=$(stat -c %Y /etc/multipath.conf)
    started=$(date -d "$(systemctl show multipathd -p ActiveEnterTimestamp --value)" +%s)
    mpaths=$(ls /dev/mapper 2>/dev/null | grep -c mpath || true)
    # LOGGED_IN only. A session left behind by a failed or torn-down attach
    # sits in state FREE with its sd device `transport-offline`, and multipathd
    # is CORRECT not to map an offline device -- counting those made the
    # assertion below fail on debris rather than on a fault. Observed on
    # k8s-lab7, 2026-09-05: one FREE session, sda transport-offline, from a
    # storage proof that failed three days earlier.
    sessions=$(grep -l LOGGED_IN /sys/class/iscsi_session/*/state 2>/dev/null | wc -l)
    echo "$conf $started $mpaths $sessions"
  register: mpath_freshness
  changed_when: false
  check_mode: false

- name: "Interpret multipath freshness"
  ansible.builtin.set_fact:
    mp_conf_mtime: "{{ mpath_freshness.stdout.split()[0] | int }}"
    mp_started: "{{ mpath_freshness.stdout.split()[1] | int }}"
    mp_devices: "{{ mpath_freshness.stdout.split()[2] | int }}"
    mp_sessions: "{{ mpath_freshness.stdout.split()[3] | int }}"

- name: "Interpret multipath freshness | derive"
  ansible.builtin.set_fact:
    mp_stale: "{{ (mp_started | int) < (mp_conf_mtime | int) }}"

# A stale config is NOT automatically a failure, and conflating the two would
# make this role fail nodes that are behaving exactly as designed. node_baseline
# DELIBERATELY writes multipath.conf and defers the restart on any node with
# attached LUNs -- that is lab1/2/3, four LUNs each -- so the first time the
# template changes they are legitimately stale until their next restart.
#
# The discriminator is behavioural, not temporal: does the running daemon still
# produce device-mapper entries?
#   * stale + mpath devices present  -> deferred restart, staging demonstrably
#                                       works, takes effect at the next reboot.
#                                       WARN.
#   * stale + ZERO mpath devices     -> exactly lab5 on 2026-08-02: sessions
#                                       attached, no dm entries, and a proven
#                                       inability to stage a qnap-iscsi volume.
#                                       FAIL.
- name: "multipathd config is stale but staging still works (deferred restart)"
  ansible.builtin.debug:
    msg: >-
      NOTE: multipathd on {{ inventory_hostname }} predates its multipath.conf
      by {{ (mp_conf_mtime | int) - (mp_started | int) }}s, but the node has
      {{ mp_devices }} live multipath device(s), so staging works and the
      restart was deferred on purpose ({{ mp_sessions }} iSCSI session(s)
      attached). The new config takes effect at the next restart or reboot --
      which the k3s upgrade provides. To force it sooner, drain the node and
      re-run with -e multipath_force_restart=true.
  when:
    - mp_stale | bool
    - (mp_devices | int) > 0

- name: Assert multipathd is not running a stale config on a node that cannot stage
  ansible.builtin.assert:
    that: "not (mp_stale | bool) or (mp_devices | int) > 0"
    fail_msg: >-
      multipathd on {{ inventory_hostname }} started
      {{ (mp_conf_mtime | int) - (mp_started | int) }}s BEFORE
      /etc/multipath.conf was last written, and the node has ZERO multipath
      devices ({{ mp_sessions }} iSCSI session(s) attached). The running daemon
      is using the OLD config and this node will fail to stage a QNAP volume
      with "multipath device not found when it is expected" -- the file being
      correct is not enough. Fix:
      ansible-playbook playbooks/10-baseline.yml --ask-become-pass
      --limit {{ inventory_hostname }} -e multipath_force_restart=true
    success_msg: >-
      multipath config effective ({{ mp_devices }} mpath device(s),
      {{ 'daemon newer than config' if not (mp_stale | bool) else 'stale but staging works' }})

# ── The assertion that would have caught k8s-lab7 (added 2026-09-02) ────────
#
# The freshness check above only fires when the DAEMON predates the CONFIG. On
# k8s-lab7 it did not -- multipathd restarted one second after the file was
# written -- and the node still could not stage a volume, because the config
# it correctly loaded blacklisted `sda`, and on that node (NVMe root, no SATA
# disk) sda IS the QNAP LUN. Everything a file check or a freshness check can
# see was right; the node was still the k8s-4 condition.
#
# So assert the outcome instead: a node with an iSCSI session attached must
# have a multipath map for it. That is the whole contract between iscsid,
# multipathd and the CSI driver, and it is what Trident means by "multipath
# device not found when it is expected".
- name: Assert an attached iSCSI session actually produced a multipath device
  ansible.builtin.assert:
    that: (mp_sessions | int) == 0 or (mp_devices | int) > 0
    fail_msg: >-
      {{ inventory_hostname }} has {{ mp_sessions }} LOGGED_IN iSCSI session(s)
      and ZERO multipath devices. The LUN is visible to the SCSI layer and
      multipathd is not mapping it, so Trident will fail to stage with
      "multipath device not found when it is expected". The usual cause is the
      blacklist: check what the LUN enumerates as and what vendor it reports --
        for d in /sys/block/sd*; do echo "$d $(cat $d/device/vendor)"; done
      A node whose only local disk is NVMe gets its first LUN at /dev/sda,
      which the pre-2026-09-02 blacklist excluded by name.
    success_msg: >-
      {{ mp_sessions }} iSCSI session(s), {{ mp_devices }} multipath device(s)
      -- the LUNs attached here are mapped

- name: Assert storage services are running
  ansible.builtin.command: "systemctl is-active {{ item }}"
  register: svc_check
  changed_when: false
  failed_when: svc_check.stdout != 'active'
  check_mode: false
  loop:
    - iscsid
    - multipathd

# THE HEADLINE GATE. An empty csinode.spec.drivers on a Ready, untainted,
# schedulable node is exactly k8s-4.home's condition, and NOTHING in
# `kubectl get nodes` reveals it. Any PVC-bearing pod that lands there hangs in
# ContainerCreating forever.
#
# Uses on-node `k3s kubectl` rather than the workstation's client, which is
# v1.27.2 against a v1.35 server -- EIGHT minors of skew (the upgrade
# campaign landed; count corrected 2026-08-22).
#
# ⚠️ RETRIES ARE LOAD-BEARING (added 2026-08-22). A node that has just
# rejoined -- e.g. every 45-change-node-role.yml demotion -- is Ready before
# its trident-node DaemonSet pod has started and registered the driver, so a
# single-shot check fails on a perfectly healthy node and aborts the role
# change half-done (cordoned, unverified). The k8s-4 condition this gate
# exists for is PERMANENT, so waiting a minute costs nothing and only the
# real fault survives it.
- name: Node has at least one registered CSI driver
  ansible.builtin.shell: >-
    /usr/local/bin/k3s kubectl get csinode {{ k8s_node_name }}
    -o jsonpath='{.spec.drivers[*].name}'
  register: csinode_check
  changed_when: false
  until: csinode_check.stdout | trim | length > 0
  retries: 12
  delay: 10
  failed_when: csinode_check.stdout | trim | length == 0
  check_mode: false
  delegate_to: "{{ k3s_control_plane_host }}"
  # A node that has not joined has no csinode object -- and no Node object
  # either. Skipped rather than failed; see the probe at the top of this file.
  when: k3s_binary.stat.exists

- name: Summary
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: DNS ok, sysctls ok, multipath.conf ok,
      iscsid+multipathd active
      {{ ', image pull ok, CSI drivers = ' ~ csinode_check.stdout
         if k3s_binary.stat.exists
         else '-- OS baseline PASSES and this node is ready to join. Not a
               cluster member yet, so image pull and CSI drivers were not
               checked.' }}
