---
# Replace the kube-vip control-plane VIP workload with a DaemonSet.
#
# NOT part of site.yml. This is a deliberate operation: the API VIP
# {{ k3s_api_vip }} briefly drops while the old Pod is pruned and the first
# DaemonSet pod claims the lease, and that VIP is the --server join target in
# the other nodes' systemd units. Run it with a human watching.
#
# Idempotent: re-running against an already-converted cluster rewrites the same
# bytes, the checksum does not change, and k3s reconciles nothing.

- name: "detect | current addon manifest"
  ansible.builtin.slurp:
    src: "{{ kube_vip_manifest_path }}"
  register: kv_current
  failed_when: false
  check_mode: false

- name: "detect | is this already a DaemonSet?"
  ansible.builtin.set_fact:
    kv_present: "{{ kv_current.content is defined }}"
    kv_already_ds: >-
      {{ (kv_current.content | default('') | b64decode) is search('kind:\s*DaemonSet') }}

# A missing file used to be fatal here, on the theory that writing a second
# copy would put two deploy controllers on one objectset. That reasoning was
# backwards. Every k3s server ALREADY reconciles this addon from its own
# manifests directory; the danger is not a second copy, it is a second copy
# with DIFFERENT content. A stale kube-vip.yaml on any node fights the managed
# one, and the addon flaps between DaemonSet and bare Pod depending on which
# server restarted last -- observed twice during the 1.34/1.35 hops, each time
# taking the API VIP down.
#
# So this role now runs on EVERY server and writes identical content. Same
# bytes everywhere means the same checksum, and nothing to fight over.
- name: "detect | note where the manifest was absent"
  ansible.builtin.debug:
    msg: >-
      {{ kube_vip_manifest_path }} did not exist on {{ inventory_hostname }};
      establishing it so every server's deploy controller agrees.
  when: not kv_present

- name: "backup | keep the previous manifest"
  ansible.builtin.copy:
    src: "{{ kube_vip_manifest_path }}"
    dest: "{{ kube_vip_manifest_path }}.pre-daemonset"
    remote_src: true
    mode: "0600"
    force: false          # never clobber an existing rollback point
  when:
    - kv_present
    - not kv_already_ds

- name: "apply | write the DaemonSet manifest"
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: "{{ kube_vip_manifest_path }}"
    mode: "0600"
    # A manifest that does not parse is applied by nothing and prunes nothing,
    # so a syntax error here would fail silently as "the VIP stopped moving".
    #
    # Deliberately a plain YAML parse, NOT `k3s kubectl apply --dry-run`: this
    # runs inside the write path of the one operation that can take the API VIP
    # down, so it must not itself depend on the API server being reachable
    # through that VIP. Schema validity is established at authoring time
    # instead -- the rendered manifest was checked with
    # `kubectl apply --dry-run=server` against the live cluster. This catches
    # the failure mode that actually belongs here: a template that rendered to
    # something unparseable.
    validate: "python3 -c 'import sys,yaml; list(yaml.safe_load_all(open(sys.argv[1])))' %s"
  register: kv_written

- name: "report | nothing to do"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} already carried the DaemonSet manifest and it
      rendered identically, so the addon checksum is unchanged and k3s
      reconciles nothing. No VIP interruption.
  when:
    - kv_already_ds | bool
    - not kv_written.changed
