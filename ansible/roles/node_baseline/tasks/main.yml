---
# Make a node fit to run k3s + the QNAP CSI driver.
#
# DESIGN: DETECT, then remediate ONLY what actually fails.
#
# Every fix below is gated on a check of the node's EFFECTIVE state, not on
# whether a file exists or matches a template byte-for-byte. That matters here:
#   * k8s-lab1/2/3 already have correct multipath settings; rewriting the file
#     just to add a "managed by Ansible" header would mark them changed and
#     invite a needless multipathd restart on nodes with 4 attached LUNs each.
#   * k8s-lab4/lab5 have a multipath.conf that EXISTS and is WRONG.
#   * the inotify sysctl file exists on all five and has never worked.
#
# So: assert behaviour, remediate the failures, leave the rest alone.
# Safe to run against all five nodes at any time.
#
# ⚠️ EVERY detect task below carries `check_mode: false`, and that is load-
# bearing. Ansible SKIPS `command:`/`shell:` tasks under --check, returning
# rc=0 with an EMPTY stdout. The detect logic then reads "" and concludes the
# node is broken -- so `--check --diff` reported sysctls=BROKEN and
# services=BROKEN on all five nodes, and liveLUNs=0 on lab1/2/3 which actually
# carry 4 LUNs each. Every one of those readings was an artefact, and the
# verify play then hard-failed asserting `"" >= 1048576`.
#
# Detection is read-only, so it must run in check mode. Only the `fix |` tasks
# below should be simulated. This is the same bug class as the rest of this
# repo: something that looked correct and had never worked.

# ─────────────────────────── DETECT ───────────────────────────

- name: "detect | can this node resolve public DNS?"
  ansible.builtin.command: getent ahostsv4 registry.k8s.io
  register: t_dns
  changed_when: false
  failed_when: false
  check_mode: false

- name: "detect | current multipath.conf"
  ansible.builtin.slurp:
    src: /etc/multipath.conf
  register: t_multipath
  failed_when: false
  check_mode: false

- name: "detect | live iSCSI sessions"
  ansible.builtin.command: ls /sys/class/iscsi_session
  register: t_iscsi
  changed_when: false
  failed_when: false
  check_mode: false

- name: "detect | effective sysctl values"
  ansible.builtin.command: "sysctl -n {{ item.key }}"
  register: t_sysctl
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ node_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "detect | service states"
  ansible.builtin.command: "systemctl is-active {{ item }}"
  register: t_svc
  changed_when: false
  failed_when: false
  check_mode: false
  loop: [iscsid, multipathd]

- name: "detect | summarise"
  ansible.builtin.set_fact:
    needs_dns: "{{ t_dns.rc != 0 }}"
    needs_multipath: >-
      {{ (t_multipath.content | default('') | b64decode)
         is not search('find_multipaths\s+' ~ node_multipath_find_multipaths) }}
    needs_sysctl: >-
      {{ t_sysctl.results | selectattr('stdout', 'defined')
         | selectattr('stdout', 'ne', '')
         | map(attribute='stdout') | map('int') | list
         != node_sysctls.values() | map('int') | list
         or (t_sysctl.results | selectattr('rc', 'ne', 0) | list | length > 0) }}
    needs_services: "{{ t_svc.results | selectattr('stdout', 'ne', 'active') | list | length > 0 }}"
    has_luns: "{{ (t_iscsi.stdout | default('') | trim | length) > 0 }}"

- name: "detect | report"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      DNS={{ 'BROKEN' if needs_dns else 'ok' }},
      multipath={{ 'BROKEN' if needs_multipath else 'ok' }},
      sysctls={{ 'BROKEN' if needs_sysctl else 'ok' }},
      services={{ 'BROKEN' if needs_services else 'ok' }},
      liveLUNs={{ t_iscsi.stdout_lines | default([]) | length }}

# ───────────────────── REMEDIATE (only failures) ─────────────────────

# --- DNS: only touched where resolution is actually broken. ---
# NOT managing the /etc/resolv.conf symlink: all five nodes point at
# stub-resolv.conf and lab1/2/3 have been healthy that way for 211 days.
- name: "fix | pin global DNS resolvers"
  when: needs_dns
  tags: [dns]
  block:
    - name: "fix | ensure resolved.conf.d exists"
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: "fix | write resolver drop-in"
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/99-homelab.conf
        mode: "0644"
        content: |
          # Managed by Ansible -- ansible/roles/node_baseline
          [Resolve]
          DNS={{ node_dns_servers }}
          FallbackDNS={{ node_dns_fallback }}
          DNSStubListener=yes

    - name: "fix | restart systemd-resolved"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted

    - name: "fix | settle"
      ansible.builtin.wait_for: { timeout: 5 }

    # Under --check nothing was actually restarted, so re-testing would just
    # re-observe the broken state and report a failure that has not happened.
    - name: "fix | re-test resolution"
      when: not ansible_check_mode
      ansible.builtin.command: getent ahostsv4 registry.k8s.io
      register: dns_retry
      changed_when: false
      failed_when: false
      check_mode: false

    # k8s-lab4's stub returns REFUSED to glibc while resolvectl works, and a
    # config rewrite alone has not cleared it. Say so rather than reporting
    # success on a node that still cannot pull images.
    - name: "fix | DNS still broken after restart"
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} STILL cannot resolve after writing the
          drop-in and restarting systemd-resolved. Its resolver stub is wedged
          at a level config does not reach. REBOOT THIS NODE, then re-run.
          Until it resolves, containerd cannot pull any image and the node
          will have zero registered CSI drivers.
      when:
        - not ansible_check_mode
        - dns_retry.rc | default(0) != 0

# --- sysctls: broken on all five (value wrapped onto a second line). ---
- name: "fix | remove the broken hand-written inotify file"
  when: needs_sysctl
  ansible.builtin.file:
    path: /etc/sysctl.d/99-inotify.conf
    state: absent

- name: "fix | apply kernel tunables"
  when: needs_sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-homelab.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ node_sysctls | dict2items }}"

# Skipped under --check: the tunables were not actually applied, so reading
# them back would report the pre-fix value as a failure.
- name: "fix | verify the kernel accepted them"
  when:
    - needs_sysctl
    - not ansible_check_mode
  ansible.builtin.command: "sysctl -n {{ item.key }}"
  check_mode: false
  register: sysctl_after
  changed_when: false
  failed_when: sysctl_after.stdout | int < item.value | int
  loop: "{{ node_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }} >= {{ item.value }}"

# --- storage packages: idempotent, cheap, always ensured. ---
- name: "fix | install storage packages"
  tags: [storage]
  ansible.builtin.apt:
    name: "{{ node_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- multipath: only where find_multipaths is not already correct. ---
- name: "fix | write multipath.conf"
  tags: [storage]
  when: needs_multipath
  ansible.builtin.copy:
    dest: /etc/multipath.conf
    mode: "0644"
    content: |
      # Managed by Ansible -- ansible/roles/node_baseline
      #
      # find_multipaths no is REQUIRED by the QNAP CSI driver. multipath-tools
      # 0.9.4 defaults it to "strict", under which a single-path LUN gets no
      # device-mapper entry and Trident fails to stage the volume with
      #   "multipath device not found when it is expected"
      defaults {
          find_multipaths {{ node_multipath_find_multipaths }}
          user_friendly_names yes
      }
      blacklist {
          devnode "^(ram|raw|loop|fd|md|dm-|sr|scd|st|sda)[0-9]*"
      }
  register: multipath_written

# Writing the file is safe. RESTARTING multipathd is the risky part on a node
# with attached LUNs -- so that, and only that, is gated. It is SKIPPED, never
# fatal: an earlier `fail` here would have aborted the whole play on lab1/2/3
# and refused to fix lab5, which carries a leftover test session.
#
# ⚠️ multipath_force_restart MUST short-circuit `multipath_written.changed`,
# and getting that wrong made the escape hatch unreachable by the only node it
# was built for. lab5's multipath.conf was already correct ON DISK -- written
# 2026-08-02 08:39, never loaded, because multipathd last started 2026-07-31.
# So `needs_multipath` was false, the copy task skipped, `multipath_written`
# stayed undefined, and the restart was skipped EVEN WITH the force flag set.
# The documented lab5 recovery command was a no-op that reported success.
#
# Restart when: forced, OR (we just rewrote the file AND no LUNs are at risk).
- name: "fix | restart multipathd"
  tags: [storage]
  when: >-
    (multipath_force_restart | default(false) | bool)
    or ((multipath_written.changed | default(false)) and not has_luns)
  ansible.builtin.systemd:
    name: multipathd
    state: restarted

- name: "fix | multipathd restart deferred"
  tags: [storage]
  when:
    - multipath_written.changed | default(false)
    - has_luns
    - not (multipath_force_restart | default(false) | bool)
  ansible.builtin.debug:
    msg: >-
      multipath.conf updated on {{ inventory_hostname }}, which has
      {{ t_iscsi.stdout_lines | default([]) | length }} attached LUN(s), so
      multipathd was NOT restarted. The file is on disk and takes effect at the
      next restart or reboot -- which the k3s upgrade provides. To force it
      sooner, drain the node and re-run with -e multipath_force_restart=true.

# --- services: enable/start only where not already active. ---
- name: "fix | enable and start storage services"
  tags: [storage]
  when: needs_services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [iscsid, multipathd]

# --- optional, opt-in only ---
- name: "fix | passwordless sudo (opt-in)"
  when: configure_nopasswd_sudo | bool
  ansible.builtin.copy:
    dest: /etc/sudoers.d/50-ansible
    mode: "0440"
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: /usr/sbin/visudo -csf %s
