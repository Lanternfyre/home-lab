---
# nftables on the public edge node. See EDGE-NODE.md finding 17.
#
# ⚠️ WHY THIS EXISTS AT ALL: `node-ip` changes what k3s ADVERTISES, not what it
# BINDS. The moment k3s installs, kubelet :10250, Cilium health :4240 and VXLAN
# :8473/udp listen on 0.0.0.0 -- which on this machine is the internet. Envoy
# adds :19001-19003 later. Measured on edge-1 before the join: `nft list
# ruleset` was EMPTY and only sshd was listening.
#
# So this role is a PREREQUISITE OF THE JOIN, not a follow-up. It runs before
# k3s exists, so there is never a window.

# Ports reachable from anywhere. Keep this list short and justified; every
# entry is a decision.
edge_fw_public_tcp:
  - { port: 22, why: "SSH -- the out-of-band path that must survive wg0 being down" }

edge_fw_public_udp:
  - { port: 51820, why: "WireGuard. Home dials in to this and nothing else." }

# The game/service ports published through the edge Gateway. These are the
# ONLY other things the internet may reach.
#
# ⚠️ Every listener added to the `homelab-edge` Gateway needs a line here too.
# A Gateway listener with no firewall rule is a service that silently does not
# work; a firewall rule with no listener is a port that answers nothing. The
# EnvoyProxy admin ports (19001-19003) are deliberately NOT here -- they bind
# 0.0.0.0 and must not be reachable.
edge_fw_service_tcp:
  - { port: 7171, why: "ot-demo login listener (the Phase C proof target)" }
  - { port: 7172, why: "ot-demo game listener" }
edge_fw_service_udp:
  - { port: 7173, why: "ot-demo UDP echo (proves the UDPRoute path)" }

# ── PRIVILEGED PUBLIC PORTS, AND WHY THEY ARE NOT PLAIN LISTENERS ───────────
#
# A service that must answer below port 1024 cannot simply be a listener. Under
# `hostNetwork` Envoy would bind the port itself, which needs NET_BIND_SERVICE
# -- and `gateway-edge-pod-constraints` forbids added capabilities
# UNCONDITIONALLY, its comment saying the edge listeners are deliberately above
# 1023 so that capability is never needed. Granting it would weaken the one
# containment policy standing in front of an internet-facing namespace, to
# change a port number.
#
# Instead: Envoy Gateway is told NOT to use the listener port as the container
# port (`useListenerPortAsContainerPort: false` on the EnvoyProxy CR), which
# makes it shift PRIVILEGED listener ports by +10000 -- a :443 listener binds
# :10443 on the host, needing no capability -- and nftables rewrites the public
# port to the shifted one on the way in.
#
# 🔴 EACH ENTRY EMITS TWO RULES AND BOTH ARE REQUIRED:
#     prerouting  dnat   public_port   -> listener_port
#     input       accept listener_port    <- NOT public_port
#
# DNAT happens at prerouting, BEFORE the input hook, so by the time the filter
# chain sees the packet its destination port is ALREADY the listener port. An
# input rule written against the public port never matches, and the connection
# dies silently after a successful DNAT -- which reads like a broken backend and
# sends you looking in the cluster.
#
# ⚠️ `listener_port` MUST be `public_port + 10000`, because that is Envoy
# Gateway's own shift and nothing reconciles the two. Any other value means
# nftables and Envoy disagree about where the traffic goes, silently.
#
# ⚠️ Kernel IP forwarding is NOT needed. The DNAT target is a port on THIS host
# (Envoy runs hostNetwork here), so the packet is delivered locally and never
# routed. Do not add net.ipv4.ip_forward for this.
edge_fw_service_tcp_dnat:
  - public_port: 443
    listener_port: 10443
    why: >-
      NetBird. Since 0.29 its management API/gRPC, signal gRPC and relay
      WebSocket are multiplexed onto ONE HTTPS endpoint, and it wants :443 --
      restrictive networks routinely allow 443 and nothing else, which is
      exactly when someone reaches for a VPN. Cloudflare Tunnel cannot carry it
      either: gRPC over a public hostname is unsupported.

# ── HOST-BOUND SERVICES THAT ARE NOT GATEWAY LISTENERS ──────────────────────
#
# A hostNetwork workload that binds its own ports on this node, rather than
# being published through `homelab-edge`. Kept apart from edge_fw_service_*
# DELIBERATELY: those pair 1:1 with Gateway listeners and
# scripts/audit-edge-exposure.py fails any entry there with no listener. These
# entries have no listener by definition; the audit checks each against the
# `workload` it names instead.
#
# Entry shape: proto (tcp|udp), then `port` OR `range: [lo, hi]`, optional
# `saddr: [cidr, ...]` to restrict the source, `workload: ns/deployment`, why.
#
# 🔴 Asterisk (apps: gitops/clusters/home/voice). SIP and RTP cannot go through
# the edge Envoy -- see EDGE-NODE.md "Asterisk".
#   * 5060/udp is ABSENT ON PURPOSE. Halonet's traffic comes back along the
#     flow Asterisk's REGISTER opened (`ct state established,related`). Only if
#     Halonet turns out to send INVITEs from other addresses, add it here WITH
#     `saddr` -- never open to the world: 5060/udp is the most scanned port on
#     the internet after 22.
#   * The RTP range MUST equal rtpstart/rtpend in the asterisk-config
#     ConfigMap. A mismatch is one-way or no audio, with no error anywhere.
edge_fw_host_service:
  - proto: tcp
    port: 5061
    workload: voice/asterisk
    why: >-
      SIP over TLS. ElevenLabs sends its agents' outbound calls here. It has no
      static source IPs below its Enterprise tier, so this cannot be
      source-restricted; digest auth and TLS are the control.
  - proto: udp
    range: [20000, 20099]
    workload: voice/asterisk
    why: >-
      RTP for both call legs (Halonet and ElevenLabs), ~25 concurrent calls.
      ElevenLabs' media addresses are dynamic, so no source restriction.

# ── OUTBOUND CONFINEMENT BY UID ─────────────────────────────────────────────
#
# A process running as one of these uids may send out of the PUBLIC NIC and
# nothing else: not wg0 (home nodes: 6443, 4240, VXLAN 8473), not the CNI
# interfaces (the pod network, and service IPs via socket-LB), not lo (Envoy
# admin 19001-19003, kubelet). Rendered as an `output` chain in edge_filter.
#
# This is the compensating control for a hostNetwork workload that strangers
# can reach: hostNetwork carries the node's identity, so no
# CiliumNetworkPolicy can confine it, and the node's own identity is what
# edge-node-containment has to let through.
#
# 🔴 THE UID IS A CONTRACT WITH KYVERNO. `voice-pod-constraints` pins
# runAsUser 20060 on any hostNetwork pod in `voice`. Change one without the
# other and the workload runs, works, and is no longer confined.
edge_fw_confined_uids:
  - uid: 20060
    workload: voice/asterisk
    why: "Asterisk. Talks to Halonet and ElevenLabs on the internet and to nothing else."

# The interface facing the internet. Everything on wg0 is trusted; everything
# arriving here is not.
edge_fw_public_iface: "{{ node_nic | default('eth0') }}"
edge_fw_tunnel_iface: "{{ wg_interface | default('wg0') }}"
