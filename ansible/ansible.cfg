[defaults]
inventory            = inventory/homelab.yml
# Playbooks live in playbooks/, so Ansible's default lookup of
# <playbook_dir>/roles/ misses ansible/roles/. Point it at the real location.
# Paths are resolved relative to this file, so always run from ansible/.
roles_path           = ./roles
interpreter_python   = auto_silent
# NOTE: community.general.yaml as a stdout_callback was REMOVED in
# community.general 12.0.0. The supported equivalent is the builtin callback
# with result_format = yaml.
stdout_callback      = ansible.builtin.default
result_format        = yaml
display_skipped_hosts = false
retry_files_enabled  = false
# k8s-2.home and k8s-3.home currently fail host-key verification from this
# workstation. Either accept them once with ssh-keyscan (see MANUAL-STEPS.md)
# and set this back to True, or leave it False for a LAN-only inventory.
host_key_checking    = False

[privilege_escalation]
become        = true
become_method = sudo
# sudo requires a password on every node, so any playbook that changes something
# must be run with --ask-become-pass.
#
# Deliberately NOT become_ask_pass = true here: that forces a prompt even for
# read-only plays that set become: false (e.g. 90-preflight.yml), which makes
# the audit unusable in automation. Pass the flag explicitly instead.
#
# ansible_become_password is NEVER stored in this repo.
become_ask_pass = false

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=10
