---
ansible_user: tarjei

# ── The one knob ─────────────────────────────────────────────────────────────
# Change this, run playbooks/30-upgrade.yml, and the rolling upgrade flows.
#
# HARD CEILING: v1.35.x. The QNAP CSI driver (csi.trident.qnap.io) declares
# Kubernetes support only up to 1.35 -- even v1.6.2, released 2026-07-31.
# k3s "stable" is already v1.36.2, so the pre-flight assertion in the upgrade
# playbook is doing real work, not being theoretical.
#
# Upgrade path is one minor at a time:
#   v1.32.10+k3s1 -> v1.33.13+k3s1 -> v1.34.9+k3s1 -> v1.35.6+k3s1
k3s_version: "v1.35.6+k3s1"
k3s_max_version: "v1.36.0"     # assert k3s_version is strictly below this

# ── k3s bundled addons to disable ────────────────────────────────────────────
# Applied via /etc/rancher/k3s/config.yaml by the k3s_config role, and
# inherited automatically by playbooks/40-add-node.yml -- which is the point:
# k8s-lab4 and k8s-lab5 joined WITHOUT a config.yaml at all, so their deploy
# controllers kept reinstalling addons that lab1/2/3 were deleting.
#
#   traefik    -- not used; ingress-nginx serves all 13 Ingresses. The addon
#                 never installed successfully anyway: its helm-install job has
#                 crashlooped 640+ times because the Gateway API CRDs (owned by
#                 Envoy Gateway) lack Helm ownership labels. Left enabled, it
#                 re-runs on EVERY server restart -- so a rolling 5-node
#                 upgrade means five more attempts.
#
#   servicelb  -- k3s's bundled klipper-lb. MetalLB is the real LoadBalancer
#                 provider here (verified: every LoadBalancer Service carries
#                 metallb.io/ip-allocated-from-pool). klipper adds nothing and
#                 actively harms:
#                   * it binds hostPorts 80/443/53 on every node, and only one
#                     service can own each -- svclb-argocd-server has been
#                     Pending for 207 days losing that race.
#                   * it is implicated in k8s-lab4's DNS failure: its
#                     svclb-pihole-dns pods claim hostPort 53 but are stuck in
#                     ImagePullBackOff there, so port 53 is intercepted with no
#                     live backend and even 127.0.0.53 is refused -- which is
#                     why that node cannot resolve, cannot pull images, and
#                     therefore has zero registered CSI drivers. A loop that
#                     cannot break itself.
#
# ⚠️ servicelb is driven by a LEADER-ELECTED controller, so it must be set on
# ALL nodes and then k3s restarted (serial:1). Setting it on one node no-ops or
# flaps depending on who holds the lease. The existing svclb-* DaemonSets also
# need an explicit one-time delete -- disabling the addon does not remove them.
k3s_disable:
  - traefik
  - servicelb

# ── Control-plane VIP ────────────────────────────────────────────────────────
# Served by kube-vip. NOTE: currently a bare Pod on k8s-1 only, with empty
# ownerReferences -- if that node dies the VIP disappears, and it is also the
# --server join target baked into lab2-lab5's systemd units AND the tls-san.
# Converting it to a DaemonSet is tracked separately.
k3s_api_vip: "192.168.32.2"

# ── Node baseline ────────────────────────────────────────────────────────────
# Upstream resolvers. The nodes' link DNS is the router (192.168.33.1); pinning
# global resolvers here is what makes name resolution independent of it.
node_dns_servers: "1.1.1.1 8.8.8.8"
node_dns_fallback: "8.8.4.4"

# Required by the QNAP CSI driver. multipath-tools 0.9.4 defaults
# find_multipaths to "strict", under which a single-path QNAP LUN never gets a
# device-mapper entry and Trident fails with:
#   failed to stage volume: multipath device not found when it is expected
# Proven on k8s-5.home on 2026-08-01.
node_multipath_find_multipaths: "no"

# ── Surviving a partition to the NAS ─────────────────────────────────────────
#
# On 2026-08-08 00:25 UTC the QNAP went away for longer than the iSCSI
# replacement_timeout. The sequence, which is entirely default behaviour:
#
#   NAS unreachable -> iscsid gives up after replacement_timeout (120s default)
#   -> the SCSI layer returns EIO -> ext4 sees a write error on its journal
#   -> the journal ABORTS -> the filesystem enters permanent error state.
#
# The last step is the one that hurts: it does not heal when the network comes
# back. Six volumes stayed dead for a week -- all three postgres-ha instances,
# loki, mealie and pihole-data -- while iSCSI reported every session LOGGED_IN
# and Trident reported every volume healthy. Nothing was wrong at the storage
# layer by then. Only the in-kernel ext4 state was wedged, and only a full
# unmount/remount cleared it.
#
# So the fix is not "detect it faster", it is "never let EIO reach ext4".
#
# ⚠️ MEASURED, not assumed -- the first draft of this got it wrong. The obvious
# suspect is iscsid's replacement_timeout sitting at its 120s default, and it
# is NOT the problem here:
#
#   multipathd show maps format "%n|%Q"   ->  queueing = "-" on every LUN
#   cat /sys/class/iscsi_session/*/recovery_tmo  ->  5
#
# recovery_tmo is already 5s, so paths fail FAST, and no map has queueing at
# all. The `defaults {}` block carries no no_path_retry, and the QNAP LUNs
# match no built-in device entry, so they get the built-in default of "fail".
# (`multipathd show config | grep no_path_retry` is misleading here -- it hits
# dozens of hwtable entries for other vendors' arrays. Read %Q on the actual
# maps.) Net effect: I/O errors ~5 SECONDS after the NAS becomes unreachable.
# A brief blip is enough to destroy a filesystem.
#
# So the one setting that matters is no_path_retry, and 5s path failure is
# correct to KEEP -- fail the path fast, then let multipath hold the I/O.
# replacement_timeout is deliberately left alone.
#
#   * no_path_retry 120 -- with polling_interval 5, queue I/O for ~10 minutes
#     with no usable path before returning an error.
#
# ⚠️ The trade-off is real and deliberate: during a partition, pods that touch
# these volumes HANG instead of erroring. A hung process in uninterruptible
# sleep cannot be killed, so a partition longer than the queue window can leave
# pods stuck until the node reboots. That is the better failure for this
# cluster -- a ten-minute freeze is recoverable, an aborted journal is a week
# of downtime and a hand-driven recovery.
#
# Bounded (120) rather than infinite (`queue`) on purpose. `no_path_retry
# queue` never gives up, so a NAS that stays down does not degrade the node,
# it wedges kubelet on it permanently.
node_multipath_no_path_retry: 120
node_multipath_polling_interval: 5

# k3s and Trident both need generous inotify limits.
# NOTE: the pre-existing /etc/sysctl.d/99-inotify.conf on ALL five nodes has the
# value split across two lines, so max_user_watches has never actually applied
# anywhere. Verification asserts `sysctl -n`, never file presence.
node_sysctls:
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 8192
  fs.file-max: 2097152

node_packages:
  - open-iscsi
  - multipath-tools
  - nfs-common

# Opt-in only: `-e configure_nopasswd_sudo=true`. Trades a real security
# property (a standing credential on every control-plane node) for unattended
# runs. Off by default.
configure_nopasswd_sudo: false

# ── API-server OIDC (Phase 4) ────────────────────────────────────────────────
#
# Defining k3s_oidc_issuer_url is what makes roles/k3s_config render the
# `kube-apiserver-arg` block. Removing these three lines and re-running
# 20-config-converge.yml is the rollback.
#
# ⚠️ k3s refuses to start on an UNKNOWN apiserver flag, which is what makes
# this the riskiest routine change in the repo. The flag NAMES were therefore
# verified against the binary that actually runs them, not against docs:
#
#   grep -ac oidc-issuer-url /var/lib/rancher/k3s/data/current/bin/k3s   -> 3
#   grep -ac oidc-client-id  ...                                        -> 2
#   grep -ac oidc-username-claim ...                                    -> 1
#
# ⚠️ Grep the 217 MB binary under data/current/bin, NOT /usr/local/bin/k3s.
# The installed 79 MB binary is a wrapper that extracts the real runtime, and
# it contains NONE of the apiserver's flags -- `anonymous-auth` returns 0
# there, which is the control that proves the point. Searching the wrong file
# yields a confident false negative.
#
# A wrong VALUE behaves differently from a wrong flag name: the apiserver still
# starts, so the node stays Ready and etcd keeps quorum, and OIDC simply
# authenticates nobody. The health gates in 20-config-converge.yml CANNOT see
# that. The only real acceptance test is a login that yields an identity.
#
# Reuses the Google OAuth client that oauth2-proxy already uses, so there is
# one consent screen and one client to revoke. The client ID is not a secret.
k3s_oidc_issuer_url: "https://accounts.google.com"
k3s_oidc_client_id: "138732748534-v50ig1jfefsmfnf910a8ns4gpj2sj120.apps.googleusercontent.com"

# `email` is deliberate and load-bearing for RBAC. Kubernetes prefixes the
# username with the issuer URL for EVERY claim except `email`, which is exempt,
# so usernames stay bare addresses and the ClusterRoleBinding in
# gitops/.../headlamp/manifests/oidc-admin.clusterrolebinding.yaml matches.
# Changing this claim silently breaks that binding.
k3s_oidc_username_claim: "email"
