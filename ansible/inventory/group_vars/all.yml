---
ansible_user: tarjei

# ── The one knob ─────────────────────────────────────────────────────────────
# Change this, run playbooks/30-upgrade.yml, and the rolling upgrade flows.
#
# HARD CEILING: v1.35.x. The QNAP CSI driver (csi.trident.qnap.io) declares
# Kubernetes support only up to 1.35 -- even v1.6.2, released 2026-07-31.
# k3s "stable" is already v1.36.2, so the pre-flight assertion in the upgrade
# playbook is doing real work, not being theoretical.
#
# Upgrade path is one minor at a time:
#   v1.32.10+k3s1 -> v1.33.13+k3s1 -> v1.34.9+k3s1 -> v1.35.6+k3s1
k3s_version: "v1.32.10+k3s1"
k3s_max_version: "v1.36.0"     # assert k3s_version is strictly below this

# ── k3s bundled addons to disable ────────────────────────────────────────────
# Applied via /etc/rancher/k3s/config.yaml by the k3s_config role, and
# inherited automatically by playbooks/40-add-node.yml -- which is the point:
# k8s-lab4 and k8s-lab5 joined WITHOUT a config.yaml at all, so their deploy
# controllers kept reinstalling addons that lab1/2/3 were deleting.
#
#   traefik    -- not used; ingress-nginx serves all 13 Ingresses. The addon
#                 never installed successfully anyway: its helm-install job has
#                 crashlooped 640+ times because the Gateway API CRDs (owned by
#                 Envoy Gateway) lack Helm ownership labels. Left enabled, it
#                 re-runs on EVERY server restart -- so a rolling 5-node
#                 upgrade means five more attempts.
#
#   servicelb  -- k3s's bundled klipper-lb. MetalLB is the real LoadBalancer
#                 provider here (verified: every LoadBalancer Service carries
#                 metallb.io/ip-allocated-from-pool). klipper adds nothing and
#                 actively harms:
#                   * it binds hostPorts 80/443/53 on every node, and only one
#                     service can own each -- svclb-argocd-server has been
#                     Pending for 207 days losing that race.
#                   * it is implicated in k8s-lab4's DNS failure: its
#                     svclb-pihole-dns pods claim hostPort 53 but are stuck in
#                     ImagePullBackOff there, so port 53 is intercepted with no
#                     live backend and even 127.0.0.53 is refused -- which is
#                     why that node cannot resolve, cannot pull images, and
#                     therefore has zero registered CSI drivers. A loop that
#                     cannot break itself.
#
# ⚠️ servicelb is driven by a LEADER-ELECTED controller, so it must be set on
# ALL nodes and then k3s restarted (serial:1). Setting it on one node no-ops or
# flaps depending on who holds the lease. The existing svclb-* DaemonSets also
# need an explicit one-time delete -- disabling the addon does not remove them.
k3s_disable:
  - traefik
  - servicelb

# ── Control-plane VIP ────────────────────────────────────────────────────────
# Served by kube-vip. NOTE: currently a bare Pod on k8s-1 only, with empty
# ownerReferences -- if that node dies the VIP disappears, and it is also the
# --server join target baked into lab2-lab5's systemd units AND the tls-san.
# Converting it to a DaemonSet is tracked separately.
k3s_api_vip: "192.168.32.2"

# ── Node baseline ────────────────────────────────────────────────────────────
# Upstream resolvers. The nodes' link DNS is the router (192.168.33.1); pinning
# global resolvers here is what makes name resolution independent of it.
node_dns_servers: "1.1.1.1 8.8.8.8"
node_dns_fallback: "8.8.4.4"

# Required by the QNAP CSI driver. multipath-tools 0.9.4 defaults
# find_multipaths to "strict", under which a single-path QNAP LUN never gets a
# device-mapper entry and Trident fails with:
#   failed to stage volume: multipath device not found when it is expected
# Proven on k8s-5.home on 2026-08-01.
node_multipath_find_multipaths: "no"

# k3s and Trident both need generous inotify limits.
# NOTE: the pre-existing /etc/sysctl.d/99-inotify.conf on ALL five nodes has the
# value split across two lines, so max_user_watches has never actually applied
# anywhere. Verification asserts `sysctl -n`, never file presence.
node_sysctls:
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 8192
  fs.file-max: 2097152

node_packages:
  - open-iscsi
  - multipath-tools
  - nfs-common

# Opt-in only: `-e configure_nopasswd_sudo=true`. Trades a real security
# property (a standing credential on every control-plane node) for unattended
# runs. Off by default.
configure_nopasswd_sudo: false
