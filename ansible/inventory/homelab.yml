# Inventory for the home-lab k3s cluster.
#
# Hosts are addressed by their .home domains, served by Pi-hole at
# 192.168.32.53. Verified resolving from this workstation and from the nodes.
#
# ⚠️ BOOTSTRAP CIRCULARITY, accepted knowingly: Pi-hole runs INSIDE this
# cluster. If the cluster is down, Ansible cannot resolve its own inventory.
# For disaster recovery, add to the workstation's /etc/hosts:
#
#   192.168.33.3   k8s-1.home
#   192.168.33.2   k8s-2.home
#   192.168.33.7   k8s-3.home
#   192.168.33.21  k8s-4.home
#   192.168.33.22  k8s-5.home
#
# There is deliberately NO k3s_agents group. Every node in this cluster joined
# with `k3s server`, so all five are control-plane + etcd members. Adding an
# agents group would invite a future join to use INSTALL_K3S_EXEC="agent",
# which would be a silent topology change.

all:
  children:
    k3s_servers:
      hosts:
        k8s-1.home:
          # The node that ORIGINALLY ran --cluster-init, and the historical
          # kube-vip holder. Upgrade and migration orders still put it last.
          #
          # ⚠️ `k3s_cluster_init: true` deliberately does NOT live here any
          # more. It was a rebuild landmine: k3s_config renders
          # `cluster-init: true` from it, and 40-add-node.yml writes config.yaml
          # BEFORE installing. So rebuilding k8s-1 after a disk failure would
          # have brought up a BRAND NEW EMPTY CLUSTER of one, while the four
          # survivors carried on — and it would have looked like "k8s-1 came
          # back but the cluster is wrong".
          #
          # It is correct exactly once, on a greenfield cluster, and wrong
          # forever after. So it is now an explicit bootstrap-time flag:
          #   ansible-playbook playbooks/40-add-node.yml -e target=k8s-1.home \
          #     -e k3s_cluster_init=true
          # Rebuilding k8s-1 into the EXISTING cluster needs no flag at all —
          # it joins via the VIP like every other node.
          node_nic: eno1
        k8s-2.home:
          node_nic: eno1
        k8s-3.home:
          node_nic: eno1
        k8s-4.home:
          # Joined 2026-07-30. Resolver stub wedged; cannot pull images.
          # Wrong multipath.conf; iscsid inactive. CORDONED.
          node_nic: enp0s31f6
        k8s-5.home:
          # Joined 2026-07-30. Wrong multipath.conf -- proven unable to stage a
          # qnap-iscsi volume ("multipath device not found"). CORDONED.
          node_nic: enp7s0
