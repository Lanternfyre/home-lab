# Inventory for the home-lab k3s cluster.
#
# Hosts are addressed by their .home domains, served by Pi-hole at
# 192.168.32.53. Verified resolving from this workstation and from the nodes.
#
# ⚠️ BOOTSTRAP CIRCULARITY -- now BROKEN ON PURPOSE, 2026-08-02.
# Pi-hole runs INSIDE this cluster and serves these .home names, so Ansible
# used to be unable to resolve its own inventory whenever Pi-hole was down.
# That is not theoretical: during the first 1.33 upgrade hop the drain of
# k8s-lab3 left Pi-hole Pending (its PVC is node-local `local-path`, pinned to
# that node), .home resolution died mid-run, and the playbook reported the node
# it was upgrading as UNREACHABLE.
#
# Every host therefore carries an explicit `ansible_host` IP, in host_vars/.
# Ansible resolves NOTHING, so a DNS outage -- including one this playbook
# causes -- cannot stop it from finishing or from repairing the cluster.
# The names are kept as inventory_hostname because the rest of the repo,
# _captured/ paths included, refers to them.
#
# ── THIS FILE IS THE TOPOLOGY, AND NOTHING ELSE ──────────────────────────────
#
# Per-host detail (ansible_host, node_nic, history) lives in host_vars/, so
# that changing a node's ROLE is moving ONE line between the two groups below
# and nothing else has to be relocated. That is the whole point of the split.
#
# ⚠️ Moving a line here does NOT change the node. It changes the DESIRED state.
# k3s cannot convert a node between server and agent in place -- once an etcd
# datastore exists on disk it ignores the datastore arguments entirely -- so a
# role change is uninstall + rejoin, and only ONE playbook is allowed to do it:
#
#   ansible-playbook playbooks/45-change-node-role.yml --ask-become-pass \
#     -e target=k8s-2.home
#
# It reads the desired role from these groups, detects the actual role from the
# node, and REFUSES if they already agree (the usual operator error is running
# it before moving the line, or twice).
#
# ── Why there IS a k3s_agents group now (2026-08-19) ─────────────────────────
#
# This file used to say, in bold, that there deliberately was NO agents group,
# because "adding one would invite a future join to use INSTALL_K3S_EXEC=agent,
# which would be a silent topology change". The risk was real; the remedy was
# not. It was written when the cluster was five nodes and five was odd, and it
# traded a topology we could not express for one we could not change.
#
# What actually makes a role change safe is that it is EXPLICIT and CHECKED,
# and that is now true: role is declared here, derived into `k3s_role` by
# group_vars/k3s_servers.yml and group_vars/k3s_agents.yml, rendered into a
# role-aware config.yaml, and a mismatch between this file and the live node is
# something 45-change-node-role.yml detects and refuses rather than papers over.
# Nothing silently reads "agent" any more -- it has to be written down here.
#
# Six etcd members would also have been strictly worse than three: identical
# failure tolerance, more write fan-out, more nodes that can break quorum.

all:
  children:

    # Every machine in the cluster. Use this for anything that is true of a
    # node regardless of role: OS baseline, verification, upgrades, CNI, and
    # "is the whole fleet reachable" checks.
    k3s_nodes:
      children:

        # Control plane + etcd members. Use this group -- NOT k3s_nodes -- for
        # anything that needs a local apiserver, a kubeconfig, an etcd
        # datastore, or /var/lib/rancher/k3s/server/. Every `delegate_to:
        # groups['k3s_servers'] | first` in this repo means exactly that.
        #
        # ⚠️ Keep k8s-1.home FIRST. `order: reverse_inventory` in
        # 20-config-converge.yml and 30-upgrade.yml exists to roll k8s-1 LAST,
        # and with child groups Ansible orders by group order then host order.
        # Reordering these lines silently changes which node goes last.
        #
        # ⚠️ An ODD count. 3 tolerates one loss; 4 also tolerates only one.
        k3s_servers:
          hosts:
            k8s-1.home:
            k8s-2.home:
            k8s-3.home:

        # Workers. No etcd, no apiserver, no server/manifests directory. They
        # run `k3s-agent.service`, not `k3s.service` -- see k3s_unit in
        # group_vars/all.yml.
        #
        # ⚠️ TARGET REVISED 2026-08-22 after the k8s-5 incident: servers
        # {k8s-1, k8s-2, k8s-3} (the three identical 4-CPU/16GB boxes),
        # agents {k8s-4, k8s-5, k8s-6} (the big/new ones — 32GB, 20-CPU,
        # 30GB — which is where CI belongs).
        #
        # Why the change from {1,4,6}: a mutation-testing job on k8s-5 took
        # the NODE down (k3s + sshd dead, containers alive; memory, disk,
        # iowait and disk-busy all provably fine — a node-level resource pod
        # limits cannot bound). It was an etcd member, so the cluster lost a
        # member AND the LAN lost DNS (Pi-hole's local-path PVC pinned it).
        # Topology is the only real protection: heavy CI must not run on an
        # etcd member. Hence the beefy nodes become agents.
        #
        # TARGET STATE REACHED 2026-08-22 (k8s-5, then k8s-6, then k8s-4).
        #
        # k8s-7 added 2026-09-02 as a FOURTH agent, straight in as an agent --
        # it has never been a server, so it needs no role change, only
        # 40-add-node.yml. Agent count is deliberately unconstrained: only the
        # SERVER count has to stay odd, because only servers hold etcd votes.
        # An agent adds capacity and nothing else -- no quorum arithmetic, no
        # kube-vip pod (its nodeAffinity requires the control-plane label), no
        # etcd write fan-out.
        #
        # Demote ONE AT A TIME, moving one line here per run:
        #   ansible-playbook playbooks/45-change-node-role.yml \
        #     --ask-become-pass -e target=k8s-5.home
        # The playbook REFUSES to shrink below 3 servers by design — going
        # to a single master would pass through the 2-member state, where
        # quorum is 2 and losing either node is an etcd-restore-only
        # recovery. 3 is the floor on purpose.
        k3s_agents:
          hosts:
            k8s-4.home:
            k8s-5.home:
            k8s-6.home:
            k8s-7.home:

          children:

            # The public edge node(s). A CHILD of k3s_agents, so it inherits
            # `k3s_role: agent` from group_vars/k3s_agents.yml and stays inside
            # `groups['k3s_nodes']` -- both of which are load-bearing:
            #
            #   * 35-cilium-migrate.yml asserts the cilium DaemonSet's desired
            #     count == `groups['k3s_nodes'] | length`, and Cilium DOES run
            #     on the edge node. A sibling group makes that assert
            #     off-by-one on a playbook that drains nodes.
            #   * 25-kube-vip-daemonset.yml pings every `groups['k3s_nodes']`
            #     member; the edge is reachable over the tunnel.
            #
            # What makes it different is NOT its group membership but
            # `node_storage_enabled: false` in group_vars/k3s_edge.yml. The
            # exception is a stated variable, not a hole in the topology --
            # see EDGE-NODE.md.
            #
            # ⚠️ `.edge`, not `.home`. This file's contract is that `.home`
            # names are LAN names served by Pi-hole; this box is on the public
            # internet and reachable only over WireGuard once joined.
            k3s_edge:
              hosts:
                edge-1.edge:
