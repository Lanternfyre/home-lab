---
ansible_host: 192.168.33.22
node_nic: enp7s0

# The big node: 20 CPU / 47 GiB, and the only NVMe. It carries ~44 of the
# cluster's pods, because 96 containers declare no requests at all and the
# scheduler's NodeResourcesFit scores free-versus-capacity -- so the largest
# node wins nearly every placement. Draining it is the most disruptive drain in
# the fleet, and it currently runs Pi-hole, i.e. LAN DNS.
#
# History, not current state: joined 2026-07-30 with the wrong
# /etc/multipath.conf and proven unable to stage a qnap-iscsi volume
# ("multipath device not found"). Cordoned, then storage-proven and UNCORDONED
# 2026-08-02.
#
# ✅ Re-verified 2026-08-19 (same checks as k8s-4): 1 CSI driver,
# find_multipaths no, iscsid+multipathd active, inotify 1048576, DNS resolves,
# not cordoned.
#
# ⚠️ Pi-hole no longer runs here: the pod list on 2026-11-11 had no pihole pod.
# What a drain does move now: nine claude-box StatefulSets, the postgres-ha and
# immich-db CNPG instances, code-health and tempo. Read the live list before
# draining rather than either line.

# ── The GPU (k3s_gpu, playbooks/51-gpu-node.yml) ─────────────────────────────
# lspci 03:00.0, read 2026-11-11: "NVIDIA Corporation GM107GL [Quadro K2200]
# [10de:13ba]", Maxwell, 4 GB, bound to nouveau. roles/nvidia_gpu refuses to
# run unless lspci shows exactly this vendor:device, so the role can never be
# pointed at a node whose card it was not written for.
nvidia_gpu_pci_id: "10de:13ba"
nvidia_gpu_pci_slot: "03:00.0"
