---
ansible_host: 192.168.33.24
node_nic: enp1s0

# ⚠️ .24 is a DHCP address, not a static one: `networkctl status enp1s0` reads
# "192.168.33.24 (DHCP4 via 192.168.33.1)", MAC a4:bb:6d:a7:1c:b1. That is the
# fleet norm -- k8s-1 (.3), k8s-5 (.22) and k8s-6 (.20) all report the same --
# so the addresses are held by MikroTik reservations, not by netplan. This node
# has no VERIFIED reservation, and the address it holds was blackbox-exporter's
# `powerline-far` until 2026-09-02, which is what a pool hands out rather than
# what a reservation pins. k3s bakes the node IP in at registration, so a lease
# change after joining is a REJOIN, not a reconfigure. Confirm the reservation
# on the router before trusting this line.

# Added 2026-09-02. Registers as k8s-lab7 -- its static hostname is already
# `k8s-lab7`, which is what kubelet uses, so the k8s_node_name derivation in
# group_vars/all.yml (k8s-7 -> k8s-lab7) matches the machine and needs no
# per-host override.
#
# Joins straight in as an AGENT. It has never been a server, so
# 45-change-node-role.yml has nothing to do here -- 40-add-node.yml reads
# `agent` from the k3s_agents group and installs k3s-agent.service directly.
#
# 6 vCPU / 31 GiB / a single 238.5 GB NVMe (KIOXIA KBG40ZNS256G). Note there is
# NO SATA disk: every other node in the fleet reports `sda` as its local disk,
# this one reports only `nvme0n1`.
#
# ⚠️ That is not trivia, and this comment originally said "nothing in the repo
# depends on the device name". It was wrong, and it cost a failed storage proof
# on the join. /etc/multipath.conf blacklisted `sda` by NAME -- true on six
# nodes, where sda is the local ATA disk. Here the first iSCSI LUN attaches AS
# /dev/sda, so it was blacklisted, got no device-mapper entry, and Trident
# failed to stage it with "multipath device not found when it is expected" on
# a node that was otherwise entirely healthy. Fixed by keying the blacklist on
# vendor (see roles/node_baseline/tasks/main.yml); k8s-lab7 is the node that
# proves the fix, so re-run the storage proof here after any change to it.
#
# smartctl-exporter was already right about this -- its alerts discriminate on
# `scsi_vendor="QNAP"`, not on a device letter -- which is why SMART worked on
# this node and multipath did not.
#
# `enp1s0` verified over SSH. node_nic is DOCUMENTATION only; nothing consumes
# it (kube-vip auto-detects the default-route interface, and it does not run
# here at all -- its nodeAffinity requires the control-plane label).
#
# ✅ IN SERVICE 2026-09-05. Storage PROVEN and uncordoned by
# playbooks/46-prove-node-storage.yml, verified by value:
#   storage proof                -> PASSED, mounted /dev/mapper/mpathb on /data,
#                                   ext4, 16 MiB written and read back. That
#                                   mpath device IS the blacklist fix working --
#                                   before it, this node's LUN got no map at all.
#   kubectl get csinode k8s-lab7 -> csi.trident.qnap.io
#   systemctl is-active k3s-agent -> active, and k3s.service does not exist,
#                                    so it was built as an agent, not a server
#   kube-vip-ds desired           -> still 3 (control-plane nodeAffinity)
#   every DaemonSet               -> desired == current == ready
#   leaked PVs                    -> none; the proof's volume and LUN were
#                                    reclaimed and no iSCSI session was left
#                                    LOGGED_IN
#
# State BEFORE the join, measured over SSH, kept because it is what
# 10-baseline.yml had to fix:
#   /usr/local/bin/k3s                     -> absent (not a cluster member)
#   systemctl is-active iscsid             -> inactive (multipathd IS active)
#   sysctl -n fs.inotify.max_user_watches  -> 248289 (kernel default, not 1048576)
#   /etc/multipath.conf                    -> the 41-byte Ubuntu stock file,
#                                             i.e. no `find_multipaths no`, so
#                                             this node cannot stage a QNAP LUN
#   nfs-common                             -> not installed
