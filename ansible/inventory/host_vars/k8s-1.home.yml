---
ansible_host: 192.168.33.3
node_nic: eno1

# The node that ORIGINALLY ran --cluster-init, and the historical kube-vip
# holder. Upgrade and migration orders still put it last.
#
# ⚠️ `k3s_cluster_init: true` deliberately does NOT live here. It was a rebuild
# landmine: k3s_config renders `cluster-init: true` from it, and 40-add-node.yml
# writes config.yaml BEFORE installing. So rebuilding k8s-1 after a disk failure
# would have brought up a BRAND NEW EMPTY CLUSTER of one, while the survivors
# carried on -- and it would have looked like "k8s-1 came back but the cluster
# is wrong".
#
# It is correct exactly once, on a greenfield cluster, and wrong forever after.
# So it is an explicit bootstrap-time flag:
#   ansible-playbook playbooks/40-add-node.yml -e target=k8s-1.home \
#     -e k3s_cluster_init=true
# Rebuilding k8s-1 into the EXISTING cluster needs no flag at all -- it joins
# via the VIP like every other node.
