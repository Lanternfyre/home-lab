# Cilium 1.20.0 — the LIVE values on all 8 nodes (helm release rev 6+).
#
# Applied by `ansible-playbook playbooks/34-cilium.yml` (workstation only, no
# sudo), never by hand and never by ArgoCD -- roles/cilium explains why. The
# role re-reads this file and asserts the RUNNING agent agrees with it.
#
# History: this was the "end-state, apply only at cleanup" file of the flannel
# migration (CILIUM-MIGRATION.md stage 5). Cleanup happened; it is simply the
# values now. Diff against cilium-values-migration.yaml for what cleanup did.

cni:
  # Cilium now owns CNI on every node unconditionally, rather than per-node
  # via CiliumNodeConfig. The CiliumNodeConfig objects are deleted after this.
  customConf: false
  uninstall: false        # still never auto-remove on shutdown

  # Unchanged from migration mode, and still not the chart defaults.
  binPath: /var/lib/rancher/k3s/data/cni
  confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d

operator:
  unmanagedPodWatcher:
    restart: true         # safe now: there are no flannel-managed pods left
  replicas: 2

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: ["10.245.0.0/16"]
    clusterPoolIPv4MaskSize: 24

routingMode: tunnel
tunnelProtocol: vxlan
# Port 8473 is KEPT even after flannel is gone. Changing it back to 8472 buys
# nothing and would be a second cluster-wide network change during cleanup.
tunnelPort: 8473
MTU: 0

bpf:
  # ⚠️ Flipping this to false causes a brief connectivity interruption on every
  # node, and it is a pure optimisation — legacy routing is correct, just
  # slower. Left TRUE deliberately. Change it later as its own small deliberate
  # op, not buried inside the cleanup that also enables policy.
  hostLegacyRouting: true

# ⚠️⚠️ THE RISKIEST LINE IN THIS FILE.
# This is the moment the 6 argocd NetworkPolicies become enforceable for the
# first time ever — flannel never implemented NetworkPolicy, so they have sat
# inert since ArgoCD chart 10.x flipped global.networkPolicy.create to true.
# They were analysed on 2026-08-03 and ArgoCD is expected to survive (all six
# are Ingress-only; there are no egress policies at all) — but "expected to"
# is not "observed to". Flip this LAST, on its own, watching ArgoCD.
# Escape hatch: global.networkPolicy.create=false in gitops/argocd-values.yaml
# then `ansible-playbook playbooks/15-argocd.yml`.
policyEnforcementMode: "default"

# ── NODE-LABEL IDENTITIES, so policy can name a SPECIFIC node ───────────────
#
# Required for `fromNodes` in a CiliumClusterwideNetworkPolicy. Without it, all
# nodes collapse into the single `remote-node` identity and a policy cannot tell
# the public edge VPS apart from a home node.
#
# Why that matters: k8s-edge1 is a k3s agent on a public VPS, and MEASURED
# 2026-09-06 it reaches every namespace over VXLAN. Hubble, with real traffic
# generated through the public edge:
#
#   10.245.8.125:39114 (remote-node) -> ot-demo/ot-login:7171
#     policy-verdict:L3-Only INGRESS ALLOWED
#
# `remote-node` is what a compromised edge would carry too, and 10 of 16
# CiliumNetworkPolicies have no ingress section at all -- Cilium's default-deny
# is per DIRECTION, so those namespaces are wide open to it.
#
# 🔴 THE KEY IS `nodeSelectorLabels`, NOT `enableNodeSelectorLabels`.
# Verified against `helm show values cilium/cilium --version 1.20.0`:
#
#   # -- Enable/Disable use of node label based identity
#   nodeSelectorLabels: false
#
# The wrong key applies cleanly, renders no error, and does nothing -- the
# ConfigMap keeps `enable-node-selector-labels: "false"` and every fromNodes
# policy silently matches nothing. That is exactly the "control that looks
# complete and has a hole nobody can see from the config" shape CLAUDE.md warns
# about, so CHECK THE CONFIGMAP, not this file, after applying:
#
#   kubectl -n kube-system get cm cilium-config \
#     -o jsonpath='{.data.enable-node-selector-labels}'   # must read "true"
#
# ⚠️ `nodeLabels` is left unset deliberately. The chart offers it to include or
# exclude labels from node identity evaluation; unset means all node labels are
# available, which is what `infrastructure.techyon.dev/location=edge` needs.
# Setting it to a list that omits that label would be another silent no-match.
#
# ⚠️ THIS IS A DAEMONSET ROLL ON ALL 8 NODES. It changes how identities are
# computed, so verify identities resolve before writing any policy that depends
# on them -- an empty match denies nothing and looks identical to a clean run.
nodeSelectorLabels: true

# ── kube-proxy replacement (KUBE-PROXY-REPLACEMENT.md) ──────────────────────
# "true" since stage B2a (2026-09-07). k3s STILL runs kube-proxy in-process
# until stage B4 -- a supported overlap: Cilium's BPF sees every packet first
# and kube-proxy's rules go dead. Why: without this no LoadBalancer frontend
# is in the BPF map at all, so a pod's packet to a MetalLB address leaves
# untranslated carrying identity `world`, and no policy can name the backend.
#
# Socket LB is forced on, at the Cilium default (full, pods included --
# operator's choice 2026-09-07). Per-packet LB is then compiled OUT of
# bpf_lxc, so a pod that emits NON-socket traffic to a Service address (raw
# sockets, kernel forwarding) is no longer translated. None known in this
# estate; the rootless NetBird routing peer forwards through real sockets.
#
# ⚠️ Socket LB refuses to translate an ExternalIPs-type frontend whose address
# is not the node's own (bpf_sock.c external-IP mitigation). A Gateway
# `spec.addresses` becomes exactly that on its Service, which is why stage B2b
# deletes them: until then pod -> LAN gateway address does not translate.
#
# Rollback: "false" here and `ansible-playbook playbooks/34-cilium.yml`.
# Workstation only, no sudo; kube-proxy is still there to take over.
kubeProxyReplacement: "true"

# Forced on by kubeProxyReplacement=true inside the agent regardless of this
# key (pkg/kpr). Set explicitly so the ConfigMap's `bpf-lb-sock` says what the
# datapath actually does, instead of rendering "false" while it is on.
socketLB:
  enabled: true

# NodePort/LoadBalancer frontends are created only for device addresses inside
# these CIDRs: the LAN NIC (192.168.33.x -- node addresses, NOT the
# 192.168.32.x MetalLB pool) and wg0 (10.250.0.x). Deliberately EXCLUDED:
#   * the edge's PUBLIC address on eth0. Under kube-proxy replacement BPF
#     NodePort runs at tc ingress, BEFORE nftables, so edge_firewall could never
#     close a NodePort there. (kube-proxy on the edge DID forward argocd-server's
#     NodePorts to the internet until 2026-09-07 -- MANUAL-STEPS.md 0c.)
#   * the API VIP 192.168.32.2, a secondary address on lab2's eno1 that floats.
#   * flannel.1's 10.42.x address, a dead interface Cilium still auto-detects.
# Set while kubeProxyReplacement is still "false" (it renders, does nothing yet)
# so the flip is a one-line change. Verified: renders as nodeport-addresses.
nodePort:
  addresses: ["192.168.33.0/24", "10.250.0.0/24"]

enableLBIPAM: false
defaultLBServiceIPAM: none

k8sServiceHost: "127.0.0.1"
k8sServicePort: "6444"
