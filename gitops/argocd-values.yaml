# argocd-values.yaml

# ⚠️ The chart's own NetworkPolicies BLOCK THE CHART'S OWN HEALTH PROBES.
# Disabled deliberately on 2026-08-03, after they were exercised for the first
# time ever and immediately broke ArgoCD.
#
# argo-cd chart 10.x flipped this default to `true`, so 6 NetworkPolicies
# appeared in the argocd namespace. They sat inert for months because flannel
# does not implement NetworkPolicy at all. The moment Cilium enforced them
# (Phase 3 stage 5a), argocd-repo-server went into a liveness CrashLoop and
# argocd-application-controller never became Ready.
#
# The defect is in the policies, not in Cilium. Both components point their
# liveness/readiness probes at the port NAMED `metrics`:
#   argocd-repo-server            metrics=8084   liveness AND readiness
#   argocd-application-controller metrics=8082   readiness
# and the only rule admitting that port is
#   from: [{namespaceSelector: {}}]  ports: [{port: metrics}]
# `namespaceSelector: {}` selects PODS IN NAMESPACES. A kubelet probe does not
# come from a pod — it comes from the node. So the probes are denied by the
# chart's own policy, and the pods are killed by their own liveness check.
#
# Observed, not theorised:
#   Liveness probe failed: Get "http://10.245.0.44:8084/healthz?full=true":
#   context deadline exceeded
#
# These policies were never designed for this cluster — they arrived as a chart
# default — and they never protected anything, since argocd-server's rule is a
# bare `{}` (allow from anywhere) and argocd-applicationset-controller is
# selected by no policy at all. Turning them off loses no protection that ever
# existed.
#
# Cilium policy enforcement itself stays ON: with no policies selecting these
# pods there is nothing to enforce, and the cluster is ready for INTENTIONAL
# policies later. When those are written (Phase 5), remember this: a policy
# that selects a pod must also admit the node, or it kills the pod's probes.
global:
  networkPolicy:
    create: false

configs:
  cm:
    # lets Argo CD discover Applications in other namespaces
    application.instanceLabelKey: argocd.argoproj.io/instance
    # Canonical external URL — used in OAuth redirect construction and
    # notification/template links.
    url: https://argocd.lab.techyon.dev
    # Google Workspace OIDC. ClientID / ClientSecret are pulled from the
    # argocd-google-oidc Secret (populated from 1Password via ExternalSecrets;
    # see gitops/clusters/home/apps/external-secrets/manifests/google-oauth.external-secret.yaml).
    # The $<secret>:<field> dollar syntax only works if the Secret has the
    # app.kubernetes.io/part-of: argocd label, which the ExternalSecret sets.
    oidc.config: |
      name: Google
      issuer: https://accounts.google.com
      clientID: $argocd-google-oidc:clientID
      clientSecret: $argocd-google-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
      # hd claim restricts logins to techyon.dev Workspace users only —
      # anyone outside the Workspace is rejected before reaching RBAC.
      requestedIDTokenClaims:
        hd:
          essential: true
          value: techyon.dev
  # Any techyon.dev user who passes the hd claim check above becomes admin.
  # Single-operator lab — no per-user policy needed.
  rbac:
    policy.default: role:admin
  params:
    # keep default HTTPS on server (safer). If you want HTTP only:
    server.insecure: "true"
    server.disable.auth: "false"

# ── Drain safety ─────────────────────────────────────────────────────────────
# Every ArgoCD component ships at ONE replica, and at one replica a PDB is
# either useless or actively harmful:
#   * minAvailable: 1  -> disruptionsAllowed 0 -> blocks EVERY drain, forever.
#     During a serial:1 rolling upgrade that presents as the run hanging on the
#     first node rather than as a misconfigured budget. The existing
#     immich-db-primary PDB sits at allowed=0 for exactly this reason.
#   * maxUnavailable: 1 -> the single pod may still be evicted, so it protects
#     nothing. A PDB that permits the only outcome it was meant to prevent.
#
# So a budget is only worth having where there is a second pod to fall back on.
# server and repoServer are stateless and scale cleanly, so they get 2 replicas
# and a real budget. The others deliberately get NO PDB:
#   controller / redis / dex / notifications / applicationset are effectively
#   singletons here (the controller needs sharding config to scale, redis needs
#   redis-ha), and adding a budget to a singleton only buys one of the two bad
#   outcomes above. ArgoCD being briefly unavailable during a drain costs a UI
#   outage and a pause in reconciliation -- it does not affect running
#   workloads -- so that is an acceptable trade, and a deadlocked drain is not.
server:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Two replicas on the same node is not redundancy; it is one drain away from
  # a full outage while the PDB reports everything as fine. This repo has
  # already been bitten by that exact shape -- all three ingress replicas
  # landed on one node under `preferred` anti-affinity, and maxSkew: 1 with
  # ScheduleAnyway was the fix. Placement is verified after applying, not
  # assumed.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
  pdb:
    enabled: true
    # Absolute, never a percentage: at low replica counts a percentage floors
    # to 0 and the budget then forbids every eviction.
    maxUnavailable: 1
  service:
    type: LoadBalancer
    # Optional: pin an IP from your MetalLB pool (recommended)
    # loadBalancerIP: 192.168.32.50
  # ── Migrated to Envoy Gateway (Phase 6) ────────────────────────────────────
  # The argo-cd chart emits the HTTPRoute itself, so this stays here and is
  # applied by `ansible-playbook playbooks/15-argocd.yml` -- ArgoCD is NOT one
  # of its own Applications, deliberately, so its route cannot live in
  # apps/*/manifests like every other migrated app.
  ingress:
    enabled: false

  # OPEN Gateway: ArgoCD has its own login and its own RBAC, so the edge gate
  # would stack a second unrelated auth in front of it. Its Ingress carried no
  # oauth2-proxy annotation for the same reason.
  #
  # ⚠️ There is a bootstrap wrinkle worth knowing: the Gateway this points at
  # is itself managed BY ArgoCD (apps/envoy-gateway). If the Gateway is ever
  # broken, the ArgoCD UI becomes unreachable -- but the controller keeps
  # reconciling and kubectl still works, so the repair path survives. That is
  # why this is acceptable; it would not be if ArgoCD had no other entry point.
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: gateway-envoy
        sectionName: https
    hostnames:
      - argocd.lab.techyon.dev
    annotations:
      gethomepage.dev/description: CD server
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: CI/CD
      gethomepage.dev/icon: argo-cd.png
      gethomepage.dev/name: ArgoCD

  # Optional quality-of-life if you later expose via ingress:
  # extraArgs:
  #   - --insecure
# repoServer does the git clones and `helm template` renders for all 55
# Applications. Losing it stalls every sync, so it is the component most worth
# having a spare of during a rolling upgrade -- and it is stateless, so a
# second replica costs nothing but memory.
repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server
  pdb:
    enabled: true
    maxUnavailable: 1

# ── Resource requests (Phase 7 / item 2b) ────────────────────────────────────
#
# ⚠️ THE PROBLEM THIS FIXES IS QoS CLASS, NOT CAPACITY. Before this, EVERY
# ArgoCD pod ran with `resources: {}` and was therefore **BestEffort** -- the
# first thing the kubelet evicts under node memory pressure. So the controller
# holding all 63 Applications, and the repo-server every sync depends on, were
# ahead of workloads that had merely declared a request. Any request at all
# moves them to Burstable; the exact numbers matter far less than that.
#
# Surfaced by the VPA recommender installed earlier in Phase 7 -- nothing else
# in the cluster reported it, and it had been true since ArgoCD was installed.
#
# Values are the VPA's own targets after ~24h of history, rounded up:
#
#   component        VPA target        actual usage at the time
#   controller       247m / 1.15 GiB   5m / 732 Mi
#   server           15m  / 237 Mi     1m / 70-188 Mi
#   redis            23m  / 156 Mi     12m / 129 Mi
#   repo-server      35m  / 121 Mi     3-4m / 45-59 Mi
#   applicationset   23m  / 121 Mi     26m / 66 Mi
#   dex              15m  / 100 Mi     1m / 23 Mi      (VPA floor)
#   notifications    15m  / 100 Mi     1m / 30 Mi      (VPA floor)
#
# ⚠️ MEMORY LIMITS ONLY, NO CPU LIMITS -- the trident-operator lesson. CFS
# enforces CPU quota per 100ms period rather than as an average, so a small
# limit throttles a bursty process that never approaches the cap on average.
# trident-operator sat 70.2% throttled at 20m while peaking at 11.4m; the
# controller's reconcile loop is exactly that shape.
#
# ⚠️ `controller`, `redis`, `applicationSet`, `dex` and `notifications` are
# appended as NEW top-level keys because this file did not define them. The
# `server:` and `repoServer:` resources are set INSIDE their existing blocks
# instead -- appending second `server:`/`repoServer:` keys silently REPLACED
# the originals, losing replicas, topologySpreadConstraints, pdb and the
# httproute. That is the duplicate-key trap already recorded in
# MODERNIZATION.md, and it was caught only by asserting the old keys survived.

controller:
  resources:
    requests:
      cpu: 250m
      # Deliberately generous: the controller's working set scales with the
      # number of Applications and the size of their manifests, and it is the
      # one component whose OOM-kill stalls every sync in the cluster.
      memory: 1536Mi
    limits:
      memory: 3Gi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 384Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 384Mi

dex:
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
    limits:
      memory: 256Mi

notifications:
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
    limits:
      memory: 256Mi
