# Passwords for the code-health Cluster's three roles, one 1Password item each
# (vault Infrastructure, the `one-password` ClusterSecretStore), in the
# pg-role-* form of apps/postgres/manifests/pg-role-secrets.yaml. CNPG reads
# `username` and `password`.
#
# Separate items, not the shared PostgresHA password: the writer's password
# leaves the cluster (Necronia2.0's CI holds it), so it must rotate alone.
#
# ⚠️ The writer's password is pasted into a connection URI (the GitHub secret
# CODE_HEALTH_WRITER_DSN), so generate it from letters and digits only. A `@`,
# `:`, `/`, `?`, `#` or `%` in it breaks the URI unless percent-encoded there.
#
# Rotating one: change the 1Password item, wait for the refresh (1h, or annotate
# the ExternalSecret with force-sync), and for the writer update the GitHub
# secret too. CNPG notices the Secret's new resourceVersion and ALTERs the role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-health-owner
  namespace: code-health
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: pg-role-health-owner
    creationPolicy: Owner
    template:
      data:
        username: health_owner
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: CodeHealthOwner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-health-writer
  namespace: code-health
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: pg-role-health-writer
    creationPolicy: Owner
    template:
      data:
        username: health_writer
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: CodeHealthWriter
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-health-reader
  namespace: code-health
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: pg-role-health-reader
    creationPolicy: Owner
    template:
      data:
        username: health_reader
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: CodeHealthReader
        property: password
