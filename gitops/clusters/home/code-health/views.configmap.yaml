# The views Grafana reads in the code-health database, as one SQL file.
# views.job.yaml runs it as health_owner after every sync of this Application,
# after tables.configmap.yaml's tables.sql.
#
# It drops and rebuilds schemas `health` and `perf` in one transaction, so this
# file is the whole truth about the views: edit a view here, and the next sync
# replaces it. The tables in `public` (health_run, perf_run) and their rows are
# never touched; the views only read them.
#
# The views are projections of the health record (health_run.record, jsonb),
# one per block the two dashboards draw: run, project, step, suite, ndepend,
# ndepend_gate, ndepend_rule, ndepend_assembly, ndepend_namespace,
# worst_method, and flake_candidate and drift over commits recorded more than
# once (run_time and repeated_commit are their helpers). The aggregates across
# projects, one row per run, are overall_mutation (the score of the mutants
# that ran, over project_mutation: each project's measured or carried mutants)
# and overall (coverage, tests, CRAP, NDepend, duplication). The producer
# blocks are lens_count (every count of performance, differential, fuzz,
# generated and invariants), differential_recording and
# differential_annotation. Every read is typed and null-safe (health.num,
# health.bool, health.elements, health.entries, health.leaves), so a
# repository whose records lack a block gets empty rows, not a failed query.
# The one read that is not, overall's jsonb_to_record, needs the record to be
# a JSON object, as every health record is.
#
# A record is read whole each time a view takes a value from it (about 0.15 ms
# for one of 140 kB), so the newer views read each record once per query.
#
# Schema `perf` projects perf_run's performance records (Necronia2.0 R313):
# run (one per record, with the environment group results compare within),
# result, metric, condition and parameter (the long form), reference (the
# value each series is read against) and noise (the spread on unchanged code).
#
# Check a change offline before committing it: the table SQL from
# code-health.cluster.yaml's postInitApplicationSQL in a throwaway postgres:18
# container, then tables.sql, a few records from the silo
# (https://s3.lab.techyon.dev/ci-reports/reports/necronia2.0/health/), then
# this file twice as the tables' owner.
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-health-views
  namespace: code-health
data:
  views.sql: |
    -- Grafana's views over health_run, rebuilt whole on every sync by
    -- views.job.yaml as health_owner. Everything in schema `health` comes from
    -- this file: a view removed here is gone after the next sync.
    --
    -- One transaction: Grafana sees the old views or the new ones, never none.
    -- lock_timeout: a long dashboard query makes the Job fail and retry instead of
    -- queueing every other query behind its lock.
    begin;
    set local lock_timeout = '30s';

    drop schema if exists health cascade;
    create schema health;

    -- Typed reads. A value of another JSON type, or a missing block, reads as null
    -- instead of failing the query, so a repository whose records lack a block
    -- (ndepend, say) shows "No data" rather than an error.
    create function health.num(j jsonb) returns numeric
      language sql immutable parallel safe
      as $$ select case when jsonb_typeof(j) = 'number' then (j #>> '{}')::numeric end $$;

    create function health.bool(j jsonb) returns boolean
      language sql immutable parallel safe
      as $$ select case when jsonb_typeof(j) = 'boolean' then (j #>> '{}')::boolean end $$;

    create function health.elements(j jsonb) returns setof jsonb
      language sql immutable parallel safe
      as $$ select e from jsonb_array_elements(case when jsonb_typeof(j) = 'array' then j else '[]'::jsonb end) e $$;

    -- Each run's place on the time axis, `at`: started_at, or for a run whose
    -- record has none (a red build leaves no Cobertura file) one second per such
    -- run after the latest start among the repository's earlier runs (run ids
    -- grow with time), or before its first start when there is none. Every run
    -- gets its own instant, so a red build never hides behind the run before it.
    create view health.run_time as
    select
      repo, run_id, run_attempt,
      coalesce(
        started_at,
        latest_start + untimed * interval '1 second',
        first_start - (untimed_before_first - untimed + 1) * interval '1 second') as at
    from (
      select
        repo, run_id, run_attempt, started_at,
        max(started_at) over (partition by repo order by run_id, run_attempt) as latest_start,
        min(started_at) over (partition by repo) as first_start,
        count(*) filter (where started_at is null)
          over (partition by repo, timed order by run_id, run_attempt) as untimed,
        count(*) filter (where started_at is null) over (partition by repo, timed) as untimed_before_first
      from (
        select repo, run_id, run_attempt, started_at,
               count(started_at) over (partition by repo order by run_id, run_attempt) as timed
        from public.health_run) counted
    ) placed;

    -- One row per run. `record` is kept for ad-hoc queries.
    create view health.run as
    select
      r.repo, r.branch, r.branch_kind, r.run_id, r.run_attempt, r.commit_sha, r.pr_number, r.event, r.profile,
      t.at,
      r.started_at,
      case when r.green then 'green' when not r.green then 'red' else 'no verdict' end as verdict,
      r.green, r.gate_passed, r.complete,
      r.record #>> '{gate,firstFailingStep}' as first_failing_step,
      (select count(*) from health.elements(r.record -> 'missing')) as missing,
      health.num(r.record -> 'wallSeconds') as wall_seconds,
      round(health.num(r.record #> '{build,elapsedMs}') / 1000, 1) as build_seconds,
      health.num(r.record #> '{summary,branchesPct}') as branches_pct,
      health.num(r.record #> '{summary,mutationPct}') as mutation_pct,
      health.num(r.record #> '{summary,crapMax}') as crap_max,
      health.num(r.record #> '{totals,tests,total}') as tests,
      health.num(r.record #> '{totals,tests,failed}') as tests_failed,
      health.num(r.record #> '{totals,mutants,survived}') as mutants_survived,
      health.num(r.record #> '{totals,mutants,noCoverage}') as mutants_no_coverage,
      (select string_agg(concat_ws(' ', f ->> 'kind', f ->> 'subject'), ', ')
         from health.elements(r.record -> 'flags') f) as flags,
      'https://github.com/' || r.repo || '/actions/runs/' || r.run_id || '/attempts/' || r.run_attempt as run_url,
      r.record
    from public.health_run r
    join health.run_time t on t.repo = r.repo and t.run_id = r.run_id and t.run_attempt = r.run_attempt;

    -- One row per run and project.
    create view health.project as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.commit_sha, r.at,
      p ->> 'project' as project,
      p ->> 'tier' as tier,
      health.num(p #> '{coverage,lines,percent}') as lines_pct,
      health.num(p #> '{coverage,branches,percent}') as branches_pct,
      health.num(p #> '{coverage,branchFloor}') as branch_floor,
      health.num(p #> '{tests,total}') as tests,
      health.num(p #> '{tests,failed}') as tests_failed,
      health.num(p #> '{tests,skipped}') as tests_skipped,
      round(health.num(p #> '{tests,durationMs}') / 1000, 1) as test_seconds,
      health.bool(p #> '{mutation,ran}') as mutation_ran,
      p #>> '{mutation,reason}' as mutation_reason,
      health.num(p #> '{mutation,carriedFromRunId}') as mutation_carried_from,
      health.num(p #> '{mutation,counts,score,percent}') as mutation_pct,
      health.num(p #> '{mutation,floor}') as mutation_floor,
      round(health.num(p #> '{mutation,elapsedMs}') / 1000, 1) as mutation_seconds,
      health.num(p #> '{mutation,counts,killed}') as killed,
      health.num(p #> '{mutation,counts,timeout}') as timeout,
      health.num(p #> '{mutation,counts,survived}') as survived,
      health.num(p #> '{mutation,counts,noCoverage}') as no_coverage,
      health.num(p #> '{mutation,counts,ignored}') as ignored,
      health.num(p #> '{mutation,counts,compileError}') as compile_error,
      health.num(p #> '{mutation,counts,runtimeError}') as runtime_error,
      health.num(p #> '{mutation,dubious}') as dubious,
      health.num(p #> '{crap,max}') as crap_max,
      health.num(p #> '{crap,testGapMass}') as test_gap_mass
    from health.run r
    cross join lateral health.elements(r.record -> 'projects') p;

    -- One row per run and verify step, in the steps file's order.
    create view health.step as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      s.position, s.step ->> 'name' as step, s.step ->> 'status' as status, health.num(s.step -> 'seconds') as seconds
    from health.run r
    cross join lateral health.elements(r.record -> 'steps') with ordinality as s(step, position);

    -- One row per run and test suite outside the projects (architecture, scenario, e2e, performance).
    create view health.suite as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      u ->> 'kind' as kind, u ->> 'assembly' as assembly,
      health.num(u #> '{tests,total}') as tests,
      health.num(u #> '{tests,failed}') as tests_failed,
      health.num(u #> '{tests,skipped}') as tests_skipped,
      round(health.num(u #> '{tests,durationMs}') / 1000, 1) as test_seconds
    from health.run r
    cross join lateral health.elements(r.record -> 'suites') u;

    -- NDepend's trend, one row per run that has an ndepend block.
    create view health.ndepend as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      health.num(r.record #> '{ndepend,trend,issues,blocker}') as issues_blocker,
      health.num(r.record #> '{ndepend,trend,issues,critical}') as issues_critical,
      health.num(r.record #> '{ndepend,trend,issues,high}') as issues_high,
      health.num(r.record #> '{ndepend,trend,issues,medium}') as issues_medium,
      health.num(r.record #> '{ndepend,trend,issues,low}') as issues_low,
      health.num(r.record #> '{ndepend,trend,rules,violated}') as rules_violated,
      health.num(r.record #> '{ndepend,trend,rules,criticalViolated}') as rules_critical_violated,
      health.num(r.record #> '{ndepend,trend,debt,percent}') as debt_pct,
      health.num(r.record #> '{ndepend,trend,debt,manDays}') as debt_man_days,
      health.num(r.record #> '{ndepend,trend,coverage,percent}') as coverage_pct
    from health.run r
    where jsonb_typeof(r.record -> 'ndepend') = 'object';

    -- NDepend's quality gates, one row per run and gate.
    create view health.ndepend_gate as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      g.position, g.gate ->> 'name' as gate, g.gate ->> 'status' as status,
      health.num(g.gate -> 'value') as value, g.gate ->> 'unit' as unit,
      concat_ws(' ', g.gate #>> '{warn,operator}', g.gate #>> '{warn,value}') as warn_when,
      concat_ws(' ', g.gate #>> '{fail,operator}', g.gate #>> '{fail,value}') as fail_when,
      health.num(g.gate #> '{warn,value}') as warn_value,
      health.num(g.gate #> '{fail,value}') as fail_value
    from health.run r
    cross join lateral health.elements(r.record #> '{ndepend,gates}') with ordinality as g(gate, position);

    -- The house rules (every one, with its status) and the critical rules violated.
    create view health.ndepend_rule as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      'house' as kind, h ->> 'rule' as rule, h ->> 'status' as status, health.num(h -> 'matched') as matched,
      (select string_agg(e #>> '{}', ', ') from health.elements(h -> 'elements') e) as elements
    from health.run r
    cross join lateral health.elements(r.record #> '{ndepend,rules,house}') h
    union all
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      'critical', c ->> 'rule', 'violated', health.num(c -> 'matched'), null
    from health.run r
    cross join lateral health.elements(r.record #> '{ndepend,rules,critical}') c;

    -- Design metrics per assembly.
    create view health.ndepend_assembly as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      a ->> 'name' as assembly,
      health.num(a -> 'types') as types, health.num(a -> 'loc') as loc,
      health.num(a -> 'afferent') as afferent, health.num(a -> 'efferent') as efferent,
      health.num(a -> 'cohesion') as cohesion, health.num(a -> 'instability') as instability,
      health.num(a -> 'abstractness') as abstractness, health.num(a -> 'distance') as distance,
      a ->> 'debtRating' as debt_rating, health.num(a -> 'debtRatio') as debt_ratio
    from health.run r
    cross join lateral health.elements(r.record #> '{ndepend,assemblies}') a;

    -- Debt per namespace.
    create view health.ndepend_namespace as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      n ->> 'name' as namespace, n ->> 'assembly' as assembly,
      health.num(n -> 'types') as types, health.num(n -> 'loc') as loc,
      n ->> 'debtRating' as debt_rating, health.num(n -> 'debtRatio') as debt_ratio
    from health.run r
    cross join lateral health.elements(r.record #> '{ndepend,namespaces}') n;

    -- The three worst-method lists. Only byCrap names the project.
    create view health.worst_method as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      l.list, m.rank, m.item ->> 'project' as project, m.item ->> 'method' as method,
      health.num(m.item -> 'crap') as crap, health.num(m.item -> 'complexity') as complexity,
      health.num(m.item -> 'coverage') as coverage, health.num(m.item -> 'lines') as lines
    from health.run r
    cross join lateral (values ('crap', 'byCrap'), ('complexity', 'byComplexity'), ('length', 'byLength')) as l(list, key)
    cross join lateral health.elements(r.record #> array['worstMethods', l.key]) with ordinality as m(item, rank);

    -- Commits recorded more than once (a re-run, or the same commit on two
    -- branches): the two views below compare their runs.
    create view health.repeated_commit as
    select repo, commit_sha
    from public.health_run
    group by repo, commit_sha
    having count(*) > 1;

    -- A commit with both green and red runs: a flaky test or step, or an outage.
    create view health.flake_candidate as
    select
      r.repo, r.commit_sha,
      array_agg(distinct r.branch) as branches,
      count(*) as runs,
      count(*) filter (where r.green) as green_runs,
      count(*) filter (where not r.green) as red_runs,
      string_agg(r.run_id || '/' || r.run_attempt || ' ' || r.verdict || coalesce(' at ' || r.first_failing_step, ''),
                 ', ' order by r.run_id, r.run_attempt) as run_list,
      max(r.at) as last_at
    from health.run r
    join health.repeated_commit c using (repo, commit_sha)
    group by r.repo, r.commit_sha
    having count(*) filter (where r.green) > 0 and count(*) filter (where not r.green) > 0;

    -- A commit whose runs disagree on a project's numbers. Mutation compares the
    -- runs that measured it, not the ones that carried it.
    create view health.drift as
    select
      p.repo, p.commit_sha, p.project,
      array_agg(distinct p.branch) as branches,
      count(*) as runs,
      min(p.tests) as tests_min, max(p.tests) as tests_max,
      min(p.lines_pct) as lines_min, max(p.lines_pct) as lines_max,
      min(p.branches_pct) as branches_min, max(p.branches_pct) as branches_max,
      min(p.mutation_pct) filter (where p.mutation_ran) as mutation_min,
      max(p.mutation_pct) filter (where p.mutation_ran) as mutation_max,
      min(p.crap_max) as crap_min, max(p.crap_max) as crap_max,
      max(p.at) as last_at
    from health.project p
    join health.repeated_commit c using (repo, commit_sha)
    group by p.repo, p.commit_sha, p.project
    having count(*) > 1
       and (min(p.tests) <> max(p.tests)
         or min(p.lines_pct) <> max(p.lines_pct)
         or min(p.branches_pct) <> max(p.branches_pct)
         or min(p.mutation_pct) filter (where p.mutation_ran) <> max(p.mutation_pct) filter (where p.mutation_ran)
         or min(p.crap_max) <> max(p.crap_max));

    -- Typed reads of an object's entries, and of every number in a block at any
    -- depth (a boolean reads as 1 or 0; strings and nulls are skipped). Both are
    -- null-safe like health.elements: a missing block or another JSON type gives
    -- no rows.
    create function health.entries(j jsonb) returns table (key text, value jsonb)
      language sql immutable parallel safe
      as $$ select e.key, e.value from jsonb_each(case when jsonb_typeof(j) = 'object' then j else '{}'::jsonb end) e $$;

    create function health.leaves(j jsonb) returns table (path text[], value numeric)
      language sql immutable parallel safe
      as $$
        with recursive walk(path, node) as (
          select array[]::text[], j
          union all
          select w.path || c.key, c.value
          from walk w
          cross join lateral (
            select e.key, e.value from health.entries(w.node) e
            union all
            select (a.n - 1)::text, a.e from health.elements(w.node) with ordinality as a(e, n)
          ) c
        )
        select path,
          case jsonb_typeof(node)
            when 'number' then (node #>> '{}')::numeric
            when 'boolean' then case when (node #>> '{}')::boolean then 1 else 0 end
          end
        from walk
        where jsonb_typeof(node) in ('number', 'boolean') and cardinality(path) > 0
      $$;

    -- camelCase to words, for a count named by the data: blockingBytes reads
    -- "blocking bytes".
    create function health.words(k text) returns text
      language sql immutable parallel safe
      as $$ select lower(regexp_replace(k, '([a-z0-9])([A-Z])', '\1 \2', 'g')) $$;

    -- A tile's change line: "+0.0004 pp vs previous run", "no change vs
    -- previous run", or "first run in range" when the panel's rows hold no
    -- earlier one. unit is percent (pp), s, or anything else (a bare number).
    create function health.change(value numeric, previous numeric, unit text) returns text
      language sql immutable parallel safe
      as $$
        select case
          when value is null then null
          when previous is null then 'first run in range'
          when value = previous then 'no change vs previous run'
          else case when value > previous then '+' else '' end || trim_scale(value - previous)
               || case unit when 'percent' then ' pp' when 's' then ' s' else '' end || ' vs previous run'
        end
      $$;

    -- Each project's mutants as the overall score counts them. A project's own
    -- counts when its record has them: measured this run, or carried by the
    -- record from the run that last measured it (mutation.carriedFromRunId).
    -- When the record has none (a run after a red build or a cancelled one,
    -- whose record carried nothing forward), the counts of the latest earlier
    -- run on the same repository and branch that had them. A project with no
    -- counts on the branch yet is listed but not counted. Counts are taken when
    -- killed, timeout, survived and noCoverage are all numbers.
    --
    -- ran is what Stryker scores (killed + timeout + survived + no coverage);
    -- generated adds the mutants that never ran: ignored, compile errors and
    -- runtime errors. score_pct is Stryker's (killed + timeout) / ran.
    --
    -- The carry reads the branch's whole history, so a time filter does not
    -- shorten it: each query reads every record of the branch once.
    create view health.project_mutation as
    select
      repo, branch, run_id, run_attempt, commit_sha, at, project, tier, mutation_ran, mutation_floor,
      case when has_counts and mutation_ran then 'this run'
           when has_counts and mutation_carried_from is not null then 'carried by the record'
           when has_counts then 'in the record'
           when killed is not null then 'carried by the view'
      end as counted_as,
      case when killed is not null then counts_from end as counts_from,
      killed, timeout, survived, no_coverage, ignored, compile_error, runtime_error,
      killed + timeout as detected,
      killed + timeout + survived + no_coverage as ran,
      killed + timeout + survived + no_coverage
        + coalesce(ignored, 0) + coalesce(compile_error, 0) + coalesce(runtime_error, 0) as generated,
      round(100.0 * (killed + timeout) / nullif(killed + timeout + survived + no_coverage, 0), 4) as score_pct,
      round(100.0 * (killed + timeout + survived + no_coverage)
        / nullif(killed + timeout + survived + no_coverage
                 + coalesce(ignored, 0) + coalesce(compile_error, 0) + coalesce(runtime_error, 0), 0), 2) as ran_pct
    from (
      select
        repo, branch, run_id, run_attempt, commit_sha, at, project, tier, mutation_ran, mutation_floor,
        mutation_carried_from, has_counts,
        first_value(source_run) over latest as counts_from,
        first_value(killed) over latest as killed,
        first_value(timeout) over latest as timeout,
        first_value(survived) over latest as survived,
        first_value(no_coverage) over latest as no_coverage,
        first_value(ignored) over latest as ignored,
        first_value(compile_error) over latest as compile_error,
        first_value(runtime_error) over latest as runtime_error
      from (
        select
          *,
          killed is not null and timeout is not null and survived is not null and no_coverage is not null as has_counts,
          case when mutation_ran then run_id else mutation_carried_from end as source_run,
          count(*) filter (where killed is not null and timeout is not null
                             and survived is not null and no_coverage is not null)
            over (partition by repo, branch, project order by run_id, run_attempt) as counted
        from (
          select r.repo, r.branch, r.run_id, r.run_attempt, r.commit_sha, r.at, x.*
          from health.run r
          cross join lateral (select r.record -> 'projects' as projects offset 0) one_read
          -- health.project's mutation columns, from that one read of the record. offset 0
          -- computes them here, so the sort below carries numbers, not each project's JSON.
          cross join lateral (
            select
              p ->> 'project' as project, p ->> 'tier' as tier,
              health.bool(p #> '{mutation,ran}') as mutation_ran,
              health.num(p #> '{mutation,floor}') as mutation_floor,
              health.num(p #> '{mutation,carriedFromRunId}') as mutation_carried_from,
              health.num(p #> '{mutation,counts,killed}') as killed,
              health.num(p #> '{mutation,counts,timeout}') as timeout,
              health.num(p #> '{mutation,counts,survived}') as survived,
              health.num(p #> '{mutation,counts,noCoverage}') as no_coverage,
              health.num(p #> '{mutation,counts,ignored}') as ignored,
              health.num(p #> '{mutation,counts,compileError}') as compile_error,
              health.num(p #> '{mutation,counts,runtimeError}') as runtime_error
            from health.elements(one_read.projects) p
            offset 0
          ) x
        ) project
      ) numbered
      window latest as (partition by repo, branch, project, counted order by run_id, run_attempt)
    ) carried;

    -- The overall mutation score, one row per run whose record lists projects,
    -- over every project it lists with health.project_mutation's counts.
    -- mutation_pct is Stryker's score of the mutants that ran,
    -- sum(killed + timeout) / sum(killed + timeout + survived + no coverage);
    -- ignored, compile-error and runtime-error mutants never ran and are not in
    -- it, as in Stryker. mutants_ran_pct is the share of generated mutants that
    -- ran, and the three _pct after it the shares that did not. projects_counted
    -- below projects means some project has no counts on the branch yet.
    create view health.overall_mutation as
    select
      repo, branch, run_id, run_attempt, at,
      projects, projects_counted, projects_measured, projects_carried_by_view,
      killed, timeout, survived, no_coverage, ignored, compile_error, runtime_error, detected, ran, generated,
      round(100.0 * detected / nullif(ran, 0), 4) as mutation_pct,
      round(100.0 * ran / nullif(generated, 0), 2) as mutants_ran_pct,
      round(100.0 * ignored / nullif(generated, 0), 2) as mutants_ignored_pct,
      round(100.0 * compile_error / nullif(generated, 0), 2) as mutants_compile_error_pct,
      round(100.0 * runtime_error / nullif(generated, 0), 2) as mutants_runtime_error_pct
    from (
      select repo, branch, run_id, run_attempt, at,
        count(*) as projects,
        count(ran) as projects_counted,
        count(*) filter (where counted_as = 'this run') as projects_measured,
        count(*) filter (where counted_as = 'carried by the view') as projects_carried_by_view,
        sum(killed) as killed, sum(timeout) as timeout, sum(survived) as survived, sum(no_coverage) as no_coverage,
        sum(coalesce(ignored, 0)) filter (where ran is not null) as ignored,
        sum(coalesce(compile_error, 0)) filter (where ran is not null) as compile_error,
        sum(coalesce(runtime_error, 0)) filter (where ran is not null) as runtime_error,
        sum(detected) as detected, sum(ran) as ran, sum(generated) as generated
      from health.project_mutation
      group by repo, branch, run_id, run_attempt, at
    ) summed;

    -- The other aggregates across projects, one row per run (every run, so a red
    -- build is a row of nulls, not a gap in the run list).
    --   Coverage: covered over coverable lines and branches, summed across the
    --   projects that report them, so a large project weighs more than a small one.
    --   Tests and CRAP: the record's totals (the tests include the suites outside
    --   the projects). NDepend and duplication: their blocks, null when absent.
    -- The record is read once per run (jsonb_to_record), not once per value: each
    -- read decompresses the whole record. Every health record is a JSON object,
    -- so jsonb_to_record never meets anything else.
    create view health.overall as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.commit_sha, r.at, r.verdict,
      c.projects_with_coverage,
      c.lines_covered, c.lines_total, round(100.0 * c.lines_covered / nullif(c.lines_total, 0), 2) as lines_pct,
      c.branches_covered, c.branches_total,
      round(100.0 * c.branches_covered / nullif(c.branches_total, 0), 2) as branches_pct,
      health.num(b.totals #> '{tests,total}') as tests,
      health.num(b.totals #> '{tests,failed}') as tests_failed,
      health.num(b.totals #> '{tests,skipped}') as tests_skipped,
      round(health.num(b.totals #> '{tests,durationMs}') / 1000, 1) as test_seconds,
      health.num(b.totals -> 'methodsOverCrapThreshold') as methods_over_crap,
      health.num(b.totals -> 'testGapMass') as test_gap_mass,
      health.num(b.ndepend #> '{trend,debt,percent}') as debt_pct,
      health.num(b.ndepend #> '{trend,issues,critical}') as issues_critical,
      health.num(b.ndepend #> '{trend,issues,blocker}') as issues_blocker,
      health.num(b.duplication -> 'duplicatedLines') as duplicated_lines,
      health.num(b.duplication -> 'lines') as duplication_lines,
      round(100.0 * health.num(b.duplication -> 'duplicatedLines')
        / nullif(health.num(b.duplication -> 'lines'), 0), 2) as duplicated_pct
    from health.run r
    cross join lateral jsonb_to_record(r.record) as b(totals jsonb, ndepend jsonb, duplication jsonb, projects jsonb)
    cross join lateral (
      select
        count(*) filter (where health.num(p #> '{coverage,lines,whole}') is not null) as projects_with_coverage,
        sum(health.num(p #> '{coverage,lines,part}')) as lines_covered,
        sum(health.num(p #> '{coverage,lines,whole}')) as lines_total,
        sum(health.num(p #> '{coverage,branches,part}')) as branches_covered,
        sum(health.num(p #> '{coverage,branches,whole}')) as branches_total
      from health.elements(b.projects) p
    ) c;

    -- Every count of the producer blocks (R130 keeps them counts only), one row
    -- per run and number at any depth: the allocation ratchet (performance),
    -- the oracle differential and, once their producers write them, fuzz,
    -- generated and invariants. A key a producer adds shows up here, and in
    -- every panel that reads this view, with no edit; a sixth block needs its
    -- name in the list below. key is the path's first step, label its words.
    create view health.lens_count as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at, b.block,
      array_to_string(l.path, '.') as path, cardinality(l.path) as depth,
      l.path[1] as key, health.words(l.path[1]) as label, l.value
    from health.run r
    cross join (values ('performance'), ('differential'), ('fuzz'), ('generated'), ('invariants')) as b(block)
    cross join lateral (select r.record -> b.block as counts offset 0) one_read
    cross join lateral health.leaves(one_read.counts) l;

    -- The oracle differential per recording, keyed by the record's own names
    -- (r1, r2, ...), so a new recording is a new row.
    create view health.differential_recording as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      e.key as recording,
      nullif(regexp_replace(e.key, '\D', '', 'g'), '')::numeric as recording_number,
      health.num(e.value -> 'compared') as compared,
      health.num(e.value -> 'masked') as masked,
      health.num(e.value -> 'annotated') as annotated,
      health.num(e.value -> 'deferredExpected') as deferred_expected,
      health.num(e.value -> 'deferredActual') as deferred_actual,
      health.num(e.value -> 'differences') as differences,
      health.num(e.value -> 'stale') as stale,
      (select string_agg(a.key || ' ' || a.value, ', ' order by a.key)
         from health.entries(e.value -> 'annotatedBy') a) as annotated_by
    from health.run r
    cross join lateral (select r.record #> '{differential,recordings}' as recordings offset 0) one_read
    cross join lateral health.entries(one_read.recordings) e;

    -- Differences the ledger annotated, per run, recording and reason (the
    -- Because, dv006 for DV-006), so a new reason is a new row.
    create view health.differential_annotation as
    select
      r.repo, r.branch, r.run_id, r.run_attempt, r.at,
      e.key as recording,
      nullif(regexp_replace(e.key, '\D', '', 'g'), '')::numeric as recording_number,
      a.key as reason, health.num(a.value) as annotated
    from health.run r
    cross join lateral (select r.record #> '{differential,recordings}' as recordings offset 0) one_read
    cross join lateral health.entries(one_read.recordings) e
    cross join lateral health.entries(e.value -> 'annotatedBy') a;

    grant usage on schema health to health_reader;
    grant select on all tables in schema health to health_reader;

    -- Schema `perf`: Necronia2.0's performance records (perf_run, one row per
    -- producer run, perf.json schema 1; tables.sql creates the table). A result
    -- is a row id with a parameter map and a metric map, so a new suite, row,
    -- parameter or metric is new data here, never a new column or view.
    -- It reads through health.num, health.bool, health.elements and
    -- health.entries, so it is built after them; `drop schema health cascade`
    -- above takes these views with it, and this section rebuilds them.
    drop schema if exists perf cascade;
    create schema perf;

    -- One row per record. env_group is the environment results compare within:
    -- class, machine, CPU model, pinning, runtime major.minor. Every view that
    -- compares joins on it; nothing compares across groups (the workstation is
    -- never a ratio of CI).
    create view perf.run as
    select
      p.repo, p.uid, p.suite, p.run_kind, p.env_class, p.branch, p.branch_kind, p.commit_sha, p.dirty, p.milestone,
      p.started_at as at,
      concat_ws(' · ', p.env_class, p.record #>> '{environment,machine}', p.record #>> '{environment,cpuModel}',
                coalesce('host ' || (p.record #>> '{environment,pinning,host}'), 'unpinned'),
                substring(p.record #>> '{environment,runtime}' from '^\.NET [0-9]+\.[0-9]+')) as env_group,
      case when jsonb_typeof(p.record #> '{run,pairing}') = 'object' then p.record #> '{run,pairing}' end as pairing,
      'https://github.com/' || p.repo || '/actions/runs/' || health.num(p.record #> '{run,github,runId}')
        || coalesce('/attempts/' || health.num(p.record #> '{run,github,runAttempt}'), '') as run_url,
      p.record
    from public.perf_run p;

    -- One row per result, in the record's order. `at` is the record's start; a
    -- result's own startedUtc stays in `result`.
    create view perf.result as
    select
      r.repo, r.uid, r.suite, r.run_kind, r.env_class, r.env_group, r.branch, r.commit_sha, r.dirty, r.milestone,
      r.at, r.pairing, r.run_url,
      x.position, x.result ->> 'scenario' as scenario, x.result ->> 'id' as row_id,
      coalesce(health.num(x.result -> 'series'), 1)::int as series, x.result ->> 'definition' as definition,
      case when jsonb_typeof(x.result -> 'parameters') = 'object' then x.result -> 'parameters' else '{}' end
        as parameters,
      coalesce(health.bool(x.result -> 'valid'), false) as valid,
      (select string_agg(c #>> '{}', ', ') from health.elements(x.result -> 'invalid') c) as invalid,
      (select string_agg(c #>> '{}', ', ') from health.elements(x.result -> 'warnings') c) as warnings,
      x.result
    from perf.run r
    cross join lateral health.elements(r.record -> 'results') with ordinality as x(result, position);

    -- One row per result and metric: the long form every panel reads. headline
    -- marks the two or three metrics a row is read by.
    create view perf.metric as
    select
      r.repo, r.uid, r.suite, r.scenario, r.row_id, r.series, r.definition, r.parameters,
      r.run_kind, r.env_class, r.env_group, r.branch, r.commit_sha, r.dirty, r.milestone, r.at, r.pairing,
      r.valid, r.warnings,
      m.key as metric, health.num(m.value -> 'value') as value, m.value ->> 'unit' as unit,
      coalesce(m.value ->> 'better', 'none') as better, coalesce(health.bool(m.value -> 'headline'), false) as headline
    from perf.result r
    cross join lateral health.entries(r.result -> 'metrics') m;

    -- One row per result and condition: what the environment did during it
    -- (temperature, CPU pressure before, after and at peak, exit codes).
    create view perf.condition as
    select
      r.repo, r.uid, r.suite, r.scenario, r.row_id, r.series,
      r.run_kind, r.env_class, r.env_group, r.branch, r.commit_sha, r.dirty, r.milestone, r.at, r.valid,
      c.key as condition, health.num(c.value -> 'value') as value, c.value ->> 'unit' as unit
    from perf.result r
    cross join lateral health.entries(r.result -> 'conditions') c;

    -- One row per result and parameter: the drill-down's variables and the
    -- scaling panel's x axis. number is null for a parameter that is not one.
    create view perf.parameter as
    select
      r.repo, r.suite, r.scenario, r.row_id, r.series, r.uid, r.env_class, r.env_group, r.at, r.valid,
      p.key as name, p.value #>> '{}' as value, health.num(p.value) as number
    from perf.result r
    cross join lateral health.entries(r.parameters) p;

    -- The value each series is read against, per environment group, for the
    -- newest ritual: on the workstation the median of that milestone's ritual
    -- runs on the candidate arm (a record without pairing counts as one); in CI
    -- the median of the group's nightlies and dispatches in the 7 days before
    -- that ritual (Necronia2.0 R313 O3: the nightly measures the milestone
    -- branch). Valid, clean results only. Never across groups.
    create view perf.reference as
    with newest as (
      select distinct on (repo) repo, milestone, at
      from perf.run
      where run_kind = 'ritual'
      order by repo, at desc)
    select
      m.repo, m.suite, m.row_id, m.series, m.metric, m.env_group, n.milestone,
      percentile_cont(0.5) within group (order by m.value) as value, count(*) as samples
    from perf.metric m
    join newest n on n.repo = m.repo
    where m.valid and m.value is not null and not m.dirty
      and ((m.run_kind = 'ritual' and m.milestone = n.milestone
            and coalesce(m.pairing ->> 'arm', 'candidate') = 'candidate')
        or (m.run_kind in ('nightly', 'dispatch') and m.at > n.at - interval '7 days' and m.at <= n.at))
    group by m.repo, m.suite, m.row_id, m.series, m.metric, m.env_group, n.milestone;

    -- The spread on unchanged code: every series measured three times or more
    -- on one commit in one group. Its cv says how large a change the group's
    -- trend can show.
    create view perf.noise as
    select
      repo, suite, row_id, series, metric, env_group, commit_sha, count(*) as samples,
      avg(value) as mean, stddev_samp(value) as stddev, stddev_samp(value) / nullif(avg(value), 0) as cv,
      max(value) / nullif(min(value), 0) as max_over_min, max(at) as last_at
    from perf.metric
    where valid and value is not null and not dirty
    group by repo, suite, row_id, series, metric, env_group, commit_sha
    having count(*) >= 3;

    grant usage on schema perf to health_reader;
    grant select on all tables in schema perf to health_reader;

    commit;
