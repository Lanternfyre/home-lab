# H1 for the tunnel. This pod is, by construction, the one thing in the cluster
# whose job is to talk to the internet and to hand what it finds to strangers,
# so its egress list is the one that matters most.
#
# Three destinations, and nothing else:
#   - DNS, to resolve region*.v2.argotunnel.com and the Envoy Service
#   - Cloudflare's edge on 7844 (QUIC/UDP by default, TCP as the fallback
#     transport) and 443 for registration
#   - the GATED Envoy Service on 443 -- and NOTHING else in the cluster
#
# 🔴 THE LAST ONE IS THE CONTAINMENT. cloudflared cannot reach app Services
# directly, so a rule in config.yaml that pointed at one would simply fail
# rather than quietly bypassing the Gateway and the Authentik policy attached
# to it. The network refuses what a config mistake would otherwise allow.
#
# `world` for the edge is unavoidable and deliberate: Cloudflare's anycast
# addresses are not a stable CIDR this repo can pin, and a toFQDNs rule for
# region*.v2.argotunnel.com would still resolve to the same anycast space. The
# port restriction is the real limit -- 7844 and 443 outbound, nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared-egress
  namespace: cloudflare-tunnel
spec:
  endpointSelector: {}

  enableDefaultDeny:
    ingress: true
    egress: true

  egress:
    # L7 DNS visibility, so a future toFQDNs rule can match at all. Without it
    # Cilium never sees the answers and name-based rules silently match nothing.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"

    # Cloudflare's edge.
    - toEntities:
        - world
      toPorts:
        - ports:
            - { port: "7844", protocol: UDP }
            - { port: "7844", protocol: TCP }
            - { port: "443",  protocol: TCP }

    # The Gateway, and only the Gateway.
    #
    # 🔴 10443, NOT 443, and this is the single most counter-intuitive number in
    # the file. The Service publishes port 443; Envoy inside the pod listens on
    # 10443, because Envoy Gateway shifts privileged ports by 10000. Cilium
    # evaluates policy AFTER service translation, so the port it sees is the
    # BACKEND's, never the Service's.
    #
    # Written as 443 first, and proven wrong by Hubble rather than by reasoning:
    #   cloudflared-... <> envoy-...-tunnel-...:10443
    #     policy-verdict:none EGRESS DENIED (TCP Flags: SYN)
    # The symptom was a 25-second hang and `dial tcp 10.43.21.216:443: i/o
    # timeout` in the cloudflared log -- a Service address and a Service port,
    # naming a rule that was never about either.
    #
    # ⚠️ This rule had NEVER been exercised before today. It was written while
    # cloudflared pointed at the gated Gateway and no request ever traversed it,
    # so "443" sat here looking correct for as long as nothing used it.
    #
    # The port restriction stays rather than opening the namespace: Envoy's
    # admin and xDS listeners (18000-19003) live on these same pods, and
    # cloudflared has no business reaching any of them.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gateway-envoy
      toPorts:
        - ports:
            - { port: "10443", protocol: TCP }

  ingress:
    # The kubelet probe path. `world` is correct here and must not be
    # "tightened" -- see canary/canary.ciliumnetworkpolicy.yaml for the
    # experiment that established it.
    - fromEntities:
        - host
        - remote-node
        - world

    # Prometheus scraping the metrics endpoint.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - { port: "2000", protocol: TCP }
