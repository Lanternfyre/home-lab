# The routing table, in git rather than in Cloudflare's dashboard.
#
# ── ONE TUNNEL, MANY HOSTNAMES ──────────────────────────────────────────────
# There is no reason to create a tunnel per app. A tunnel is a named connection
# to Cloudflare's edge; the `ingress` list below is what fans it out. Cloudflare
# supports up to 25 replicas / 100 connections on a single tunnel, and every
# replica serves every rule. Adding an app is a rule here, not new
# infrastructure.
#
# ── ORIGIN: THE GATEWAY, NOT THE APP ────────────────────────────────────────
# Every rule points at the SAME gated Envoy Service, and lets Envoy route by
# Host as it already does for LAN traffic. Pointing cloudflared straight at app
# Services would bypass the Gateway -- and with it the Authentik SecurityPolicy
# attached to that Gateway, which is the only thing standing between the
# internet and these apps.
#
# ⚠️ The Service name carries a hash Envoy generates: LOOK IT UP, never guess.
#     kubectl get svc -n gateway-envoy
#   `envoy-gateway-envoy-homelab-tunnel-6cc00307`  the INTERNET Gateway  .32.11
#   `envoy-gateway-envoy-homelab-gated-06cddf46`   LAN, authentik        .32.19
#   `envoy-gateway-envoy-homelab-b0a9a155`         LAN, OPEN -- never this one
#
# The tunnel Gateway is the right target and not merely a tidier one: the LAN
# Gateway serves `*.lab.techyon.dev`, for which Cloudflare has NO EDGE
# CERTIFICATE, so pointing here at the gated Service publishes a hostname whose
# TLS handshake dies at the edge before this config is ever consulted.
#
# `originServerName` is required because the Gateway serves a WILDCARD
# certificate. Without it cloudflared validates the cert against the Service's
# internal DNS name, which no certificate covers, and every request fails TLS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    # The UUID from `cloudflared tunnel create`, which is also the TunnelID
    # field inside the credentials JSON. NOT a secret -- it is published in DNS
    # as <uuid>.cfargotunnel.com, which is why canary-public's external-dns
    # target annotation can carry it in plain sight. The two must MATCH.
    tunnel: 69f49aa0-f301-4aa0-9fb1-40025f21a963
    credentials-file: /etc/cloudflared/creds/credentials.json

    # Prometheus endpoint. Worth having: when the tunnel is down, everything
    # published through it is down, and nothing else in the cluster will notice.
    metrics: 0.0.0.0:2000

    # The image is pinned by digest and updated through git. An in-place
    # self-update would silently replace the binary this repo thinks it runs.
    no-autoupdate: true

    ingress:
      # ── The canary, and nothing else yet ──────────────────────────────────
      # `canary.lab.techyon.dev` keeps resolving to the LAN Gateway and is
      # untouched by any of this. It is the CONTROL: when the public path
      # misbehaves it answers "is the app broken, or is the exposure broken?".
      - hostname: canary.techyon.dev
        service: https://envoy-gateway-envoy-homelab-tunnel-6cc00307.gateway-envoy.svc.cluster.local:443
        originRequest:
          originServerName: canary.techyon.dev

      # ── The two-port TCP demo ─────────────────────────────────────────────
      # An Open-Tibia-shaped protocol: LOGIN on one port, GAME on another, each
      # its own hostname so a failure is visibly on one of them.
      #
      # ⚠️ THESE BYPASS ENVOY COMPLETELY. `tcp://` points at the Service, not at
      # a Gateway, so there is no HTTPRoute, no SecurityPolicy and NO AUTHENTIK
      # GATE -- OIDC is a browser redirect flow and cannot run over a raw TCP
      # stream. Cloudflare Access in front of the hostname is the only gate
      # available here, and it is not configured. Throwaway services only.
      #
      # ⚠️ NOT reachable by a plain client. A public hostname serves HTTP(S)
      # only; raw TCP needs `cloudflared access tcp` on the CLIENT machine, or
      # WARP with private network routes. See MANUAL-STEPS.md for the exact
      # commands and for the Open Tibia handoff problem, which is the thing
      # that will actually bite: an OT login server hands the client an address
      # for the game server, and through a tunnel that address has to be the
      # client's own local proxy, not a public one.
      #
      # ⚠️ DNS for these is NOT created by external-dns. It watches Gateway API
      # routes, and these have none -- so here, and ONLY here, `cloudflared
      # tunnel route dns` is the right tool. On the HTTP side it is exactly the
      # wrong tool, because it creates a record external-dns cannot reconcile.
      - hostname: ot-login.techyon.dev
        service: tcp://ot-login.ot-demo.svc.cluster.local:7171
      - hostname: ot-game.techyon.dev
        service: tcp://ot-game.ot-demo.svc.cluster.local:7172

      # Required, and required LAST: cloudflared refuses to start without a
      # catch-all. 404 rather than a redirect, so an unmapped hostname that
      # somehow reaches this tunnel gets nothing.
      - service: http_status:404
