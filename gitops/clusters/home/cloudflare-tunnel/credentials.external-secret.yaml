# The tunnel's credentials, from GCP Secret Manager via ESO -- the same path
# CF_API_TOKEN already takes for cert-manager and external-dns.
#
# ⚠️ This is NOT the same credential as CF_API_TOKEN, and not the dashboard
# connector token either. A LOCALLY-managed tunnel authenticates with the JSON
# that `cloudflared tunnel create` writes to ~/.cloudflared/<uuid>.json:
#
#     { "AccountTag": "...", "TunnelSecret": "...", "TunnelID": "..." }
#
# Locally-managed is the deliberate choice: it puts the ingress rules in
# cloudflared.configmap.yaml, in git, reviewable and revertible. The
# remotely-managed alternative authenticates with a dashboard token and keeps
# the routing table in Cloudflare's UI, where this repo cannot see or diff it.
#
# The credential is tunnel-scoped: it can serve this tunnel and do nothing else.
# It cannot read DNS, cannot create tunnels, and cannot touch the account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: cloudflare-tunnel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: cloudflare-tunnel-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # cloudflared wants a file, and the file must be exactly the JSON blob.
        credentials.json: "{{ .credentials }}"
  data:
    - secretKey: credentials
      remoteRef:
        key: CF_TUNNEL_CREDENTIALS
