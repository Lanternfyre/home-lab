# The tunnel's credentials, from 1Password.
#
# ⚠️ This is NOT the same credential as CF_API_TOKEN, and not the dashboard
# connector token either. A LOCALLY-managed tunnel authenticates with the JSON
# that `cloudflared tunnel create` writes to ~/.cloudflared/<uuid>.json:
#
#     { "AccountTag": "...", "TunnelSecret": "...", "TunnelID": "..." }
#
# Locally-managed is the deliberate choice: it puts the ingress rules in
# cloudflared.configmap.yaml, in git, reviewable and revertible. The
# remotely-managed alternative authenticates with a dashboard token and keeps
# the routing table in Cloudflare's UI, where this repo cannot see or diff it.
#
# The credential is tunnel-scoped: it can serve this tunnel and do nothing
# else. It cannot read DNS, cannot create tunnels, and cannot touch the account.
#
# ── Why 1Password and not gcp-secret-store ──────────────────────────────────
# 1Password is the convention here: 28 ExternalSecrets use it against 4 for
# GCP, and two of those four are `secrets/one-password-access-token` and
# `secrets/one-password-credentials`. GCP Secret Manager is the BOOTSTRAP root
# whose job is to unlock 1Password and then get out of the way; the
# `cloudflare-access-token` pair also living there is a bootstrap-era leftover,
# not a pattern to copy. Putting a new secret in GCP would grow the one store
# that exists to stay small.
#
# `trim` is not optional. 1Password fields ship with a trailing newline, and
# this repo has been bitten by it at least three times -- redis rejecting
# requirepass, Pushover returning a bare HTTP 400, and the google-oauth
# fan-out. cloudflared would fail to parse the credentials file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: cloudflare-tunnel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: cloudflare-tunnel-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # cloudflared wants a file, and the file must be exactly the JSON blob.
        credentials.json: "{{ .rawCredentials | trim }}"
  data:
    - secretKey: rawCredentials
      remoteRef:
        # 1Password item CF_TUNNEL_CREDENTIALS in the `Infrastructure` vault,
        # JSON in the `password` field.
        key: CF_TUNNEL_CREDENTIALS
        property: password
