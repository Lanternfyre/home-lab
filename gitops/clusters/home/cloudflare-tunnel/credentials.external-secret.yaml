# The tunnel's credentials, from 1Password.
#
# ⚠️ NOT the same credential as CF_API_TOKEN, and not the dashboard connector
# token either. A LOCALLY-managed tunnel authenticates with the JSON that
# `cloudflared tunnel create` writes to ~/.cloudflared/<uuid>.json:
#
#     { "AccountTag": "...", "TunnelSecret": "...", "TunnelID": "..." }
#
# Locally-managed is the deliberate choice: it puts the ingress rules in
# cloudflared.configmap.yaml, in git, reviewable and revertible. The
# remotely-managed alternative authenticates with a dashboard token and keeps
# the routing table in Cloudflare's UI, where this repo cannot see or diff it.
#
# The credential is tunnel-scoped: it serves this one tunnel and does nothing
# else. It cannot read DNS, cannot create tunnels, cannot touch the account.
#
# ── ONE 1Password ITEM, ONE FIELD PER TUNNEL ────────────────────────────────
# Item `CLOUDFLARE_TUNNELS` in the `Infrastructure` vault. This tunnel's JSON
# lives in the field labelled `homelab`. A second tunnel is a NEW FIELD on the
# SAME item plus a copy of this file -- not a new 1Password item, and not a
# migration of this one.
#
# ESO's 1Password provider maps `remoteRef.key` to the item TITLE and
# `remoteRef.property` to a field LABEL, and custom labels are supported --
# `password` is not special, it is just the default field's label.
#
# 🔴 The documented hazard is DUPLICATE LABELS on one item: 1Password permits
# them and ESO's behaviour is then undefined. Field labels here must be unique
# and should be the tunnel name, lowercase, no spaces.
#
# Trade-off, stated rather than glossed: everything in one item means anyone
# with access to that item sees every tunnel's credentials. Cluster-side
# isolation is unaffected -- only the named property is projected into the
# Secret below -- so the blast radius is at the 1Password level, where a single
# `Infrastructure` vault already implies it.
#
# `trim` is not decoration. 1Password fields carry a trailing newline and this
# repo has been bitten three times: redis rejecting requirepass, Pushover
# returning a bare HTTP 400, and the google-oauth fan-out.
#
# ── Why 1Password and not gcp-secret-store ──────────────────────────────────
# 1Password is the convention: 28 ExternalSecrets against 4 for GCP, and two of
# those four are `secrets/one-password-access-token` and
# `secrets/one-password-credentials`. The one-password ClusterSecretStore
# authenticates with the first of them, so GCP is the BOOTSTRAP ROOT whose only
# job is to unlock 1Password and get out of the way. The `cloudflare-access-token`
# pair also living there is a bootstrap-era leftover, not a pattern to copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-homelab-credentials
  namespace: cloudflare-tunnel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: cloudflared-homelab-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # cloudflared wants a file, and the file must be exactly the JSON blob.
        credentials.json: "{{ .rawCredentials | trim }}"
  data:
    - secretKey: rawCredentials
      remoteRef:
        key: CLOUDFLARE_TUNNELS
        property: homelab
