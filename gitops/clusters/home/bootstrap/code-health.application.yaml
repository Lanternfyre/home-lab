# A standalone manifests Application, as necronia-k0-mysql. The code-health
# database is a CNPG Cluster, its role secrets, its later tables and its views
# and their PostSync Job, and two network policies, with no Helm chart, and
# both apps ApplicationSets read an app.yaml that must name one.
#
# What it is for: Necronia2.0's CI inserts one health record per run into
# `health_run` (Necronia2.0 R134 G8), and one performance record per producer
# run into `perf_run` (its R313); Grafana reads them through the views
# (code-health/views.job.yaml) as health_reader, with the datasource and the
# two dashboards in apps/prometheus/manifests/code-health-*.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: code-health
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/Lanternfyre/home-lab.git
    targetRevision: master
    path: gitops/clusters/home/code-health
  destination:
    server: https://kubernetes.default.svc
    namespace: code-health
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # As the ApplicationSets carry it: an automated sync that fails (say, the
    # namespace from bootstrap/namespaces/ not there yet on the first pass) is
    # otherwise not retried until the next commit.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
