apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: home-helm-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/t3chy0n/home-lab.git
        revision: master
        files:
          - path: gitops/clusters/home/apps/**/app.yaml


  template:
    metadata:
      name: "{{ .path.basename }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io

    spec:
      project: default

      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            releaseName: "{{ default .path.basename .releaseName }}"
            valueFiles:
              - "$values/{{ .path.path }}/chart-values.yaml"
            ignoreMissingValueFiles: true

        - repoURL: https://github.com/t3chy0n/home-lab.git
          targetRevision: master
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ default .path.basename .namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # NOTE the indentation: retry MUST be nested inside syncPolicy.
        # It previously sat here at 6 spaces, as a sibling of syncPolicy, i.e.
        # spec.template.spec.retry. The Application CRD has no spec.retry, so
        # the field was silently pruned and ALL 27 Helm Applications ran with
        # no retry policy whatsoever -- verified live: every one returned
        # <EMPTY> for .spec.syncPolicy.retry while the -manifests apps, whose
        # ApplicationSet nests it correctly, returned limit 10.
        # Nothing errors when you get this wrong; the field just vanishes.
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 10m