# ot-demo
#
# A minimum two-port TCP demo: an Open-Tibia-shaped protocol with LOGIN on one
# port and GAME on another, published through the Cloudflare Tunnel.
#
# Deliberately NOT in the `canary` namespace. The canary's defining property is
# that it can reach NOTHING -- not even DNS -- and it is only reachable from
# `gateway-envoy`. Publishing TCP requires cloudflared to reach these pods
# directly, bypassing Envoy entirely, so putting them in `canary` would mean
# widening the one policy in the cluster whose strictness is the whole point.
#
# `restricted`, like canary. All three listeners are above 1024, so nothing here
# needs a capability to bind.
#
# ── 🔴 THE OPT-IN LABEL IS WHAT PUBLISHES THIS NAMESPACE TO THE INTERNET ────
# `homelab.techyon.dev/edge-publish` is what the `homelab-edge` Gateway's
# `allowedRoutes.namespaces.selector` matches. Without it, a TCPRoute here
# reports `Accepted: False` / NotAllowedByListeners and nothing is exposed.
#
# It is a PURPOSE-BUILT label, not a reused one, so it cannot be granted as a
# side effect of doing something else -- and adding it is a reviewable commit to
# this directory rather than a consequence of deploying an app. That is the
# containment for a Gateway with no authentication in front of it.
#
# Residual hole, stated rather than hidden: anyone who can label a namespace can
# publish through the edge. That is cluster-admin -- ArgoCD and this repo.
apiVersion: v1
kind: Namespace
metadata:
  name: ot-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
    homelab.techyon.dev/edge-publish: "true"
