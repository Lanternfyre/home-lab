# nvidia-device-plugin
#
# Apps in this namespace: nvidia-device-plugin.
#
# ⚠️ NOT enforced. The device plugin mounts hostPath -- kubelet's
# device-plugins socket directory, /var/run/cdi and the MPS directories under
# /run/nvidia/mps -- which `baseline` forbids. Measured from `helm template` of
# chart 0.20.1 with this repo's values (2026-11-11), not from a running pod:
# none existed yet.
# PSA cannot grant a per-field exception, so `privileged` is the only level that
# admits these pods. The things that DO matter here move to Kyverno (H3):
# kyverno/manifests/nvidia-device-plugin-pod-constraints.validatingpolicy.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-device-plugin
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.35
