# monitoring
#
# Apps in this namespace: alloy-gateway, alloy, blackbox-exporter, loki, prometheus, pyroscope, smartctl-exporter, speedtest-exporter, tempo.
#
# ⚠️ NOT enforced. node-exporter runs privileged with hostPID, hostPath and hostNetwork.
# PSA cannot grant a per-field exception, so `privileged` is the only level that
# admits these pods. The things that DO matter here move to Kyverno (H3).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.35
