# The NetBird dashboard, DELIBERATELY NOT on the internet.
#
# 🔴 NO `edge-publish` LABEL, AND THAT IS THE POINT. The dashboard is a static
# SPA that runs in an operator's browser and calls the management API over
# HTTPS. Only management, signal and relay have to be publicly reachable,
# because those are what the VPN CLIENT talks to. Nothing about the UI needs to
# be exposed to strangers.
#
# Keeping it out of `netbird` also removes it from
# `edge-published-pod-constraints`, which it CANNOT satisfy: measured against
# the image, netbirdio/dashboard runs supervisord with `user=root` on every
# program and nginx binding :80. Forcing runAsNonRoot makes supervisord refuse
# outright --
#
#   Error: Can't drop privilege as nonroot user
#
# -- and binding :80 unprivileged would need NET_BIND_SERVICE, which the
# contract forbids. Complying would mean forking the image to rewrite both
# supervisord.conf and nginx.conf.
#
# ⚠️ SO THIS IS NOT AN EXEMPTION GRANTED TO A NON-COMPLIANT WORKLOAD. It is the
# workload being put where its exposure actually warrants: behind the
# authentik-gated LAN Gateway, reachable from the LAN and over the VPN itself
# once connected. The contract still refuses it everywhere it would be public.
#
# PSA `baseline` rather than `restricted`: baseline permits a root UID, which
# this image requires, while still forbidding privileged, host namespaces and
# hostPath.
apiVersion: v1
kind: Namespace
metadata:
  name: netbird-ui
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.35
