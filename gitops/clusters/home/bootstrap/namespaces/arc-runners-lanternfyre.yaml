# arc-runners-lanternfyre
#
# Apps in this namespace: arc-lanternfyre, arc-lanternfyre-dind, arc-lanternfyre-xl,
# arc-lanternfyre-android, arc-lanternfyre-gpu. (This line listed the -mutation and
# -ndepend sets until 2026-11-11; both were replaced on 2026-09-16.)
#
# ⚠️ NOT enforced. arc-lanternfyre-dind runs a privileged dind sidecar; NDepend licences by MAC + uppercase machine name.
# PSA cannot grant a per-field exception, so `privileged` is the only level that
# admits these pods. The things that DO matter here move to Kyverno (H3).
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners-lanternfyre
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.35
