# arc-runners-lanternfyre
#
# Apps in this namespace: arc-lanternfyre-mutation, arc-lanternfyre-ndepend, arc-lanternfyre.
#
# ⚠️ NOT enforced. arc-lanternfyre-ndepend runs a privileged dind sidecar; NDepend licences by MAC + uppercase machine name.
# PSA cannot grant a per-field exception, so `privileged` is the only level that
# admits these pods. The things that DO matter here move to Kyverno (H3).
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners-lanternfyre
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.35
