# claude-box-charlie
#
# Apps in this namespace: necronia-k0-assets only, a one-shot Job that staged
# the K0 asset map into this box's claim and has been complete since 2026-10-27
# (bootstrap/necronia-k0-assets.application.yaml). The Claude Code workspace
# box that lived here, the `oracle-ops` role box (the `charlie` directory under
# gitops/clusters/home/claude-boxes/), was parked on 2026-11-13 to free worker
# CPU for CI. The namespace stays because it holds the box's protected claim,
# home-claude-box-charlie-0 (protected-volumes.yaml): deleting the namespace
# would hang in Terminating. The box comes back by restoring its directory; see
# "Parked boxes" in claude-boxes/README.md.
#
# Same posture as claude-box-alpha, and for the same reasons -- that file's
# header carries them: `restricted` BY CONSTRUCTION, because the workload is an
# agent with a shell; Claude Code's bundled bubblewrap sandbox is disabled
# under it by design, and the pod plus the CiliumNetworkPolicy ARE the sandbox.
# Do not add capabilities to "fix" it.
#
# ⚠️ This namespace must NEVER carry homelab.techyon.dev/edge-publish: "true" --
# it forbids the read-only cluster token and requires a read-only root
# filesystem, neither of which a development box can live with.
apiVersion: v1
kind: Namespace
metadata:
  name: claude-box-charlie
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
