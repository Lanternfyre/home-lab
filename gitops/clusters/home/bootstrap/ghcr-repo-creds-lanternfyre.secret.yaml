# ArgoCD OCI pull credentials for ghcr.io/lanternfyre.
#
# A SIBLING of ghcr-repo-creds.secret.yaml, not a replacement, and deliberately
# so. ArgoCD matches repo-creds by URL PREFIX, so both can coexist and each app
# picks up whichever entry matches its repoURL. Editing the t3chy0n file in
# place would instead open a window where the seven apps still pointing at
# ghcr.io/t3chy0n/charts have no matching credential at all -- and one of them
# is the storage driver.
#
# Retire the t3chy0n copy only once nothing resolves to it (see MODERNIZATION).
#
# ⚠️ ONE token serves BOTH orgs. `read:packages` on a CLASSIC PAT is not
# org-scoped -- it grants read to every package its owner can see, in every org
# they belong to. So this reads the same 1Password item as its sibling, and no
# new secret was created. A fine-grained PAT would NOT work here: they cannot
# authenticate to ghcr.io at all.
#
# ⚠️ `username` is a PERSON, not the org. GHCR ignores it when the password is
# a valid classic PAT, which is why the existing value works and why it is left
# alone here -- changing it to "lanternfyre" would look tidier and buy nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-repo-creds-lanternfyre
  namespace: argocd
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: ghcr-repo-creds-lanternfyre
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: helm
        url: ghcr.io/lanternfyre
        username: t3chy0n
        password: "{{ .ghcrToken }}"
        enableOCI: "true"

  data:
    - secretKey: ghcrToken
      remoteRef:
        key: GHCR
        property: password
