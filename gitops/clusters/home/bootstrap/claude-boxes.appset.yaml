# One Application per directory under claude-boxes/, rendered from the
# claude-box chart (helm-compendium, published to ghcr.io/lanternfyre/charts).
#
# 🟢 A SECOND BOX IS A COPY OF A DIRECTORY. `cp -r claude-boxes/alpha
# claude-boxes/bravo`, set `rbac.clusterRole.create: false` in its
# chart-values.yaml (the ClusterRole is shared and alpha owns it), add
# bootstrap/namespaces/claude-box-bravo.yaml, merge. Nothing in this file
# changes. ⚠️ auq's own ingress policy names claude-box-alpha literally -- a
# second box that enables auq needs an edit there too.
#
# ── Why this is not home-appset.yaml ─────────────────────────────────────────
# The boxes used to be plain manifests, which is why this file existed at all.
# They are a chart now, and home-appset.yaml could render one -- but it sets
# CreateNamespace=true, and this file deliberately refuses that (below).
#
# 🔴 THE RELEASE NAME AND THE NAMESPACE ARE DERIVED HERE, from the directory,
# never read from app.yaml. Every object name, the StatefulSet's immutable
# selector and the claim `home-claude-box-<dir>-0` hang off the release name; a
# value a typo could change is a way to orphan a box's $HOME.
#
# 🔴 NO CreateNamespace=true, DELIBERATELY. A namespace created by this
# ApplicationSet would carry no Pod Security Admission labels, and an unlabelled
# namespace defaults to `privileged` -- a silent downgrade on the one pod in
# this estate that runs an agent with shell access and a cluster token. The
# namespace is declared in bootstrap/namespaces/ and owned by home-root, which
# is the convention that directory's README exists to enforce. A box whose
# namespace file is missing stays Progressing and tells you so; that is the
# intended failure.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: claude-boxes
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # ⚠️ MIGRATION WINDOW (manifests -> chart). If the generator ever yields no
  # Application for a box -- a bad app.yaml, a half-applied change -- the
  # controller deletes that Application, and its resources finalizer would
  # cascade into the StatefulSet and kill the live tmux session. This keeps the
  # objects when that happens. (`applicationsSync: create-update` would be the
  # obvious guard, but it is IGNORED unless the controller enables policy
  # override. This one does not: `argocd-cmd-params-cm` carries no
  # `applicationsetcontroller.enable.policy.override` key, checked 2026-09-13.)
  # The claim is protected either way.
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - git:
        repoURL: https://github.com/Lanternfyre/home-lab.git
        revision: master
        files:
          - path: gitops/clusters/home/claude-boxes/*/app.yaml

  template:
    metadata:
      # For a files generator `.path.basename` is the DIRECTORY holding
      # app.yaml, so this is the same `claude-box-alpha` the directories
      # generator produced -- the Application is updated in place, not
      # replaced, and every tracking-id annotation stays valid.
      name: "claude-box-{{ .path.basename }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # Same reasoning as the two app ApplicationSets: the diff goes through
        # a server-side apply dry run, so controller-defaulted and
        # webhook-written fields are not reported as permanent drift.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            releaseName: "claude-box-{{ .path.basename }}"
            valueFiles:
              - "$values/{{ .path.path }}/chart-values.yaml"
            # 🔴 false, unlike home-appset.yaml. A box rendered WITHOUT its
            # values is the chart defaults: repo REPLACE-ME, a fake hostname,
            # and the default probe -- a new pod template and a rescoped token
            # on a live session. Fail the render instead.
            ignoreMissingValueFiles: false
        - repoURL: https://github.com/Lanternfyre/home-lab.git
          targetRevision: master
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "claude-box-{{ .path.basename }}"
      syncPolicy:
        automated:
          # ⚠️ MIGRATION WINDOW: false until the chart-rendered box is proven
          # identical to the manifests it replaces. A mis-rendered object then
          # shows as OutOfSync instead of being pruned. Restored to true in the
          # follow-up PR, one review cycle later.
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        # ⚠️ NOTE THE INDENTATION -- retry nests inside syncPolicy. Sat as a
        # sibling in home-appset.yaml for months, where the CRD silently pruned
        # it and all 27 Helm Applications ran with no retry policy at all.
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 10m
