# One pinned OCI asset stage into Charlie's persistent operator cache.
#
# Charlie was parked on 2026-11-13 (claude-boxes/README.md, "Parked boxes").
# The Job finished on 2026-10-27 and its output stays on charlie's claim, which
# is kept. Recreated while charlie is parked, the Job would stay Pending: its
# podAffinity needs charlie's pod, and its ghcr-docker pull secret went with
# charlie's Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: necronia-k0-assets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/Lanternfyre/home-lab.git
    targetRevision: master
    path: gitops/clusters/home/necronia-k0-assets
  destination:
    server: https://kubernetes.default.svc
    namespace: claude-box-charlie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
