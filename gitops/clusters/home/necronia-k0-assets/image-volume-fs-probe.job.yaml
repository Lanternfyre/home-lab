# One Charlie-only read-only probe of the pinned filesystem OCI image.
# No workspace or home claim is mounted; this job does not stage assets.
apiVersion: batch/v1
kind: Job
metadata:
  name: necronia-k0-image-volume-fs-v1
  namespace: claude-box-charlie
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app.kubernetes.io/name: necronia-k0-assets}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-docker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: check
          image: ghcr.io/oras-project/oras:v1.3.5
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              cd /mount/assets
              test -s necronia.otbm
              test -s necronia-house.xml
              test -s betamap.otbm
              test -s betamap-house.xml
              test -s betamap-spawn.xml
              sha256sum -c SHA256SUMS
              sha256sum necronia.otbm necronia-house.xml betamap.otbm betamap-house.xml betamap-spawn.xml
              if touch /mount/assets/.write-probe 2>/dev/null; then
                echo 'asset volume was writable' >&2
                exit 1
              fi
              echo 'five assets verified; image volume is read-only'
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: assets, mountPath: /mount, readOnly: true}
      volumes:
        - name: assets
          image:
            reference: ghcr.io/lanternfyre/necronia-assets-fs@sha256:855e78c49d94e5293d5a9b469b494cf372f6b880d65e0fa4e87acb947fd0ed91
            pullPolicy: IfNotPresent
