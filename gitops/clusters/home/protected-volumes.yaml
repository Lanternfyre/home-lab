# Canonical register of persistent data in this cluster.
#
# THIS FILE IS NOT APPLIED TO THE CLUSTER. It is a reviewable inventory, and it
# is the input to scripts/audit-protected-volumes.sh, which fails if:
#   - a PVC exists in the cluster but appears in neither list below, or
#   - a `protected` claim is missing its label, or its PV is not Retain, or
#   - a `protected` claim's owning manifest lacks the Argo prune/delete guards.
#
# The point of the second rule is that adding a new volume forces a conscious
# protect / don't-protect decision instead of defaulting to silence.
#
# ── How protection is actually enforced (four independent layers) ────────────
#   1. PV reclaimPolicy: Retain          — a deleted PVC leaves the data on the NAS
#   2. label homelab.techyon.dev/protect — Kyverno ValidatingPolicy, compiled to a
#                                          native ValidatingAdmissionPolicy, denies
#                                          DELETE on PVC/PV carrying it
#   3. argocd sync-options Prune=false,Delete=false — a removed or renamed manifest
#                                          cannot cascade into volume deletion
#   4. off-NAS backups (see `backup:` per entry) — the only layer that survives
#                                          disk failure, corruption or a bad mkfs
#
# Layers 1-3 stop mistakes. ONLY layer 4 stops hardware and software faults.
# Do not confuse "protected" with "backed up" — read the `backup:` field.
#
# ── Break-glass ──────────────────────────────────────────────────────────────
# To legitimately delete a protected volume, add an annotation whose value is
# the object's OWN NAME, via a git commit:
#     homelab.techyon.dev/unprotect: "<metadata.name>"
# It cannot be applied by a broadcast command and cannot be copy-pasted between
# objects. A manual `kubectl label` is reverted by selfHeal within minutes, so
# git is the only durable route — which is the audit trail.

version: 1

protected:
  - namespace: immich
    claim: immich-library
    size: 100Gi
    class: qnap-samba
    source: gitops/clusters/home/apps/immich/manifests/immich-library.pvc.yaml
    backup: file-level, off-NAS
    reason: >-
      Photographs. Irreplaceable; there is no other copy anywhere. This is the
      single highest-value object in the cluster.

  - namespace: immich
    claim: immich-db-2
    size: 20Gi
    class: qnap-iscsi
    source: CNPG Cluster/immich-db (label via spec.inheritedMetadata)
    backup: CNPG barmanObjectStore + WAL archiving
    reason: >-
      Albums, face recognition and smart-search embeddings. The library above is
      just a pile of files without this database.

  - namespace: immich
    claim: immich-db-3
    size: 20Gi
    class: qnap-iscsi
    source: CNPG Cluster/immich-db (label via spec.inheritedMetadata)
    backup: CNPG barmanObjectStore + WAL archiving
    reason: Replica of immich-db-2. Protected so a drain cannot destroy the pair.

  - namespace: immich
    claim: immich-db-4
    size: 20Gi
    class: qnap-iscsi
    source: CNPG Cluster/immich-db (label via spec.inheritedMetadata)
    backup: CNPG barmanObjectStore + WAL archiving
    reason: >-
      Third instance, added 2026-08-02 when immich-db went 2 -> 3 so that every
      drain has more than one switchover target. Protected so a drain cannot
      destroy the set.
    warning: >-
      Registered here on 2026-08-03. CNPG gave it the protect label and Retain
      automatically via inheritedMetadata, so the CLUSTER was always correct —
      but the registry was not, and the audit failed on it. Scaling a CNPG
      cluster silently creates a protected volume; add the entry in the same
      change that scales it.

  - namespace: databases
    claim: postgres-ha-1
    size: 8Gi
    class: qnap-iscsi
    source: CNPG Cluster/postgres-ha (label via spec.inheritedMetadata)
    backup: CNPG barmanObjectStore + WAL archiving
    reason: Application databases (necronia, techyon). Not reconstructible.

  - namespace: databases
    claim: postgres-ha-2
    size: 8Gi
    class: qnap-iscsi
    source: CNPG Cluster/postgres-ha (label via spec.inheritedMetadata)
    backup: CNPG barmanObjectStore + WAL archiving
    reason: Replica of the postgres-ha cluster.

  - namespace: databases
    claim: postgres-ha-3
    size: 8Gi
    class: qnap-iscsi
    source: CNPG Cluster/postgres-ha (label via spec.inheritedMetadata)
    backup: CNPG barmanObjectStore + WAL archiving
    reason: Replica of the postgres-ha cluster.

  - namespace: home-utils
    claim: qnap-mealie
    size: 5Gi
    class: qnap-iscsi
    source: gitops/clusters/home/apps/mealie/manifests/qnap-mealie.pvc.yaml
    backup: file-level, off-NAS
    reason: Hand-entered recipes and uploaded images. Not reconstructible.

  - namespace: databases
    claim: pg-backup
    size: 10Gi
    class: qnap-samba
    source: gitops/clusters/home/apps/postgres/manifests/pg-backup.pvc.yaml
    backup: n/a - this IS the backup
    reason: >-
      Nightly pg_dumpall of the postgres-ha cluster. Deliberately on SMB, not
      iSCSI: SMB shares are never formatted, so the backup does not share the
      mkfs failure mode of the volumes it protects.

  - namespace: immich
    claim: immich-db-backup
    size: 10Gi
    class: qnap-samba
    source: gitops/clusters/home/apps/immich/manifests/immich-db-backup.pvc.yaml
    backup: n/a - this IS the backup
    reason: >-
      Nightly pg_dumpall of immich-db (albums, faces, smart-search embeddings).
      Same SMB reasoning as pg-backup above.

  - namespace: home-utils
    claim: mealie-backup
    size: 5Gi
    class: qnap-samba
    source: gitops/clusters/home/apps/mealie/manifests/mealie-backup.pvc.yaml
    backup: n/a - this IS the backup
    reason: Nightly tar of Mealie's data dir. SMB, so immune to the mkfs bug.

  - namespace: dns
    claim: pihole-data
    size: 5Gi
    class: qnap-iscsi
    source: gitops/clusters/home/apps/pihole/manifests/pihole-data.pvc.yaml
    backup: NONE                 # deliberate, 2026-08-03 — see warning
    reason: >-
      THE LIVE Pi-hole volume since Phase 0.D. Blocklists, custom DNS entries
      for every node and LAN host, and query history. Losing it takes LAN DNS
      down for the whole house.
    warning: >-
      Registered here on 2026-08-03. It carried the protect label and Retain in
      the cluster from the day it was created, but was MISSING from this file,
      so the audit had no entry to check it against — the live volume serving
      LAN DNS was the one unregistered protected volume in the cluster.
      It now has no backup job: pihole-backup was retired the same day because
      its whole rationale was local-path fragility, which this migration
      removed. Recovery is therefore a rebuild from
      apps/pihole/chart-values.yaml, not a restore.

  - namespace: dns
    claim: pihole-backup
    size: 5Gi
    class: qnap-samba
    source: gitops/clusters/home/apps/pihole/manifests/pihole-backup.pvc.yaml
    backup: n/a - this IS a backup
    reason: >-
      STALE ARCHIVE, no longer written to. Held nightly tars of /etc/pihole
      until the CronJob was retired on 2026-08-03. Kept because it still holds
      real history from before the qnap-iscsi migration; delete it — and the
      backend volume with tridentctl — once that history is worthless.

  - namespace: dns
    claim: pihole
    size: 5Gi
    class: local-path            # NOTE: node-local, NOT on the NAS
    source: pihole chart (persistentVolumeClaim.enabled) — NO LONGER MOUNTED
    backup: n/a - superseded
    reason: >-
      ROLLBACK POINT for Phase 0.D, not the live volume. Pi-hole moved to
      pihole-data on qnap-iscsi; nothing mounts this any more. Kept
      deliberately (Prune=false, Delete=false) until the migration is trusted.
    warning: >-
      Pinned by nodeAffinity to k8s-lab3 and dies with that node's disk —
      reclaimPolicy Retain does not help here. This is now stale data, so that
      exposure no longer matters, but it also means the volume is worth
      strictly less than its size suggests. It is local-path, so cleaning it up
      is deleting a directory on lab3's disk, NOT a tridentctl operation.

# Deliberately NOT protected. Listed so the audit can distinguish "considered
# and declined" from "nobody looked at it".
unprotected:
  - namespace: immich
    claim: immich-machine-learning
    size: 10Gi
    reason: >-
      Downloaded ML model cache. Immich re-fetches the models on demand; losing
      it costs one slow first run, nothing else.

  - namespace: monitoring
    claim: storage-loki-0
    size: 20Gi
    reason: Logs, 336h retention by config. Discardable by design.

  - namespace: monitoring
    claim: storage-tempo-0
    size: 20Gi
    reason: Traces, 168h retention by config. Discardable by design.

  - namespace: monitoring
    claim: data-pyroscope-0
    size: 20Gi
    reason: Profiles, 720h retention by config. Discardable by design.

  - namespace: redis
    claim: redis-data-redis-master-0
    size: 8Gi
    reason: >-
      Cache and job queues (Immich background jobs). Rebuilt on restart; not
      authoritative for anything. Re-evaluate if Redis ever becomes a datastore.

  - namespace: redis
    claim: redis-data-redis-replicas-0
    size: 8Gi
    reason: Replica of the above.
