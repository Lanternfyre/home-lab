# The canary's PUBLIC name, on the internet-facing Gateway.
#
# `canary.techyon.dev`, one level deep, because Cloudflare's Universal SSL
# covers the root and first-level subdomains only -- see
# apps/envoy-gateway/manifests/homelab-tunnel.gateway.yaml for the proof and
# the decision.
#
# `homelab-tunnel` holds the `target` annotation, so attaching a route to it is
# enough to publish a CNAME to the tunnel, reconciled from git. Route-level
# `target` is silently ignored -- that lesson is written up on the Gateway.
#
# ⚠️ `cloudflare-proxied` is the OTHER half of that split and belongs HERE, not
# on the Gateway: external-dns reads `target` from the Gateway and every other
# annotation from the route. Without it the CNAME is created UNPROXIED, and an
# unproxied CNAME to cfargotunnel.com resolves to nothing a client can reach --
# `dig` returns the raw target instead of Cloudflare's anycast addresses, and
# there is no error anywhere to say so.
#
# 🔴 EVERY route on homelab-tunnel needs this annotation. Forgetting it on one
# publishes a hostname that silently resolves nowhere.
#
# ⚠️ TWO changes are needed to publish a hostname, not one. This file is the
# first; the second is its exact redirect URI in
# authentik/manifests/blueprint-envoy-gateway.external-secret.yaml, which uses
# `matching_mode: strict`. Missing it gives a healthy-looking 302 followed by
# an HTTP 400 from authentik -- the canary shipped that way and nobody noticed
# for two days. `canary.techyon.dev` is already registered there.
#
# `canary.lab.techyon.dev` stays exactly as it was on homelab-gated. It is the
# CONTROL: when the public path misbehaves, the LAN path answers the question
# "is the app broken, or is the exposure broken?".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-tunnel
  namespace: canary
  labels:
    app.kubernetes.io/name: canary
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab-tunnel
      namespace: gateway-envoy
  hostnames:
    - canary.techyon.dev
  rules:
    - backendRefs:
        - name: canary
          port: 80
