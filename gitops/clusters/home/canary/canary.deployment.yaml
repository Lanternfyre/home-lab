# The exposure probe.
#
# `traefik/whoami` is chosen for three properties, not because it is a
# convenient hello-world:
#
#   1. It is a SCRATCH image -- one static Go binary, no shell, no package
#      manager, no libc. There is nothing to get a foothold in. Every "pop a
#      shell in the container" step simply has no shell to pop.
#   2. It ECHOES the request, so it answers the question a tunnel test actually
#      asks: what does the edge send my origin? `CF-Connecting-IP`,
#      `Cf-Ray`, `X-Forwarded-Proto` and the Authentik headers all show up in
#      the response body. A static "hello world" page proves connectivity and
#      nothing else.
#   3. It holds no state and reads nothing, so publishing it leaks nothing even
#      if the policy below were wrong.
#
# Pinned by DIGEST, not tag. v1.12.0 today; the digest is what is enforced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: canary
  labels:
    app.kubernetes.io/name: canary
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canary
    spec:
      serviceAccountName: canary
      automountServiceAccountToken: false
      # Two replicas on different nodes, so that draining a node during a
      # tunnel test does not look like a tunnel failure.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: canary
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
          imagePullPolicy: IfNotPresent
          # Port 8080, not the image's default 80: a non-root process cannot
          # bind below 1024 without NET_BIND_SERVICE, and adding a capability
          # to serve a test page would defeat the point of the exercise.
          args: ["-port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { memory: 32Mi }
