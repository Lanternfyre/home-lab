# On the GATED Gateway, behind Authentik -- deliberately, and this is the order
# the whole exercise depends on.
#
# The canary is proven reachable through Authentik from the LAN FIRST. Only
# then does the Cloudflare Tunnel get pointed at it, so that when the tunnel is
# added there is exactly one new variable. Publishing an unproven route through
# an unproven tunnel gives a failure with two causes and no way to tell them
# apart.
#
# ⚠️ Do NOT move this to the open `homelab` Gateway. Nothing on that Gateway is
# fit to be tunnel-exposed as-is.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: canary
  labels:
    app.kubernetes.io/name: canary
spec:
  parentRefs:
    - name: homelab-gated
      namespace: gateway-envoy
  hostnames:
    - canary.lab.techyon.dev
  rules:
    - backendRefs:
        - name: canary
          port: 80
