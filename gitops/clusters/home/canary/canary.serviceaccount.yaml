# Its own identity, bound to no Role, token not mounted.
#
# The lesson from volume-health-exporter: a workload running as `default` cannot
# be named in an admission allow-list, because `default` is a name every pod in
# the namespace takes by omission. Cheaper to do it at birth than to retrofit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canary
  namespace: canary
  labels:
    app.kubernetes.io/name: canary
automountServiceAccountToken: false
