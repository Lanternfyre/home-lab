# The GitHub App credential for the token broker sidecar.
#
# 🔴 THIS IS THE ONLY DURABLE GITHUB SECRET IN THE DESIGN, AND IT IS MOUNTED
# INTO EXACTLY ONE CONTAINER. The workspace container never sees it; it sees
# only the ~1h tokens the broker mints into a shared tmpfs. That separation is
# the whole point of the sidecar, and it holds only as long as
# `shareProcessNamespace` stays false -- with it true the workspace could read
# the PEM through /proc/<broker-pid>/root.
#
# 🔴 NOT `ARC-GitHub-App`. That is a DIFFERENT App, used by the CI runner scale
# sets. Reusing it would hand an interactive agent the identity that builds and
# publishes every image in this estate.
#
# ⚠️ NO `template:` BLOCK, DELIBERATELY. The dockerconfigjson pattern next door
# renders a JSON string through a Go template, and a PEM inside a Go template is
# an escaping problem waiting to eat the newlines. A plain `data:` mapping
# copies bytes through untouched. This is the one case where the more
# sophisticated pattern is the wrong one.
#
# ⚠️ The 1Password Connect provider matches by field LABEL across the whole
# item -- sections are flattened and labels must be unique. Same caveat as
# apps/github-mcp-proxy/manifests/github-mcp-pat.external-secret.yaml.
#
# Operator side -- 1Password item `Claude Box GitHub App`, Infrastructure vault:
#   app-id                    4043649
#   private-key               the App PEM, WITH its trailing newline
#                             (tail -c1 key.pem | xxd  ->  0a)
#   installation-lanternfyre  140425201
#   installation-t3chy0n      140425220
#
# ⚠️ UNVERIFIED IN THIS REPO: no existing ExternalSecret pulls a MULTI-LINE
# value through 1Password Connect. Prove the PEM round-trips before believing
# the broker is merely misconfigured:
#   kubectl -n claude-box-alpha get secret gh-app -o jsonpath='{.data.private-key}' \
#     | base64 -d | openssl rsa -check -noout      # must print "RSA key ok"
# A PEM with collapsed newlines fails at signing time with an opaque OpenSSL
# error that reads like a broken key rather than a broken transport.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gh-app
  namespace: claude-box-alpha
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: gh-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef: {key: Claude Box GitHub App, property: app-id}
    - secretKey: private-key
      remoteRef: {key: Claude Box GitHub App, property: private-key}
    - secretKey: installation-lanternfyre
      remoteRef: {key: Claude Box GitHub App, property: installation-lanternfyre}
    - secretKey: installation-t3chy0n
      remoteRef: {key: Claude Box GitHub App, property: installation-t3chy0n}
