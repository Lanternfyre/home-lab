# The console Service: ttyd for the browser, sshd for a real terminal.
#
# ⚠️ ClusterIP, never LoadBalancer. A LoadBalancer allocates a NodePort on
# EVERY node by default -- the undeclared-doors problem this estate closed in
# KUBE-PROXY-REPLACEMENT Stage 0, where `audit-edge-exposure.py --probe` is now
# the guard. A NodePort on the public edge node is a door onto the internet
# that nothing in this directory declares.
apiVersion: v1
kind: Service
metadata:
  name: claude-box-alpha-console
  namespace: claude-box-alpha
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: claude-box-alpha}
  ports:
    - {name: console, port: 7681, targetPort: console, protocol: TCP}
    - {name: ssh, port: 2222, targetPort: ssh, protocol: TCP}
---
# The StatefulSet's `serviceName`. Headless, and it exists for the stable DNS
# identity a StatefulSet requires -- not as a second way in.
apiVersion: v1
kind: Service
metadata:
  name: claude-box-alpha
  namespace: claude-box-alpha
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: claude-box-alpha}
  ports:
    - {name: console, port: 7681}
