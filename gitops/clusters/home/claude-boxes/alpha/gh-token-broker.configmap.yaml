# The token broker: the Kubernetes port of claude-box's `_gh-token.lib.sh`
# installation-token mint (lines 379-402 of that file).
#
# 🔴 ONLY THE STATELESS HALF IS PORTED, AND THAT IS NOT AN OVERSIGHT.
# claude-box also carries a `ghu_` device-flow path with a durable `ghr_`
# refresh token. GitHub ROTATES THAT REFRESH TOKEN ON EVERY USE, so two
# refreshers -- or one restart racing an in-flight refresh -- brick the
# credential permanently, recoverable only by a fresh interactive device flow.
# A pod can restart at any moment and ArgoCD can run two during a rollout.
# The installation mint below reads the PEM, produces a token, and keeps
# nothing: repeating it is always safe. DO NOT "COMPLETE" THIS BY ADDING THE
# OTHER PATH.
#
# ⚠️ The App already has `contents: write` -- verified against the live API
# 2026-09-11, correcting an older note that said read-only. So a minted token
# can `git push` over https://x-access-token:<token>@github.com/<owner>/<repo>
# and NO deploy keys are needed. The whole ssh-agent half of claude-box drops
# out of this port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gh-token-broker
  namespace: claude-box-alpha
data:
  broker.sh: |
    #!/usr/bin/env bash
    # Mint GitHub App installation tokens for the workspace container.
    set -uo pipefail

    API=https://api.github.com
    PEM=/etc/gh-app/private-key
    APP_ID="$(cat /etc/gh-app/app-id)"
    OUT="${GH_TOKEN_DIR:-/var/run/gh-token}"
    REPO_LIST="${REPO_LIST_FILE:-/etc/claude-workspace/config/repos}"
    PERIOD="${MINT_PERIOD_SECONDS:-2700}"

    log() { printf '[broker] %s\n' "$*"; }

    # base64url, unpadded. JWT requires it and `base64 -w0` does NOT give it;
    # getting this wrong yields a 401 from GitHub with no hint as to why.
    b64u() { base64 -w0 | tr '+/' '-_' | tr -d '='; }

    mint_jwt() {
      local now hdr pay unsigned sig
      now=$(date +%s)
      # iat is backdated 60s. GitHub rejects a JWT whose iat is in the future
      # and container clocks drift -- this one line removes an entire class of
      # intermittent 401s that reproduce on nobody's laptop.
      # exp +540s: GitHub's hard ceiling is 600, leaving a minute of slack.
      hdr='{"alg":"RS256","typ":"JWT"}'
      pay="{\"iat\":$((now - 60)),\"exp\":$((now + 540)),\"iss\":\"${APP_ID}\"}"
      unsigned="$(printf '%s' "$hdr" | b64u).$(printf '%s' "$pay" | b64u)"
      sig="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$PEM" -binary | b64u)"
      printf '%s.%s' "$unsigned" "$sig"
    }

    # Build the `repositories` array for one owner from the SAME ConfigMap the
    # workspace clones from. One list, one source of truth: a repo the box can
    # clone is a repo the token covers, and nothing else is.
    repos_json_for() {
      local owner="$1"
      [[ -r "$REPO_LIST" ]] || return 1
      awk -v o="$owner" '
        { sub(/#.*/, ""); gsub(/[ \t]/, "") }
        $0 == "" { next }
        {
          split($0, p, "/")
          if (tolower(p[1]) == tolower(o)) printf "%s\"%s\"", (n++ ? "," : ""), p[2]
        }
        END { if (!n) exit 1 }
      ' "$REPO_LIST"
    }

    mint_installation() {
      local owner="$1" inst="$2" jwt repos body resp tok
      jwt="$(mint_jwt)"

      # 🔴 `repositories` SCOPES THE TOKEN BELOW THE INSTALLATION, and that is
      # the only thing that narrows it. BOTH installations are
      # `repository_selection: all`, so an UNSCOPED token carries contents:write
      # to EVERY repo in the org. An absent/empty array means "everything" --
      # so a missing repo list is a silent WIDENING, not a no-op. Refuse.
      # 🔴 TWO DIFFERENT OUTCOMES THAT MUST NOT BE CONFLATED.
      #
      # "this owner has no repos in the list" is a CONFIGURATION CHOICE -- the
      # box simply is not scoped to that org -- and the right response is to
      # skip it silently-ish and carry on. Returning failure here made the
      # main loop treat a correctly-configured box as broken: `ok` never
      # reached 2, so it retried every 120s forever and logged a refusal each
      # time, burning an API call and drowning real failures in noise.
      #
      # "minting failed" is different and DOES return 1, below.
      #
      # What must never happen is minting with an EMPTY repositories array:
      # both installations are `repository_selection: all`, so that silently
      # grants contents:write to every repo in the org. Skipping is the safe
      # branch; widening is not.
      if ! repos="$(repos_json_for "$owner")"; then
        log "skip ${owner}: no repos for it in ${REPO_LIST} (not an error)"
        return 2
      fi
      body="{\"repositories\":[${repos}]}"

      resp="$(curl -sS --max-time 20 -X POST \
          -H "Authorization: Bearer ${jwt}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -d "$body" \
          "${API}/app/installations/${inst}/access_tokens")" || return 1

      if ! tok="$(printf '%s' "$resp" | jq -re '.token')"; then
        # ⚠️ Print the MESSAGE, never the body -- on some error paths GitHub
        # echoes request content back. A broker that leaks into a log the agent
        # can read has undone its own job.
        log "mint failed for ${owner}: $(printf '%s' "$resp" | jq -r '.message // "unparseable"')"
        return 1
      fi

      # 🔴 ATOMIC REPLACE: write-then-rename, never write-in-place. git may open
      # this file at any instant, and a half-written token is a push that fails
      # with "Bad credentials" exactly once and then works -- the worst possible
      # thing to debug. rename(2) on tmpfs is atomic.
      ( umask 077; printf '%s' "$tok" > "${OUT}/.${owner}.tmp" )
      mv -f "${OUT}/.${owner}.tmp" "${OUT}/${owner}.token"
      log "minted ${owner} ($(printf '%s' "$repos" | tr -cd ',' | wc -c | awk '{print $1+1}') repos)"
    }

    # ⚠️ NO chmod ON $OUT. It is an emptyDir MOUNT POINT owned by root, and a
    # non-root container cannot chmod it -- the attempt logged
    #   chmod: changing permissions of '/var/run/gh-token': Operation not permitted
    # on every start. The permission that actually matters is on the token
    # FILES, and `umask 077` at write time already gives them 0600.
    mkdir -p "$OUT" 2>/dev/null || true
    log "starting; period=${PERIOD}s app=${APP_ID}"

    while :; do
      failed=0
      for pair in "lanternfyre:/etc/gh-app/installation-lanternfyre" \
                  "t3chy0n:/etc/gh-app/installation-t3chy0n"; do
        owner="${pair%%:*}"; idfile="${pair#*:}"
        mint_installation "$owner" "$(cat "$idfile")"
        # 0 = minted, 2 = deliberately skipped, anything else = real failure.
        [[ $? -eq 1 ]] && failed=1
      done

      # 🔴 FAIL-CLOSED, AND THE TWO HALVES MEAN DIFFERENT THINGS.
      #
      # Fail-closed means: on a mint failure there is NO fallback. No PAT, no
      # cached durable credential, no deploy key. git stops working and a human
      # notices. A fail-OPEN broker would reintroduce, on the worst possible
      # day, exactly the durable secret this design exists to remove.
      #
      # It does NOT mean "delete the old token on failure". The existing token
      # is good for ~60 min and we re-mint every 45, so a transient failure
      # leaves ~15 min of working credential to ride out a GitHub blip.
      # Deleting it would turn a 30-second hiccup into an immediate outage --
      # fail-closed applied where it buys nothing. GitHub expires the token on
      # its own clock either way; keeping the file only decides whether the
      # remaining validity is usable.
      if [[ "$failed" -eq 0 ]]; then sleep "$PERIOD"; else sleep 120; fi
    done
