# The kubeconfig for the box's READ-ONLY cluster identity.
#
# It points at the projected ServiceAccount token rather than the well-known
# in-cluster path, which is the whole reason this file exists:
# `automountServiceAccountToken: false` means no client library auto-detects a
# credential, and cluster access becomes something the PodSpec grants
# explicitly via KUBECONFIG rather than something any process picks up by
# accident.
#
# ⚠️ The server is the in-cluster Service address, reached under socket LB.
# That is why the egress policy needs `toEntities: [kube-apiserver]` and not a
# toServices or toFQDNs rule -- by the time policy sees the connection, socket
# LB has already rewritten 10.43.0.1:443 to a real backend on a home node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-box-alpha-kubeconfig
  namespace: claude-box-alpha
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: home
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /etc/kube-ro/ca.crt
    users:
      - name: claude-box-alpha
        user:
          tokenFile: /etc/kube-ro/token
    contexts:
      - name: home
        context: {cluster: home, user: claude-box-alpha, namespace: claude-box-alpha}
    current-context: home
