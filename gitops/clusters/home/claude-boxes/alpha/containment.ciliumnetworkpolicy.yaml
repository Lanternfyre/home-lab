# H1 -- what the Claude Code box may reach, and who may reach it.
#
# This namespace is unusual in this estate in three ways, and each one shapes
# the policy:
#
#  1. It runs on k8s-edge1, THE ONE NODE THAT IS NOT TRUSTED INFRASTRUCTURE.
#     Everything below assumes the node itself may be hostile.
#  2. It holds an INTERACTIVE SHELL that a human drives. "What it needs to
#     reach" is therefore not derivable from a Hubble capture of a running
#     workload -- the capture only shows what the operator happened to do that
#     hour. This list is the Claude Code CLI's documented egress plus the
#     in-cluster services the box is built to use, and it WILL need extending.
#     Extend it from `hubble observe --verdict DROPPED` evidence, never from
#     guesswork: a missing FQDN does not error, it HANGS.
#  3. It carries a read-only cluster token and short-lived GitHub write tokens.
#     Egress containment is what stands between "an agent made a mistake" and
#     "an agent made a mistake on the internet".
#
# ⚠️ `enableDefaultDeny` is stated EXPLICITLY in both directions. Cilium's
# implicit per-direction default-deny would do the same thing invisibly; saying
# it means that deleting the last egress rule is a visible change rather than a
# silent opening.
#
# ⚠️ ONE POLICY COVERS BOTH CONTAINERS. `endpointSelector: {}` selects the pod,
# and the broker sidecar shares the pod's identity -- so the broker's
# api.github.com egress is granted to the workspace container too. That is a
# decision, not an accident: a separate identity would need a separate pod, and
# the workspace needs github.com anyway to push.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-box-alpha-containment
  namespace: claude-box-alpha
spec:
  description: >-
    Ingress and egress allow-lists for the Claude Code workspace box.
    Default-deny both directions, stated explicitly.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true

  ingress:
    # ── The node-admit rule, and why it is a NO-OP HERE ─────────────────────
    # A policy that selects a pod must also admit the node, or kubelet probes
    # are denied and the pod crash-loops. That rule is unconditional in this
    # repo and the rule is kept.
    #
    # 🔴 BUT `[host, remote-node]` IS NOT SUFFICIENT FOR AN httpGet PROBE ON
    # THIS NODE, and this is measured, not reasoned. On k8s-edge1, 2026-09-11,
    # a scratch pod with an httpGet liveness probe crash-looped 5 times in 2
    # minutes, and Hubble on the edge agent gave the reason:
    #
    #   srcIP 10.245.8.125  srcID 2  srcLbl ["reserved:world"]  POLICY_DENIED
    #   policy-verdict:none INGRESS DENIED
    #
    # 10.245.8.125 is this node's OWN cilium_host address, and the datapath
    # tagged it `reserved:world` -- even though `cilium-dbg bpf ipcache get`
    # reports identity=1 (reserved:host) for the same address. The same trap is
    # already documented for a HOME node in
    # apps/mealie/manifests/mealie-ingress.ciliumnetworkpolicy.yaml, which also
    # records that a `fromCIDR` allow-list of cilium_host addresses fails
    # SILENTLY (Cilium CIDR rules do not apply inside the pod CIDR).
    #
    # 🟢 The way out is NOT to add `world` here. The workspace's probes are
    # `exec`, which runs through the CRI and never touches the pod network --
    # so no probe traffic is subject to this policy at all, and the pod's
    # ingress stays closed to `world`. That is why this rule can stay narrow
    # where mealie's cannot.
    #
    # ⚠️ Adding an httpGet or tcpSocket probe to this pod later WILL crash-loop
    # it, and the event will say "context deadline exceeded" rather than
    # anything about policy. Either keep exec probes or add `world` knowingly.
    - fromEntities:
        - host
        - remote-node

    # ── The browser console, through the GATED Gateway only ────────────────
    # 🔴 PINNED TO `homelab-gated`, NOT to the whole gateway-envoy namespace.
    # ttyd is an interactive shell sitting next to an Anthropic OAuth
    # credential and a GitHub write token. On the plain `homelab` Gateway that
    # is a shell for anyone on the LAN or the VPN; `homelab-gated` carries the
    # SecurityPolicy that cascades OIDC to every attached route.
    #
    # ⚠️ FAILING CLOSED IS THE POINT. If someone later attaches the ttyd
    # HTTPRoute to `homelab` by mistake, the page does not load -- rather than
    # loading, ungated, looking like it worked.
    #
    # ⚠️ The SecurityPolicy is still NAMED `google-workspace-only`, but its
    # issuer is authentik. The name is historical (a rename is a delete+create
    # and ArgoCD does not guarantee the order); do not infer the provider.
    #
    # 🟡 ssh (:2222) is NOT admitted yet -- see the console HTTPRoute's stage
    # note. Adding it means a TCP listener on a Gateway, and which Gateway
    # decides whether ssh is VPN-only or LAN-wide.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gateway-envoy
            gateway.envoyproxy.io/owning-gateway-name: homelab-gated
      toPorts:
        - ports: [{port: "7681", protocol: TCP}]

    # Prometheus. Nothing scrapes this box today; allowed so that adding a
    # ServiceMonitor later is not a silent metrics gap.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring

  egress:
    # ── DNS, WITH L7 INSPECTION. THIS RULE IS WHAT MAKES toFQDNs WORK. ──────
    # toFQDNs is implemented by Cilium's DNS proxy, which learns name->IP
    # bindings by WATCHING this pod's own DNS answers. Without `rules.dns` the
    # proxy is not engaged for this endpoint, nothing is learned, and every
    # toFQDNs rule below matches nothing -- presenting as connections that
    # HANG, not as NXDOMAIN.
    # TCP as well as UDP: answers over 512 bytes retry over TCP, and several of
    # the CDN names below return large answers.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"

    # ── The Kubernetes API server ──────────────────────────────────────────
    # 🔴 `toEntities: [kube-apiserver]`, and nothing else works:
    #   * NOT toFQDNs -- kubernetes.default.svc resolves to a ClusterIP, and
    #     the DNS-proxy path behind toFQDNs applies only to egress LEAVING the
    #     cluster. The rule would match nothing and fail closed.
    #   * NOT toEndpoints -- the apiserver is not a Cilium endpoint. It is a
    #     process in the host netns of three home nodes; there is no pod.
    #   * NOT `toEntities: [world]` -- `world` is everything OUTSIDE the
    #     cluster and excludes the cluster's own API server.
    #
    # What happens on the wire from the edge, because it is four mechanisms in
    # a row and any one failing looks like a timeout: the pod dials
    # 10.43.0.1:443, socket LB rewrites it at connect() to a real backend on a
    # home node, the packet leaves over wg0 masqueraded to 10.250.0.1, and
    # roles/wg_guard admits 6443 from the tunnel.
    #
    # ⚠️ GATE THIS. Every `toEntities: kube-apiserver` precedent in this repo
    # is from a HOME node. Whether the edge agent's ipcache tags the home
    # apiserver addresses `reserved:kube-apiserver` was not confirmed -- prove
    # it with a `kubectl get ns` from inside the box plus a Hubble verdict
    # before believing the read-only RBAC is reachable at all.
    - toEntities:
        - kube-apiserver

    # ── In-cluster: the MCP namespace ──────────────────────────────────────
    # 🔴 toEndpoints, NOT toFQDNs. This is the most repeated trap in this
    # repository: the DNS-proxy path behind toFQDNs applies only to egress
    # leaving the cluster, so an FQDN rule for an east-west ClusterIP matches
    # nothing and the connection is dropped silently, as a hang.
    #
    # ⚠️ CONFIGURE THE MCP CLIENT WITH THE CLUSTER-LOCAL ENDPOINT --
    # http://github-mcp-proxy.mcp.svc.cluster.local:8080 -- and NOT
    # https://github-mcp.lab.techyon.dev. The latter goes out to a LAN Gateway
    # and back, is not admitted by this rule, and under kube-proxy replacement
    # policy would see the Gateway's BACKEND port (10443) rather than 443.
    #
    # 🔴 RESIDUAL RISK, STATED NOT HIDDEN: github-mcp-proxy holds
    # GH_CLAUDE_CODE_TARJEI, a user-owned classic PAT with repo + read:org, and
    # its basic auth is an ingress-nginx annotation on the PUBLIC hostname --
    # the ClusterIP is unauthenticated. So this rule reaches the operator's full
    # GitHub identity, bypassing that auth. "The box holds no durable GitHub
    # secret" is true of the box and false of what the box can drive. Closing
    # it means an ingress CNP on `mcp`, tracked separately.
    #
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}

    # ── In-cluster: auq ────────────────────────────────────────────────────
    # ⚠️ auq is its OWN namespace, not `mcp`. Port 5577 used to be listed on
    # the `mcp` rule above, back when auq had no home and the rule was inert;
    # it moved here when auq actually landed. Leaving it on `mcp` would have
    # been the silent failure mode -- a rule that selects nothing does not
    # error, so `ask_user_questions` would simply hang until its 300 s
    # long-poll deadline and report "pending", which reads as "the user has
    # not answered yet" rather than "the packet never left the box".
    #
    # auq-mcp runs INSIDE this pod (stdio), so the connection this admits is
    # box → auq-server:5577 directly; the phone's half of the round trip goes
    # through the Gateway and is not this policy's business.
    #
    # 🔴 Cluster-local endpoint, not auq.lab.techyon.dev. Same trap as the MCP
    # rule above: the LAN hostname leaves for a Gateway that this policy does
    # not admit, and under kube-proxy replacement policy would see the
    # Gateway's backend port (10443) rather than 443.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: auq
      toPorts:
        - ports:
            - {port: "5577", protocol: TCP}

    # ── Anthropic ──────────────────────────────────────────────────────────
    # The CLI's documented egress surface. Several of these are suppressed by
    # environment variables baked into the image's managed-settings.json, and
    # BOTH halves are listed so the two cannot drift apart silently:
    #   api.anthropic.com      the model API. Nothing works without it.
    #   claude.ai / claude.com the OAuth /login flow. The headless flow shows a
    #   platform.claude.com    CODE in the browser to paste back -- no loopback
    #   console.anthropic.com  callback -- so a TTY in a pod is sufficient and
    #                          login needs no ingress at all.
    #   statsig.anthropic.com  feature gates, suppressed by
    #                          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1.
    #                          Listed anyway: removing it would turn a flag
    #                          regression into a startup hang.
    #   downloads.claude.ai    the updater. DISABLE_AUTOUPDATER=1 is set because
    #                          a self-updating binary on an untrusted node
    #                          defeats pinning the image -- but KEEP the FQDN so
    #                          a manual update during an incident needs no
    #                          policy edit.
    #
    # ⚠️ NOT LISTED, DELIBERATELY: the Datadog telemetry hosts. DISABLE_TELEMETRY
    # and DISABLE_ERROR_REPORTING are set. If those hosts start showing up in
    # DROPPED verdicts, find out which env var stopped working -- do not add
    # the hosts.
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: console.anthropic.com
        - matchName: statsig.anthropic.com
        - matchName: claude.ai
        - matchName: claude.com
        - matchName: platform.claude.com
        - matchName: downloads.claude.ai
      toPorts:
        - ports: [{port: "443", protocol: TCP}]

    # ── GitHub ─────────────────────────────────────────────────────────────
    # Three consumers ride this one rule, worth naming so you know which broke:
    #   * the broker sidecar: api.github.com only (JWT -> installation id ->
    #     ghs_ token)
    #   * git, pushing over https://x-access-token:<ghs_>@github.com/...
    #   * seed-repos.sh, cloning at container start
    #
    # ⚠️ matchPATTERN, not matchName, for anything containing `*`. matchName is
    # validated against '^([-a-zA-Z0-9_]+[.]?)+$' and rejects '*' -- and the
    # rejection is of the WHOLE CiliumNetworkPolicy object, not the one entry,
    # while ArgoCD keeps reporting Synced and Healthy. That has already cost
    # this repo five FQDNs that silently never landed.
    #
    # ⚠️ Cilium's `*` spans EXACTLY ONE DNS LABEL -- it cannot cross a dot.
    # Both githubusercontent patterns are required.
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: uploads.github.com
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.actions.githubusercontent.com"
      toPorts:
        - ports: [{port: "443", protocol: TCP}]

    # ── Package registries ─────────────────────────────────────────────────
    # 🟢 THIS IS THE LIST THAT GROWS, AND IT SHOULD GROW SLOWLY. Every entry is
    # a host from which an agent with a shell may fetch executable code. npm is
    # here because the CLI installs MCP servers with npx. Add a language
    # registry when a task actually needs one, from a DROPPED verdict rather
    # than in advance -- the commented block is left in place so the next
    # person adds the right name instead of inventing one.
    #
    # ⚠️ ghcr.io is NOT here and does not belong here. Nothing in this pod
    # pulls images; the kubelet does, and the kubelet is not subject to this
    # policy.
    - toFQDNs:
        - matchName: registry.npmjs.org
        # - matchName: pypi.org
        # - matchName: files.pythonhosted.org
        # - matchName: crates.io
        # - matchPattern: "*.crates.io"
        # - matchName: static.rust-lang.org
        # - matchName: api.nuget.org
      toPorts:
        - ports: [{port: "443", protocol: TCP}]

    # ⚠️ NO `toEntities: [world]` ANYWHERE, deliberately -- the same standing
    # rule netbird-egress states. An agent with a shell on a public VPS that can
    # phone anywhere it likes is not contained by anything else in this file.
    # If a future need is real, name the host.
