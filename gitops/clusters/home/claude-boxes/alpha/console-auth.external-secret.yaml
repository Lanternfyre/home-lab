# ttyd's own basic-auth credential, and the ssh material for the box.
#
# 🔴 ttyd ALWAYS runs with --credential, even once the HTTPRoute moves to the
# OIDC-gated Gateway. A browser terminal is a remote-code-execution surface
# sitting next to an Anthropic OAuth credential and a GitHub write token; the
# failure this guards against is an HTTPRoute accidentally attached to the
# UNGATED Gateway, which presents as a working page rather than as an error.
# The entrypoint refuses to start if TTYD_CREDENTIAL is unset -- fail closed.
#
# 🔴 THE SSH HOST KEY COMES FROM 1PASSWORD, NOT FROM THE POD. Generating it on
# the PVC would tie the box's identity to a local-path volume with
# reclaimPolicy: Delete -- so losing that volume fires
# REMOTE HOST IDENTIFICATION HAS CHANGED on every client, at exactly the moment
# the operator is trying to recover. Held centrally, the box keeps one identity
# across any number of rebuilds.
#
# Operator side -- 1Password item `Claude Workspace Console` in the
# `Infrastructure` vault, field labels (the Connect provider flattens sections
# and requires labels to be UNIQUE across the whole item):
#   ttyd-credential         "user:password", the literal ttyd -c argument
#   ssh-host-ed25519-key    an ed25519 private key, WITH its trailing newline
#   ssh-authorized-keys     the operator's public keys, one per line
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: console-auth
  namespace: claude-box-alpha
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: console-auth
    creationPolicy: Owner
  data:
    - secretKey: ttyd-credential
      remoteRef: {key: Claude Workspace Console, property: ttyd-credential}
    - secretKey: authorized_keys
      remoteRef: {key: Claude Workspace Console, property: ssh-authorized-keys}
    - secretKey: ssh_host_ed25519_key
      remoteRef: {key: Claude Workspace Console, property: ssh-host-ed25519-key}
