# alpha's values for the claude-box chart.
#
# 🔴 THE MIGRATION CONTRACT. Rendered as release `claude-box-alpha`, these values
# produce every object alpha ran as plain manifests, under the same names, with
# the same pod template -- so moving onto the chart mints no new
# ControllerRevision and the tmux session survives. helm-compendium pins this in
# claude-box/tests/values/alpha.yaml + names_test.yaml.
# ⚠️ Change one, change the other.

# One `owner/repo` per entry: what seed-repos clones AND what the broker's token
# covers. An edit rescopes the token within 45 minutes, with no restart.
repos:
  - Lanternfyre/home-lab
  - Lanternfyre/claude-workbench
  - Lanternfyre/docker-compendium
  - Lanternfyre/helm-compendium
  - Lanternfyre/github-actions-compendium
  # Operator maintains the shared Beads runner; keep this scope on alpha only.
  - Lanternfyre/claude-shared-skills
  # ⚠️ Necronia is ~856 MiB and is cloned in FULL, not shallow -- convco reads
  # tags and history to compute a version, so a `--depth 1` checkout would
  # silently restart every release at 0.1.0. Expect its first clone to take
  # minutes. That is fine: seed-repos runs in the background and does not
  # hold up readiness or the console.
  - Lanternfyre/Necronia
  - Lanternfyre/Necronia2.0

# The shared skills checkout is now in alpha's token-scoped repos list above.
# Avoid also seeding it through the common publicRepos list.
publicRepos: []

# Native NDepend pilot on alpha only. These published versions include the
# tested console and opt-in identity init. The namespace exception is enforced
# by claude-box-ndepend; its image pin must match this value. RollingUpdate
# replaces alpha's pod when these values sync, ending its active sessions.
image:
  tag: "0.1.22"
ndepend:
  enabled: true
  hostname: TarjeiPC
  mac: "50:eb:f6:77:84:3a"
  onePasswordItem: Ndepend
  activationProperty: ActivationLic
  markerProperty: H

console:
  # 🔴 A ROLE BOX (Necronia v2 plan, O30; operator 2026-10-25): `operator` --
  # the orchestrator: reads everything, drives the role boxes through Beads and
  # ListAgents/SendMessage, and never runs slices itself.
  # Was box1.lab.lanternfyre.dev. A hostname change needs its authentik
  # redirect URI too (apps/authentik/manifests/blueprint-envoy-gateway...).
  hostname: operator.lab.lanternfyre.dev
  homepageName: operator

# 🔴 lanternfyre boxes mint for the Lanternfyre installation ONLY (2026-10-22).
# The chart default is both orgs; with t3chy0n listed, an edit that added a
# t3chy0n repo to `repos:` would quietly widen this box into the techyon boxes'
# territory. With it absent, that edit fails the render instead.
github:
  installations:
    - lanternfyre

# 🔴 Pin the workspace image. The chart's default is Chart.appVersion, but the
# auq through the sidecar. The bearer is this box's paired device token, and
# only the auq-proxy container mounts it; the workspace gets no auq env at all.
auqProxy:
  enabled: true
  onePasswordItem: "Claude Box Alpha auq"

# Remote Control under this box's address (operator request 2026-10-23):
# window 0 registers as `Lanternfyre-operator`, drivable from claude.ai/code and the app,
# and reachable BY NAME from the operator's other sessions (ListAgents /
# SendMessage). Brand from the console's domain, number from its hostname.
# Needs chart >= 0.1.8 and image >= 0.1.17 -- see claude-boxes/README.md.
remoteControl:
  name: Lanternfyre-operator

# beads, the shared issue graph and memory (chart >= 0.1.9, image >= 0.1.18;
# apps/beads/README.md). bd reaches beads-dolt.beads:3306 in-cluster, as user
# `beads` and as BEADS_ACTOR=<remoteControl.name>, so the audit trail and
# `--claim` say which box did it. The password comes from the `Beads Dolt` item
# through an ExternalSecret in this namespace; the chart adds the egress rule,
# and the server's policy admits this namespace by name.
# ⚠️ OnDelete and no Reloader: after a password rotation bd here fails with
# "Access denied" until this pod is deleted (README, "Rotate a password").
beads:
  enabled: true
  onePasswordItem: "Beads Dolt"
  user: bd_operator
  actor: operator-alpha

# K0 role control: this box is operator-only. The chart mounts the marker and
# pinned guard read-only; Claude's managed PreToolUse hook checks the marker
# against the env role on every tool call. The existing Beads password field is
# reused through the chart's unchanged ExternalSecret.
roleControl:
  role: operator
  bdGuardSha256: 95114da6a3bd41841085e8dd611dbc5a0cc6455313b86514504f4c2b0517da77
claudeCode:
  managedSettings:
    hooks:
      PreToolUse:
        - matcher: "*"
          hooks:
            - type: command
              command: /etc/necronia/pre-tool

# Argo replaces the pod by itself on any spec change -- a new image, an env var,
# a renamed Remote Control -- instead of waiting for a manual pod delete
# (claude-box >= 0.1.10; operator decision 2026-10-25: session restarts are an
# accepted risk). 🔴 Every such sync kills the running session unannounced.
updateStrategy: RollingUpdate

# Sibling-only restart rights (claude-box >= 0.1.6, helm-compendium#39): these OTHER boxes'
# service accounts may get/delete THIS box's pod, and nothing else. A box can never restart
# itself. Operator decision 2026-09-15, Lanternfyre/claude-workbench#1521.
restartableBy:
  serviceAccounts:
    - {namespace: claude-box-bravo, name: claude-box-bravo}
    - {namespace: claude-box-charlie, name: claude-box-charlie}
# Codex egress. Opened 2026-09-22 (operator decision) because `codex login`
# needs a browser and `codex login --device-auth` HUNG on the box: every
# OpenAI host timed out exactly like the known-blocked ghcr.io, while
# api.github.com returned 200 — name-based filtering, not CIDR. A missing
# FQDN hangs rather than failing, which is precisely how it presented.
#
# ⚠️ extraEgress, NOT registryFqdns. Helm REPLACES lists rather than merging
# them, so setting registryFqdns here would silently drop npm / pypi /
# pythonhosted / nuget / context7 from this box. extraEgress defaults to []
# and is appended verbatim, so this is purely additive.
#
# Each host with the reason it is open — the ChatGPT-account login flow was
# the mode chosen (operator, 2026-09-22); an API-key-only setup needs just
# the third:
#   auth.openai.com  the browser / --device-auth flow authenticates here
#   chatgpt.com      ChatGPT-plan runtime calls (backend-api/codex)
#   api.openai.com   the API host, used when codex is pointed at a key
#
# ⚠️ matchName only — a `*` in matchName rejects the WHOLE policy while ArgoCD
# keeps reporting Synced. If login still hangs after this, take the next host
# from `hubble observe --verdict DROPPED`, never from guesswork: this list was
# derived from codex's documented flow, NOT from observed drop verdicts, because
# the hubble CLI is not present in the box.
networkPolicy:
  extraEgress:
    - toFQDNs:
        - matchName: auth.openai.com
        - matchName: chatgpt.com
        - matchName: api.openai.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
  # Actions log storage + the Rust registry and toolchain. Opened 2026-10-14
  # (operator decision, Lanternfyre/claude-workbench#2288). Both presented
  # exactly like the codex hosts above: TCP connect with NO HTTP response --
  # `dial tcp 20.209.227.33:443: i/o timeout` -- while api.github.com returned
  # 200 and DNS resolved. Name-based filtering again, not a permission gap:
  # `actions:read` is granted and no auth is involved at the point of failure.
  #
  # What each one unblocks:
  #   *.blob.core.windows.net  Actions LOG storage. `gh run view --log-failed`
  #                            downloads from here, so /wf-green's central step
  #                            was unrunnable. Observed hosts were
  #                            productionresultssa0. and productionresultssa1.;
  #                            the sa<N> prefix ROTATES, so a wildcard is
  #                            required rather than two matchName entries.
  #                            Filed as claude-workbench#2277.
  #   crates.io, *.crates.io   the cargo index and crate downloads -- `cargo
  #                            build`/`test` of ANY crate failed without them.
  #                            `*` spans exactly one label, so this covers
  #                            index.crates.io and static.crates.io.
  #                            Filed as claude-workbench#2208 (severity:high),
  #                            whose accepted answer was "mirror, vendor, or
  #                            egress" -- this is the egress mechanism.
  #   static.rust-lang.org     toolchain and component downloads
  #   sh.rustup.rs             the rustup installer
  #
  # ⚠️ matchPATTERN, not matchName, for both wildcards. matchName is validated
  # against '^([-a-zA-Z0-9_]+[.]?)+$' and rejects `*` outright -- as matchName
  # the entry does not merely fail to match, the CRD rejects the WHOLE object,
  # so every other change in the same apply never reaches the cluster and the
  # box keeps running the last valid version, while ArgoCD reports Synced
  # throughout (the error surfaces only as a ComparisonError on the
  # Application). This is copied verbatim from the ARC runner policy
  # (apps/arc-lanternfyre/manifests/runner-egress.ciliumnetworkpolicy.yaml),
  # which carries both entries and the same warning, rather than invented here.
    - toFQDNs:
        - matchPattern: "*.blob.core.windows.net"
        - matchName: crates.io
        - matchPattern: "*.crates.io"
        - matchName: static.rust-lang.org
        - matchName: sh.rustup.rs
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
  # Certificate revocation and issuer lookups, for NuGet package signatures.
  # Opened 2026-10-29 (operator request, from alpha's Necronia2.0 session). On
  # Linux, `dotnet restore` and `dotnet tool restore` verify each package's
  # signature when they first extract it, and the chain check looks up
  # revocation online, over plain HTTP on port 80: the first http:// CRL URL
  # of each certificate, then OCSP if the CRL is inconclusive, 15 s each.
  # Neither those names nor that port is open above, so each lookup HANGS to
  # its timeout instead of failing. On alpha's cold cache, `dotnet nuget verify`
  # of one package took 2 min 1 s (two chains x two certificates x CRL and
  # OCSP x 15 s) and warned NU3018 and NU3028 ("the revocation server could not
  # be reached"); the solution's restore took 4 minutes and a three-tool
  # `dotnet tool restore` about 6, while api.nuget.org:443 answered at once.
  #
  # The hosts are every CRL, OCSP and issuer (AIA) URL in the signatures of the
  # 164 packages (167 .nupkg files) in alpha's ~/.nuget/packages, read from the
  # certificates with `openssl x509 -ext crlDistributionPoints,authorityInfoAccess`
  # -- found, not guessed, though not hubble verdicts either (no hubble CLI in
  # the box). If a new package still hangs, read its signature the same way.
  # The ARC runner policies open :80 to the same CAs, from hubble drops.
  #   ocsp.digicert.com              OCSP for the DigiCert chains every package uses
  #   crl3.digicert.com, crl4.digicert.com
  #                                  CRLs for the same chains (crl4 is the first
  #                                  CRL URL on the SHA2 Assured ID CAs)
  #   cacerts.digicert.com           issuer certificates, fetched when a chain lacks one
  #   www.microsoft.com              /pkiops CRLs and issuers of the Microsoft
  #                                  timestamp chain (coverlet, Newtonsoft.Json 13.0.4)
  #   ts-ocsp.ws.symantec.com, ts-crl.ws.symantec.com, ts-aia.ws.symantec.com,
  #   s.symcd.com, s.symcb.com       the Symantec timestamp chain on older packages
  #                                  (Newtonsoft.Json 13.0.1, xunit.abstractions,
  #                                  Microsoft.Extensions.* 6.0); DigiCert serves them now
  #
  # ⚠️ RESIDUAL RISK, STATED: this is port 80 to the IPs these names resolve to,
  # not to "these names only". Cilium enforces toFQDNs as an L3 rule on the
  # learned IPs, and every name here is a CNAME onto a shared CDN edge (Akamai,
  # and Cloudflare for some DigiCert answers), where a plain-HTTP Host header
  # picks the site. So other tenants of those edges answer on :80 -- the same
  # reach registry.npmjs.org, chatgpt.com and api.nuget.org already give on 443.
  # CAs serve signed revocation data over plain HTTP by design. An L7 Host rule
  # could narrow it; none exists in the estate yet, so it is not done here.
    - toFQDNs:
        - matchName: ocsp.digicert.com
        - matchName: crl3.digicert.com
        - matchName: crl4.digicert.com
        - matchName: cacerts.digicert.com
        - matchName: www.microsoft.com
        - matchName: ts-ocsp.ws.symantec.com
        - matchName: ts-crl.ws.symantec.com
        - matchName: ts-aia.ws.symantec.com
        - matchName: s.symcd.com
        - matchName: s.symcb.com
      toPorts:
        - ports: [{port: "80", protocol: TCP}]

# The Necronia v2 plan keeps bd memories out of every session (clean room):
# the beadwork session hook reads this and runs `bd prime --no-memories`.
extraEnv:
  BEADWORK_NO_MEMORIES: "1"
