# The MCP servers this box may use.
#
# Consumed by the image's `claude` shim (docker-compendium
# claude-workspace/claude-shim.sh) as `--mcp-config /etc/claude-code/mcp/mcp.json
# --strict-mcp-config` on EVERY invocation -- interactive, scripted, and
# `kubectl exec`.
#
# 🔴 WHY A ConfigMap AND NOT ~/.claude.json. Claude Code OWNS ~/.claude.json at
# runtime: the OAuth account, per-project trust decisions and history live in
# it. Mounting a read-only ConfigMap over that file would break login
# persistence, and the operator's `/login` is the one credential on this box
# with no minting analogue -- losing it costs a manual re-auth. Passing the
# config on the command line leaves the file alone entirely.
#
# 🔴 `--strict-mcp-config` MAKES THIS FILE AUTHORITATIVE, NOT ADDITIVE. Without
# it Claude Code ALSO loads servers from ~/.claude.json and from each project's
# .mcp.json -- so a server deleted here would keep running from a stale copy on
# the PVC, and this file would quietly stop describing reality.
#
# ⚠️ `reloader` is in this cluster. Do NOT annotate the StatefulSet to watch
# this ConfigMap: a restart destroys the tmux session, which is the whole point
# of the box. Edit, then restart deliberately. The shim reads the file per
# invocation, so an already-running `claude` keeps the old set until it exits --
# a NEW `claude` in the same session picks the change up without a restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-box-alpha-mcp
  namespace: claude-box-alpha
  labels:
    app.kubernetes.io/name: claude-box
    app.kubernetes.io/instance: alpha
data:
  # ── The roster ─────────────────────────────────────────────────────────
  # Matches what the operator develops with on the laptop. Four of the five are
  # STDIO servers: Claude spawns them as child processes, so each binary must
  # exist in the image (docker-compendium claude-workspace), pinned there and
  # updatable in place with `devtools-update`.
  #
  # 🔴 EVERY LAUNCH COMMAND BELOW WAS RUN, not copied from a README. A real MCP
  # initialize handshake as uid 1000 returned:
  #     glider    Glider.Server 11.0.0.0
  #     semble    semble 1.30.0
  #     context7  Context7 4.1.0
  #     serena    Serena 1.28.1
  #
  # github -- the in-cluster proxy, github-mcp-server 1.27.1 behind mcp-proxy.
  #
  #   TRANSPORT IS `http` (streamable HTTP) ON /mcp, AND THAT WAS MEASURED, NOT
  #   ASSUMED. The proxy serves BOTH transports, so either would have "worked":
  #   POST /mcp initialize returns a real serverInfo, and GET /sse returns an
  #   `event: endpoint` with a session id. `/` is 404, so a URL without the
  #   path fails. SSE is the deprecated transport in the MCP spec; /mcp is the
  #   current one and needs no second connection for the write half.
  #
  #   CLUSTER-LOCAL URL, not https://github-mcp.lab.techyon.dev. The LAN
  #   hostname leaves for a Gateway this namespace's CNP does not admit, and
  #   under kube-proxy replacement policy would see the Gateway's BACKEND port
  #   (10443) rather than 443. The ClusterIP is admitted on 8080.
  #
  #   🔴 NO CREDENTIAL HERE, AND THAT IS NOT AN OVERSIGHT. The proxy's basic
  #   auth is an ingress-nginx annotation on its PUBLIC hostname; the ClusterIP
  #   is unauthenticated. It injects GH_CLAUDE_CODE_TARJEI -- the operator's
  #   classic PAT, repo + read:org -- so anything reaching :8080 wields the
  #   operator's full GitHub identity. Stated in the CNP too. Closing it means
  #   an ingress CNP on the `mcp` namespace, tracked separately.
  #
  # roslyn -- glider, C# semantic analysis over Roslyn.
  #
  #   ⚠️ --no-telemetry IS LOAD-BEARING HERE, not a preference. glider phones
  #   home on start, that host is not in the egress allow-list, and a denied
  #   toFQDNs is a DROPPED PACKET rather than a refusal -- so the failure mode
  #   is a server that hangs on startup, which Claude reports as a server that
  #   would not connect. Cheaper to not make the call.
  #
  # serena -- launched through the `serena-mcp` wrapper, NOT directly.
  #
  #   🔴 DO NOT INLINE `serena start-mcp-server --context claude-code-workbench`
  #   HERE. That context is CUSTOM: it ships in claude-workbench, not in serena,
  #   and it is what restores `activate_project` (single_project: false) --
  #   worth having on a seven-repo box. But claude-workbench is private and
  #   cloned at RUNTIME, so the file may not exist yet, and serena does not
  #   degrade when a context is missing: it raises FileNotFoundError and exits.
  #   The wrapper prefers the workbench context, falls back to the stock
  #   `claude-code` one, and says which on stderr.
  #
  # semble -- code search. Nothing to configure.
  #
  # context7 -- library documentation. A LOCAL stdio process that proxies to the
  #   context7 API, so the box makes that call itself; context7.com is in the
  #   egress allow-list for exactly this. Without it the server connects and
  #   every query hangs.
  #
  # ⚠️ TWO OF THE OPERATOR'S SERVERS ARE ABSENT, each for a measured reason:
  #
  #   auq     -- stdio, so the binary must be in the image, and it is not:
  #              auq-mcp is Rust in the PRIVATE claude-workbench repo and the
  #              image builds with no credential. Listing it without the binary
  #              would fail at spawn on every `claude` start rather than
  #              degrade. The egress half is already open (the `auq` namespace
  #              rule in containment.ciliumnetworkpolicy.yaml); publishing
  #              auq-mcp as its own OCI image is the remaining piece.
  #
  #   ndepend -- its licence is a hash of the network MAC, and reproducing it
  #              needs CAP_NET_ADMIN, which is POD-WIDE. A server-side dry run
  #              against this cluster shows NET_ADMIN rejected under PSA
  #              `restricted` AND under `baseline`; only `privileged` accepts
  #              it, and this is a box an agent has a shell in. A separate pod
  #              sidesteps the capability but cannot see /home/agent/work,
  #              which is the code NDepend exists to analyse. The unlock is a
  #              licence that does not hash the MAC -- a question for NDepend,
  #              not a Kubernetes problem.
  mcp.json: |
    {
      "mcpServers": {
        "github": {
          "type": "http",
          "url": "http://github-mcp-proxy.mcp.svc.cluster.local:8080/mcp"
        },
        "roslyn": {
          "type": "stdio",
          "command": "glider",
          "args": ["--no-telemetry"]
        },
        "serena": {
          "type": "stdio",
          "command": "serena-mcp"
        },
        "semble": {
          "type": "stdio",
          "command": "semble"
        },
        "context7": {
          "type": "stdio",
          "command": "context7-mcp"
        }
      }
    }
