# Values EVERY claude box shares, read before the box's own chart-values.yaml
# (bootstrap/claude-boxes.appset.yaml lists this file first, so a box can still
# override any key). Maps deep-merge across the two files; a LIST in a box's file
# replaces the list here, so keep shared settings in maps.
#
# Needs claude-box chart >= 0.1.12 (publicRepos, Codex settings and MCPs). An
# older chart ignores these keys.

# Keep one published workspace image pin for all boxes. Advance only after the
# registry tag exists; a missing tag restarts every box into ImagePullBackOff.
image:
  tag: "0.1.21"

claudeCode:
  managedSettings:
    # The shared skills (Lanternfyre/claude-shared-skills, public): the Beads
    # work loop and the documentation standard. Claude Code installs both at
    # session start, with no trust prompt, from the managed-settings drop-in the
    # chart mounts. Box sessions see four skills: bead, question, adr, write.
    extraKnownMarketplaces:
      claude-shared-skills:
        # 🔴 `git` with https, NOT `github`: the github source clones over SSH,
        # and the box has no SSH key. Public, so no token scope is involved --
        # which is what lets the t3chy0n boxes use it too.
        source: {source: git, url: "https://github.com/Lanternfyre/claude-shared-skills.git"}
        # Follow the latest release (operator, 2026-10-25). An update is picked
        # up after a session's first message (random delay up to 10 min) and
        # loads at the next session or on /reload-plugins. A box moves only
        # when a plugin's `version` changes, which that repo bumps per change.
        autoUpdate: true
    enabledPlugins:
      beadwork@claude-shared-skills: true
      docs@claude-shared-skills: true

# Public checkout for editing the skills. This list is separate from `repos:`:
# the GitHub App broker keeps each box's existing org-specific token scope.
publicRepos:
  - Lanternfyre/claude-shared-skills

codex:
  # System defaults in these Kubernetes-constrained boxes. The pod still has
  # non-root execution, no extra capabilities, RuntimeDefault seccomp and its
  # existing network policy. Codex's inner bubblewrap cannot create a user
  # namespace here, so the operator chose full access with no CLI approvals.
  configToml: |
    sandbox_mode = "danger-full-access"
    approval_policy = "never"

    [marketplaces.claude-shared-skills]
    source_type = "git"
    source = "https://github.com/Lanternfyre/claude-shared-skills.git"
    ref = "main"

    [plugins."beadwork@claude-shared-skills"]
    enabled = true

    [plugins."docs@claude-shared-skills"]
    enabled = true

# The Anthropic Console API pool (operator, 2026-10-29: about $200 of credit) for
# SUPPLEMENTARY headless runs, the way agents already use Codex. Needs claude-box
# chart >= 0.1.12 for secretEnv (0.1.18 has it). The chart puts it in the workspace
# container's environment only; sidecars never see it.
#
# 🔴 NOT `ANTHROPIC_API_KEY`. Claude Code ranks that variable above the claude.ai
# login and always uses it under `-p`, so exporting it would bill every session on
# the box to the pool and switch off features that need the login (Remote Control).
# An agent opts in per run instead:
#   ANTHROPIC_API_KEY="$ANTHROPIC_POOL_API_KEY" claude -p --max-budget-usd 2 "…"
#
# ⚠️ The 1Password field label must exist exactly as written: a wrong label leaves
# the ExternalSecret unsynced, and a box that restarts then cannot start
# (CreateContainerConfigError on the missing key).
secretEnv:
  ANTHROPIC_POOL_API_KEY:
    onePasswordItem: Claude Workspace Console
    onePasswordProperty: api-token
