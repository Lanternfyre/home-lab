# golf's values for the claude-box chart -- the ops box,
# https://ops.lab.lanternfyre.dev (Necronia v2 plan, O30; added 2026-10-25).
#
# A ROLE BOX: CI, build scripts, ADR scaffolding, and PRs to github-actions-compendium,
# helm-compendium, docker-compendium and home-lab (plan, Clean-room roles: ops).
# CLEAN SIDE: it must never see the C++ oracle or v1 `Lanternfyre/Necronia`.
#
# 🔴 BORN CLEAN. A new box starts on a new, empty home volume -- no v1 checkout,
# no old Claude transcripts -- which is why the clean-side roles are NEW boxes and
# the C++-side ones (spec-writer = bravo, oracle-ops = charlie) are the boxes
# that already held the v1 code. Never reuse an old volume for this box.
#
# bravo's shape otherwise: no shared ClusterRole, 20Gi, Lanternfyre installation
# only, beads on, auq on a shared device token.

# One `owner/repo` per entry: what seed-repos clones AND what the broker's token
# covers. An edit rescopes the token within 45 minutes, with no restart.
# 🔴 NO `Lanternfyre/Necronia` (v1, GPL C++) -- ever -- and NO
# `Lanternfyre/Necronia2.0` YET: until M0/S03 removes docs/, its HEAD still holds
# C++ excerpts (docs/FINDINGS.md) and its history more. After S03 it is added as
# a HISTORY-CUT clone (the plan's --shallow-since recipe), which seed-repos cannot
# do yet -- a claude-box chart change. Never add it here before both.
repos:
  - Lanternfyre/home-lab
  - Lanternfyre/docker-compendium
  - Lanternfyre/helm-compendium
  - Lanternfyre/github-actions-compendium

console:
  hostname: ops.lab.lanternfyre.dev
  homepageName: ops

# 🔴 Lanternfyre installation ONLY, as on alpha..charlie: with t3chy0n absent, an
# edit that added a t3chy0n repo to `repos:` fails the render instead of quietly
# widening this box's token.
github:
  installations:
    - lanternfyre

# 🔴 alpha owns the shared `claude-box-reader` ClusterRole; this release only binds.
rbac:
  clusterRole:
    create: false

# 20Gi, as bravo. To grow it, resize the CLAIM (bravo's chart-values.yaml says
# how), never this value -- volumeClaimTemplates are immutable.
storage:
  size: 20Gi

image:
  tag: "0.1.18"

# auq on alpha's paired device token, shared (operator, 2026-10-25: "We
# don't mind same device tokens for now"). Its cards therefore show alpha's
# device, and unpairing it cuts off both boxes. To split: pair a device
# `claude-box-golf`, store it as "Claude Box Golf auq", change this line.
auqProxy:
  enabled: true
  onePasswordItem: "Claude Box Alpha auq"

# window 0 registers as `Lanternfyre-ops`; also its BEADS_ACTOR, so every bead
# it claims or writes is recorded under the role name.
remoteControl:
  name: Lanternfyre-ops

beads:
  enabled: true
  onePasswordItem: "Beads Dolt"

# Argo replaces the pod by itself on any spec change (claude-box >= 0.1.10;
# operator decision 2026-10-25: session restarts are an accepted risk).
updateStrategy: RollingUpdate

# Only the operator box (alpha) may restart this one. The plan's rule is that
# role boxes never act on each other; the operator drives them.
restartableBy:
  serviceAccounts:
    - {namespace: claude-box-alpha, name: claude-box-alpha}

# Actions LOG storage, so `gh run view --log-failed` works (the sa<N> prefix
# rotates, hence matchPattern; same entry and reasoning as bravo's). Nothing
# else beyond the chart's default egress and the Codex pilot below.
networkPolicy:
  extraEgress:
    - toFQDNs:
        - matchPattern: "*.blob.core.windows.net"
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    # Golf-only Codex pilot: device login and ChatGPT-backed model requests.
    # Both hosts timed out from this box under the previous policy (2026-10-26).
    # No API-key endpoint, wildcard OpenAI access, image or pod-spec change.
    - toFQDNs:
        - matchName: auth.openai.com
        - matchName: chatgpt.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]

# The Necronia v2 plan keeps bd memories out of every session (clean room):
# the beadwork session hook reads this and runs `bd prime --no-memories`.
extraEnv:
  BEADWORK_NO_MEMORIES: "1"
