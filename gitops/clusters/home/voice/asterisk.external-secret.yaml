# The secret half of Asterisk's configuration, rendered whole from ONE
# 1Password item and #include'd by pjsip.conf / extensions.conf.
#
# 1Password: vault `Infrastructure`, item `voip-asterisk`, text fields:
#
#   halonet_registrar        SIP domain/registrar Linphone uses, no `sip:`
#   halonet_username         SIP username (Linphone "Username")
#   halonet_auth_username    Linphone "Auth ID"/"User ID"; repeat the username
#                            if the account has no separate one
#   halonet_password         SIP password
#   halonet_number           the DID in E.164 (+48...). Must match, exactly, the
#                            number imported into ElevenLabs -- that is what it
#                            routes the inbound call on
#   elevenlabs_sip_username  digest user, invented by us; entered in ElevenLabs
#   elevenlabs_sip_password  digest password, long and random; same
#   linphone_password        password of the `linphone` TEST extension (SIP
#                            username is literally `linphone`); remove with it
#
# ⚠️ These land on k8s-edge1, the one untrusted node, because that is where
# Asterisk runs. Inherent in running there; see EDGE-NODE.md.
#
# ⚠️ Asterisk reads its config at start only. Reloader restarts the pod when
# this Secret changes (the Deployment carries reloader.stakater.com/auto).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asterisk-secrets
  namespace: voice
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: asterisk-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        pjsip_secrets.conf: |
          [halonet-auth]
          type = auth
          auth_type = userpass
          username = {{ .halonetAuthUsername | trim }}
          password = {{ .halonetPassword | trim }}

          [halonet]
          type = aor
          contact = sip:{{ .halonetRegistrar | trim }}
          ; Every 25s: keeps the edge's conntrack entry for the REGISTER flow
          ; alive, which is the ONLY way Halonet's INVITEs get in (5060/udp is
          ; not open on the firewall).
          qualify_frequency = 25

          [halonet]
          type = identify
          endpoint = halonet
          match = {{ .halonetRegistrar | trim }}

          [halonet-reg]
          type = registration
          transport = transport-udp
          outbound_auth = halonet-auth
          server_uri = sip:{{ .halonetRegistrar | trim }}
          client_uri = sip:{{ .halonetUsername | trim }}@{{ .halonetRegistrar | trim }}
          contact_user = {{ .halonetUsername | trim }}
          expiration = 300
          retry_interval = 60
          forbidden_retry_interval = 600
          max_retries = 10000
          ; line=yes tags our Contact so an INVITE is matched to this
          ; registration even if Halonet sends it from an address `identify`
          ; did not resolve.
          line = yes
          endpoint = halonet

          [halonet](halonet-endpoint)
          from_user = {{ .halonetUsername | trim }}
          from_domain = {{ .halonetRegistrar | trim }}

          [elevenlabs-auth]
          type = auth
          auth_type = userpass
          username = {{ .elevenlabsUsername | trim }}
          password = {{ .elevenlabsPassword | trim }}
          [linphone-auth]
          type = auth
          auth_type = userpass
          username = linphone
          password = {{ .linphonePassword | trim }}
        extensions_globals.conf: |
          [globals]
          DID = {{ .halonetNumber | trim }}
  data:
    - secretKey: halonetRegistrar
      remoteRef: { key: voip-asterisk, property: halonet_registrar }
    - secretKey: halonetUsername
      remoteRef: { key: voip-asterisk, property: halonet_username }
    - secretKey: halonetAuthUsername
      remoteRef: { key: voip-asterisk, property: halonet_auth_username }
    - secretKey: halonetPassword
      remoteRef: { key: voip-asterisk, property: halonet_password }
    - secretKey: halonetNumber
      remoteRef: { key: voip-asterisk, property: halonet_number }
    - secretKey: elevenlabsUsername
      remoteRef: { key: voip-asterisk, property: elevenlabs_sip_username }
    - secretKey: elevenlabsPassword
      remoteRef: { key: voip-asterisk, property: elevenlabs_sip_password }
    - secretKey: linphonePassword
      remoteRef: { key: voip-asterisk, property: linphone_password }
