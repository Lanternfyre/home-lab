# The authentik service account's password.
#
# ⚠️ THE SAME 1Password FIELD THE AUTHENTIK BLUEPRINT READS -- item `netbird`,
# field `reconciler-token`. One credential, two consumers: authentik DEFINES
# the app-password Token from it, the reconciler PRESENTS it. If these ever
# diverge, authentik answers `invalid_grant`, which is the same reply it gives
# for a missing grant type or a wrong-intent token, so the cause would not be
# obvious. They read the same field so they cannot drift.
#
# 🔴 This is the only credential in the whole reconciler design, and it lives
# in authentik + 1Password ON PURPOSE. A NetBird PAT would have been simpler
# and is exactly wrong: a PAT belongs to a NetBird ACCOUNT, so wiping the
# management datastore kills it -- and surviving that wipe is the entire point.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-reconciler-credentials
  namespace: netbird-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: netbird-reconciler-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: netbird
        property: reconciler-token
