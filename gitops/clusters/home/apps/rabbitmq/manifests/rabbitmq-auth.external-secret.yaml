# RabbitMQ credentials, pulled from 1Password (ClusterSecretStore one-password).
#
# Operator side: 1Password item "RabbitMQ" with fields
#   password       -- the `rabbitmq` user's password
#   erlang-cookie  -- the Erlang cookie (the cluster-membership shared secret,
#                     not a user credential)
#
# ⚠️ BOTH VALUES MUST BE ALPHANUMERIC — [A-Za-z0-9] only, no punctuation. This
# is not tidiness, it is two hard constraints:
#
#   password:      ReportPortal interpolates it RAW into two connection URIs,
#                  `amqp://rabbitmq:<pass>@...:5672` and the management
#                  `http://rabbitmq:<pass>@...:15672/api`, with NO URL-encoding
#                  (verified in the rendered chart, 2026-08-23). A `@`, `/`,
#                  `:`, `#`, `?` or `%` silently truncates or corrupts the host
#                  portion, and the failure surfaces as an unhelpful connection
#                  error rather than as a bad password.
#   erlang-cookie: Erlang reads it as an atom; punctuation is unsafe there.
#
# Use 1Password's generator with symbols OFF (32+ chars is ample for both).
#
# ⚠️ Both fields must be set BEFORE first sync. The chart generates a random
# value for either one that is missing -- into a Secret it owns, which means the
# value is regenerated on some upgrades and the broker then rejects its own
# stored data directory. Fixing that after the fact costs a volume wipe.
#
# ⚠️ The SAME item is materialised a second time into the reportportal
# namespace, by ../../reportportal/manifests/rabbitmq-auth-replicated.external-secret.yaml
# (with a different key name, because RP's chart hardcodes it). Rotating the
# 1Password field rotates both; rotating one side alone breaks RP's connection.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-auth
  namespace: rabbitmq
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: rabbitmq-auth
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: RabbitMQ
        property: password
    - secretKey: erlang-cookie
      remoteRef:
        key: RabbitMQ
        property: erlang-cookie
