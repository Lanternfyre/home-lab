# A2/A4 -- the authentik OIDC provider + application for Silo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-silo
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-silo
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        silo.yaml: |
          version: 1
          metadata:
            name: silo-oidc
          entries:
            - id: silo-provider
              model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: silo
              attrs:
                name: silo
                client_type: confidential
                client_id: "{{ .client_id }}"
                client_secret: "{{ .client_secret }}"
                # ⚠️ REQUIRED. grant_types defaults to an EMPTY list, which
                # permits nothing -- every authorize request is rejected with
                # "Invalid grant_type for provider" and the browser lands on
                # the callback with error=invalid_request.
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                sub_mode: user_email
                include_claims_in_id_token: true
                redirect_uris:
                  - matching_mode: strict
                    url: https://silo.lab.techyon.dev/oauth_callback
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - model: authentik_core.application
              identifiers:
                slug: silo
              attrs:
                name: Silo
                provider: !KeyOf silo-provider
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-silo
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc-silo
        property: client_secret
