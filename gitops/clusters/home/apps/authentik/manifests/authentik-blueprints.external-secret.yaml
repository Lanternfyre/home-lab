# A0b -- Google federated as a Source, so existing accounts map by email.
#
# The blueprint lives in a SECRET rather than a ConfigMap because it carries the
# OAuth client secret. The chart mounts `blueprints.secrets` entries at
# /blueprints/mounted/secret-<name> on the WORKER, and only keys ending `.yaml`
# are discovered and applied.
#
# ⚠️ `| trim` is not cosmetic. The 1Password entries are file attachments and
# preserve the original trailing newline; Google rejects "clientId\n" as an
# unknown client. Every other consumer of this item does the same -- see
# apps/external-secrets/manifests/google-oauth.external-secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprints
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: authentik-blueprints
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        google-source.yaml: |
          version: 1
          metadata:
            name: google-federated-source
          entries:
            # ── The flow the Google source runs, and why it is not the default ──
            #
            # 🔴 DEFINED BEFORE THE SOURCE ON PURPOSE, AND IN THIS FILE.
            #
            # `!Find` returns None SILENTLY when nothing matches -- it is a
            # .filter().first(), not a .get(). If this flow lived in a separate
            # blueprint and that one applied second, the source's
            # `authentication_flow` would be set to NULL and EVERY Google login
            # in the estate would fail, with nothing in the logs naming the
            # cause. Order is only guaranteed WITHIN a file, so it lives here
            # and is referenced by `!KeyOf`, which cannot silently miss.
            #
            # ── What it changes: `authentication: none` ────────────────────────
            #
            # authentik's built-in `default-source-authentication` is
            # `require_unauthenticated`. Three things then collide:
            #
            #   1. the NetBird client sends `prompt=login` on every authorize
            #   2. that forces authentik to re-run authentication even though a
            #      session already exists
            #   3. the user taps "Sign in with Google" -- and a flow marked
            #      require_unauthenticated does not apply to a logged-in session
            #
            # authentik raises FlowNonApplicableException and renders it as
            # "Permission denied. Flow does not apply to current user.", which
            # names neither the flow nor the session and sends you looking at
            # the provider, the redirect URIs and the Google client -- none of
            # which are involved. MEASURED 2026-09-06:
            #
            #   logger: authentik.core.sources.flow_manager
            #   event : Flow non applicable   exc: FlowNonApplicableException()
            #   source: <OAuthSource: OAuth Source Google>
            #
            # `none` means "applies regardless of session state", which is
            # exactly what prompt=login asks for.
            #
            # ⚠️ THIS IS NOT A WEAKENING. Same UserLoginStage, same
            # `ak_is_sso_flow` guard (reused, not reimplemented) -- the Google
            # identity must still be verified and linked. The only new
            # behaviour is that the flow also runs when a session exists.
            #
            # ⚠️ DO NOT "FIX" THIS BY EDITING `default-source-authentication`
            # INSTEAD. authentik ships it in a system blueprint that re-applies
            # on every start and upgrade, so the edit would be reverted later,
            # far from whatever change appeared to cause it.
            - id: sso-source-authentication-flow
              model: authentik_flows.flow
              identifiers:
                slug: sso-source-authentication
              attrs:
                name: sso-source-authentication
                title: Welcome to authentik!
                designation: authentication
                authentication: none
                layout: stacked
                denied_action: message_continue
            # Reused from the built-in flow, NOT redefined: the same login stage
            # and the same "only inside an SSO flow" guard the default carries.
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf sso-source-authentication-flow
                stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-authentication-login]]
                order: 0
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf sso-source-authentication-flow
                policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-source-authentication-if-sso]]
                order: 0
              attrs:
                negate: false
                enabled: true

            - id: google
              model: authentik_sources_oauth.oauthsource
              identifiers:
                slug: google
              attrs:
                name: Google
                provider_type: google
                consumer_key: "{{ .rawClientID | trim }}"
                consumer_secret: "{{ .rawClientSecret | trim }}"
                enabled: true
                # Renders as a full button on the login page rather than a small icon.
                promoted: true
                # Link a Google identity to the EXISTING authentik user with the
                # same email. akadmin already carries the Workspace address, so
                # signing in with Google lands on the existing admin account
                # rather than creating a second one.
                user_matching_mode: email_link
                # See the flow defined above. NOT `default-source-authentication`:
                # that one is require_unauthenticated, and with `prompt=login`
                # (which the NetBird client always sends) an already-signed-in
                # user tapping Google gets "Flow does not apply to current user".
                authentication_flow: !KeyOf sso-source-authentication-flow
                # ⚠️ enrollment_flow is deliberately LEFT UNSET. With no
                # enrollment flow, a Google account whose email does not already
                # exist in authentik cannot create one -- so this federates the
                # accounts that exist and is not an open front door for any
                # Google user on the internet. Setting an enrollment flow here
                # would change that, and should be a deliberate decision.
            # Bind the source to the login screen. Verified before writing this:
            # the stage's `sources` list is currently EMPTY, so assigning it
            # clobbers nothing.
            - model: authentik_stages_identification.identificationstage
              identifiers:
                name: default-authentication-identification
              attrs:
                sources:
                  - !KeyOf google
            # ── Keeping that button REACHABLE, not merely present ────────────
            #
            # 🔴 WITHOUT THIS, THE BUTTON ABOVE IS INVISIBLE TO EVERY NETBIRD
            # LOGIN, BECAUSE THE STAGE THAT DRAWS IT IS NEVER RENDERED.
            #
            # The NetBird clients send `login_hint=<the user's email>` on EVERY
            # authorize. MEASURED 2026-09-16, from the phone, in authentik's own
            # request log:
            #
            #   /application/o/authorize/?...&login_hint=adrian.jutrowski%40techyon.dev
            #     &prompt=login&redirect_uri=http%3A%2F%2Flocalhost%3A53000
            #   ua=Mozilla/5.0 (Linux; Android 10; K)              -> 302
            #
            # authentik copies that straight into the flow plan --
            # providers/oauth2/views/authorize.py at 2026.8.0:
            #
            #   if QS_LOGIN_HINT in self.request.GET:
            #       context[PLAN_CONTEXT_PENDING_USER_IDENTIFIER] = ...
            #
            # and the identification stage then SKIPS ITSELF --
            # stages/identification/stage.py, `get()`:
            #
            #   can_skip = (
            #       not current_stage.password_stage
            #       and not current_stage.captcha_stage
            #       and not current_stage.webauthn_stage
            #       and not self.executor.current_binding.policies.exists()
            #   )
            #
            # The source buttons are assembled in THAT stage's `get_challenge`,
            # so skipping it takes the Google button with it and drops the user
            # straight onto the password stage. An account federated from Google
            # may have no usable password at all, which is a full lockout.
            #
            # ⚠️ "Not you?" CANNOT RECOVER FROM IT, which is what makes this
            # read like a cookie bug and sends you to clear site data. The hint
            # lives in the QUERY STRING, not in a cookie: restarting the flow
            # re-reads the same URL and skips again, forever.
            #
            # ⚠️ IT CANNOT BE FIXED ON THE NETBIRD SIDE. The hint is read from
            # the DEVICE, never from management.json -- client/android/login.go
            # at v0.78.1: `profileLoginHint(cfgPath)` -> `ReadProfileEmail`.
            # No server setting suppresses it, which is also why clearing the
            # app's storage is what unblocks a phone that is already stuck.
            #
            # ── Why a policy, and why one that decides nothing ───────────────
            #
            # `can_skip` is an AND of four terms, so ANY of them being non-empty
            # restores the stage. Three of them change what every user sees:
            # `password_stage` merges password entry into the identification
            # screen for the WHOLE estate, and captcha/webauthn add a dependency
            # and a stage. The policy term is the only one whose mere presence
            # is enough, so every other consumer's login page is untouched --
            # and the address still arrives pre-filled, because `get_challenge`
            # sets `pending_user_identifier` from that same hint.
            #
            # 🔴 THIS POLICY IS BOUND FOR ITS EXISTENCE, NOT ITS RESULT. Do not
            # "clean up" a policy that always returns True: `policies.exists()`
            # IS the mechanism, and deleting it silently restores the lockout.
            - id: identification-always-runs
              model: authentik_policies_expression.expressionpolicy
              identifiers:
                name: identification-defeats-login-hint-skip
              attrs:
                expression: |
                  # Bound so that `current_binding.policies.exists()` is True,
                  # which is what stops the identification stage skipping itself
                  # when a client sends `login_hint`. The stage must always run,
                  # so this is unconditionally True.
                  return True
            # 🔴 `!Find` ON UPSTREAM'S BINDING, BECAUSE THERE IS NOTHING TO KEY
            # OFF. This binding is authentik's own -- see its
            # blueprints/default/flow-default-authentication-flow.yaml, where it
            # is `order: 10` and, unlike the password and MFA bindings, carries
            # NO `id:`. `!Find` builds a Django `Q()` per pair, so relation
            # lookups are legal.
            #
            # ⚠️ BOTH TERMS ARE REQUIRED. `stage__name` alone would also match
            # this stage's binding in any OTHER flow that reuses it.
            #
            # ⚠️ `!Find` RETURNS None SILENTLY when nothing matches -- it is a
            # .filter().first() -- and a None target binds the policy to nothing
            # while the blueprint still reports success. VERIFY after first sync:
            #
            #   kubectl -n authentik exec deploy/authentik-server -- ak shell -c \
            #     "from authentik.flows.models import FlowStageBinding as B; \
            #      b = B.objects.get(target__slug='default-authentication-flow', \
            #        stage__name='default-authentication-identification'); \
            #      print([p.name for p in b.policies.all()])"
            #
            # must print ['identification-defeats-login-hint-skip'].
            #
            # ⚠️ UPSTREAM RE-APPLIES ITS FLOW BLUEPRINT ON EVERY UPGRADE. That
            # re-applies the flow, its stages and its bindings, but it knows
            # nothing of this PolicyBinding and will not remove it. What an
            # upgrade CAN do is change `can_skip` itself, and then this stops
            # working with no error -- the symptom is the Google button
            # vanishing from the NetBird login again.
            - model: authentik_policies.policybinding
              identifiers:
                target: !Find [authentik_flows.flowstagebinding, [target__slug, default-authentication-flow], [stage__name, default-authentication-identification]]
                policy: !KeyOf identification-always-runs
                order: 0
              attrs:
                enabled: true
                # Run the stage even if the expression somehow fails to
                # evaluate. A skipped identification stage is the bug this
                # whole entry exists to prevent.
                failure_result: true
  data:
    - secretKey: rawClientID
      remoteRef:
        key: GoogleOauthClient
        property: GoogleOauthClientId.txt
    - secretKey: rawClientSecret
      remoteRef:
        key: GoogleOauthClient
        property: GoogleOauthSecretId.txt
