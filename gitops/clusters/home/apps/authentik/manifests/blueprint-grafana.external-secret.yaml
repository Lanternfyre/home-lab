# A1 -- the authentik OIDC provider + application for Grafana.
#
# A SEPARATE blueprint Secret from the Google source on purpose: each
# ExternalSecret uses creationPolicy Owner and rewrites its whole target, so two
# of them writing one Secret would strip each other's keys on every refresh.
# One Secret per blueprint, each listed in chart-values `blueprints.secrets`.
#
# The client secret is read back out of the authentik namespace through the
# authentik-oidc store -- the same Secret Grafana reads -- so the two sides
# cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-grafana
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-grafana
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        grafana.yaml: |
          version: 1
          metadata:
            name: grafana-oidc
          entries:
            - id: grafana-provider
              model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: grafana
              attrs:
                name: grafana
                client_type: confidential
                # ⚠️ REQUIRED. `grant_types` defaults to an EMPTY list in
                # authentik 2026.x, which permits nothing -- every authorize
                # request is rejected with "Invalid grant_type for provider"
                # and the browser lands on the callback with
                # error=invalid_request. Not setting it is not a default; it
                # is a deny-all.
                grant_types:
                  - authorization_code
                  - refresh_token
                client_id: "{{ .client_id }}"
                client_secret: "{{ .client_secret }}"
                # Flow slugs verified against the live instance -- note the
                # invalidation flow carries a `-flow` suffix and the
                # authorization one does not.
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                sub_mode: user_email
                redirect_uris:
                  - matching_mode: strict
                    url: https://grafana.lab.techyon.dev/login/generic_oauth
                # `profile` is what carries the groups claim Grafana maps roles
                # from -- confirmed by reading the mapping's own expression.
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - model: authentik_core.application
              identifiers:
                slug: grafana
              attrs:
                name: Grafana
                provider: !KeyOf grafana-provider
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-grafana
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc-grafana
        property: client_secret
