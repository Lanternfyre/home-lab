# AUTHENTIK_SECRET_KEY signs sessions and tokens. It is generated in-cluster
# rather than stored in 1Password: it is not a credential anyone types, nothing
# outside this namespace needs it, and generating it means there is no new
# secret for a human to mint, hold or rotate.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-secret-key
  namespace: authentik
spec:
  length: 64
  digits: 10
  symbols: 0
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
---
# Authentik's two credentials, in ONE ExternalSecret on purpose.
#
# ⚠️ Do NOT split these into two ExternalSecrets pointing at the same target.
# `creationPolicy: Owner` rewrites the whole Secret from its own template, so an
# Owner + Merge pair would silently strip the other's key on every refresh.
#
# ⚠️ refreshInterval: 0 is load-bearing. A generator produces a NEW value on
# every reconcile; "0" means reconcile once, so the signing key is stable.
# Without it, every ESO refresh would log every user out.
#
# Consequence: the postgres password is also read only once. If it is ever
# rotated in 1Password, delete this ExternalSecret to force a re-read -- a new
# signing key is generated at the same time, which invalidates sessions but
# loses no stored data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-env
  namespace: authentik
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: authentik-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Reuses the shared `PostgresHA` item, exactly as pg-role-reportportal
        # does -- the managed role `authentik` is created from the same string,
        # so the role and the client cannot drift apart.
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .password }}"
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: password
      remoteRef:
        key: PostgresHA
        property: password
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-secret-key
      rewrite:
        - regexp:
            source: "password"
            target: "secret_key"
