# The identity the NetBird reconciler authenticates as.
#
# 🔴 WHY A SERVICE ACCOUNT AND NOT A NETBIRD PAT.
#
# A NetBird personal access token belongs to a NetBird ACCOUNT, and the account
# is created by whoever authenticates first. Wipe the management PVC and the PAT
# is dead -- which defeats the entire purpose, because "rebuild from git and it
# works" is the requirement. This credential lives in authentik and 1Password,
# both of which outlive any NetBird datastore, so a rebuilt NetBird accepts it
# on the first call.
#
# ── How the token is obtained, and why no second provider was needed ────────
#
# authentik's client_credentials handler takes a USERNAME/PASSWORD branch
# BEFORE it looks at client_secret -- providers/oauth2/token/client_credentials.py:
#
#   # authentik-custom-ish client credentials flow
#   if request.POST.get("username", "") != "":
#       return self.post_init_client_credentials_creds(
#           request, request.POST.get("username"), request.POST.get("password"))
#
# so the EXISTING public `netbird` provider mints the token:
#
#   POST https://authentik.techyon.dev/application/o/token/
#     grant_type=client_credentials
#     client_id=netbird
#     username=netbird-reconciler
#     password=<the app-password token below>
#     scope=openid profile email
#
# ⚠️ That matters for a reason that is easy to miss. NetBird validates the
# token's ISSUER against a single configured value
# (https://authentik.techyon.dev/application/o/netbird/) and its AUDIENCE
# against `netbird`. A second authentik provider would issue under
# .../application/o/<its-own-slug>/ and be REJECTED -- and "fixing" that by
# switching both providers to a global issuer would change the issuer of the
# working dashboard login. Reusing this provider avoids the whole problem.
#
# ⚠️ The password MUST be a Token with intent `app_password` belonging to this
# user -- `Token.objects.filter(key=password, intent=INTENT_APP_PASSWORD,
# user=user)`. A plain API token has the wrong intent and fails as
# `invalid_grant`, which is indistinguishable from a wrong password.
#
# ⚠️ The provider's APPLICATION policies are enforced on this path
# (check_policy_access), so a policy binding that excludes service accounts
# would break the reconciler while leaving human login working.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-netbird-reconciler
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-netbird-reconciler
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        netbird-reconciler.yaml: |
          version: 1
          metadata:
            name: netbird-reconciler-identity
          entries:
            - id: netbird-reconciler-user
              model: authentik_core.user
              identifiers:
                username: netbird-reconciler
              attrs:
                name: NetBird Reconciler
                # 🔴 `service_account`, NOT `internal_service_account`.
                #
                # authentik RESERVES the internal variant for outposts and
                # refuses to create one through the API or a blueprint:
                #
                #   Entry invalid: Serializer errors
                #   {'type': ["Can't create internal service accounts"]}
                #
                # ⚠️ That refusal is INVISIBLE unless you go looking. The
                # blueprint file is discovered, an instance is created, the
                # apply task runs and finishes with `exc: null` -- the only
                # trace is `status: error` on the BlueprintInstance row. The
                # worker log instead shows an unrelated IntegrityError from two
                # discovery passes racing, which is harmless and looks like the
                # cause. To read the real reason:
                #
                #   kubectl -n authentik exec deploy/authentik-worker -- ak shell -c "
                #     from authentik.blueprints.models import BlueprintInstance
                #     from authentik.blueprints.v1.importer import Importer
                #     b = BlueprintInstance.objects.get(name='netbird-reconciler-identity')
                #     print(Importer.from_string(b.retrieve(), b.context).validate())"
                #
                # ⚠️ It must be run on the WORKER. Blueprints are mounted there
                # only, so the same command on the server fails with
                # `BlueprintRetrievalFailed: No such file or directory` and
                # looks like a missing mount.
                #
                # This account still has NO email, which is why the
                # account-routing claims in blueprint-netbird are hardcoded
                # rather than derived from one.
                type: service_account
                is_active: true
                path: goauthentik.io/service-accounts
            - id: netbird-reconciler-token
              model: authentik_core.token
              identifiers:
                identifier: netbird-reconciler-app-password
              attrs:
                user: !KeyOf netbird-reconciler-user
                # 🔴 app_password, NOT api. See the header.
                intent: app_password
                expiring: false
                description: "client_credentials password for the NetBird reconciler"
                key: "{{ .reconcilerToken }}"
  data:
    - secretKey: reconcilerToken
      remoteRef:
        key: netbird
        property: reconciler-token
