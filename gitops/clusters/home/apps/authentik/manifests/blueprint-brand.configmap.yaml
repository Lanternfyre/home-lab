# The look of every authentik login page, as code.
#
# ── Why a ConfigMap and not an ExternalSecret ───────────────────────────────
# Every other blueprint here is an ExternalSecret because it carries an OIDC
# client secret. This one carries no secret at all -- it is a title and a
# stylesheet. Routing it through External Secrets would hide the CSS behind a
# secret store for no benefit and make it unreadable in review. The chart
# mounts `blueprints.configMaps` exactly like `blueprints.secrets` (both
# confirmed in the 2026.8.0 values), so nothing else differs.
#
# ⚠️ Only keys ending `.yaml` are discovered, and only the WORKER mounts them.
#
# ── It UPDATES the existing brand, it does not add one ──────────────────────
# Checked against the live instance before writing: there is exactly ONE brand,
# `authentik-default`, `default: true`, with an empty custom CSS field.
# `identifiers.domain` below matches it, so this blueprint takes ownership of
# that row. Using any other domain would create a SECOND brand that never
# matches a request, and the login page would look untouched with the blueprint
# reporting success.
#
# ── Field names are from the live model, not from the docs ──────────────────
# The documentation lists UI labels ("Custom CSS"), not API fields. These came
# from `Brand._meta.get_fields()` on the running 2026.8.0 instance:
#   branding_title, branding_custom_css, branding_logo, branding_favicon,
#   branding_default_flow_background
# A misspelled attr does not fail loudly -- the blueprint applies and the
# setting simply is not there.
#
# ── How to iterate ──────────────────────────────────────────────────────────
# Edit the CSS below, commit, let ArgoCD sync; the worker re-applies the
# blueprint within its discovery interval. Then hard-reload the login page --
# the CSS is adopted into each component's shadow root and is cached hard.
#
#   kubectl -n authentik logs deploy/authentik-worker | grep -i blueprint
#
# ⚠️ Editing the brand in the admin UI is NOT the way. The blueprint reasserts
# on every apply and will silently revert it -- the same "I changed it and it
# went back" trap as patching a chart-managed resource.
#
# ── How this CSS actually reaches the page ──────────────────────────────────
# Verified by rendering the live page in a headless browser, not assumed.
# `branding_custom_css` is emitted TWICE: once as `<style data-id="brand-css">`
# in <head>, and once as a constructed stylesheet pushed onto
# `adoptedStyleSheets` of every authentik web component's shadow root. Three
# consequences drive everything below:
#
#   1. Adopted sheets come LAST in the cascade, so these rules beat authentik's
#      own component styles on a specificity tie. No `!important` is needed.
#   2. Selectors must be written for the shadow root they land in -- there is
#      no document-wide tree. `.pf-c-login__footer .pf-c-list` cannot work: the
#      footer is in <ak-flow-executor>'s shadow root and the list is slotted
#      light DOM. Each is styled where it actually lives.
#   3. The <head> copy is the only one that is document-scoped, which is what
#      makes @font-face and the `body::before` rule below work at all.
#
# The class names are PatternFly 4 (`.pf-c-*`) as rendered by 2026.8.0, read
# off the live DOM. If an upgrade moves to `.pf-v5-c-*` this file goes inert
# and the page falls back to stock authentik -- it will look wrong, not break.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-brand
  namespace: authentik
data:
  brand.yaml: |
    version: 1
    metadata:
      name: brand-lanternfyre
    entries:
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          branding_title: "Lanternfyre"

          # ⚠️ `branding_default_flow_background` is NOT set here. The
          # obvious move -- blanking it so the stock mountain photo stops
          # being referenced -- is rejected by the serializer:
          #   Serializer errors {'branding_default_flow_background':
          #     [ErrorDetail(string='This field may not be blank.')]}
          # and a rejected entry fails the WHOLE blueprint, taking the theme
          # with it. The photo is removed in CSS instead; see body::before.

          # ── The theme ───────────────────────────────────────────────────
          # Every colour worth changing is a variable at the top; the rules
          # below only reference those. Restyling means editing the block, not
          # hunting through selectors.
          branding_custom_css: |
            /* Manrope for UI, Lora for the headline -- the two faces the
               design calls for. These are the `latin` subsets Google Fonts
               serves today; Manrope is a variable font, hence one @font-face
               for the whole weight range. The fonts are fetched by the
               VISITOR'S browser, not by the pod, so the authentik egress
               policy is not involved. A client with no route to
               fonts.gstatic.com falls back to the stacks below and the page
               is still correct, just less distinctive. */
            @font-face {
              font-family: 'Manrope';
              font-style: normal;
              font-weight: 200 800;
              font-display: swap;
              src: url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggexSg.woff2) format('woff2');
            }
            @font-face {
              font-family: 'Lora';
              font-style: normal;
              font-weight: 400 700;
              font-display: swap;
              src: url(https://fonts.gstatic.com/s/lora/v37/0QI6MX1D_JOuGQbT0gvTJPa787zAvBJBkq0.woff2) format('woff2');
            }

            :host,
            :root {
              --lf-bg:      #2a1e3f;  /* the plum field behind the card */
              --lf-card:    #f4ecf1;  /* the card itself                */
              --lf-ink:     #2b2038;  /* body text on the card          */
              --lf-muted:   #6f6280;  /* subtitle, placeholder          */
              --lf-label:   #4a3d5c;  /* field labels                   */
              --lf-line:    #d9c9d8;  /* input + secondary button edge  */
              --lf-rule:    #e3d6e2;  /* the "or" divider               */
              --lf-accent:  #e0862e;  /* focus ring, button base        */
              --lf-onbg:    #e9dcf0;  /* text ON the plum field         */
              --lf-radius:  24px;

              --ak-sans: Manrope, "Helvetica Neue", Arial, sans-serif;
              --pf-global--FontFamily--sans-serif: var(--ak-sans);
              --pf-global--FontFamily--redhat-updated--sans-serif: var(--ak-sans);
              --pf-global--FontFamily--heading--sans-serif: var(--ak-sans);
            }

            :host,
            .pf-c-login,
            .pf-c-form,
            .pf-c-button,
            .pf-c-form-control { font-family: var(--ak-sans); }

            /* ── The field behind the card ─────────────────────────────── */
            .pf-c-login {
              min-height: 100vh;
              color: var(--lf-ink);
              background-color: var(--lf-bg);
              background-image:
                radial-gradient(70% 55% at 50% 100%, rgba(240, 150, 60, .35), transparent 70%),
                radial-gradient(50% 40% at 50%   0%, rgba(150, 120, 200, .25), transparent 70%);
            }

            /* ⚠️ This one line is what removes the stock mountain photo,
               and there is no other way to do it. The photo is painted by
               `body::before`, not by any class. Overriding
               --ak-global--background-image does not reach it: a second
               <style> sets that variable on :root AFTER this stylesheet, so
               it wins. And the brand field that would stop the image being
               referenced at all cannot be blanked (see the note on
               branding_default_flow_background above). So: the document-scoped
               copy of this CSS blanks the pseudo-element. Verified by
               rendering -- with this rule the photo is gone, without it the
               plum gradient never shows. */
            body::before { background-image: none; }

            /* ── Wordmark, top left ────────────────────────────────────── */
            /* ⚠️ <ak-locale-select> is a SIBLING of the header, not a child of
               it -- it is the first cell of the .pf-c-login grid, which is why
               it sits top-left and no amount of alignment on the header moves
               it. Lifted out of flow and pinned top-right so the wordmark has
               the corner the design gives it. */
            .pf-c-login { position: relative; }
            /* `left: auto` is not redundant: authentik already pins this to
               `left: 16px`, and setting only `right` leaves BOTH edges bound,
               which stretches the element across the page and parks its
               content back on the left. */
            .pf-c-login ak-locale-select {
              position: absolute;
              top: 20px;
              left: auto;
              right: 44px;
              z-index: 1;
            }

            .pf-c-login__header {
              position: relative;
              display: flex;
              justify-content: flex-end;
              align-items: center;
              padding-inline: 56px;
              min-height: 44px;
            }
            .pf-c-login__header::before {
              content: "Lanternfyre";
              position: absolute;
              left: 56px;
              top: 50%;
              transform: translateY(-50%);
              font-family: Lora, Georgia, serif;
              font-size: 20px;
              font-weight: 600;
              letter-spacing: .02em;
              color: var(--lf-onbg);
            }

            /* ── The card ──────────────────────────────────────────────── */
            .pf-c-login__main {
              max-width: 460px;
              margin: 0 auto;
              background: var(--lf-card);
              border: none;
              border-radius: var(--lf-radius);
              box-shadow: 0 30px 80px rgba(20, 10, 40, .5),
                          0 0 0 1px rgba(255, 255, 255, .08);
              padding-bottom: 12px;
              overflow: hidden;
            }
            .pf-c-login__main-header,
            .pf-c-login__main-body,
            .pf-c-login__main-footer { background: transparent; }

            /* ── The mark ──────────────────────────────────────────────── */
            /* ⚠️ This is drawn in CSS instead of being set as the brand's
               logo, and that is not a stylistic choice -- `branding_logo`
               REFUSES anything but a bare file path:
                 ErrorDetail('File name can only contain letters (a-z, A-Z),
                 numbers (0-9), dots (.), hyphens (-), underscores (_),
                 forward slashes (/), and the placeholder %(theme)s')
               which rules out both a `data:` URI and an https:// URL. The only
               paths it would accept are inside the container image or the
               media volume, i.e. not in git. So the stock authentik wordmark
               is hidden and the Lanternfyre mark is painted as a background on
               the header that held it. The same restriction applies to
               `branding_favicon`, and CSS cannot reach a favicon -- the browser
               tab therefore keeps authentik's icon. That is the one piece of
               the design this file cannot deliver.
               Source: the Lanternfyre org avatar,
               https://avatars.githubusercontent.com/u/270296815 -- inlined so
               the login page makes no third-party request and the mark cannot
               rot when the avatar is changed. Re-encoded to 192px WebP, which
               is what keeps it to 13 KB rather than 69 KB of PNG. To replace:
                 magick new.png -resize 192x192 -quality 88 new.webp
                 printf 'data:image/webp;base64,%s' "$(base64 -w0 new.webp)" */
            .pf-c-login__main-header.pf-c-brand {
              justify-content: center;
              padding: 40px 44px 4px;
            }
            /* Qualified by the header, not bare: `img.branding-logo` alone
               loses to authentik's own rule and the stock wordmark keeps
               rendering next to the mark. */
            .pf-c-login__main-header.pf-c-brand img.branding-logo {
              display: none;
            }
            .pf-c-login__main-header.pf-c-brand::before {
              content: "";
              display: block;
              width: 96px;
              height: 96px;
              border-radius: 50%;
              box-shadow: 0 8px 24px rgba(60, 30, 90, .25);
              background-size: cover;
              background-position: center;
              background-image: url("data:image/webp;base64,");
            }

            /* ── Headline and subtitle ─────────────────────────────────── */
            /* This header is `display: grid` in stock authentik, which lays
               the title and the pseudo-element out side by side. Block, so
               they stack. */
            .pf-c-login__main-header:has(.pf-c-title) {
              display: block;
              text-align: center;
              padding: 4px 44px 0;
            }
            .pf-c-title.pf-m-3xl {
              font-family: Lora, Georgia, serif;
              font-size: 30px;
              font-weight: 600;
              letter-spacing: -.01em;
              color: var(--lf-ink);
            }
            /* authentik renders no subtitle element, so there is nothing to
               restyle -- it is drawn. Decorative only; the headline itself
               stays a real <h1> set from the flow.
               ⚠️ The wording is deliberately NOT "Sign in to your Lanternfyre
               account", which is what the design asks for. This header lives
               in <ak-flow-card>, which every stage of every flow reuses, and
               its host carries no attribute naming the stage -- so this line
               also appears under "Authorize Application" on the OIDC consent
               screen that Grafana and ArgoCD users see, under the MFA prompt,
               and under password recovery. There is no CSS hook to scope it
               to the login screen, so it has to read true on all of them. */
            .pf-c-login__main-header:has(.pf-c-title)::after {
              content: "Lanternfyre single sign-on";
              display: block;
              margin-top: 6px;
              font-size: 15px;
              font-weight: 400;
              color: var(--lf-muted);
            }

            /* ── Form ──────────────────────────────────────────────────── */
            /* Both the body and the footer are given the card's inset --
               the footer needs it too, or the "or" rule below spans the full
               card width and runs out past the buttons it divides. */
            .pf-c-login__main-body   { padding: 8px 44px 0; }
            .pf-c-login__main-footer { padding: 0 44px 8px; }
            .pf-c-form__label .pf-c-form__label-text {
              font-size: 13px;
              font-weight: 600;
              color: var(--lf-label);
            }
            /* ⚠️ Not redundant. The card is cream in BOTH viewer themes, so
               its text must stay dark -- but when the visitor's OS is in dark
               mode authentik stamps theme="dark" on the stage host and a
               :host([theme="dark"]) rule repaints this label near-white. Being
               adopted last is not enough against it; only the matching host
               qualifier outranks it. Everything else on the card already
               carries the specificity to survive dark mode -- verified by
               rendering with prefers-color-scheme: dark, which is the only way
               to catch this: the light render looks perfect either way. */
            :host([theme="dark"]) .pf-c-form__label .pf-c-form__label-text {
              color: var(--lf-label);
            }
            /* ⚠️ `input`, not a bare class. This stylesheet is adopted into
               EVERY authentik surface, admin UI included, and
               `.pf-c-form-control` is also worn by <textarea> and <select> --
               a bare rule would give every expression-policy editor a 48px
               tall textarea. Colour and radius are safe to share; a fixed
               height is not. */
            .pf-c-form-control {
              background: #fff;
              border: 1px solid var(--lf-line);
              border-radius: 12px;
              color: var(--lf-ink);
            }
            input.pf-c-form-control {
              height: 48px;
              padding: 0 14px;
              font-size: 15px;
            }
            .pf-c-form-control::placeholder { color: var(--lf-muted); opacity: .55; }
            .pf-c-form-control:focus {
              border-color: var(--lf-accent);
              box-shadow: 0 0 0 3px rgba(224, 134, 46, .22);
              outline: none;
            }
            .pf-c-form__group.pf-m-action { margin-top: 8px; }

            /* ── Buttons ───────────────────────────────────────────────── */
            .pf-c-button.pf-m-primary {
              height: 50px;
              border: 0;
              border-radius: 12px;
              background: linear-gradient(180deg, #f0a23a, #dd6a22);
              color: #2b1a10;
              font-size: 15px;
              font-weight: 700;
              box-shadow: 0 8px 20px rgba(224, 134, 46, .35);
              transition: filter 120ms ease, transform 120ms ease;
            }
            .pf-c-button.pf-m-primary:hover  { filter: brightness(1.05); }
            .pf-c-button.pf-m-primary:active { transform: translateY(1px); }
            .pf-c-button.pf-m-link { color: #b5541c; font-weight: 600; }

            /* ⚠️ The identity-source buttons ("Continue with Google") are
               rendered `pf-m-primary` too -- stock authentik gives the
               federated login the same weight as the password submit. They
               must read as the second choice, so this rule needs the extra
               class to outrank the block above. */
            .pf-c-button.pf-m-primary.source-button {
              height: 46px;
              background: #fff;
              border: 1px solid var(--lf-line);
              color: var(--lf-ink);
              font-size: 14px;
              font-weight: 600;
              box-shadow: none;
            }
            .pf-c-button.pf-m-primary.source-button:hover {
              border-color: #b9a5c0;
              filter: none;
            }

            /* The "or" rule above them. Drawn with both pseudo-elements --
               the line and the label -- because a border on the fieldset is
               overridden by a logical-property rule further up authentik's
               own cascade. */
            /* Qualified by :has() so the divider is drawn only for a fieldset
               that actually contains identity-source buttons -- the class
               itself is generic and this stylesheet reaches every flow. */
            .ak-c-fieldset:has(.source-button) {
              position: relative;
              border: 0;
              margin: 14px 0 0;
              padding: 26px 0 0;
            }
            .ak-c-fieldset:has(.source-button)::after {
              content: "";
              position: absolute;
              top: 10px;
              left: 0;
              right: 0;
              height: 1px;
              background: var(--lf-rule);
            }
            .ak-c-fieldset:has(.source-button)::before {
              content: "or";
              position: absolute;
              top: 10px;
              left: 50%;
              transform: translate(-50%, -50%);
              padding: 0 12px;
              background: var(--lf-card);
              color: #a496ad;
              font-size: 12px;
              z-index: 1;
            }

            /* ── Phones ────────────────────────────────────────────────── */
            /* The desktop gutters (56px) plus a 460px card overflow a 390px
               viewport -- the card's rounded corners get cut off at both
               edges. The wordmark goes with them: at this width the language
               picker is already pinned into the same corner, and the mark and
               title inside the card carry the branding perfectly well. */
            @media (max-width: 600px) {
              .pf-c-login ak-locale-select { top: 12px; right: 16px; }
              .pf-c-login__header::before { display: none; }
              .pf-c-login__header { padding-inline: 16px; }
              .pf-c-login__footer.pf-m-dark { padding-inline: 24px; }
              .pf-c-login__main { margin: 0 16px; }
              .pf-c-login__main-header.pf-c-brand { padding: 28px 24px 4px; }
              .pf-c-login__main-header:has(.pf-c-title) { padding-inline: 24px; }
              .pf-c-login__main-body   { padding-inline: 24px; }
              .pf-c-login__main-footer { padding-inline: 24px; }
            }

            /* ── Footer ────────────────────────────────────────────────── */
            /* Two halves in two trees: the <footer> is in the flow executor's
               shadow root, the <ul> inside it is slotted LIGHT DOM and so is
               reached by the document-scoped copy of this stylesheet. Hence
               two rules that look like they should be one. */
            .pf-c-login__footer.pf-m-dark {
              display: flex;
              justify-content: flex-start;
              align-items: flex-start;
              text-align: left;
              padding-inline: 56px;
            }
            /* The <ul> is a grid that centres its items; flex is what makes
               `justify-content` actually pull them to the start. */
            ak-brand-links .pf-c-list.pf-m-inline {
              display: flex;
              justify-content: flex-start;
              margin: 0;
            }
            ak-brand-links .pf-c-list.pf-m-inline,
            ak-brand-links .pf-c-list.pf-m-inline li,
            ak-brand-links .pf-c-list.pf-m-inline a {
              font-size: 12px;
              font-weight: 600;
              letter-spacing: .08em;
              text-transform: uppercase;
              color: rgba(233, 220, 240, .55);
              text-decoration: none;
            }

      # ── The headline is a FLOW field, not a brand field ────────────────
      # "Welcome to authentik!" is `title` on the default authentication flow.
      # Setting it here keeps it a real, translatable <h1> rather than CSS
      # `content:` text.
      #
      # ⚠️ authentik's own system blueprint
      # (/blueprints/default/flow-default-authentication-flow.yaml) also sets
      # this title, and re-imports itself when the file hash changes -- i.e.
      # on an authentik UPGRADE. When that happens the headline reverts to
      # "Welcome to authentik!" and STAYS reverted, because this blueprint is
      # only re-imported when ITS content changes. There is no fight, no flap;
      # it just quietly goes back. To detect and fix:
      #
      #   kubectl -n authentik exec deploy/authentik-server -- ak shell -c \
      #     "from authentik.flows.models import Flow; \
      #      print(Flow.objects.get(slug='default-authentication-flow').title)"
      #
      # and if it reads "Welcome to authentik!", change anything in this file
      # (a comment will do) and let ArgoCD re-sync.
      - model: authentik_flows.flow
        identifiers:
          slug: default-authentication-flow
        attrs:
          title: "Light the way in"
