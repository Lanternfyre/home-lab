# A5 -- the authentik client for the EDGE GATE.
#
# One provider for the whole `homelab-gated` Gateway. The SecurityPolicy omits
# redirectURL so Envoy derives %REQ(:authority)%/oauth2/callback per host, which
# is what lets one policy serve every hostname -- so every hostname behind the
# gate needs its redirect URI listed here, exactly, or that host fails with
# redirect_uri_mismatch while the others keep working.
#
# ⚠️ This list must be kept in step with the routes attached to homelab-gated.
# Adding an app to the gate without adding its URI here breaks only that app,
# which makes it easy to miss.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-envoy-gateway
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-envoy-gateway
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        envoy-gateway.yaml: |
          version: 1
          metadata:
            name: envoy-gateway-oidc
          entries:
            - id: envoy-gateway-provider
              model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: envoy-gateway
              attrs:
                name: envoy-gateway
                client_type: confidential
                # ⚠️ REQUIRED. `grant_types` defaults to an EMPTY list in
                # authentik 2026.x, which permits nothing -- every authorize
                # request is rejected with "Invalid grant_type for provider"
                # and the browser lands on the callback with
                # error=invalid_request. Not setting it is not a default; it
                # is a deny-all.
                grant_types:
                  - authorization_code
                  - refresh_token
                client_id: "{{ .client_id }}"
                client_secret: "{{ .client_secret }}"
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                sub_mode: user_email
                # The edge reads `groups` out of the ID TOKEN, so the claims must
                # be embedded there rather than left to the userinfo endpoint.
                include_claims_in_id_token: true
                redirect_uris:
                  - matching_mode: strict
                    url: https://goldilocks.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://headlamp.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://home.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://prometheus.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://pyroscope.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://opensearch.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://rabbitmq.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://reports.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://silo.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://pihole.lab.techyon.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://grafana.lab.techyon.dev/oauth2/callback
                # `profile` is what carries `groups`, which the SecurityPolicy's
                # authorization rule matches on. Dropping it would leave the rule
                # matching nothing and, with defaultAction Deny, 403 everything.
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - model: authentik_core.application
              identifiers:
                slug: envoy-gateway
              attrs:
                name: Homelab Edge Gate
                provider: !KeyOf envoy-gateway-provider
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-envoy-gateway
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc-envoy-gateway
        property: client_secret
