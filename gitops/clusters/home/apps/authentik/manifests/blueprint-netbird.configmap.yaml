# The authentik OIDC provider + application for NetBird.
#
# ── A ConfigMap, not an ExternalSecret, because there IS no secret ──────────
#
# blueprint-argocd is an ExternalSecret because argocd's is a CONFIDENTIAL
# client and its `client_secret` must come from 1Password. NetBird's is a PUBLIC
# client: a browser SPA and a CLI cannot keep a secret, so PKCE is used instead
# and no secret exists to protect.
#
# `client_id` is therefore just an identifier -- a name this cluster chooses,
# not something issued by Google or by authentik. It is public by construction:
# it ships inside the dashboard's JavaScript. Putting it in 1Password would be
# storing a non-secret in a vault and adding a manual step for nothing.
#
# Same discovery rules as every other blueprint: mounted from a ConfigMap named
# in authentik's `blueprints.configMaps`, `.yaml` keys only, worker-mounted
# only. ⚠️ A blueprint not listed there is never mounted and never applied --
# it looks committed and does nothing.
#
# ── Why NetBird cannot reuse an existing client ─────────────────────────────
#
# 1. 🔴 DIFFERENT ISSUER. authentik derives its issuer from the REQUEST HOST
#    (EDGE-NODE.md finding 12). Every existing client is reached through
#    `authentik.lab.techyon.dev` and the Envoy gates pin that issuer. A NetBird
#    client enrolling from the internet can only reach `authentik.techyon.dev`,
#    which mints a DIFFERENT issuer. That doc's rule is explicit: "No client may
#    be reachable through both."
# 2. DIFFERENT GRANT TYPES. The CLI enrols by DEVICE CODE. `grant_types`
#    defaults to an empty list which permits nothing, so adding device_code to
#    the argocd or envoy-gateway provider would widen what those clients can do.
# 3. DIFFERENT CLIENT TYPE. Public/PKCE here; argocd's is confidential.
#
# To add another client later: copy this file, change the names, and add it to
# `blueprints.configMaps` (or `.secrets`, if it needs a client_secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-netbird
  namespace: authentik
data:
  netbird.yaml: |
    version: 1
    metadata:
      name: netbird-oidc
    entries:
      # ── The claims that put a token in the RIGHT NetBird account ──────────
      #
      # 🔴 NETBIRD DOES NOT INFER THE ACCOUNT. IT READS THESE CLAIMS, AND
      # WITHOUT THEM AN IDENTITY LANDS IN AN ACCOUNT OF ITS OWN.
      #
      # Read from the source, shared/auth/jwt/extractor.go at v0.78.1:
      #
      #   DomainIDSuffix       = "wt_account_domain"
      #   DomainCategorySuffix = "wt_account_domain_category"
      #   claim name = url.JoinPath(audience, suffix) -> "netbird/wt_..."
      #
      # management/server/account.go then routes on them: a PRIVATE-category
      # domain matching an existing account joins THAT account
      # (addNewUserToDomainAccount); anything else falls through to
      # GetAccountIDByUserID and gets one of its own. These two claims are the
      # difference between the reconciler administering YOUR NetBird account
      # and it quietly building a parallel empty one.
      #
      # ⚠️ scope_name IS `profile`, NOT a scope of its own. authentik emits a
      # ScopeMapping's claims only when the client REQUESTS that scope, and
      # neither the dashboard nor `netbird up` can be made to ask for a custom
      # one -- both request "openid profile email offline_access". Several
      # mappings may share a scope; their claims merge.
      - id: netbird-account-claims
        model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: netbird-account-claims
        attrs:
          scope_name: profile
          description: "NetBird account routing claims (domain + category)"
          expression: |
            # techyon.dev is the NetBird account's private domain. Hardcoded
            # rather than derived from the user's email so the SERVICE ACCOUNT
            # -- which has no email -- lands in the same account as the humans.
            return {
                "netbird/wt_account_domain": "techyon.dev",
                "netbird/wt_account_domain_category": "private",
            }
      - id: netbird-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: netbird
        attrs:
          name: netbird
          client_type: public
          client_id: netbird
          # 🔴 device_code IS THE ONE THAT MATTERS. The NetBird CLI enrols by
          # device authorization, not a browser redirect. Without it `netbird
          # up` fails while the dashboard still works, which reads like a client
          # bug rather than a provider one.
          grant_types:
            - authorization_code
            - refresh_token
            - urn:ietf:params:oauth:grant-type:device_code
            # 🔴 THE RECONCILER'S GRANT. WITHOUT IT authentik ANSWERS
            # `invalid_grant`, WHICH READS AS A BAD PASSWORD.
            #
            # authentik enforces this list -- an omitted grant is refused with
            # the generic OAuth error, the same one a wrong username or a
            # wrong-intent token produces. So the single most likely cause of
            # "the reconciler cannot authenticate" is this line missing, and
            # nothing in the message will say so.
            #
            # This does NOT make the provider confidential and does not affect
            # the dashboard or `netbird up`: authentik's client_credentials
            # handler takes a username/password branch before it looks at
            # client_secret, so a public client can still serve it.
            - client_credentials
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: user_email
          include_claims_in_id_token: true
          redirect_uris:
            # 🔴 THE DASHBOARD IS ON THE LAN NAME, NOT THE PUBLIC ONE.
            #
            # These said `vpn.techyon.dev` from when the dashboard was still
            # going to be published to the internet. It was then moved to the
            # LAN's gated Gateway and these were never updated, so the browser
            # sent redirect_uri=https://vpn.lab.techyon.dev/callback --
            # unregistered, `matching_mode: strict`, refused. The dashboard
            # renders that refusal as "There was an error logging you in.
            # Error: Unauthenticated", which names neither the URI nor the host
            # and sends you looking at tokens instead.
            #
            # ⚠️ The PUBLIC name is deliberately NOT here. Nothing is served at
            # vpn.techyon.dev/callback -- that host carries the machine-facing
            # API only, and its `/` catch-all was removed. A redirect URI for a
            # page that does not exist is a redirect target for no benefit.
            # 🔴 `/#callback`, WITH THE HASH. `/callback` MATCHES NOTHING.
            #
            # The dashboard is a HASH-ROUTED SPA. Taken from the authorize
            # request authentik rejected, not from the docs:
            #
            #   redirect_uri=https%3A%2F%2Fvpn.lab.techyon.dev%2F%23callback
            #   cause: redirect_uri_no_match          status 400
            #
            # `%2F%23` is `/#`. Confirmed independently in the image: the only
            # callback strings in the served bundle are `#callback` and
            # `#silent-callback`, and `AUTH_REDIRECT_URI` is UNSET on the pod,
            # so those defaults are what ships.
            #
            # ⚠️ A fragment in a redirect_uri is unusual -- OAuth 2.0 forbids
            # it (RFC 6749 3.1.2) -- so it looks like a typo and invites
            # "correction" to `/callback`. It is not a typo: authentik compares
            # the registered string to what the client sends, and the client
            # sends the hash. Do not tidy this.
            #
            # ⚠️ VERIFY IT SURVIVED THE BLUEPRINT, because a stripped fragment
            # would silently reproduce this exact 400:
            #   ak shell -c "from authentik.providers.oauth2.models import \
            #     OAuth2Provider as P; print([r.url for r in \
            #     P.objects.get(client_id='netbird').redirect_uris])"
            # must print the `/#callback` forms.
            - matching_mode: strict
              url: https://vpn.lab.techyon.dev/#callback
            - matching_mode: strict
              url: https://vpn.lab.techyon.dev/#silent-callback
            # ── The desktop/CLI client's local callback ────────────────
            #
            # 🔴 THESE MUST MATCH `PKCEAuthorizationFlow.RedirectURLs` IN
            # apps/netbird/chart-values.yaml BYTE FOR BYTE. THERE IS NO PATH.
            #
            # Read from the client, not guessed -- netbird
            # client/internal/auth/pkce_flow.go:49-67 walks `RedirectURLs`,
            # takes the first whose port is free, and assigns it to
            # `oauth2.Config.RedirectURL` UNCHANGED. So the client sends
            # `http://localhost:53000` exactly, with no `/callback` suffix.
            # An entry carrying a path matches nothing and `netbird up` dies on
            # the same "Redirect URI Error" page the dashboard gave.
            #
            # ⚠️ WHY STRICT AND NOT REGEX, having just written one.
            #
            # authentik's `cors_allow` (providers/oauth2/utils.py:52)
            # `urlparse()`s EVERY redirect URI on the provider -- regex entries
            # included, unparsed -- to decide which origins may call the OIDC
            # endpoints. A `[` in the netloc is read as the start of a
            # bracketed IPv6 literal and raises, on authentik's Python 3.14.7:
            #
            #   ValueError: Invalid IPv6 URL
            #
            # It escapes before any header is written, so the endpoint returns
            # 200 with NO Origin header and 500 WITH one. The browser reports
            # only "No 'Access-Control-Allow-Origin' header is present", which
            # reads like an authentik CORS setting and is really a traceback in
            # a regex belonging to the CLI. One regex written for the desktop
            # client took out the DASHBOARD's browser login, and every other
            # OIDC endpoint on the provider with it.
            #
            # ⚠️ THE ASYMMETRY IS THE DIAGNOSTIC. Any OIDC endpoint that
            # answers cleanly by curl and fails from a browser: re-request it
            # with `-H "Origin: <the SPA's origin>"` BEFORE suspecting CORS
            # configuration. A 500 there is a crash, not a policy.
            #
            # Enumerating the ports strictly keeps the provider regex-free, so
            # this cannot recur. Two ports because ONE means `netbird up` fails
            # with "no available port found" if something else holds 53000.
            - matching_mode: strict
              url: http://localhost:53000
            - matching_mode: strict
              url: http://localhost:54000
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
            # Defined ABOVE in this file and referenced by !KeyOf: `!Find`
            # returns None silently, and a None here drops the account claims
            # with no error at all.
            - !KeyOf netbird-account-claims
      - model: authentik_core.application
        identifiers:
          slug: netbird
        attrs:
          name: NetBird
          provider: !KeyOf netbird-provider
