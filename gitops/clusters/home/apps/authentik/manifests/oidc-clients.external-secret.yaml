# Per-application OIDC client secrets, generated in-cluster.
#
# Each authentik integration needs a client secret known to BOTH sides: the
# blueprint that creates the provider here, and the consumer in its own
# namespace. Rather than minting one credential per app by hand, the secret is
# generated here and read from the consumer's namespace through the
# `authentik-oidc` ClusterSecretStore (see eso-oidc-reader.rbac.yaml).
#
# ⚠️ refreshInterval "0" is load-bearing. A generator emits a NEW value on every
# reconcile; "0" means reconcile once, so the secret is stable. Without it the
# provider and the consumer would silently drift apart on the next refresh and
# every login would fail with invalid_client.
#
# The client_id is not secret and is a fixed string; only the secret is
# generated. Both live in one Secret so the pair can never be half-copied.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: oidc-client-secret
  namespace: authentik
spec:
  length: 64
  digits: 10
  symbols: 0
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-grafana
  namespace: authentik
spec:
  refreshInterval: "0"
  target:
    name: oidc-grafana
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: "grafana"
        client_secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
---
# A5 -- the edge gate itself. One client for the whole `homelab-gated` Gateway,
# which is what lets a single SecurityPolicy serve every hostname behind it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-envoy-gateway
  namespace: authentik
spec:
  refreshInterval: "0"
  target:
    name: oidc-envoy-gateway
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: "envoy-gateway"
        client_secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
