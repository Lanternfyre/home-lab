# A6 -- the authentik client for KUBERNETES itself.
#
# Shared by three consumers on purpose: Headlamp, kubectl via kubelogin, and the
# k3s API server. The API server validates `aud` against ONE configured client
# id, so every party that mints a token the API server must accept has to use
# this same client.
#
# ⚠️ THREE redirect URIs. The Headlamp callback, plus the two localhost forms
# kubelogin may use -- it listens on 127.0.0.1:8000 but defaults its redirect to
# `http://localhost:8000`, and authentik matches strictly, so both are listed.
# Omitting them leaves the web UI working while `kubectl` cannot log in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-kubernetes
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-kubernetes
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        kubernetes.yaml: |
          version: 1
          metadata:
            name: kubernetes-oidc
          entries:
            - id: kubernetes-provider
              model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: kubernetes
              attrs:
                name: kubernetes
                client_type: confidential
                client_id: "{{ .client_id }}"
                client_secret: "{{ .client_secret }}"
                # ⚠️ REQUIRED -- defaults to an empty list, which permits nothing.
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                # ⚠️ LOAD-BEARING. k3s runs with oidc-username-claim=email, and
                # Kubernetes prefixes the username with the issuer URL for every
                # claim EXCEPT email. The existing ClusterRoleBinding grants
                # cluster-admin to the bare address adrian.jutrowski@techyon.dev,
                # so the token's email must be exactly that -- which akadmin's
                # already is. Changing this silently breaks cluster-admin.
                sub_mode: user_email
                include_claims_in_id_token: true
                redirect_uris:
                  - matching_mode: strict
                    url: https://headlamp.lab.techyon.dev/oidc-callback
                  - matching_mode: strict
                    url: http://localhost:8000
                  - matching_mode: strict
                    url: http://127.0.0.1:8000
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - model: authentik_core.application
              identifiers:
                slug: kubernetes
              attrs:
                name: Kubernetes
                provider: !KeyOf kubernetes-provider
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-kubernetes
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc-kubernetes
        property: client_secret
