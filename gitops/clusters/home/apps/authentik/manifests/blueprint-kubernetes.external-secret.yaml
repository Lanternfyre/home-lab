# A6 -- the authentik client for KUBERNETES itself.
#
# Shared by three consumers on purpose: Headlamp, kubectl via kubelogin, and the
# k3s API server. The API server validates `aud` against ONE configured client
# id, so every party that mints a token the API server must accept has to use
# this same client.
#
# ⚠️ THREE redirect URIs. The Headlamp callback, plus the two localhost forms
# kubelogin may use -- it listens on 127.0.0.1:8000 but defaults its redirect to
# `http://localhost:8000`, and authentik matches strictly, so both are listed.
# Omitting them leaves the web UI working while `kubectl` cannot log in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-kubernetes
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-kubernetes
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        kubernetes.yaml: |
          version: 1
          metadata:
            name: kubernetes-oidc
          entries:
            # 🔴 `email_verified` DECIDES WHETHER THE API SERVER ACCEPTS THE
            # TOKEN AT ALL.
            #
            # k3s runs with oidc-username-claim=email, and Kubernetes then
            # refuses any token carrying `email_verified: false` -- "oidc:
            # email not verified" in the k3s journal, a bare 401 in Headlamp
            # AFTER a login that visibly succeeded. authentik's stock `email`
            # scope mapping has emitted exactly that since before 2026.2, so
            # the API-server half of A6 never worked (found 2026-09-07).
            #
            # This mapping REPLACES the stock one on this provider. It is not
            # listed alongside it: two mappings on one scope merge in an order
            # authentik does not define, and which `email_verified` survived
            # would be luck.
            #
            # ⚠️ `True` IS DELIBERATELY NOT UNCONDITIONAL. Kubernetes checks
            # this claim because IdP users can usually edit their own email,
            # and in authentik `User.email` is neither unique nor read-only.
            # An unconditional True would let any account that can reach the
            # authorize endpoint set its email to the address the
            # ClusterRoleBinding names and become cluster-admin. So it is true
            # only for members of `authentik Admins` -- the same group the
            # edge gate authorises on -- whose addresses the operator sets.
            # Everyone else keeps `false`, the API server rejects them
            # outright, and they had no RBAC to lose.
            - id: kubernetes-email-verified
              model: authentik_providers_oauth2.scopemapping
              identifiers:
                name: kubernetes-email-verified
              attrs:
                scope_name: email
                description: "Email; verified only for authentik Admins (what the k3s API server requires)"
                expression: |
                  return {
                      "email": request.user.email,
                      "email_verified": ak_is_group_member(request.user, name="authentik Admins"),
                  }
            - id: kubernetes-provider
              model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: kubernetes
              attrs:
                name: kubernetes
                client_type: confidential
                client_id: "{{ .client_id }}"
                client_secret: "{{ .client_secret }}"
                # ⚠️ REQUIRED -- defaults to an empty list, which permits nothing.
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                # ⚠️ LOAD-BEARING. k3s runs with oidc-username-claim=email, and
                # Kubernetes prefixes the username with the issuer URL for every
                # claim EXCEPT email. The existing ClusterRoleBinding grants
                # cluster-admin to the bare address adrian.jutrowski@techyon.dev,
                # so the token's email must be exactly that -- which akadmin's
                # already is. Changing this silently breaks cluster-admin.
                sub_mode: user_email
                include_claims_in_id_token: true
                redirect_uris:
                  - matching_mode: strict
                    url: https://headlamp.lab.techyon.dev/oidc-callback
                  - matching_mode: strict
                    url: http://localhost:8000
                  - matching_mode: strict
                    url: http://127.0.0.1:8000
                # ⚠️ The stock mappings are found by their `managed` id, NOT by
                # `[scope_name, X]`: `!Find` returns the FIRST match, and both
                # `profile` (netbird's extra mapping) and now `email` (above)
                # have two mappings on the same scope. The other blueprints in
                # this directory still find by scope_name; for them a wrong
                # pick is harmless (same claims, `email_verified` true instead
                # of false) but it is a trap worth closing.
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                  - !KeyOf kubernetes-email-verified
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - model: authentik_core.application
              identifiers:
                slug: kubernetes
              attrs:
                name: Kubernetes
                provider: !KeyOf kubernetes-provider
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-kubernetes
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc-kubernetes
        property: client_secret
