# The authentik OIDC provider + application for NetBird.
#
# ── Why NetBird cannot reuse an existing client ─────────────────────────────
#
# 1. 🔴 DIFFERENT ISSUER. authentik derives its issuer from the REQUEST HOST
#    (EDGE-NODE.md finding 12). Every existing client is reached through
#    `authentik.lab.techyon.dev` and the Envoy gates pin that issuer. A NetBird
#    client enrolling from the internet can only reach `authentik.techyon.dev`,
#    which mints a DIFFERENT issuer. That doc's rule is explicit: "No client may
#    be reachable through both."
# 2. DIFFERENT GRANT TYPES. The CLI enrols by DEVICE CODE, which the existing
#    providers do not declare -- and `grant_types` "defaults to an empty list,
#    which permits nothing" (see blueprint-argocd). Adding device_code to the
#    argocd or envoy-gateway provider would widen what those clients can do.
# 3. DIFFERENT CLIENT TYPE. The dashboard is a browser SPA, so this is a PUBLIC
#    client using PKCE with no secret. argocd's is confidential. Sharing one
#    means either the SPA holds a secret it cannot keep, or argocd stops being
#    confidential.
# 4. BLAST RADIUS. One client means a token minted for either is accepted by
#    both, and rotating or revoking one affects the other.
#
# ── How to add a client in future: copy this file ───────────────────────────
# Declarative, same as blueprint-argocd. The only manual part is a 1Password
# item holding the client_id; authentik picks the blueprint up from the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-netbird
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-netbird
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        netbird.yaml: |
          version: 1
          metadata:
            name: netbird-oidc
          entries:
            - id: netbird-provider
              model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: netbird
              attrs:
                name: netbird
                # PUBLIC: a browser SPA and a CLI cannot keep a secret.
                client_type: public
                client_id: "{{ .client_id }}"
                # 🔴 device_code IS THE ONE THAT MATTERS. The NetBird CLI enrols
                # by device authorization, not a browser redirect; without it
                # `netbird up` fails and the dashboard still works, which makes
                # it look like a client problem.
                grant_types:
                  - authorization_code
                  - refresh_token
                  - urn:ietf:params:oauth:grant-type:device_code
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                sub_mode: user_email
                include_claims_in_id_token: true
                redirect_uris:
                  - matching_mode: strict
                    url: https://vpn.techyon.dev/callback
                  - matching_mode: strict
                    url: https://vpn.techyon.dev/silent-callback
                  # The desktop/CLI client's local callback.
                  - matching_mode: regex
                    url: http://localhost:[0-9]+/callback
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
            - model: authentik_core.application
              identifiers:
                slug: netbird
              attrs:
                name: NetBird
                provider: !KeyOf netbird-provider
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-netbird
        property: client_id
