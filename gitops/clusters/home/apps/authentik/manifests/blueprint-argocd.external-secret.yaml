# A3 -- the authentik OIDC provider + application for ArgoCD.
#
# ⚠️ TWO redirect URIs. The second is the localhost callback `argocd login --sso`
# opens on the workstation; without it the web UI works and the CLI does not.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-argocd
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-argocd
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        argocd.yaml: |
          version: 1
          metadata:
            name: argocd-oidc
          entries:
            - id: argocd-provider
              model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: argocd
              attrs:
                name: argocd
                client_type: confidential
                client_id: "{{ .client_id }}"
                client_secret: "{{ .client_secret }}"
                # ⚠️ REQUIRED -- defaults to an empty list, which permits nothing.
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                sub_mode: user_email
                include_claims_in_id_token: true
                redirect_uris:
                  - matching_mode: strict
                    url: https://argocd.lab.techyon.dev/auth/callback
                  - matching_mode: strict
                    url: http://localhost:8085/auth/callback
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - model: authentik_core.application
              identifiers:
                slug: argocd
              attrs:
                name: ArgoCD
                provider: !KeyOf argocd-provider
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-argocd
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc-argocd
        property: client_secret
