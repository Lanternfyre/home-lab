#Notice chart name has to be a part of repoURL for oci
# GPU runner scale set (runs-on: arc-linux-gpu, derived as
# format('{0}-gpu', vars.CI_RUNNER)). One runner on k8s-lab5's Quadro K2200,
# for Necronia2.0's Godot frame-time job. Procedure and rollback:
# docs/operate/gpu-runner.md.
#
# ⚠️ Named for the CAPABILITY, like -dind: a GPU and a display. Godot is the
# first consumer, not the reason the pool exists.
#
# Same 0.14.2 pin + chart-bump warning as arc-controller/app.yaml. Shares
# ns arc-runners-lanternfyre (github-app + ghcr-pull secrets owned by the
# arc-lanternfyre app dir, and its runner-egress policy selects every pod in
# the namespace, this one included).
repoURL: "ghcr.io/actions/actions-runner-controller-charts"
chart: "gha-runner-scale-set"
targetRevision: "0.14.2"
releaseName: "arc-lanternfyre-gpu"
namespace: "arc-runners-lanternfyre"
