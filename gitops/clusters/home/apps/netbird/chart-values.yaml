# NetBird self-hosted control plane.
#
# ── 🔴 THE VERSION DECISION, MADE EXPLICITLY ────────────────────────────────
#
# Chart 1.9.0 declares appVersion **0.46.0**, and the management/signal/relay
# image tags default to EMPTY -- they fall back to the chart's appVersion. The
# current upstream NetBird release is **0.78.1**. That is a 32-minor gap, and
# the chart's templates were written against the older config format.
#
# Pinned to 0.46.0, the combination the chart was actually built for, because a
# templating mismatch on an internet-facing control plane fails in ways that are
# hard to diagnose and easy to half-fix.
#
# ⚠️ THIS IS A TRADE, NOT A CLEAN ANSWER, AND THE OTHER SIDE IS REAL: this is an
# internet-facing VPN control plane running a materially old release. Treat
# closing that gap as owed work, not optional. The 0.78.1 digests, resolved from
# the registry on 2026-09-06, so nobody has to re-derive them:
#
#   management  sha256:e114d2c8e699da19a05678c0600b821c59587541c404ac550cc062b96c3d3f54
#   signal      sha256:ebc42056ce135b5163554fad47c5b1456673e7132dc4fad9f9cc34d84c70feb4
#   relay       sha256:d5df6e3fe802734164fbe81d814d4575d7c29b29f9e03c95b49f18c10efd7958
#
# Bumping to them requires checking the chart renders a config the newer
# binaries accept -- not just changing these lines.
#
# ── 🔴 EVERY securityContext BELOW IS MANDATORY, NOT HYGIENE ────────────────
#
# This namespace carries `homelab.techyon.dev/edge-publish`, so
# `edge-published-pod-constraints` (a ValidatingAdmissionPolicy) selects every
# pod here and REQUIRES: runAsNonRoot, readOnlyRootFilesystem,
# allowPrivilegeEscalation false, capabilities.drop ALL,
# automountServiceAccountToken false, an image digest, and a memory limit.
#
# The chart ships `securityContext: {}` and `podSecurityContext: {}` for all
# four components. Remove any block below and the pod is DENIED at admission --
# which is the policy working, not a bug.
#
# ⚠️ `readOnlyRootFilesystem` on management is the one that is NOT proven. It
# writes to a PVC, which is fine, but if the binary also writes anywhere on the
# root filesystem the pod will crashloop on first sync. If it does, add an
# emptyDir at the offending path -- do NOT relax the flag, because that is the
# rule that stops an RCE becoming a persistent foothold.

global:
  namespace: netbird

# ── Management: the API, the gRPC endpoint, and the only stateful component ──
management:
  enabled: true
  replicaCount: 1
  image:
    repository: netbirdio/management
    tag: "0.46.0@sha256:b0adc4ad4ec6e3394c1f3e13680b7a8bbb1eeefddd1733cf658862e39468e062"
    pullPolicy: IfNotPresent

  # ⚠️ 10Mi is the chart default and it is NOT a typo -- management's store is
  # small. It is also, per H0, a datastore with NO BACKUP: losing it means every
  # enrolled device must re-enrol. Recorded, not solved; backups are deferred.
  persistentVolume:
    enabled: true
    size: 1Gi
    accessModes: [ReadWriteOnce]

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  # Scratch space, because the rootfs is read-only.
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp

  # ⚠️ The chart renders management's config from this block. The endpoints must
  # be the PUBLIC name -- a client outside the cluster is told where to go by
  # these values, so a Service name here produces a client that authenticates
  # and then cannot connect.
  envRaw:
    - name: NETBIRD_MGMT_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: NETBIRD_MGMT_DNS_DOMAIN
      value: "netbird.selfhosted"

# ── Signal: peer rendezvous, gRPC ────────────────────────────────────────────
signal:
  enabled: true
  replicaCount: 1
  image:
    repository: netbirdio/signal
    tag: "0.46.0@sha256:e8f39261115233c05098d0a0ced33d13e77bdefb32f93505d238a7bf979fa80d"
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  serviceAccount:
    create: true
    automountServiceAccountToken: false

# ── Relay: the fallback path when two peers cannot hole-punch ────────────────
relay:
  enabled: true
  replicaCount: 1
  image:
    repository: netbirdio/relay
    tag: "0.46.0@sha256:d32f82514a24b9582fe04d3e6e4cbaa9d5a9efcbf31234fd3ff289971e0bfe0e"
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  serviceAccount:
    create: true
    automountServiceAccountToken: false

# ── Dashboard: the browser UI ────────────────────────────────────────────────
dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: netbirdio/dashboard
    tag: "v2.13.1@sha256:88b5fb704a8c9dc3fe0bbdbcb19840d5fbcc6e8c79dd36ad322ba13baca9d233"
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  serviceAccount:
    create: true
    automountServiceAccountToken: false

  # ⚠️ The dashboard is a static SPA: these are baked into the served JavaScript
  # at container start, so they are PUBLIC values by construction. Nothing
  # secret may go here -- the OIDC client is public/PKCE for exactly that reason.
  #
  # 🔴 AUTH_AUTHORITY IS THE PUBLIC authentik NAME, NOT THE .lab ONE.
  # EDGE-NODE.md finding 12: authentik derives its issuer from the request host,
  # so a token minted through `authentik.techyon.dev` carries a DIFFERENT issuer
  # than one minted through `authentik.lab.techyon.dev`. The Envoy gates pin the
  # `.lab` issuer. A NetBird client enrolling from the internet can only reach
  # the public one, and the two must never be mixed for one client.
  envRaw:
    - name: NETBIRD_MGMT_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: AUTH_AUTHORITY
      value: "https://authentik.techyon.dev/application/o/netbird/"
    - name: AUTH_CLIENT_ID
      value: "netbird"
    - name: AUTH_SUPPORTED_SCOPES
      value: "openid profile email offline_access"
    - name: USE_AUTH0
      value: "false"

# ⚠️ NO chart `ingress:` ANYWHERE. This estate publishes through Gateway API,
# and the routes live in manifests/netbird-edge.httproute.yaml attached to the
# `homelab-edge` Gateway's :443 listener. Enabling the chart's Ingress would
# create a second, unmanaged path with no firewall entry behind it.
