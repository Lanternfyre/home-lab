# NetBird, on the Lanternfyre fork of the upstream chart.
#
# ── Why a fork, and why this file is short ─────────────────────────────────
#
# Upstream netbirdio/helms 1.9.0 cannot run in an `edge-publish` namespace: it
# templates `automountServiceAccountToken` NOWHERE and its `serviceAccount:`
# values block silently accepts and ignores the field, so all four components
# were DENIED by `edge-published-pod-constraints`. It also ships no routing
# peer, which is the component that makes VPN clients carry a POD identity
# rather than the edge node's.
#
# Neither gap is closable from a values file, so the chart was forked into
# helm-compendium. The fork carries the secure defaults -- non-root, read-only
# rootfs, dropped capabilities, seccomp, memory limits, no SA token -- so this
# file states only what is specific to THIS cluster: image digests, the public
# endpoints, and the peer.
#
# 🔴 DIGESTS ARE STILL REQUIRED HERE. The contract demands an image pinned by
# digest, and a chart cannot supply that for you -- a tag is the chart's job,
# the digest is the estate's. Resolved from the registry 2026-09-06.
#
# ⚠️ appVersion 0.46.0 is materially behind upstream NetBird (0.78.1). Kept at
# the version the chart's templates were written against. The 0.78.1 digests,
# so nobody re-derives them when the fork catches up:
#   management  sha256:e114d2c8e699da19a05678c0600b821c59587541c404ac550cc062b96c3d3f54
#   signal      sha256:ebc42056ce135b5163554fad47c5b1456673e7132dc4fad9f9cc34d84c70feb4
#   relay       sha256:d5df6e3fe802734164fbe81d814d4575d7c29b29f9e03c95b49f18c10efd7958
#   client      sha256:5025865661882adc6ef2ea125de5d2b9f1a298fb67da990ab180ef55dddfeadb

global:
  namespace: netbird

management:
  image:
    tag: "0.46.0@sha256:b0adc4ad4ec6e3394c1f3e13680b7a8bbb1eeefddd1733cf658862e39468e062"
  # ⚠️ 10Mi is the chart default and is not a typo -- management's store is
  # small. It is also, per H0, a datastore with NO BACKUP: losing it means every
  # enrolled device must re-enrol. Recorded, not solved.
  persistentVolume:
    enabled: true
    size: 1Gi
  envRaw:
    - name: NETBIRD_MGMT_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: NETBIRD_MGMT_DNS_DOMAIN
      value: "netbird.selfhosted"

  # ── management.json, in full ───────────────────────────────────────────────
  #
  # The chart pipes this straight into /etc/netbird/management.json. NetBird
  # substitutes `{{ .VAR }}` from the environment at container START -- helm
  # does NOT touch them, so they must survive into the rendered ConfigMap
  # verbatim. They are wired from `envFromSecret` below.
  #
  # 🔴 STUN AND TURN ARE EMPTY, AND THAT IS A DECISION, NOT AN OVERSIGHT.
  #
  # This cluster runs no coturn. The options were to publish one (another UDP
  # listener, another firewall entry, another chart) or to point at a public
  # STUN server -- which would mean granting this namespace egress to the
  # internet, in a namespace whose whole contract is that it cannot phone
  # anywhere it likes.
  #
  # Neither is worth it for an admin VPN, because the RELAY is already
  # published on :443 through our own edge node. Without STUN, peers cannot
  # discover their public address, so direct peer-to-peer mostly will not form
  # and traffic goes through the relay instead.
  #
  # ⚠️ WHAT THAT COSTS, stated plainly: every byte flows through edge-1 rather
  # than peer-to-peer, so throughput is bounded by that VPS and latency is
  # whatever the detour costs. For reaching cluster services from a laptop that
  # is fine. If NetBird is ever used for bulk transfer between peers, deploy
  # coturn and fill these in -- do not discover the cost by measuring it.
  configmap: |-
    {
      "Stuns": [],
      "TURNConfig": {
        "TimeBasedCredentials": false,
        "CredentialsTTL": "12h0m0s",
        "Secret": "{{ .RELAY_PASSWORD }}",
        "Turns": []
      },
      "Relay": {
        "Addresses": ["rels://vpn.techyon.dev:443/relay"],
        "CredentialsTTL": "24h",
        "Secret": "{{ .RELAY_PASSWORD }}"
      },
      "Signal": { "Proto": "https", "URI": "vpn.techyon.dev:443", "Username": "", "Password": "" },
      "Datadir": "/var/lib/netbird/",
      "DataStoreEncryptionKey": "{{ .DATASTORE_ENCRYPTION_KEY }}",
      "HttpConfig": {
        "LetsEncryptDomain": "",
        "CertFile": "",
        "CertKey": "",
        "AuthAudience": "netbird",
        "AuthIssuer": "https://authentik.techyon.dev/application/o/netbird/",
        "AuthUserIDClaim": "",
        "AuthKeysLocation": "https://authentik.techyon.dev/application/o/netbird/jwks/",
        "OIDCConfigEndpoint": "https://authentik.techyon.dev/application/o/netbird/.well-known/openid-configuration",
        "IdpSignKeyRefreshEnabled": false
      },
      "IdpManagerConfig": { "ManagerType": "none" },
      "DeviceAuthorizationFlow": {
        "Provider": "hosted",
        "ProviderConfig": {
          "ClientID": "netbird",
          "ClientSecret": "",
          "Domain": "authentik.techyon.dev",
          "Audience": "netbird",
          "TokenEndpoint": "https://authentik.techyon.dev/application/o/token/",
          "DeviceAuthEndpoint": "https://authentik.techyon.dev/application/o/device/",
          "AuthorizationEndpoint": "",
          "Scope": "openid",
          "UseIDToken": false,
          "RedirectURLs": null
        }
      },
      "PKCEAuthorizationFlow": {
        "ProviderConfig": {
          "ClientID": "netbird",
          "ClientSecret": "",
          "Domain": "",
          "Audience": "netbird",
          "TokenEndpoint": "https://authentik.techyon.dev/application/o/token/",
          "DeviceAuthEndpoint": "",
          "AuthorizationEndpoint": "https://authentik.techyon.dev/application/o/authorize/",
          "Scope": "openid profile email offline_access",
          "UseIDToken": false,
          "RedirectURLs": ["http://localhost:53000"]
        }
      },
      "StoreConfig": { "Engine": "sqlite" },
      "ReverseProxy": { "TrustedHTTPProxies": null, "TrustedHTTPProxiesCount": 0, "TrustedPeers": null }
    }

  # ⚠️ `IdpManagerConfig.ManagerType: none` is deliberate. The alternative is
  # `authentik`, which needs an authentik SERVICE ACCOUNT so NetBird can list
  # users through the API -- another credential, another manual step, and a
  # standing API token for a service on the internet. Without it the dashboard
  # simply shows users by their token claims instead of a full directory, which
  # is all an admin VPN needs.

  envFromSecret:
    DATASTORE_ENCRYPTION_KEY: netbird-secrets/datastore-encryption-key
    RELAY_PASSWORD: netbird-secrets/relay-password


signal:
  image:
    tag: "0.46.0@sha256:e8f39261115233c05098d0a0ced33d13e77bdefb32f93505d238a7bf979fa80d"

relay:
  image:
    tag: "0.46.0@sha256:d32f82514a24b9582fe04d3e6e4cbaa9d5a9efcbf31234fd3ff289971e0bfe0e"
  # 🔴 `exposed address is required` -- the relay refuses to start without it,
  # and it is the one value that CANNOT be defaulted in the chart, because only
  # this repo knows the public endpoint. `rels://` is the TLS scheme; the path
  # must match the /relay HTTPRoute rule.
  env:
    NB_EXPOSED_ADDRESS: "rels://vpn.techyon.dev:443/relay"
    NB_LISTEN_ADDRESS: ":33080"
  envFromSecret:
    NB_AUTH_SECRET: netbird-secrets/relay-password

dashboard:
  image:
    tag: "v2.13.1@sha256:88b5fb704a8c9dc3fe0bbdbcb19840d5fbcc6e8c79dd36ad322ba13baca9d233"
  envRaw:
    - name: NETBIRD_MGMT_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: AUTH_AUTHORITY
      value: "https://authentik.techyon.dev/application/o/netbird/"
    - name: AUTH_CLIENT_ID
      value: "netbird"
    - name: AUTH_SUPPORTED_SCOPES
      value: "openid profile email offline_access"
    - name: USE_AUTH0
      value: "false"


# ── The in-cluster routing peer ─────────────────────────────────────────────
#
# 🔴 THIS IS WHAT MAKES STAGE 4 AND A VPN COEXIST. A peer on the VPS host would
# SNAT clients to 10.250.0.1 -- the edge node's own address -- so Cilium would
# stamp them `remote-node`, identical to a compromised edge. As a pod it
# masquerades to its own pod IP, and netbird-vpn-access names that.
routingPeer:
  enabled: true
  managementURL: "https://vpn.techyon.dev"
  hostname: "cluster-routing-peer"
  image:
    tag: "0.46.0-rootless@sha256:4ee5b2b090a04e6df203b78f9fe29e40db0ab2b275267bde0af7a18ea1286801"
  setupKeySecret:
    name: netbird-setup-key
    key: setup-key
