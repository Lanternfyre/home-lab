# NetBird, on the Lanternfyre fork of the upstream chart.
#
# ── Why a fork, and why this file is short ─────────────────────────────────
#
# Upstream netbirdio/helms 1.9.0 cannot run in an `edge-publish` namespace: it
# templates `automountServiceAccountToken` NOWHERE and its `serviceAccount:`
# values block silently accepts and ignores the field, so all four components
# were DENIED by `edge-published-pod-constraints`. It also ships no routing
# peer, which is the component that makes VPN clients carry a POD identity
# rather than the edge node's.
#
# Neither gap is closable from a values file, so the chart was forked into
# helm-compendium. The fork carries the secure defaults -- non-root, read-only
# rootfs, dropped capabilities, seccomp, memory limits, no SA token -- so this
# file states only what is specific to THIS cluster: image digests, the public
# endpoints, and the peer.
#
# 🔴 DIGESTS ARE STILL REQUIRED HERE. The contract demands an image pinned by
# digest, and a chart cannot supply that for you -- a tag is the chart's job,
# the digest is the estate's. Resolved from the registry 2026-09-06.
#
# 🔴 0.78.1, AND THE UPGRADE FROM 0.46.0 WAS FORCED BY THE RELAY WIRE
# PROTOCOL -- IT IS NOT HOUSEKEEPING.
#
# 0.46.0 was "materially behind, kept at the version the templates were written
# against", which read like an acceptable debt. It was not: a current client
# CANNOT USE A 0.46.0 RELAY AT ALL. Measured 2026-09-06 with an Android client
# on 0.71.0, in the relay's own log, once every ~4 seconds:
#
#   relay/server/peer.go:89: failed to determine message type: invalid msg
#   type 8
#
# The client connects over the WebSocket, sends a frame type the old server has
# never heard of, and the server drops it. On the peer side that surfaces as
#
#   Relay is not supported by remote peer
#   OnRemoteOffer, on status ICE: Disconnected, status Relay: Connected
#
# -- "Relay: Connected" is the peer's own link to the relay, so it looks fine.
# With Stuns/Turns empty by decision there is no ICE fallback, so no relay
# means NO DATA PATH AT ALL, and the handshake loops forever while both peers
# report as connected in the dashboard.
#
# ⚠️ THE SYMPTOM POINTS AT ROUTING, NOT VERSIONS. Peers enrol, management and
# signal work, the dashboard lists everything as connected, and nothing passes
# traffic -- which sends you to network policy and NetBird routes. It is the
# relay server being 32 releases behind the client.
#
# ⚠️ Client versions are NOT under this repo's control. Phones update
# themselves, so the server side must stay current or it breaks on someone
# else's release schedule. Treat a NetBird version bump as maintenance with a
# deadline, not as optional.
#
# All four digests re-verified against the live registry before this landed.

global:
  namespace: netbird

management:
  image:
    tag: "0.78.1@sha256:e114d2c8e699da19a05678c0600b821c59587541c404ac550cc062b96c3d3f54"
  # 🔴 WITHOUT THIS, EVERY gRPC CALL IS A 500 WHILE REST KEEPS WORKING.
  #
  # Measured from the public internet before this landed:
  #   GET /api                            404   <- the app answered
  #   GET /management.ManagementService/  500
  #
  # NetBird multiplexes gRPC and REST onto ONE port. Envoy Gateway picks the
  # upstream protocol from the Service's appProtocol, and with none set it dials
  # HTTP/1.1 -- which a gRPC server cannot answer. A 500 on one path while
  # another returns a real application 404 is the signature of a protocol
  # mismatch, and it is easy to read as a broken backend: the pod is Running and
  # its logs say nothing at all.
  service:
    appProtocol: kubernetes.io/h2c
  # ⚠️ 10Mi is the chart default and is not a typo -- management's store is
  # small. It is also, per H0, a datastore with NO BACKUP: losing it means every
  # enrolled device must re-enrol. Recorded, not solved.
  persistentVolume:
    enabled: true
    size: 1Gi
  envRaw:
    # 🔴 WITHOUT THIS, MANAGEMENT 0.78.1 EXITS FATALLY AT STARTUP IN A
    # NAMESPACE WITH DEFAULT-DENY EGRESS.
    #
    # 0.78.1 initialises a geolocation service that DOWNLOADS a GeoLite2
    # database on boot. `netbird-containment` permits egress to DNS, this
    # namespace, authentik and vpn.techyon.dev -- and nothing else -- so the
    # fetch hangs until it times out and the process calls log.Fatalf:
    #
    #   FATL could not initialize geolocation service: failed to get database
    #   filename: Head "https://pkgs.netbird.io/geolocation-dbs/GeoLite2-City/
    #   download?suffix=tar.gz": dial tcp 5.22.212.152:443: i/o timeout
    #
    # ⚠️ IT CRASHES ~30s AFTER A CLEAN, COMPLETE SCHEMA MIGRATION, so the last
    # hundred log lines are successful migration output and it reads like the
    # upgrade failing. The migration is fine; the network call after it is not.
    #
    # Read from the source rather than guessed --
    # management/internals/server/modules.go:38-51 at v0.78.1:
    #
    #   const geolocationDisabledKey = "NB_DISABLE_GEOLOCATION"
    #   if os.Getenv(geolocationDisabledKey) == "true" { ...return nil }
    #   ... log.Fatalf("could not initialize geolocation service: %v", err)
    #
    # ⚠️ DISABLED RATHER THAN ALLOWED, DELIBERATELY. The alternative is an
    # egress rule for pkgs.netbird.io, which grants this namespace a standing
    # route to the internet so a feature nobody here uses can phone home on
    # every boot. Geolocation exists for country-based POSTURE CHECKS; none are
    # configured. If they are ever wanted, this flips to false AND the egress
    # rule goes in -- both, and as a deliberate decision.
    - name: NB_DISABLE_GEOLOCATION
      value: "true"
    - name: NETBIRD_MGMT_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: NETBIRD_MGMT_DNS_DOMAIN
      value: "netbird.selfhosted"

  # ── management.json, in full ───────────────────────────────────────────────
  #
  # The chart pipes this straight into /etc/netbird/management.json. NetBird
  # substitutes `{{ .VAR }}` from the environment at container START -- helm
  # does NOT touch them, so they must survive into the rendered ConfigMap
  # verbatim. They are wired from `envFromSecret` below.
  #
  # 🔴 STUN AND TURN ARE EMPTY, AND THAT IS A DECISION, NOT AN OVERSIGHT.
  #
  # This cluster runs no coturn. The options were to publish one (another UDP
  # listener, another firewall entry, another chart) or to point at a public
  # STUN server -- which would mean granting this namespace egress to the
  # internet, in a namespace whose whole contract is that it cannot phone
  # anywhere it likes.
  #
  # Neither is worth it for an admin VPN, because the RELAY is already
  # published on :443 through our own edge node. Without STUN, peers cannot
  # discover their public address, so direct peer-to-peer mostly will not form
  # and traffic goes through the relay instead.
  #
  # ⚠️ WHAT THAT COSTS, stated plainly: every byte flows through edge-1 rather
  # than peer-to-peer, so throughput is bounded by that VPS and latency is
  # whatever the detour costs. For reaching cluster services from a laptop that
  # is fine. If NetBird is ever used for bulk transfer between peers, deploy
  # coturn and fill these in -- do not discover the cost by measuring it.
  configmap: |-
    {
      "Stuns": [],
      "TURNConfig": {
        "TimeBasedCredentials": false,
        "CredentialsTTL": "12h0m0s",
        "Secret": "{{ .RELAY_PASSWORD }}",
        "Turns": []
      },
      "Relay": {
        "Addresses": ["rels://vpn.techyon.dev:443/relay"],
        "CredentialsTTL": "24h",
        "Secret": "{{ .RELAY_PASSWORD }}"
      },
      "Signal": { "Proto": "https", "URI": "vpn.techyon.dev:443", "Username": "", "Password": "" },
      "Datadir": "/var/lib/netbird/",
      "DataStoreEncryptionKey": "{{ .DATASTORE_ENCRYPTION_KEY }}",
      "HttpConfig": {
        "LetsEncryptDomain": "",
        "CertFile": "",
        "CertKey": "",
        "AuthAudience": "netbird",
        "AuthIssuer": "https://authentik.techyon.dev/application/o/netbird/",
        "AuthUserIDClaim": "",
        "AuthKeysLocation": "https://authentik.techyon.dev/application/o/netbird/jwks/",
        "OIDCConfigEndpoint": "https://authentik.techyon.dev/application/o/netbird/.well-known/openid-configuration",
        "IdpSignKeyRefreshEnabled": false
      },
      "IdpManagerConfig": { "ManagerType": "none" },
      "DeviceAuthorizationFlow": {
        "Provider": "hosted",
        "ProviderConfig": {
          "ClientID": "netbird",
          "ClientSecret": "",
          "Domain": "authentik.techyon.dev",
          "Audience": "netbird",
          "TokenEndpoint": "https://authentik.techyon.dev/application/o/token/",
          "DeviceAuthEndpoint": "https://authentik.techyon.dev/application/o/device/",
          "AuthorizationEndpoint": "",
          "Scope": "openid",
          "UseIDToken": false,
          "RedirectURLs": null
        }
      },
      "PKCEAuthorizationFlow": {
        "ProviderConfig": {
          "ClientID": "netbird",
          "ClientSecret": "",
          "Domain": "",
          "Audience": "netbird",
          "TokenEndpoint": "https://authentik.techyon.dev/application/o/token/",
          "DeviceAuthEndpoint": "",
          "AuthorizationEndpoint": "https://authentik.techyon.dev/application/o/authorize/",
          "Scope": "openid profile email offline_access",
          "UseIDToken": false,
          "RedirectURLs": ["http://localhost:53000", "http://localhost:54000"]
        }
      },
      "StoreConfig": { "Engine": "sqlite" },
      "ReverseProxy": { "TrustedHTTPProxies": null, "TrustedHTTPProxiesCount": 0, "TrustedPeers": null }
    }

  # ⚠️ `IdpManagerConfig.ManagerType: none` is deliberate. The alternative is
  # `authentik`, which needs an authentik SERVICE ACCOUNT so NetBird can list
  # users through the API -- another credential, another manual step, and a
  # standing API token for a service on the internet. Without it the dashboard
  # simply shows users by their token claims instead of a full directory, which
  # is all an admin VPN needs.

  envFromSecret:
    DATASTORE_ENCRYPTION_KEY: netbird-secrets/datastore-encryption-key
    RELAY_PASSWORD: netbird-secrets/relay-password


signal:
  image:
    tag: "0.78.1@sha256:ebc42056ce135b5163554fad47c5b1456673e7132dc4fad9f9cc34d84c70feb4"
  # Signal is gRPC and nothing else, so this is unconditional.
  service:
    appProtocol: kubernetes.io/h2c

relay:
  # ⚠️ NO appProtocol HERE, DELIBERATELY. The relay endpoint is a WebSocket over
  # an HTTP/1.1 Upgrade -- the one protocol on this Gateway that must NOT be
  # h2c. Declaring it would break the upgrade handshake while looking like the
  # same hardening applied to its neighbours.
  image:
    tag: "0.78.1@sha256:d5df6e3fe802734164fbe81d814d4575d7c29b29f9e03c95b49f18c10efd7958"
  # 🔴 `exposed address is required` -- the relay refuses to start without it,
  # and it is the one value that CANNOT be defaulted in the chart, because only
  # this repo knows the public endpoint. `rels://` is the TLS scheme; the path
  # must match the /relay HTTPRoute rule.
  env:
    NB_EXPOSED_ADDRESS: "rels://vpn.techyon.dev:443/relay"
    NB_LISTEN_ADDRESS: ":33080"
  envFromSecret:
    NB_AUTH_SECRET: netbird-secrets/relay-password

# 🔴 THE DASHBOARD IS NOT DEPLOYED HERE. See apps/netbird-ui/.
#
# It cannot satisfy `edge-published-pod-constraints`: measured from the image,
# supervisord declares `user=root` for every program and nginx binds :80, so
# runAsNonRoot makes supervisord abort with "Can't drop privilege as nonroot
# user" and an unprivileged bind of :80 would need NET_BIND_SERVICE.
#
# It also does not belong here. The dashboard is a static SPA in an operator's
# browser; only management, signal and relay must be reachable by VPN CLIENTS.
# Publishing a UI to the internet because it shipped in the same chart is how a
# public surface grows for no reason.
dashboard:
  enabled: false

# ── The in-cluster routing peer ─────────────────────────────────────────────
#
# 🔴 THIS IS WHAT MAKES STAGE 4 AND A VPN COEXIST. A peer on the VPS host would
# SNAT clients to 10.250.0.1 -- the edge node's own address -- so Cilium would
# stamp them `remote-node`, identical to a compromised edge. As a pod it
# masquerades to its own pod IP, and netbird-vpn-access names that.
routingPeer:
  enabled: true
  managementURL: "https://vpn.techyon.dev"
  hostname: "cluster-routing-peer"
  image:
    tag: "0.78.1-rootless@sha256:5025865661882adc6ef2ea125de5d2b9f1a298fb67da990ab180ef55dddfeadb"
  setupKeySecret:
    name: netbird-setup-key
    key: setup-key
