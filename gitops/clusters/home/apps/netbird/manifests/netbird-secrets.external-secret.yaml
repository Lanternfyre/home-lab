# NetBird's three secrets, in one 1Password item.
#
# ⚠️ TWO OF THEM MUST EXIST BEFORE THE FIRST DEPLOY; THE THIRD CANNOT.
#
#   datastore-encryption-key   needed at management STARTUP
#   relay-password             shared secret between management and relay,
#                              needed at startup by both
#   setup-key                  created INSIDE NetBird after you first sign in,
#                              so it cannot exist until the control plane runs
#
# That ordering is not a design flaw to work around -- a setup key is an
# enrolment credential minted by a running system. Create the item with the
# first two, let the control plane come up, sign in, then add the third. The
# routing peer stays NotReady until it lands, which is its readiness probe
# telling the truth.
#
# Generate both with `openssl rand -base64 32`. Same instinct as
# CLUSTER-TOKEN.md: generate it, do not choose it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-secrets
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: netbird-secrets
    creationPolicy: Owner
  data:
    - secretKey: datastore-encryption-key
      remoteRef:
        key: netbird
        property: datastore-encryption-key
    - secretKey: relay-password
      remoteRef:
        key: netbird
        property: relay-password
