# The authentik service account's password, in the namespace that uses it.
#
# Same 1Password field the authentik blueprint reads (item `netbird`, field
# `reconciler-token`) -- one credential, two consumers: authentik defines the
# Token, the reconciler presents it. They MUST stay identical, which is why
# both read the same field rather than each holding a copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-reconciler-credentials
  namespace: netbird-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: netbird-reconciler-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: netbird
        property: reconciler-token
