# NetBird's public surface, on the `homelab-edge` Gateway's :443 listener.
#
# 🔴 PATH ROUTING IS NOT COSMETIC HERE. Since 0.29 NetBird multiplexes FOUR
# things onto one HTTPS endpoint: the dashboard SPA, the management REST API,
# two gRPC services, and the relay's WebSocket. They are separated only by path,
# which is why TLS has to terminate at Envoy rather than pass through -- and why
# Cloudflare Tunnel cannot carry this at all (no gRPC on a public hostname).
#
# ⚠️ ORDER MATTERS. Gateway API matches the MOST SPECIFIC path, but the `/`
# catch-all to the dashboard would still swallow anything not listed, so a
# missing prefix here is a 200-with-the-wrong-app rather than a 404.
#
# ⚠️ The gRPC services are matched by their proto package paths. Getting one
# wrong produces a client that authenticates and then hangs at "connecting",
# because the gRPC stream lands on the SPA.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-edge
  namespace: netbird
  annotations:
    # The public IP is the Gateway's, not a Service's -- external-dns falls back
    # to Status.Addresses (a ClusterIP) without this, and `policy: upsert-only`
    # means it could never take that record back.
    external-dns.alpha.kubernetes.io/target: "167.86.81.59"
    external-dns.alpha.kubernetes.io/hostname: vpn.techyon.dev
spec:
  parentRefs:
    - name: homelab-edge
      namespace: gateway-edge
      sectionName: netbird-https
  hostnames:
    - vpn.techyon.dev
  rules:
    # Management gRPC -- what the CLI client actually talks to after enrolment.
    - matches:
        - path: { type: PathPrefix, value: /management.ManagementService/ }
      # 🔴 `0s` DISABLES THE TIMEOUT, AND WITHOUT IT THE VPN IS UNUSABLE.
      #
      # Envoy's DEFAULT route timeout is 15 seconds. NetBird's Sync is a
      # long-lived SERVER-STREAMING RPC that must stay open for the life of the
      # peer, so Envoy was cutting it on a metronome. MEASURED 2026-09-06 from
      # the in-cluster routing peer:
      #
      #   18:43:32 connected to the Management Service stream
      #   18:43:47 disconnected ... RST_STREAM with error code: INTERNAL_ERROR
      #   18:43:58 connected
      #   18:44:13 disconnected ... RST_STREAM INTERNAL_ERROR
      #
      # Exactly 15s per cycle. The client RECONNECTS SILENTLY ("will retry
      # silently"), so the peer shows as connected in `netbird status` and in
      # the dashboard and nothing looks broken. The damage is that every
      # stream -- and every route and DNS update carried on it -- dies every
      # 15 seconds.
      #
      # ⚠️ A ZERO-VALUED DURATION MEANS "NO TIMEOUT" in Gateway API, not "time
      # out immediately". Deleting this does not restore a default; it restores
      # the 15s cut.
      timeouts:
        request: 0s
      # 🔴 netbird-management, NOT netbird-management-grpc.
      #
      # The separate gRPC Service only exists when the chart's
      # `useBackwardsGrpcService` is true, and it defaults to false -- correctly,
      # because since 0.29 NetBird multiplexes gRPC and REST onto the SAME port.
      # This route pointed at a Service the chart never creates, so Envoy had no
      # endpoint and returned 500. `kubectl get svc` shows only three Services in
      # this namespace; the fourth was only ever in this file.
      backendRefs:
        - name: netbird-management
          port: 80

    # Signal gRPC -- peer rendezvous.
    - matches:
        - path: { type: PathPrefix, value: /signalexchange.SignalExchange/ }
      # Signal is a bidirectional stream held open for the life of the peer,
      # exactly like management above, and takes the same 15s cut.
      timeouts:
        request: 0s
      backendRefs:
        - name: netbird-signal
          port: 80

    # Relay WebSocket -- the fallback path when hole-punching fails.
    - matches:
        - path: { type: PathPrefix, value: /relay }
      # The relay is a WebSocket carrying ALL peer traffic -- Stuns/Turns are
      # empty by decision, so nothing is peer-to-peer. A 15s cut here severs
      # every connection in the mesh, over and over.
      timeouts:
        request: 0s
      backendRefs:
        - name: netbird-relay
          port: 33080

    # Management REST API -- the dashboard's backend.
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: netbird-management
          port: 80

    # ⚠️ NO `/` CATCH-ALL, DELIBERATELY. The dashboard is served on the LAN's
    # gated Gateway (apps/netbird-ui), so anything not matching a rule above
    # gets a 404 from Envoy instead of a UI. That is the correct answer for a
    # public listener: the paths above are the entire machine-facing API
    # surface, and a catch-all would publish whatever was added to the namespace
    # next.
