# 🔴 THE PIECE THAT RESOLVES THE IDENTITY CONTRADICTION.
#
# EDGE-NODE.md Phase D originally SNAT'd VPN clients at the VPS to 10.250.0.1 --
# which is the edge node's own address. Cilium stamps that `remote-node`, the
# identical identity a compromised edge host carries, so
# `edge-node-containment` could not have told a VPN user from an attacker on the
# edge. Closing the pod-network gap and running the VPN that way are mutually
# exclusive.
#
# A routing peer running as a POD masquerades to its OWN pod IP instead, so
# client traffic carries a pod identity that `fromEndpoints` can name precisely
# and `fromNodes` never touches. That is what netbird-vpn-access.ciliumnetworkpolicy.yaml
# then grants.
#
# ⚠️ MESH -> CLUSTER ONLY. No cluster pod uses this peer for egress; it exists so
# VPN clients can reach cluster Services, not the reverse.
#
# ── The `-rootless` image is the mechanism, not an env var ──────────────────
# It runs `wireguard-go` in USERSPACE, so the pod needs no CAP_NET_ADMIN and
# never touches the kernel routing table or iptables. That is what lets it
# satisfy `edge-published-pod-constraints`, which forbids added capabilities
# outright. The ordinary `netbirdio/netbird` image would need NET_ADMIN and be
# DENIED at admission in this namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-routing-peer
  namespace: netbird
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: netbird-routing-peer }
  template:
    metadata:
      labels: { app: netbird-routing-peer }
    spec:
      # No API access whatsoever -- required by the published-pod contract, and
      # correct regardless: this is a network forwarder, not a controller.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: netbird
          image: netbirdio/netbird:0.46.0-rootless@sha256:4ee5b2b090a04e6df203b78f9fe29e40db0ab2b275267bde0af7a18ea1286801
          securityContext:
            runAsNonRoot: true
            # ⚠️ NOT in the upstream example, required by the contract here. The
            # peer's state lives on the emptyDir below, so this should hold --
            # but it is the single most likely cause of a crashloop on first
            # deploy. If it crashes, find the path it writes to and add an
            # emptyDir for it; do NOT relax this flag.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities: { drop: ["ALL"] }
          env:
            # 🔴 BOTH ARE LOAD-BEARING. Without HOME the client falls back to
            # `/` and cannot write its state on a read-only rootfs.
            - { name: USER, value: netbird }
            - { name: HOME, value: /var/lib/netbird }
            - { name: NB_MANAGEMENT_URL, value: "https://vpn.techyon.dev" }
            - { name: NB_HOSTNAME, value: "cluster-routing-peer" }
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-setup-key
                  key: setup-key
          volumeMounts:
            - { name: netbird-data, mountPath: /var/lib/netbird }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          # Asserts BEHAVIOUR, not liveness: a peer that is Running but not
          # registered with management routes nothing, and would otherwise look
          # perfectly healthy.
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  out="$(netbird status 2>/dev/null || true)"
                  echo "$out" | grep -Eq '^Management:\s+Connected' &&
                  echo "$out" | grep -Eq '^Signal:\s+Connected'
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        # ⚠️ `medium: Memory` -- the peer holds a WireGuard PRIVATE KEY and the
        # setup key's derived credentials. Keeping them off disk means a stolen
        # node disk does not yield a cluster VPN identity. Cost: the peer
        # re-registers on restart, which is the correct trade.
        - name: netbird-data
          emptyDir: { medium: Memory }
