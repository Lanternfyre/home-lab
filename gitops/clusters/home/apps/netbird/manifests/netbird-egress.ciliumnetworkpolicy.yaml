# H1 -- what NetBird may reach.
#
# ⚠️ `enableDefaultDeny` IS SET EXPLICITLY, both directions. Cilium's implicit
# per-direction default-deny would do the same thing here, but invisibly, and
# `scripts/audit-edge-exposure.py` FAILS a published namespace that relies on
# the implicit form. A namespace on the internet must state its containment.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbird-containment
  namespace: netbird
spec:
  endpointSelector: {}

  enableDefaultDeny:
    ingress: true
    egress: true

  ingress:
    # The kubelet-probe path. `world` is correct and must NOT be narrowed:
    # apps/mealie/manifests/mealie-ingress.ciliumnetworkpolicy.yaml records a
    # `fromEntities: [host, remote-node]` narrowing that crashlooped a healthy
    # app eight times, and a `fromCIDR` allow-list that failed SILENTLY.
    #
    # This is also the rule that admits the edge Envoy, because it runs
    # hostNetwork and therefore carries the NODE identity. There is no way to
    # distinguish it from a probe at L3/L4 -- see HARDENING.md.
    - fromEntities: [host, remote-node, world]

    # The components talk to each other.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: netbird

  egress:
    # DNS first, and L7-restricted: the pods may ask CoreDNS, and only for the
    # names below. Same idiom as every other egress policy in this repo.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }]
          rules:
            dns:
              - matchPattern: "*"

    # Each other.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: netbird

    # 🔴 authentik, for OIDC token and JWKS validation, by FQDN.
    #
    # ⚠️ The PUBLIC name, not the `.lab` one. Management validates tokens minted
    # for the issuer the client used, and a client enrolling from the internet
    # can only have used `authentik.techyon.dev`. Pointing this at the `.lab`
    # name would fetch a JWKS for a different issuer and every token would fail
    # with a 403 carrying no useful message -- EDGE-NODE.md finding 12.
    - toFQDNs:
        - matchName: "authentik.techyon.dev"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]

    # 🔴 THE ROUTING PEER'S OWN CONTROL PLANE -- AND IT LEAVES THE CLUSTER
    # TO REACH SERVICES RUNNING NEXT TO IT.
    #
    # The peer is a NetBird CLIENT. It is co-resident with management, signal
    # and relay, but it does not talk to them as neighbours: it dials the
    # PUBLIC endpoint like any other peer, out through the home uplink to
    # edge-1 and back in through the Gateway. Without this rule it fails with
    #
    #   dial tcp 167.86.81.59:443: i/o timeout
    #
    # which reads like a broken edge node and is really this policy.
    #
    # ⚠️ THE IN-NAMESPACE RULE ABOVE DOES NOT COVER IT, and that is the trap.
    # `toEndpoints: netbird` allows the pod to reach the management SERVICE,
    # so it looks like the peer is already served. It is not: the peer resolves
    # `vpn.techyon.dev`, which is the edge VPS's public address, and that is
    # `world` -- a different destination entirely from the pod next door.
    #
    # ⚠️ ONE NAME, THREE SERVICES. Management gRPC, signal gRPC and the relay
    # WebSocket are all multiplexed onto this single :443 endpoint (NetBird
    # >= 0.29), so this one rule is the whole control plane. Do not "tidy" it
    # by narrowing to management -- signal and relay ride the same tuple.
    #
    # ⚠️ TCP ONLY, and that is a CONSEQUENCE OF THE STUN DECISION, not an
    # oversight. With `Stuns`/`Turns` empty the peer never forms a direct
    # WireGuard path, so it needs no UDP egress; everything relays over :443.
    # The day coturn is deployed and direct peer-to-peer starts working, this
    # rule must gain UDP or connections will silently fall back to relay
    # forever while looking healthy. See chart-values.yaml.
    - toFQDNs:
        - matchName: "vpn.techyon.dev"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]

    # ── WHAT VPN CLIENTS MAY ACTUALLY REACH ────────────────────────────────
    #
    # 🔴 THE OTHER HALF OF `netbird-vpn-access`. WITHOUT THIS, THAT POLICY
    # DOES NOTHING AND THE VPN REACHES NOTHING.
    #
    # netbird-vpn-access grants those namespaces INGRESS from the routing
    # peer. Cilium's default-deny is per DIRECTION and per ENDPOINT, so the
    # destination letting the peer in is only half a path -- this namespace is
    # default-deny EGRESS, so the peer could never leave to use it. The pair
    # was written apart and only the ingress half landed; a VPN client saw
    # timeouts that look exactly like a routing problem.
    #
    # ⚠️ KEEP THIS LIST AND `netbird-vpn-access` IN STEP. They are one control
    # expressed in two objects, and either alone is silently inert.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
        - matchLabels:
            io.kubernetes.pod.namespace: home-utils
        - matchLabels:
            io.kubernetes.pod.namespace: immich
        - matchLabels:
            io.kubernetes.pod.namespace: silo

    # ── The LAN gateways, so `*.lab.techyon.dev` works over the VPN ────────
    #
    # 🔴 BY ADDRESS, AND THE ADDRESSES ARE NOW DECLARED RATHER THAN
    # ALLOCATED. The Gateways carry `spec.addresses`, so these are facts this
    # repo states, not values MetalLB happened to hand out. Change one there
    # and change it here; nothing else moves them.
    #
    # ⚠️ SELECTING THE SERVICE BY LABEL WAS TRIED AND CANNOT WORK HERE. A
    # `toServices` rule resolves correctly -- the policy map gains an allow for
    # the envoy pod identity, verified -- and traffic is STILL denied:
    #
    #   netbird-routing-peer <> envoy-gateway/...-homelab-gated:443 (world)
    #   policy-verdict:none EGRESS DENIED
    #
    # Hubble NAMES the destination as the Service while the identity it carries
    # is `world`. With `kube-proxy-replacement: false`, egress policy is
    # evaluated BEFORE kube-proxy's DNAT, so the packet is still addressed to
    # the LoadBalancer frontend -- an address with no ipcache entry, hence
    # `world` -- and a rule naming backends can never match it. `toCIDRSet` is
    # what CREATES an ipcache entry for that frontend, which is why this form
    # works and the identity form does not.
    #
    # ⚠️ This becomes obsolete the day Cilium owns service translation
    # (kubeProxyReplacement), because translation would then happen before
    # policy and the identity form would start working. That is a deliberate
    # cluster-wide change, not something to slip in here.
    - toCIDRSet:
        - cidr: 192.168.32.18/32   # Gateway homelab       (declared)
        - cidr: 192.168.32.19/32   # Gateway homelab-gated (declared)
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]

    # ⚠️ NO `toEntities: [world]` ANYWHERE, deliberately. The audit script fails
    # a published namespace that grants it, and a control plane strangers can
    # reach must not be able to phone anywhere it likes. If a future NetBird
    # feature needs an external host, name that host here.
