# The routing peer's enrolment credential.
#
# ⚠️ CHICKEN AND EGG, AND IT IS EXPECTED. A setup key is created INSIDE NetBird
# after the control plane is up and you have logged in once. So on first deploy
# this Secret does not resolve and the routing peer stays NotReady -- correctly,
# because its readiness probe asserts `Management: Connected`, which is a real
# statement about whether it routes anything.
#
# Order: control plane up -> log in -> create a reusable setup key -> put it in
# 1Password as `netbird` / `setup-key` -> the peer joins by itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-setup-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: netbird-setup-key
    creationPolicy: Owner
  data:
    - secretKey: setup-key
      remoteRef:
        key: netbird
        property: setup-key
