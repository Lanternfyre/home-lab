# The routing peer's enrolment credential, kept separate from netbird-secrets
# ON PURPOSE: it is created at a DIFFERENT TIME. The other two secrets must
# exist before the control plane starts; this one can only be minted after it is
# running and you have signed in.
#
# Separating them means the control plane is not blocked waiting for a value
# that cannot exist yet, and `kubectl get externalsecret -n netbird` shows
# exactly which half of the bootstrap you are in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-setup-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: netbird-setup-key
    creationPolicy: Owner
  data:
    - secretKey: setup-key
      remoteRef:
        key: netbird
        property: setup-key
