# CI runner pods run BELOW everything else in the cluster and never preempt.
# value -100: the default PriorityClass is 0, so under node pressure the
# scheduler evicts/keeps-pending CI before touching workloads.
# preemptionPolicy Never: a queued runner pod must wait for room, not push
# something off a node to make it.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-runner
value: -100
preemptionPolicy: Never
globalDefault: false
description: >-
  GitHub Actions runner pods (ARC). Lowest priority in the cluster, never
  preempts; CI yields to every real workload (ARC v4 plan, C4).
