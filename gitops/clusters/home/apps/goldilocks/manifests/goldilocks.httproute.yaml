# goldilocks on Envoy Gateway. FIRST app migrated in Phase 6 — chosen because
# it is the newest and least load-bearing thing here, so the pattern gets
# proven where a mistake costs nothing.
#
# ── This file used to be ~140 lines ──────────────────────────────────────────
# It carried its own SecurityPolicy (oidc + jwt + authorization) and its own
# ExternalSecret copy of the OIDC client secret. Both are gone: the policy now
# lives ONCE on the `homelab-gated` Gateway and cascades to every route
# attached to it.
#
# So the entire security decision for an app is now WHICH GATEWAY IT NAMES:
#
#   parentRefs: homelab         -> reachable by anything on the LAN
#   parentRefs: homelab-gated   -> Google sign-in, restricted to techyon.dev
#
# That is the whole point. A one-line difference, impossible to get subtly
# wrong, and changing the auth rules is one edit rather than six.
#
# ⚠️ Goldilocks MUST be gated: it has no authentication of its own and renders
# a complete inventory of every workload in the cluster with its resource
# usage — a reconnaissance map.
#
# ⚠️ Google Console still needs `https://goldilocks.lab.techyon.dev/oauth2/callback`
# registered on the OAuth client. The shared policy removes duplicated YAML,
# not Google's exact-match requirement on redirect URIs.
#
# Rollback is reverting the commit that deleted goldilocks.ingress.yaml.
# external-dns retargets the record on its 1-minute interval.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  parentRefs:
    - name: homelab-gated
      namespace: gateway-envoy
      sectionName: https
  hostnames:
    - goldilocks.lab.techyon.dev
  rules:
    - backendRefs:
        - name: goldilocks-dashboard
          port: 80
