# The VPA recommender exposes Prometheus metrics on port 8942, and the chart
# creates NO Service for it -- the only Service it ships is for the Goldilocks
# dashboard. So without these two objects the recommender's own health is
# unobservable, which is exactly the failure this repo keeps re-learning: the
# component runs, looks fine, and is producing nothing that anyone checks.
#
# Selector labels and the port are lifted from the rendered Deployment, not
# guessed -- `helm template` reports pod labels
# {app.kubernetes.io/name: vpa, app.kubernetes.io/component: recommender,
#  app.kubernetes.io/instance: goldilocks} and a single named port `metrics`
# on 8942.
apiVersion: v1
kind: Service
metadata:
  name: goldilocks-vpa-recommender-metrics
  namespace: goldilocks
  labels:
    app.kubernetes.io/name: vpa
    app.kubernetes.io/component: recommender
    app.kubernetes.io/instance: goldilocks
spec:
  type: ClusterIP
  # Headless: this Service exists only to give Prometheus something to
  # discover. Nothing should ever route traffic to the recommender.
  clusterIP: None
  selector:
    app.kubernetes.io/name: vpa
    app.kubernetes.io/component: recommender
    app.kubernetes.io/instance: goldilocks
  ports:
    - name: metrics
      port: 8942
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: goldilocks-vpa-recommender
  namespace: goldilocks
  labels:
    # kube-prometheus-stack's Prometheus selects ServiceMonitors carrying this
    # label -- verified against the live Prometheus CR's serviceMonitorSelector.
    # Without it this object exists, reads correctly, and is loaded by nobody.
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - goldilocks
  selector:
    matchLabels:
      app.kubernetes.io/name: vpa
      app.kubernetes.io/component: recommender
      app.kubernetes.io/instance: goldilocks
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
