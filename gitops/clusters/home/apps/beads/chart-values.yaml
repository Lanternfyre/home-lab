# The beads Dolt server. README.md beside this file has the why, the client
# setup and the runbook; values here are only what differs from the chart.

# Pinned to the Dolt engine bd 1.3.1 is built and tested against. A server
# OLDER than a client's databases cannot open them (the format change is
# one-way), so this moves only with -- or after -- the bd pin in claude-workspace.
image:
  tag: "2.5.1"

auth:
  existingSecret: beads-dolt      # manifests/beads-dolt.external-secret.yaml

# The one app user. Every box and the operator's machine connect as `beads`;
# BEADS_ACTOR (set per client) is what tells them apart in the audit trail.
# The list is the narrowed grant measured on 2026-10-23: every bd command works
# under it -- init (CREATE DATABASE), dep, ready, remember, claim, close,
# `admin compact --analyze`. No FILE/SUPER/GRANT/CREATE USER.
users:
  - name: beads
    host: "%"
    passwordKey: beads-password
    privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX,
                 REFERENCES, CREATE VIEW, SHOW VIEW, TRIGGER, EXECUTE,
                 CREATE ROUTINE, ALTER ROUTINE, EVENT, LOCK TABLES,
                 CREATE TEMPORARY TABLES]

# For the operator's machine, which connects by name and verifies (bd checks
# chain AND hostname -- measured). In-cluster clients stay plaintext: a public
# certificate cannot carry `.svc` names.
tls:
  existingSecret: beads-dolt-tls  # manifests/beads-dolt-tls.certificate.yaml
  requireSecureTransport: false

persistence:
  existingClaim: qnap-beads-dolt  # manifests/qnap-beads-dolt.pvc.yaml

# The LAN door. externalTrafficPolicy Local (the chart default) keeps the
# client's source address, which is what lets the policy admit the LAN CIDR and
# nothing else. No NodePorts: the chart renders allocateLoadBalancerNodePorts
# false.
loadBalancer:
  enabled: true
  annotations:
    external-dns.alpha.kubernetes.io/hostname: beads.lab.lanternfyre.dev
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: beads
    gethomepage.dev/description: Dolt server for bd, the agents' shared issue graph
    gethomepage.dev/group: Databases
    gethomepage.dev/icon: mysql.png

# A renewed certificate and a rotated password are both Secret changes; without
# this the server keeps the old ones until someone remembers to delete the pod.
annotations:
  reloader.stakater.com/auto: "true"
