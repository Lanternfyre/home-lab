# The Dolt server's two passwords, from the 1Password item `Beads Dolt`.
#
#   admin-password -- `admin`@`localhost`, ALL WITH GRANT OPTION. Usable only
#                     from inside the pod (kubectl exec); it is what can
#                     `CALL DOLT_UNDROP` a database an agent dropped.
#   beads-password -- `beads`@`%`, the app user every client connects as. The
#                     SAME item and field feed each box's own `beads-dolt`
#                     ExternalSecret (claude-box chart, `beads.onePasswordItem`).
#
# Rotation is NOT automatic end to end -- the two sides differ:
#   * this server: ExternalSecrets re-reads within the refreshInterval and
#     Reloader rolls it; its init container sets the new password on start.
#   * the boxes: their own `beads-dolt` Secret updates too, but their pods are
#     OnDelete and the claude-box chart forbids a Reloader annotation (a roll
#     kills live sessions). A running box keeps the OLD password in its env, so
#     from the moment this server rolls, every `bd` in every box fails with
#     "Access denied" until that box's pod is deleted.
# So rotate only when the boxes can be restarted right after. The operator's
# machine needs its credentials file updated by hand.
#
# ⚠️ `| trim`: 1Password fields come back with a trailing newline.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beads-dolt
  namespace: beads
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: beads-dolt
    creationPolicy: Owner
    template:
      data:
        admin-password: "{{ .rawAdmin | trim }}"
        beads-password: "{{ .rawBeads | trim }}"
  data:
    - secretKey: rawAdmin
      remoteRef: {key: Beads Dolt, property: admin-password}
    - secretKey: rawBeads
      remoteRef: {key: Beads Dolt, property: beads-password}
