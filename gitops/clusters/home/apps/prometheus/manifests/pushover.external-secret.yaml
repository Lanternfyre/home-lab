# Pushover credentials for Alertmanager.
#
# Pushover needs TWO distinct values and they are easy to confuse:
#   user key  — identifies the RECIPIENT (you). 1Password item PUSHOVER_USER_KEY
#   API token — identifies the SENDING APPLICATION, created at
#               pushover.net/apps/build. 1Password item PUSHOVER_API_KEY
# Sending with only one of them fails; sending with them swapped fails too, and
# Pushover's error is a bare HTTP 400, so it is worth getting right here.
#
# ⚠️ Neither value ever appears in git, and neither is inlined into the
# Alertmanager config. The Secret is mounted into the Alertmanager pods by
# alertmanagerSpec.secrets (see ../chart-values.yaml) and referenced with
# `user_key_file` / `token_file`. Inlining them under alertmanager.config would
# put both credentials into the rendered Helm release AND into this repo.
#
# The keys below become filenames under
#   /etc/alertmanager/secrets/pushover-credentials/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pushover-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: pushover-credentials
    creationPolicy: Owner
    template:
      data:
        # `trim` for the same reason the google-oauth ExternalSecret does it:
        # a 1Password field can carry a trailing newline, and Pushover rejects
        # a user key or token with whitespace baked in — as an opaque 400, with
        # nothing in the Alertmanager log to say the credential was the problem.
        userKey:  "{{ .rawUserKey | trim }}"
        apiToken: "{{ .rawApiToken | trim }}"
  data:
    - secretKey: rawUserKey
      remoteRef:
        key: PUSHOVER_USER_KEY
        property: password
    - secretKey: rawApiToken
      remoteRef:
        key: PUSHOVER_API_KEY
        property: password
