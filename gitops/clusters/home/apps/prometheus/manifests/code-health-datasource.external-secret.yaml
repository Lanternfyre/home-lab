# Grafana's PostgreSQL datasource "Code health" (uid code-health): the views
# in the code-health database (../../../code-health/views.configmap.yaml),
# read as health_reader. code-health-dashboard.yaml and
# code-health-tests-dashboard.yaml query it.
#
# A Secret, not an additionalDataSources entry in ../chart-values.yaml. The
# whole provisioning file is rendered here, password included, and the chart's
# datasource sidecar (grafana-sc-datasources, RESOURCE=both) loads Secrets
# labelled grafana_datasource: "1" in this namespace and has Grafana reload its
# datasources. So the password stays out of the chart values, adding the
# datasource does not restart Grafana (its database is an emptyDir), and a
# rotated password reaches Grafana at the next refresh, which an env var from
# envFromSecret would only do after a restart.
#
# The password comes from the 1Password item CNPG sets the role from
# (CodeHealthReader; ../../../code-health/pg-role-secrets.external-secret.yaml),
# so the two cannot drift. It is used verbatim, never trimmed, because the
# role's password is the item's exact value. toJson quotes it for YAML, and
# every `$` is doubled because Grafana expands $VAR in provisioning files.
#
# Network: nothing to open. monitoring has no egress policy (HARDENING.md, H1)
# and the code-health instances have no ingress policy (cnpg-instance-egress
# is egress only), so Grafana reaches code-health-rw:5432 as the runners do.
# If either side gains a policy, it must admit this path.
#
# Check after a sync, in Grafana: Connections > Data sources > Code health >
# Test says "Database Connection OK".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasource-code-health
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: grafana-datasource-code-health
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          grafana_datasource: "1"
      data:
        # CNPG serves TLS with its own CA, so sslmode require (as the CI
        # writer's DSN). maxOpenConns caps what one dashboard load (about 20
        # panel queries) holds open against PostgreSQL's 100 connections.
        code-health.yaml: |
          apiVersion: 1
          datasources:
            - name: Code health
              uid: code-health
              type: grafana-postgresql-datasource
              access: proxy
              url: code-health-rw.code-health.svc.cluster.local:5432
              user: health_reader
              editable: false
              jsonData:
                database: code_health
                sslmode: require
                maxOpenConns: 10
                maxIdleConns: 2
                connMaxLifetime: 14400
              secureJsonData:
                password: {{ .password | replace "$" "$$" | toJson }}
  data:
    - secretKey: password
      remoteRef:
        key: CodeHealthReader
        property: password
