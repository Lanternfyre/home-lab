# Grafana dashboard "Code health" (uid code-health): Necronia2.0's CI
# code-health records, through the "Code health" datasource
# (code-health-datasource.external-secret.yaml) and the views in
# ../../../code-health/views.configmap.yaml.
#
# Rows: Overall (one number per run across every project: the mutation score
# of the mutants that ran and how many of the generated mutants ran, line and
# branch coverage weighted by size, tests, failures and test time, methods over
# the CRAP threshold, test-gap mass, NDepend debt and critical issues,
# duplicated lines; each a tile with its change against the previous run and a
# trend); Runs (the count by verdict, green or red per branch as a state
# timeline, and every recorded run, linked to GitHub); coverage and mutation
# against the floors, mutation time against the 240 s flag and the 300 s
# trigger, CRAP max and test-gap mass per project; NDepend's six groups (debt
# and issues trend, quality gates, rules, design per assembly, namespace debt,
# worst methods); CI time (wall and build time per run, step time).
#
# Necronia2.0's milestone-ritual falsifier reads the Runs table: every
# recorded run on the milestone branch and main, green and red, none missing.
# A run whose record has no start time (a red build) is still listed.
#
# Variables: $repo (default Lanternfyre/Necronia2.0), $branch (newest first;
# several at once name each series by project and branch) and $project, which
# the Overall row ignores. Every query filters on $repo and reads the record's
# schema only, so a second repository needs just its own producer of the same
# record and the writer's DSN; a panel for a block its records lack (ndepend,
# suites) shows no data.
#
# The queries are SQL against views, not PromQL, so
# scripts/audit-dashboard-queries.py (which reads `expr` only) checks nothing
# here. Test a changed query against a throwaway postgres with the views and a
# few silo records (see views.configmap.yaml's header) before committing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-health-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
