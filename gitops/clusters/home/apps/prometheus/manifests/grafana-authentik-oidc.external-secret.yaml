# Grafana's authentik OIDC client credentials.
#
# Read from the `authentik` namespace through the authentik-oidc store, so the
# exact secret authentik generated for the `grafana` provider is what Grafana
# presents. Nothing is copied by hand and nothing is stored outside the cluster.
#
# Grafana reads GF_AUTH_GENERIC_OAUTH_CLIENT_ID / _SECRET from the environment
# and they override the matching grafana.ini keys -- which is why chart-values
# deliberately omits literal credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-authentik-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: grafana-authentik-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:     "{{ .client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc-grafana
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc-grafana
        property: client_secret
