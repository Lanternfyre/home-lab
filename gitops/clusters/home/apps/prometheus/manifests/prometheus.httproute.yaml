# Prometheus on Envoy Gateway. Replaces prometheus.ingres.yaml.
#
# Attached to `homelab-gated`: Prometheus has NO authentication of its own and
# exposes every metric in the cluster plus a query console. Its Ingress was
# behind oauth2-proxy for that reason, and the edge gate replaces that hop.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    # Carried over verbatim -- dropping these silently removes the app from
    # the homepage dashboard, which is how goldilocks vanished.
    gethomepage.dev/description: Prometheus
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: prometheus.png
    gethomepage.dev/name: Prometheus
spec:
  parentRefs:
    - name: homelab-gated
      namespace: gateway-envoy
      sectionName: https
  hostnames:
    - prometheus.lab.techyon.dev
  rules:
    - backendRefs:
        - name: prometheus-operated
          port: 9090
