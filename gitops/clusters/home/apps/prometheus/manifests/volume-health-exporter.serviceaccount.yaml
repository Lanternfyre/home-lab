# Its own identity, so that a hostPath rule can name it.
#
# The DaemonSet has always run with `automountServiceAccountToken: false`, so
# this ServiceAccount grants nothing and is bound to no Role -- the pod still
# has no API access whatsoever. It exists purely so that admission control has
# a name to key on.
#
# Until now the pod ran as `default`, which every pod in `monitoring` may name
# by omission. That is why monitoring-pod-constraints could not assert hostPath:
# the allow-list would have had to permit `default` and would therefore have
# permitted everything, while looking protective. See the note at the foot of
# kyverno/manifests/monitoring-pod-constraints.validatingpolicy.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-health-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: volume-health-exporter
automountServiceAccountToken: false
