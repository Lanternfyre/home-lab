# Grafana dashboard "Tests and coverage" (uid code-health-tests): the test
# side of Necronia2.0's CI code-health records, through the "Code health"
# datasource (code-health-datasource.external-secret.yaml) and the views in
# ../../../code-health/views.configmap.yaml.
#
# Rows: tests, failures and test time per project, and the suites outside the
# projects; line and branch coverage per project; mutants by status, each
# project's mutation (measured or carried, why, score against floor, Dubious
# lines), survivors per run, and how many of each project's generated mutants
# ran (with its compile errors and ignored mutants per run); the allocation
# ratchet (the record's performance block); the oracle differential (totals,
# per recording, annotated by reason); flakiness (one commit with green and
# red runs) and drift (one commit, different numbers); every count of the
# producer blocks.
#
# Panels that list projects, suites, recordings, annotation reasons or a
# block's counts take them from the data, so a new one shows up without an
# edit. A new counts-only producer block needs its name in health.lens_count
# (views.configmap.yaml) and then shows up in "Every count of the producer
# blocks"; curated panels for it are a copy of the allocation ratchet's two
# with the block's name changed.
#
# Variables: $repo (default Lanternfyre/Necronia2.0), $branch (newest first;
# several at once name each series by project and branch) and $project. Every
# query filters on $repo and reads the record's schema only, so a second
# repository needs just its own producer of the same record and the writer's
# DSN; a panel for a block its records lack (ndepend, suites) shows no data.
#
# The queries are SQL against views, not PromQL, so
# scripts/audit-dashboard-queries.py (which reads `expr` only) checks nothing
# here. Test a changed query against a throwaway postgres with the views and a
# few silo records (see views.configmap.yaml's header) before committing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-health-tests-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
