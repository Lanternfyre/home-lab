              "rawSql": "select case when cardinality(array[${branch:sqlstring}]::text[]) > 1 then project || ' · ' || branch else project end as metric, killed, timeout, survived, no_coverage as \"no coverage\", ignored,\n  compile_error as \"compile error\", runtime_error as \"runtime error\"\nfrom (\n  select v.*, dense_rank() over (partition by v.branch order by v.run_id desc, v.run_attempt desc) as newest\n  from health.project v\n  where repo = any(array[${repo:sqlstring}]::text[])\n    and branch = any(array[${branch:sqlstring}]::text[])\n    and project = any(array[${project:sqlstring}]::text[])\n    and $__timeFilter(at)\n) x\nwhere newest = 1\norder by metric"
