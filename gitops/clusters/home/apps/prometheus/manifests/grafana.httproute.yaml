# Grafana on Envoy Gateway. Replaces grafana.ingress.yaml.
#
# Attached to `homelab-gated`.
#
# This REVERSES the earlier decision, which put Grafana on the open Gateway
# because it authenticated its own users and stacking a second login seemed
# redundant. The reasoning has changed: an app having its own login is not a
# reason to expose its whole surface. Behind the gate, an unauthenticated
# request never reaches Grafana at all -- no login page, no API, no
# unauthenticated endpoint, nothing to probe for a CVE.
#
# Cost today: two sign-ins, because the edge still gates with Google while
# Grafana itself now uses authentik. That is accepted deliberately and is
# temporary -- A5 moves the edge SecurityPolicy onto authentik, after which
# both hops share one identity provider and the second becomes a silent
# redirect against an existing session.
#
# The security decision for any app in this repo is just which Gateway its
# route names:
#   homelab        -> reachable on the LAN, app handles its own auth (or needs none)
#   homelab-gated  -> sign-in enforced at the edge before the app is reachable
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # Carried over from the Ingress verbatim. Dropping these silently removes
    # the app from the homepage dashboard -- that happened to goldilocks and
    # nothing reported it.
    gethomepage.dev/description: Grafana
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: grafana.png
    gethomepage.dev/name: Grafana
spec:
  parentRefs:
    - name: homelab-gated
      namespace: gateway-envoy
      sectionName: https
  hostnames:
    - grafana.lab.techyon.dev
  rules:
    - backendRefs:
        - name: prometheus-operator-grafana
          port: 80
