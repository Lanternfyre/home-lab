
#https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
crds:
  enabled: true

# ── k3s runs these INSIDE the server process, so they are not scrapeable ─────
# kube-prometheus-stack assumes a kubeadm-style cluster where the scheduler,
# controller-manager and kube-proxy are separate pods with their own metrics
# endpoints. In k3s all three live inside the k3s server process and expose no
# such endpoint, so the shipped ServiceMonitors scrape nothing and the matching
# alerts fire permanently:
#
#   KubeSchedulerDown · KubeControllerManagerDown · KubeProxyDown
#
# All three were firing on 2026-08-03 and had been for as long as the stack has
# been installed. They are false, they can never resolve, and they are exactly
# the kind of noise that trains you to ignore the alert that matters — this
# repo already learned that from a leak check that cried wolf.
#
# ⚠️ BOTH halves are required, and disabling only the components makes it
# WORSE. The alerts are `absent(up{job="kube-scheduler"} == 1)` style, so
# removing the ServiceMonitor removes the job entirely and absent() then
# matches even more confidently. The `defaultRules.rules.*` toggles are what
# actually stop them.
#
# kubeEtcd stays enabled AND now gets explicit endpoints. The old comment
# here claimed k3s "does expose etcd metrics on :2381 … so it is genuinely
# being scraped" — DISPROVEN live 2026-08-21: `count by (job) (up)` showed no
# etcd job and zero etcd_disk_* series existed (the etcd_* names in
# Prometheus are apiserver CLIENT metrics). "No etcd alert firing" was
# absence of data, not health — the exact silent-empty class the smartctl
# rules file warns about. Two halves fixed together:
#   1. k3s now sets etcd-expose-metrics: true (ansible k3s_config role) so
#      etcd listens on 0.0.0.0:2381 instead of localhost-only.
#   2. The endpoints below point the chart's kube-etcd Service at the SERVER
#      nodes. ⚠️ Every k3s server is an etcd member, so this list is the
#      CURRENT server set (k8s-5 removed 2026-08-22 on demotion) — a node
#      demotion (45-change-node-role.yml) must
#      remove its IP here, and a promotion must add it.
# This scrape feeds the ARC CI etcd WAL-fsync p99 canary
# (manifests/ci-guards.prometheusrule.yaml) — the standing guard for CI
# runners co-scheduling with etcd members.
#
# ⚠️ 2026-08-21 follow-up: the endpoints mechanism DOES NOT WORK under this
# ArgoCD — it renders a static v1 Endpoints object, and ArgoCD v3's default
# resource.exclusions silently never apply Endpoints/EndpointSlice. The real
# scrape lives in prometheusSpec.additionalScrapeConfigs above (job_name
# kube-etcd, static targets). kubeEtcd is disabled to remove the dead
# Service/ServiceMonitor pair that produced zero targets; the chart's etcd
# defaultRules stay active via defaultRules.rules (they match
# job=~".*etcd.*", which the static job satisfies).
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false

# ── node-exporter: see PVC filesystems, and read the textfile collector ──────
#
# BOTH changes here exist because of the 2026-08-08 storage incident, in which
# six PVC filesystems sat in permanent ext4 error state for SEVEN DAYS and this
# monitoring stack said nothing. That was not bad luck — it was configuration:
#
#   --collector.filesystem.mount-points-exclude=...|var/lib/kubelet/.+|...
#
# Every PVC in this cluster mounts under /var/lib/kubelet/pods/..., so the
# filesystem collector was explicitly told to ignore every volume that matters.
# node-exporter was watching the five root disks and nothing else. There was no
# `node_filesystem_readonly` series for a wedged Postgres volume to be 1 on,
# and no `node_filesystem_device_error` for a statfs that was returning EIO.
#
# ⚠️ `extraArgs` REPLACES the chart's defaults rather than appending, so both
# original args are restated below verbatim except for the one change. Drop
# either and you silently lose the fs-type exclusions or re-break this.
#
# ⚠️ THAT ATTEMPT WAS REVERTED 2026-08-17, and the exclusion is back. Admitting
# the kubelet mounts here CANNOT work, for a reason nothing in the config makes
# visible: node-exporter runs as uid 65534 and /var/lib/kubelet is 0750
# root:root, so every statfs() beneath it returns EACCES. What the collector
# produced was not a storage signal but 192 permanent false criticals — one per
# mount, on all five nodes, 167 of them not even volumes but service-account
# token and secret tmpfs. Measured before reverting: of every mount under
# /var/lib/kubelet/pods, ZERO reported a size and 100% reported device_error=1,
# on nodes rebuilt 17 days ago as much as on the originals. Uniform totality is
# what a permission boundary looks like; a storage fault is never that tidy.
#
# `node_filesystem_readonly` and `node_filesystem_device_error` on PVCs are
# therefore not "unverified" any more, as the original commit labelled them —
# they are unavailable to this exporter at this uid. The signal moved to
# manifests/volume-health-exporter.*, which already runs as root for the mount
# table, has no network listener, no Service and no ServiceAccount token, and
# now emits homelab_volume_{statfs_ok,readonly,size_bytes,avail_bytes} per PVC.
# Making node-exporter root instead was considered and rejected: it mounts the
# whole host root and listens on <nodeIP>:9100 unauthenticated, so it is the
# one component on the node where added privilege costs the most.
#
# Second change: `--collector.textfile.directory`. The textfile collector is
# compiled in and ALREADY RUNNING (node_textfile_scrape_error exists on all
# five nodes) but points at nothing, so it contributes no series. It reads
# through the existing read-only host-root mount at /host/root, so this needs
# no new volume — only somewhere to look. manifests/volume-health-exporter.*
# is what writes there.
prometheus-node-exporter:
  # ── Make node alerts say WHICH NODE ──────────────────────────────────────
  # node-exporter series carry no `node` label -- only `instance`, which is
  # "192.168.33.22:9100". Every built-in node alert inherits that, and the
  # Pushover message template in the alertmanager block below ends with
  #
  #     {{ if .Labels.node }}node: {{ .Labels.node }}{{ end }}
  #
  # which therefore renders EMPTY for all ~15 of them (NodeCPUHighUsage,
  # NodeMemoryHighUtilization, NodeSystemSaturation, NodeFilesystem*, ...).
  # The notification arrives naming an IP and a port, or nothing at all.
  #
  # The endpoints role exposes the pod's node, so promote it to a real label --
  # the same fix, for the same reason, as smartctl-exporter's chart-values.yaml.
  # This is a relabeling, not a metric relabeling: it applies at scrape time to
  # every series from this job at once.
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
  extraArgs:
    # var/lib/kubelet/.+ is excluded again -- see the reversion note above.
    # run/k3s/containerd/.+ is NOT stock and must stay: k3s puts its shm mounts
    # there while the upstream default only lists run/containerd/, which left
    # device_error=1 on 106 tmpfs series.
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|run/k3s/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/host/root/var/lib/node-exporter/textfile_collector

# Accept Prometheus remote_write pushes on the main instance. OTLP metrics from
# external apps (e.g. the Necronia dev server) are relayed by alloy-gateway via
# prometheus.remote_write and now land here, the same instance Grafana queries by
# default. Consolidated from the former standalone `prometheus` CR receiver, which
# had no Service and no datasource (removed in manifests/).
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    # Exemplars are the metric→trace jump: a spike on a latency histogram carries
    # the trace id of one request that produced it. The Necronia server already
    # emits them (OpenTelemetry ExemplarFilterType.TraceBased), but the
    # remote_write receiver DISCARDS exemplars silently unless this feature flag
    # is on — they do not error, they just never arrive. The view half is
    # grafana.sidecar.datasources.exemplarTraceIdDestinations below; both halves
    # are required, and both are what Necronia's ADR-077 lists as the home-lab
    # follow-up it could not do from its own repo.
    enableFeatures:
      - exemplar-storage

    # ── etcd scrape, the way that actually works under ArgoCD ────────────────
    # The kubeEtcd.endpoints mechanism below renders a static v1 Endpoints
    # object — and ArgoCD v3's DEFAULT resource.exclusions drop Endpoints +
    # EndpointSlice, so the object renders in helm and is silently never
    # applied (verified 2026-08-21: chart renders it at --kube-version 1.35,
    # app resource list doesn't contain it, argocd-cm exclusions list both
    # kinds). A static scrape job involves no Endpoints object at all.
    # job_name "kube-etcd" on purpose: the chart's own etcd defaultRules and
    # the ci-guards canary both match it.
    # ⚠️ Same maintenance duty as the kubeEtcd comment: this is the CURRENT
    # server set — demotions remove an IP here, promotions add one.
    additionalScrapeConfigs:
      - job_name: kube-etcd
        metrics_path: /metrics
        static_configs:
          - targets:
              - 192.168.33.3:2381    # k8s-1
              - 192.168.33.2:2381    # k8s-2
              - 192.168.33.7:2381    # k8s-3

# ── Alerts actually reach a human ────────────────────────────────────────────
# Until 2026-08-03 the ONLY receiver was `name: "null"`. Every alert the
# cluster produced went into a black hole — including Watchdog, whose entire
# purpose is to prove the pipeline reaches someone. Seven were firing.
alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/pushover-credentials/<key>.
    # Populated by manifests/pushover.external-secret.yaml from 1Password.
    secrets:
      - pushover-credentials

  config:
    global:
      resolve_timeout: 5m

    route:
      # Group by alertname too, not just namespace: a single node problem
      # otherwise arrives as one notification covering unrelated alerts.
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      # 12h, deliberately. A home lab has no on-call rotation; re-notifying
      # every 4h for something already known is how a phone gets muted, and a
      # muted phone is the same as the null receiver this replaces.
      repeat_interval: 12h
      receiver: pushover
      routes:
        # Watchdog fires CONSTANTLY by design — it is a dead-man's switch meant
        # for an external service that alerts when it STOPS arriving. Routed to
        # Pushover it would be a notification every few minutes forever.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        # InfoInhibitor is not an alert, it is plumbing for the inhibit_rules
        # below. It has no meaning to a human.
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"

    # Stock kube-prometheus-stack inhibitions: do not page about a warning when
    # the critical version of the same thing on the same object is already
    # firing.
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity =~ "warning|info"]
        equal: ["namespace", "alertname"]
      - source_matchers: [severity = "warning"]
        target_matchers: [severity = "info"]
        equal: ["namespace", "alertname"]
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: ["namespace"]

    receivers:
      - name: "null"
      - name: pushover
        pushover_configs:
          # ⚠️ *_file, not literals. The credentials are mounted from the
          # Secret; inlining them would put both into this repo and into the
          # rendered Helm release.
          - user_key_file: /etc/alertmanager/secrets/pushover-credentials/userKey
            token_file: /etc/alertmanager/secrets/pushover-credentials/apiToken
            # Pushover priority: -2..2. critical -> high (1), everything else
            # normal (0). Deliberately NOT 2/emergency: that demands
            # acknowledgement and retries until you tap it, which is wrong for
            # a lab that can be down for a weekend without harm.
            priority: '{{ if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}'
            title: '{{ .Status | toUpper }}{{ if eq .Status "firing" }} ({{ .Alerts.Firing | len }}){{ end }} {{ .CommonLabels.alertname }}'
            message: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ if .Annotations.description }}{{ .Annotations.description }}
              {{ end }}{{ if .Labels.namespace }}ns: {{ .Labels.namespace }}  {{ end }}{{ if .Labels.node }}node: {{ .Labels.node }}{{ end }}
              {{ end }}
            url: https://grafana.lab.techyon.dev
            url_title: Open Grafana
            send_resolved: true

grafana:
  # Google Workspace OIDC. Client ID + Secret are injected as env vars from
  # the grafana-google-oidc Secret (populated from 1Password via the
  # ExternalSecret in external-secrets/manifests/google-oauth.external-secret.yaml).
  # Grafana reads GF_AUTH_GOOGLE_CLIENT_ID / GF_AUTH_GOOGLE_CLIENT_SECRET from
  # the environment and overrides the matching grafana.ini values — so we
  # intentionally omit literal client_id / client_secret in grafana.ini below.
  envFromSecret: grafana-google-oidc

  sidecar:
    datasources:
      # The Prometheus datasource is created by the chart's sidecar, not by the
      # additionalDataSources list below, so this is where its exemplar wiring
      # goes. Note the shape: three SCALAR fields on a dedicated key — it is not
      # a jsonData list of {name, datasourceUid} the way a hand-written Grafana
      # datasource would be. Getting that wrong yields a datasource that looks
      # configured and links nowhere.
      #
      # `traceIdLabelName` must match the exemplar label the OTLP→remote_write
      # path attaches (trace_id). Pairs with prometheusSpec.enableFeatures above.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: View trace

  grafana.ini:
    server:
      root_url: https://grafana.lab.techyon.dev
    auth.google:
      enabled: true
      scopes: openid email profile
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      api_url: https://openidconnect.googleapis.com/v1/userinfo
      allowed_domains: techyon.dev
      hosted_domain: techyon.dev
      allow_sign_up: true
    # All Google-SSO users are auto-assigned Admin on first login — same
    # policy as ArgoCD (policy.default: role:admin). Single-operator lab,
    # the hosted_domain claim restricts logins to techyon.dev so no
    # outsiders can land here. If you ever need to scope this down, switch
    # to a JMESPath role_attribute_path on [auth.google] instead.
    users:
      auto_assign_org: true
      auto_assign_org_role: Admin
    # Keep the local admin login form available as a break-glass path.
    auth:
      disable_login_form: false

  # Loki and Tempo are deployed as sibling ArgoCD apps in this same namespace
  # (see ../loki/ and ../tempo/). They plug into the Grafana bundled with
  # kube-prometheus-stack as additional datasources. The derivedFields entry
  # on the Loki datasource turns any "trace_id=<hex>" in a log line into a
  # clickable link that jumps to the matching Tempo trace view.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        # Native-OTLP logs (alloy-gateway → Loki /otlp) carry the trace id as the
        # `trace_id` structured-metadata field, which becomes a click-through link
        # to Tempo. The second entry is a fallback that matches legacy JSON-blob
        # log lines ("traceid":"<hex>") still within Loki retention.
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            url: "$${__value.raw}"
            datasourceUid: tempo
            urlDisplayLabel: View Trace
          - name: TraceIDLegacy
            matcherType: regex
            matcherRegex: '"traceid":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        # Jump from a span to its logs in Loki, matched by trace id within the
        # span's time window. serviceMap (service graph) is wired in P2 once the
        # Tempo metrics-generator is enabled.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: true
          filterBySpanID: false
          tags:
            - key: service.name
              value: service_name
        # Service Graph reads the Tempo metrics-generator output from Prometheus
        # (the default datasource, uid: prometheus). Powers the topology view.
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
    - name: Pyroscope
      type: grafana-pyroscope-datasource
      uid: pyroscope
      access: proxy
      url: http://pyroscope.monitoring.svc.cluster.local:4040