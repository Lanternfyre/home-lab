# Kubelet pull credentials for the private t3chy0n GHCR packages
# (actions-runner-dotnet — the custom runner image). Same 1Password source as
# bootstrap/ghcr-repo-creds.secret.yaml (key GHCR, t3chy0n PAT with
# read:packages), rendered as a dockerconfigjson the pod template references
# via imagePullSecrets. This is the M11 alternative: packages stay PRIVATE.
# Owned by the arc-lanternfyre dir (namespace-wide object, same convention as
# github-app.external-secret.yaml); both scale sets in the namespace use it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: arc-runners-lanternfyre
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"t3chy0n","password":"{{ .ghcrToken }}","auth":"{{ printf "t3chy0n:%s" .ghcrToken | b64enc }}"}}}

  data:
    - secretKey: ghcrToken
      remoteRef:
        key: GHCR
        property: password
