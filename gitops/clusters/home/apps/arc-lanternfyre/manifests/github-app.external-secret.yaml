# The GitHub App credentials for the Lanternfyre runner scale sets, pulled
# from 1Password (ClusterSecretStore one-password, same pattern as
# bootstrap/ghcr-repo-creds.secret.yaml).
#
# Operator side (M3-M7): 1Password item "ARC-GitHub-App" with fields
#   app-id           -- the App ID (numeric)
#   installation-id  -- the Lanternfyre installation ID (numeric)
#   private-key      -- the App PEM, WITH its trailing newline
#                       (tail -c1 key.pem | xxd  ->  0a)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-runner-github-app
  namespace: arc-runners-lanternfyre
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: gha-runner-github-app
    creationPolicy: Owner

  data:
    - secretKey: github_app_id
      remoteRef:
        key: ARC-GitHub-App
        property: app-id
    - secretKey: github_app_installation_id
      remoteRef:
        key: ARC-GitHub-App
        property: installation-id
    - secretKey: github_app_private_key
      remoteRef:
        key: ARC-GitHub-App
        property: private-key
