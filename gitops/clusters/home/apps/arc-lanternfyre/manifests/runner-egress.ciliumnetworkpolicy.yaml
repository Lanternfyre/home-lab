# Egress allowlist for the CI runner pods (ARC v4, C10 — deliberately the
# LAST commit of the ARC rollout: with everything else proven green, a
# failure after this lands is unambiguously the policy).
#
# ── Why CiliumNetworkPolicy, not NetworkPolicy ───────────────────────────────
# A plain NetworkPolicy is one spec with two engines watching it (Cilium +
# kube-router); a CNP is a CRD only Cilium acts on — exactly one place to
# debug. These are the FIRST hand-authored network policies in the repo, and
# adding them re-arms the 35-cilium-migrate straggler preflight (its
# zero-policy-objects escape hatch closes — by design).
#
# ── 🔴 The node-admit rule is non-negotiable ─────────────────────────────────
# A policy that selects a pod must also admit the NODE, or kubelet probes are
# denied and the pod crash-loops. This empirically took out argocd-repo-server
# (chart policy admitted namespaces; a kubelet probe comes from the node).
# CILIUM-MIGRATION.md:521's claim of implicit host allow is CONTRADICTED by
# that observed crash-loop — the empirical account is later and wins. The
# ingress fromEntities [host, remote-node] rule below is that admit; V6 proves
# it (pod must NOT crash-loop on probes).
#
# ── What runners may reach ───────────────────────────────────────────────────
# DNS (kube-dns, with L7 dns inspection so toFQDNs can resolve), the GitHub
# service surface (api/codeload/objects/pkg-containers), GHCR, the .NET/node
# package registries, and the in-cluster object store at s3.lab.techyon.dev
# (MinIO — where every ratcheted baseline and the BADASS history live).
# Everything else — INCLUDING the cluster-local pod
# and service space — is denied by the default-deny that selecting the pods
# creates. V6's cluster-local curl must time out.
#
# The dind set is covered too: both scale sets' pods carry
# actions.github.com/scale-set-namespace: arc-runners-lanternfyre labels; the
# endpointSelector below selects EVERYTHING in this namespace, runner and
# listener alike (listeners live in arc-systems, so they are NOT selected —
# their long-poll to GitHub is untouched).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner-egress
  namespace: arc-runners-lanternfyre
spec:
  endpointSelector: {}   # every pod in this namespace (runners + dind)

  ingress:
    # Node-admit: kubelet startup/liveness probes originate from the host
    # (this node) or, under some topologies, another node.
    - fromEntities:
        - host
        - remote-node

  egress:
    # DNS to kube-dns, with the DNS proxy engaged so toFQDNs below works.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # The in-cluster object store. CI publishes quality reports and reads the
    # baselines its regression gates compare against, so a runner that cannot
    # reach Silo cannot complete a quality pipeline at all.
    #
    # ⚠️ toEndpoints, NOT toFQDNs. This is east-west traffic to a ClusterIP; the
    # DNS-proxy path that backs toFQDNs only applies to egress leaving the
    # cluster, so an FQDN rule here would match nothing and the connection would
    # still be dropped.
    #
    # Port 9000 only — the S3 API. The console (9001) is a browser surface
    # reached through the Gateway by people, and a build runner has no business
    # talking to it.
    #
    # Added 2026-08-27, after a CI store probe failed with
    #   dial tcp 10.43.122.208:9000: i/o timeout
    # which is what this allowlist looks like from the outside: not a refusal,
    # just silence.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: silo
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

    # The GitHub + package-registry surface the workflows actually use.
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: uploads.github.com
        # The whole *.githubusercontent.com constellation, not hand-picked
        # hosts (release-assets, raw, objects, pipelines*, results-receiver…
        # — all GitHub-operated CDN; enumerating them is a treadmill).
        # ⚠️ Cilium's `*` matches EXACTLY ONE DNS label (it cannot span a
        # dot), so BOTH patterns are required: the first for
        # release-assets.githubusercontent.com-class hosts, the second for
        # pipelinesghubeus3.actions.githubusercontent.com-class broker hosts.
        # Dropping the second silently killed the runner long-poll while DNS
        # still resolved — connection timeouts, not NXDOMAIN (2026-08-21).
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.actions.githubusercontent.com"
        - matchName: ghcr.io
        - matchPattern: "*.ghcr.io"
        - matchName: api.nuget.org
        - matchName: www.nuget.org
        - matchName: registry.npmjs.org
        - matchName: dot.net
        - matchName: builds.dotnet.microsoft.com
        - matchName: ci.dot.net
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: sh.rustup.rs
        - matchName: static.rust-lang.org
        - matchName: crates.io
        # ⚠️ matchPATTERN, not matchName. matchName is validated against
        # '^([-a-zA-Z0-9_]+[.]?)+$' and rejects '*' outright. As matchName this
        # entry did not merely fail to match — the CRD rejected the WHOLE
        # object, so every other change in the same apply (pypi.org,
        # files.pythonhosted.org, sh.rustup.rs, static.rust-lang.org, crates.io)
        # never reached the cluster either, and the runners kept running the
        # last valid version. ArgoCD reported Synced/Healthy throughout; the
        # error was only visible as a ComparisonError on the Application.
        # Cilium's '*' still spans exactly ONE label, so this covers
        # index.crates.io and static.crates.io but NOT a deeper name.
        - matchPattern: "*.crates.io"
        - matchPattern: "*.blob.core.windows.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # ── The in-cluster object store (MinIO, silo) ───────────────────────────
    # Runners publish NDepend/Stryker reports and the BADASS score history to
    # it, and FETCH the baselines every ratcheted gate compares against. Without
    # this rule there is no baseline, so no ratchet, so no NDepend/mutation/
    # coverage regression detection at all.
    #
    # Found the hard way (2026-08-28): the default-deny this policy creates was
    # working exactly as documented above — "everything else, INCLUDING the
    # cluster-local pod and service space, is denied". From a consumer repo it
    # surfaced as
    #   dial tcp 192.168.32.18:443: i/o timeout
    # after DNS had resolved correctly, which reads as a broken store rather
    # than a denied egress. Bucket, credentials and endpoint were all correct.
    #
    # ⚠️ Traffic goes out to the GATEWAY (s3.lab.techyon.dev -> the homelab
    # gateway LB), not straight to the minio Service, because the consumers are
    # configured with the external endpoint. toFQDNs is therefore the right
    # match here; a toEndpoints rule against namespace minio would NOT admit
    # this traffic, since the pod dials the gateway address.
    - toFQDNs:
        - matchName: s3.lab.techyon.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Certificate revocation infrastructure — plain HTTP :80 by design (CRL
    # and OCSP are pre-TLS protocols). Found the hard way (2026-08-21):
    # Metalama's compile-time assemblies are Authenticode-signed and .NET
    # validates the chain, phoning OCSP/CRL; the 443-only policy silently
    # dropped it, the check hung, and Metalama's 120s temp-project budget
    # blew as LAMA0083 "could not build the internal project". Hubble showed
    # 160+ drops to crl3/crl4/ocsp.digicert.com + ts-ocsp.ws.symantec.com.
    # Extend this list from `hubble observe --verdict DROPPED` evidence, not
    # guesswork. Port 80 ONLY here — nothing else widens.
    - toFQDNs:
        - matchPattern: "*.digicert.com"
        - matchPattern: "*.ws.symantec.com"
        - matchName: crl.microsoft.com
        - matchName: oneocsp.microsoft.com
        - matchName: www.microsoft.com
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
