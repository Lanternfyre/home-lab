# GHCR pull credential for this namespace.
#
# The auq images are PRIVATE packages, and an imagePullSecret is a namespaced
# Secret -- no namespace inherits one from anywhere else. Without this the pods
# sit in ImagePullBackOff.
#
# ⚠️ `username` is a PERSON, not the org. GHCR ignores it when the password is
# a valid classic PAT, and a fine-grained PAT cannot authenticate to ghcr.io at
# all. Same item and same caveat as bootstrap/ghcr-repo-creds.secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-docker
  namespace: auq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: ghcr-docker
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"t3chy0n","password":"{{ .ghcrToken }}"}}}
  data:
    - secretKey: ghcrToken
      remoteRef:
        key: GHCR
        property: password
