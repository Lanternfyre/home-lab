# The Metro dev server for auq's mobile client.
#
# 🟢 NAMED FOR THE APP, NOT THE TOOL, AND THAT IS DELIBERATE. This was
# `metro.lab.techyon.dev` until 2026-09-12. A Metro dev server cannot be shared:
# it is bound to one project root, serves that project's manifest and bundle,
# and the JavaScript is baked into the image. A second mobile app means a second
# image and a second instance, never a second consumer of this one -- so a
# generic `metro` hostname would have been the first app to claim a name every
# later app also wanted.
#
# Un-gated for the same structural reason auq is: the dev client is not a
# browser and cannot complete an OIDC sign-in. Reachable from the LAN and over
# NetBird, which is the whole audience.
#
# 🔴 THIS HOSTNAME APPEARS TWICE MORE, IN chart-values.yaml, AND ALL THREE MUST
# AGREE:
#   mobile.packagerHostname   the host Expo advertises
#   mobile.packagerProxyUrl   the FULL external URL, scheme included
#
# Measured 2026-09-12, and the reason packagerHostname alone is not enough:
# Expo appends its own listen port, so with only the hostname set the manifest
# advertises https://<host>:8081/index.ts.bundle while this Gateway serves 443.
#
#   curl https://<host>/status       -> 200 in 14ms
#   curl https://<host>:8081/status  -> 000, no listener
#
# The dev client fetches the manifest over 443 without complaint, then follows
# that bundle URL into nothing. It HANGS; there is no 404 and no error naming
# the cause. packagerProxyUrl is what makes the advertised URL match this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auq-mobile
  namespace: auq
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=auq,app.kubernetes.io/component=mobile"
    gethomepage.dev/name: auq mobile
    gethomepage.dev/description: Expo dev server for the auq mobile client
    gethomepage.dev/group: Agents
    gethomepage.dev/icon: mdi-cellphone-link
spec:
  parentRefs:
    - name: homelab
      namespace: gateway-envoy
      sectionName: https
  hostnames:
    - auq-mobile.lab.techyon.dev
  rules:
    # Metro holds a websocket for hot reload and streams bundles that take
    # minutes to build on a cold cache. Envoy's 15s default would cut both.
    - timeouts: {request: 0s}
      backendRefs:
        - {name: auq-auq-mobile, port: 8081}
