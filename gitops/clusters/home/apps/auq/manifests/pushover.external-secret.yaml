# Pushover credentials for auq-server -- the SAME two 1Password items
# Alertmanager uses (apps/prometheus/manifests/pushover.external-secret.yaml).
#
# auq-server reads AUQ_PUSHOVER_TOKEN (the sending application's token) and
# AUQ_PUSHOVER_USER_KEY (the recipient), and quietly skips the Pushover leg unless
# BOTH are non-blank (PushoverOptions.IsConfigured). That is why nothing ever
# arrived: neither was set. chart-values.yaml's server.secretEnv maps the two
# keys below onto those env names.
#
# ⚠️ Easy to swap, and Pushover answers a swap with a bare HTTP 400:
#   userKey  <- PUSHOVER_USER_KEY  (you, the recipient)
#   apiToken <- PUSHOVER_API_KEY   (the application token)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pushover-credentials
  namespace: auq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: pushover-credentials
    creationPolicy: Owner
    template:
      data:
        # `trim`: a 1Password field can carry a trailing newline, and Pushover
        # rejects whitespace in either value as an opaque 400.
        userKey:  "{{ .rawUserKey | trim }}"
        apiToken: "{{ .rawApiToken | trim }}"
  data:
    - secretKey: rawUserKey
      remoteRef:
        key: PUSHOVER_USER_KEY
        property: password
    - secretKey: rawApiToken
      remoteRef:
        key: PUSHOVER_API_KEY
        property: password
