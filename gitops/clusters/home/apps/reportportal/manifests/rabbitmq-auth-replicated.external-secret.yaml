# The RabbitMQ credential, republished into the reportportal namespace.
#
# Same pattern and same reason as ../../immich/manifests/redis-auth-replicated.external-secret.yaml:
# a Secret cannot cross namespaces, so the shared 1Password item is materialised
# separately on each side rather than copied by hand.
#
# ⚠️ The key MUST be `rabbitmq-password`. RP's chart hardcodes that string in
# every deployment template (api, uat, jobs, analyzer) and offers no
# passwordKeyName override the way the database and searchengine blocks do --
# which is the whole reason this file exists instead of pointing
# msgbroker.secretName straight at a differently-shaped secret.
#
# Source of truth: 1Password item "RabbitMQ", field `password`, the same field
# ../../rabbitmq/manifests/rabbitmq-auth.external-secret.yaml reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-auth
  namespace: reportportal
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: rabbitmq-auth
    creationPolicy: Owner

  data:
    - secretKey: rabbitmq-password
      remoteRef:
        key: RabbitMQ
        property: password
