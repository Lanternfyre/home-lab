# The `reportportal` Postgres role's password, in the reportportal namespace.
#
# The shared PostgresHA `password` — the same field the necronia and techyon
# roles use, and the same one ../../postgres/manifests/pg-role-secrets.yaml
# reads to provision this role on the CNPG cluster.
#
# Two ExternalSecrets rather than one Secret because a Secret cannot be mounted
# across namespaces: CNPG needs it in `databases` to set the password, RP needs
# it in `reportportal` to use it. One source of truth in 1Password,
# materialised twice.
#
# ⚠️ Rotating the field rotates BOTH sides here AND the other two roles.
# Rotating one side alone leaves RP unable to authenticate.
#
# The key name `postgresql-password` matches database.passwordKeyName in
# ../chart-values.yaml -- unlike the RabbitMQ credential, this one IS
# configurable, so the two must be kept in step.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-db
  namespace: reportportal
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: reportportal-db
    creationPolicy: Owner

  data:
    - secretKey: postgresql-password
      remoteRef:
        key: PostgresHA
        property: password
