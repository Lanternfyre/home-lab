# ReportPortal's initial superadmin password.
#
# Operator side: 1Password item "ReportPortal" with fields
#   password   -- the initial password for the `superadmin` account. Plain
#                 `password` because it is the only password on the item; the
#                 other field is a token, not a second credential.
#   api-token  -- see the note below; NOT consumed by this cluster
#
# Note the deliberate asymmetry with the Kubernetes side: the SECRET KEY below
# stays `superadmin-password`, because inside the cluster it sits next to other
# unrelated keys and "password" alone would not say whose. The 1Password item
# has no such ambiguity.
#
# ⚠️ FIRST LAUNCH ONLY. RP reads this when it creates the superadmin account and
# never again -- the password then lives in Postgres and is changed through the
# UI. Rotating the 1Password field afterwards changes nothing in the running
# system, so do not treat this as a live credential: it is a bootstrap seed.
# (Set it anyway before first sync. The chart's fallback is a well-known default
# baked into its values file.)
#
# ── Why `api-token` is not in here ───────────────────────────────────────────
# CI needs an RP API token to import test results, and that token cannot exist
# until RP is running and a human has generated it in the UI. It is also
# consumed by GitHub Actions, not by a pod -- and ExternalSecrets feeds pods
# only. So it lives in the same 1Password item for tidiness, and is copied by
# hand into a GitHub Actions secret. Nothing in this repo reads it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-admin
  namespace: reportportal
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: reportportal-admin
    creationPolicy: Owner

  data:
    - secretKey: superadmin-password
      remoteRef:
        key: ReportPortal
        property: password
