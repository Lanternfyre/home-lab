# ReportPortal on Envoy Gateway. The chart's Ingress is disabled in
# chart-values.yaml.
#
# ⚠️ THIS DELIBERATELY DIFFERS FROM THE CHART'S OWN ROUTE, and the difference is
# the fix for a real bug. Read before "correcting" it back.
#
# The chart's templates/ingress/gateway-http-route.yaml sends `/` to
# reportportal-index. That breaks the UI: the SPA requests several of its
# bundles at the ROOT (/polyfills.app.<hash>.js, /main.app.<hash>.js,
# /main_app.app.<hash>.js, /favicon.ico), index does not serve them, and it
# answers with `302 -> /ui/#notfound`. The browser gets a redirect where it
# expects JavaScript, the SPA never boots, and the user is dropped on uat's bare
# Spring login page — which offers only a SAML button, because no SAML provider
# is registered. It looks like a broken login; it is a broken asset route.
# Observed 2026-08-23; the login itself was never at fault.
#
# ── Why the root belongs to `ui` ─────────────────────────────────────────────
# reportportal-ui is an nginx SPA catch-all: it serves the real bundles at root
# (verified: /polyfills.app.<hash>.js returns 39679 bytes of
# application/javascript, byte-identical to the /ui/ copy) and falls back to
# index.html for anything it does not recognise.
#
# ⚠️ That fallback is exactly why `/` alone is NOT enough. ui answers 200 +
# text/html for ANY path, including /composite/info and a deliberately bogus
# one. Routing everything to it would silently turn index's JSON endpoints into
# HTML — a 200 that looks healthy and is wrong. So index keeps its four real
# endpoints, enumerated explicitly below, and ui gets the rest.
#
#     /composite  -> index  8080   JSON (info + health; the SPA reads these)
#     /info       -> index  8080   JSON
#     /health     -> index  8080   JSON
#     /ui         -> ui     8080
#     /uat        -> uat    9999   authorization / login
#     /api        -> api    8585
#     /           -> ui     8080   SPA + its root-level assets
#
# Note the three DIFFERENT ports; only ui and index listen on 8080.
#
# Gateway API resolves Exact before PathPrefix, and longer prefixes before
# shorter, so /info and /health beat the `/` catch-all and the order below is
# for human readability only.
#
# No URLRewrite filter anywhere, matching the chart: each service receives the
# full original path INCLUDING its prefix. That is why the API's own routes are
# `/api/v1/...` and not `/v1/...`. Adding a rewrite would break every one.
#
# Attached to `homelab-gated`. RP has its own login, so the gate is defence in
# depth rather than the only lock — the same posture as ../../rabbitmq.
#
# ⚠️ CI runners do NOT come through here. They post to the in-cluster
# reportportal-api Service over cluster DNS, which is why the ../../arc-t3chy0n
# egress policy opens port 8585 into this namespace. Ingestion never leaves the
# cluster and this hostname is for humans only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reportportal
  namespace: reportportal
  annotations:
    gethomepage.dev/description: Test results + history
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: CI/CD
    # ⚠️ reportportal.png does not exist in the dashboard-icons set — verified
    # 404 on both mirrors — and a missing icon fails SILENTLY, rendering a blank
    # tile rather than an error. mdi- names come from Material Design Icons,
    # which homepage bundles, so they cannot 404.
    gethomepage.dev/icon: mdi-clipboard-check-outline
    gethomepage.dev/name: ReportPortal
spec:
  parentRefs:
    - name: homelab-gated
      namespace: gateway-envoy
      sectionName: https
  hostnames:
    - reports.lab.techyon.dev
  rules:
    - matches:
        - path: {type: PathPrefix, value: /composite}
      backendRefs:
        - name: reportportal-index
          port: 8080
    - matches:
        - path: {type: Exact, value: /info}
        - path: {type: Exact, value: /health}
      backendRefs:
        - name: reportportal-index
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /uat}
      backendRefs:
        - name: reportportal-uat
          port: 9999
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: reportportal-api
          port: 8585
    - matches:
        - path: {type: PathPrefix, value: /ui}
      backendRefs:
        - name: reportportal-ui
          port: 8080
    # Catch-all LAST for readability; Gateway API resolves by specificity.
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: reportportal-ui
          port: 8080
