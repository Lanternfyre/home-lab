# MinIO — S3-compatible object store for CI artifacts.
#
# Two consumers, two very different access needs, which is what most of the
# configuration below is about:
#
#   reports/   rendered HTML quality reports (NDepend, Stryker, BADASS).
#              ANONYMOUSLY READABLE so a browser can open them: an HTML report
#              pulls its CSS and JS through relative links, and a presigned URL
#              signs exactly one object, so every sub-request would 403 and the
#              page would render broken.
#   baseline/  the .ndar analysis result, the trend history, the Stryker
#              baseline. PRIVATE, and the only data here that is NOT
#              regenerable — see protected-volumes.yaml.
#
# The access scope is the FIRST key segment on purpose. `mc anonymous set` takes
# a literal prefix and cannot wildcard, so scope-first makes "every report is
# readable" one fixed prefix that never changes as projects are added.

# ── Server image: Silo, not upstream MinIO ───────────────────────────────────
# Silo (github.com/pgsty/silo) is a community fork of MinIO, AGPL-3.0, maintained
# by Pigsty who run it for Postgres backups. Two reasons it is the better binary
# here, both of which upstream created deliberately:
#
#   1. Upstream stripped the web CONSOLE from the community edition in 2025,
#      leaving a read-only object browser. Silo restores it — and a console is
#      most of why this service has a hostname at all.
#   2. The upstream community chart's last release was 5.4.0 in Jan 2025;
#      MinIO now steers people at the Operator. Silo ships current releases with
#      SBOMs and Sigstore signatures.
#
# ⚠️ The CHART stays the official minio 5.4.0. Silo publishes no Helm repository
# — its chart lives only in git — and its chart is a fork of this one with the
# same keys and different image defaults. So swapping charts would buy nothing
# and cost a migration. Only the images change.
#
# Silo's contract: "the product and its delivery surfaces are renamed; the
# protocol and your data are not." S3 API, MINIO_* variables and on-disk format
# are preserved under CI compatibility checks, which is why every value below —
# and every credential, secret name and hostname — is untouched.
image:
  repository: pgsty/silo
  tag: RELEASE.2026-08-06T00-00-00Z
  pullPolicy: IfNotPresent

# The post-install jobs run `mc`. The silo image bundles mcli and provides
# /usr/bin/mc as a compatibility link, so one image serves both and there is no
# second upstream dependency to go stale.
mcImage:
  repository: pgsty/silo
  tag: RELEASE.2026-08-06T00-00-00Z
  pullPolicy: IfNotPresent

# ── Rollout strategy ─────────────────────────────────────────────────────────
# ⚠️ Recreate, NOT RollingUpdate, and this is load-bearing with an RWO volume —
# the same rule ../pihole/chart-values.yaml documents.
#
# The chart defaults to RollingUpdate with maxSurge 100%, which starts the new
# pod BEFORE terminating the old one. Two pods cannot mount one ReadWriteOnce
# iSCSI volume, so the new pod sits in ContainerCreating with
#
#   Multi-Attach error for volume "pvc-..." Volume is already used by pod(s) ...
#
# while the old pod refuses to die. Every future change to this app would
# deadlock. Observed here on 2026-08-27, exactly as pihole predicted.
deploymentUpdate:
  type: Recreate

mode: standalone          # one node; this is a CI artifact store, not a fleet
replicas: 1

# ── Credentials ──────────────────────────────────────────────────────────────
# From 1Password via manifests/minio-auth.external-secret.yaml. NEVER let the
# chart generate these: it writes them into a Secret it owns, so an upgrade can
# regenerate them and every stored credential elsewhere stops matching.
existingSecret: minio-auth
rootUser: ""
rootPassword: ""

# ── Storage ──────────────────────────────────────────────────────────────────
# The PVC is declared in manifests/, not by the chart, because a chart cannot put
# LABELS on its own PVC and `homelab.techyon.dev/protect` must be declarative —
# the same reason pihole and mealie do it this way.
persistence:
  enabled: true
  existingClaim: minio-data
  accessMode: ReadWriteOnce

# ── Buckets ──────────────────────────────────────────────────────────────────
# policy: none — the chart's bucket policies are BUCKET-WIDE, which would expose
# baseline/ alongside reports/. The prefix-scoped grant is in customCommands.
buckets:
  - name: ci-reports
    policy: none
    purge: false
    versioning: false

# Runs as a post-install/upgrade Job. Idempotent, so re-running on every sync is
# harmless.
#
# ⚠️ This one line is what makes report links openable in a browser. Remove it
# and every link 403s while the pipeline stays green — the failure only shows up
# when somebody clicks one.
customCommands:
  - command: "anonymous set download myminio/ci-reports/reports"

# ── Least privilege for CI ───────────────────────────────────────────────────
# CI gets a scoped account, never the root credential. The root key can create
# and delete buckets and rewrite policies; the pipeline only ever needs to read
# and write objects in one bucket, and that key is copied into GitHub org secrets
# where more people and more machines can see it.
policies:
  - name: ci-reports-rw
    statements:
      # Objects: read/write/delete plus the multipart verbs, because rclone
      # switches to multipart for anything sizeable and a partial grant fails
      # only on large uploads -- the worst kind of intermittent.
      - resources:
          - "arn:aws:s3:::ci-reports/*"
        actions:
          - "s3:GetObject"
          - "s3:PutObject"
          - "s3:DeleteObject"
          - "s3:AbortMultipartUpload"
          - "s3:ListMultipartUploadParts"
      # Bucket-level: listing is not optional. The store probes reachability with
      # a bucket list before every operation, precisely so an unreachable store
      # fails the build loudly instead of skipping silently.
      - resources:
          - "arn:aws:s3:::ci-reports"
        actions:
          - "s3:ListBucket"
          - "s3:GetBucketLocation"
          - "s3:ListBucketMultipartUploads"

# ⚠️ This list REPLACES the chart default, and it must. The shipped default
# creates a user `console` with password `console123` and the consoleAdmin
# policy -- a well-known admin credential, on an admin console, that nobody would
# think to look for.
# ⚠️ accessKey must be 3-20 characters. MinIO rejects anything shorter with
# "The access key is invalid. (access key length should be between 3 and 20)",
# and because the make-user container is one of several running CONCURRENTLY in
# the post-job pod, the bucket and the anonymous grant are created successfully
# while the job as a whole sits in Error — the store looks half-working rather
# than plainly broken. `ci` was two characters and did exactly that.
users:
  - accessKey: github-ci
    existingSecret: minio-auth
    existingSecretKey: ciPassword
    policy: ci-reports-rw

# ── Services ─────────────────────────────────────────────────────────────────
# ClusterIP both: exposure is via HTTPRoutes in manifests/, not LoadBalancers.
service:
  type: ClusterIP
  port: 9000
consoleService:
  type: ClusterIP
  port: 9001

# Routing lives in manifests/*.httproute.yaml, on Envoy Gateway. The chart's own
# Ingress objects would be a second, conflicting source of truth.
ingress:
  enabled: false
consoleIngress:
  enabled: false

resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 2Gi

# ── Console login: Google, not a shared password ─────────────────────────────
# Without this the console asks for the ROOT credential, so the admin key gets
# typed into a browser regularly and shared with whoever needs console access.
# With it, sign-in is per-person against Google and root stays in 1Password as
# break-glass — it still works the day Google is unreachable.
#
# ⚠️ Configured through extraSecret / config.env, NOT the chart's `oidc:` block.
# That block has no key for MINIO_IDENTITY_OPENID_ROLE_POLICY, and it always
# emits MINIO_IDENTITY_OPENID_CLAIM_NAME (defaulting to "policy"). Role policy
# and claim name are MUTUALLY EXCLUSIVE — MinIO rejects both at startup — and
# Google never emits a `policy` claim, so the chart's path leads to users who
# authenticate successfully and then have no permissions at all. config.env sets
# exactly the variables we want and no others.
extraSecret: minio-oidc-config

environment:
  TZ: "Europe/Warsaw"
  # Tells the console which public URL it is served on, so it builds the OIDC
  # callback as <this>/oauth_callback. Behind a Gateway the console cannot infer
  # it from the request, and gets the redirect wrong without this.
  MINIO_BROWSER_REDIRECT_URL: "https://minio.lab.techyon.dev"
  # Path-style addressing only. The wildcard cert covers *.lab.techyon.dev, which
  # is ONE label — bucket.s3.lab.techyon.dev would need a new cert and a new
  # listener. Leaving MINIO_DOMAIN unset keeps MinIO on s3.lab.techyon.dev/<bucket>.
