# MinIO root credentials, pulled from 1Password (ClusterSecretStore one-password).
#
# Operator side: 1Password item "MinIO" in the Infrastructure vault, with fields
#   rootUser      -- the root access key   (cluster-only: the chart and the console)
#   rootPassword  -- the root secret key   (cluster-only)
#   ciPassword    -- the secret key for the scoped `ci` account used by GitHub
#                    Actions. THIS is the one that leaves the cluster.
#
# The first two secretKey names are NOT free choice: the chart reads exactly
# `rootUser` and `rootPassword` out of existingSecret
# (templates/statefulset.yaml:136-141). `ciPassword` is referenced by
# users[].existingSecretKey in chart-values.yaml.
#
# CI never gets root. The root credential can create and delete buckets and
# rewrite policies; the pipeline only needs objects in one bucket, and its key is
# copied into GitHub org secrets where more machines can read it.
#
# ⚠️ BOTH VALUES MUST BE ALPHANUMERIC — [A-Za-z0-9] only, no punctuation. These
# are S3 credentials, and S3 credentials end up interpolated raw into connection
# strings and endpoint URLs by tooling that does not URL-encode them. A `/` in a
# secret key is the classic one: it silently truncates the credential and the
# failure surfaces as SignatureDoesNotMatch, which reads like a clock-skew or
# region problem and sends you looking in the wrong place entirely. Use
# 1Password's generator with symbols OFF, 40 characters.
#
# ⚠️ Both fields must exist BEFORE first sync. If existingSecret is missing or
# incomplete the chart falls back to generating a random root credential into a
# Secret it owns — which is regenerated on some upgrades, at which point every
# stored credential in GitHub org secrets stops matching and every CI job fails
# to reach the store at once.
#
# ⚠️ Rotating these means rotating the GitHub org secrets
# OBJECT_STORE_ACCESS_KEY_ID / OBJECT_STORE_SECRET_ACCESS_KEY in the same sitting.
# CI hard-fails on an unreachable store by design, so a half-done rotation reds
# every pipeline rather than degrading quietly. That is intended; just do both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-auth
  namespace: minio
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: minio-auth
    creationPolicy: Owner

  data:
    - secretKey: rootUser
      remoteRef:
        key: MinIO
        property: rootUser
    - secretKey: rootPassword
      remoteRef:
        key: MinIO
        property: rootPassword
    - secretKey: ciPassword
      remoteRef:
        key: MinIO
        property: ciPassword
