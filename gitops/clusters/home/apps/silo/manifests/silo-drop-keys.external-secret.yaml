# Secret of `drop-keys`, the parent user of the expiring drop keys
# (users: in ../chart-values.yaml). Generated, not stored in 1Password.
#
# Nobody ever signs with this secret. `drop-keys` exists only to own the keys
# scripts/silo-drop-key.sh mints, and each of those carries its own secret. So
# there is nothing to keep, share or rotate, and no operator step before the
# first sync. Same generator pattern as
# ../../authentik/manifests/oidc-clients.external-secret.yaml.
#
# refreshInterval "0": generated once. If the Secret is ever regenerated anyway,
# the chart's make-user step resets the user's secret to match on the next sync
# and every minted key keeps working.
#
# Letters and digits only, per the Silo warning in
# docs/operate/standing-warnings.md: tools interpolate S3 secrets raw into URLs.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: silo-drop-keys
  namespace: silo
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-drop-keys
  namespace: silo
spec:
  refreshInterval: "0"
  target:
    name: silo-drop-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The key name is what users[].existingSecretKey reads.
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: silo-drop-keys
