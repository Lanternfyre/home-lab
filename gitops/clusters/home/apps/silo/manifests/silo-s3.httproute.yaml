# Silo S3 API — on the OPEN gateway.
#
# ⚠️ This route MUST NOT be gated, and the reason is the same one that keeps
# immich open (../../immich/manifests/immich.httproute.yaml): the clients are not
# browsers. `mc`, the aws SDKs, the GitHub Actions runners, and — when they are
# wired up — Velero and CNPG's barman all speak S3 with a request signature and
# cannot complete a Google OIDC redirect. Putting this behind homelab-gated
# breaks every one of them with an HTML login page where they expect XML.
#
# Path-style addressing: https://s3.lab.techyon.dev/<bucket>/<key>. Virtual-host
# style would need bucket.s3.lab.techyon.dev, which the *.lab.techyon.dev
# wildcard cert does not cover — it matches one label — and would need its own
# listener as well.
#
# ⚠️ Consequence, accepted deliberately: objects under reports/ are anonymously
# readable, so anyone who can reach this gateway can read a quality report. The
# gateway is on a private LB address (192.168.32.18), so that means the LAN, not
# the internet. Everything else in the bucket — baseline/ especially — still
# requires a signed request.
#
# No gethomepage.dev annotations here on purpose: this is a machine endpoint and
# has nothing a person would click. The console route carries the homepage entry.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo-s3
  namespace: silo
spec:
  parentRefs:
    - name: homelab
      namespace: gateway-envoy
      sectionName: https
  hostnames:
    - s3.lab.techyon.dev
  rules:
    - backendRefs:
        - name: silo
          port: 9000
