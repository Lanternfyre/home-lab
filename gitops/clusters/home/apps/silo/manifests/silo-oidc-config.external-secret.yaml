# MinIO OpenID configuration, rendered into the config.env file MinIO reads via
# MINIO_CONFIG_ENV_FILE (chart `extraSecret`). TWO providers:
#
#   (default)  the console login. The authentik client `silo`
#              (../../authentik/manifests/blueprint-silo.external-secret.yaml);
#              its client_id and secret come from the authentik-oidc store.
#              ROLE_POLICY mode: every identity that completes this login is
#              consoleAdmin, which is why the application is bound to
#              `authentik Admins` on the authentik side and the console sits
#              behind the gated Gateway.
#   _CLI       command-line credentials for the NecroniaAssets authors. The
#              PUBLIC authentik client `necronia-cli`
#              (../../authentik/manifests/blueprint-necronia-cli.configmap.yaml),
#              no secret. CLAIM mode: Silo reads the token's `policy` claim,
#              which authentik fills from the user's `silo-<policy>` groups,
#              and applies those named policies. Adding Silo access for a team
#              is a policy in chart-values.yaml plus a group; this file does
#              not change. Runbook: docs/operate/necronia-assets-on-silo.md.
#
# ⚠️ CLAIM_NAME and ROLE_POLICY are mutually exclusive PER PROVIDER, and MinIO
# allows at most ONE claim-mode provider per server. So the default provider
# has ROLE_POLICY and no CLAIM_NAME, the _CLI provider has CLAIM_NAME and no
# ROLE_POLICY, and a third provider would have to be ROLE_POLICY again. This
# is also why the chart's `oidc:` block is unused: it always emits CLAIM_NAME.
#
# 🔴 ONE BROKEN PROVIDER DISABLES ALL OF THEM. Silo fetches every provider's
# discovery document at startup and gives up on OpenID entirely at the first
# failure (internal/config/identity/openid/openid.go, LookupConfig), so a 404
# or an unreachable host on the _CLI URL takes the CONSOLE's login down with
# it: the standing-warnings symptom, "only the password form". Therefore the
# _CLI discovery URL is the LAN host, which the egress policy already admits
# and which does not depend on Cloudflare or the tunnel at restart time. The
# tokens themselves are minted at authentik.techyon.dev; Silo does not check
# `iss`, only signature, `aud` and `exp` (jwt.go, Validate), and both hosts
# sign with the same key.
#
# ⚠️ A change to this file needs `kubectl -n silo rollout restart deploy/silo`:
# the chart's deployment checksum covers its own secret and configmap, not
# `extraSecret`.
#
# The console shows one "Login with" button per provider. The _CLI one cannot
# complete a browser login from the console (its callback is a localhost port
# for the CLI, not the console's), hence its display name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-oidc-config
  namespace: silo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: authentik-oidc
  target:
    name: silo-oidc-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # The key MUST be exactly `config.env` — the chart mounts it at
        # /tmp/minio-config-env/config.env and points MINIO_CONFIG_ENV_FILE there.
        config.env: |
          MINIO_IDENTITY_OPENID_CONFIG_URL="https://authentik.lab.techyon.dev/application/o/silo/.well-known/openid-configuration"
          MINIO_IDENTITY_OPENID_CLIENT_ID="{{ .clientID }}"
          MINIO_IDENTITY_OPENID_CLIENT_SECRET="{{ .clientSecret }}"
          MINIO_IDENTITY_OPENID_SCOPES="openid,profile,email"
          MINIO_IDENTITY_OPENID_ROLE_POLICY="consoleAdmin"
          MINIO_IDENTITY_OPENID_DISPLAY_NAME="Sign in with authentik"
          MINIO_IDENTITY_OPENID_CONFIG_URL_CLI="https://authentik.lab.techyon.dev/application/o/necronia-cli/.well-known/openid-configuration"
          MINIO_IDENTITY_OPENID_CLIENT_ID_CLI="necronia-cli"
          MINIO_IDENTITY_OPENID_CLAIM_NAME_CLI="policy"
          MINIO_IDENTITY_OPENID_SCOPES_CLI="openid,profile,email,minio"
          MINIO_IDENTITY_OPENID_DISPLAY_NAME_CLI="CLI tokens only - not a login"
  data:
    - secretKey: clientID
      remoteRef:
        key: oidc-silo
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: oidc-silo
        property: client_secret
