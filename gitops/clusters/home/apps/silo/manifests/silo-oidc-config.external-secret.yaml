# MinIO OpenID configuration, rendered into the config.env file MinIO reads via
# MINIO_CONFIG_ENV_FILE (chart `extraSecret`).
#
# Reuses the SAME Google client and the SAME 1Password item as the gated
# gateway's SecurityPolicy
# (../../envoy-gateway/manifests/homelab-gated.gateway.yaml): one client to
# maintain, one secret to rotate. The client ID is not secret — the gateway
# policy inlines it too.
#
# ⚠️ MINIO_IDENTITY_OPENID_CLAIM_NAME is deliberately ABSENT. It and ROLE_POLICY
# are mutually exclusive and Silo refuses to start with both. This is also why
# the chart's `oidc:` block is unused: it always emits CLAIM_NAME.
#
# ⚠️ ROLE_POLICY grants consoleAdmin to EVERY identity that can authenticate with
# this client. The consent screen is Internal, so that is the Workspace, and the
# console additionally sits behind the gated Gateway. This is coarse authorisation
# and should not be mistaken for per-user permissions.
#
# ⚠️ Silo needs its OWN authorised redirect URI on the Google client, IN ADDITION
# to the gateway's — different paths, both required:
#
#     https://silo.lab.techyon.dev/oauth2/callback   -- the gateway's gate
#     https://silo.lab.techyon.dev/oauth_callback    -- Silo Console's own login
#
# Registering only the first gives a working gate in front of a console that
# cannot log you in, which reads as a MinIO bug rather than a Google Console
# omission. Both are listed in MANUAL-STEPS.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-oidc-config
  namespace: silo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: silo-oidc-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # The key MUST be exactly `config.env` — the chart mounts it at
        # /tmp/minio-config-env/config.env and points MINIO_CONFIG_ENV_FILE there.
        config.env: |
          MINIO_IDENTITY_OPENID_CONFIG_URL="https://accounts.google.com/.well-known/openid-configuration"
          MINIO_IDENTITY_OPENID_CLIENT_ID="138732748534-v50ig1jfefsmfnf910a8ns4gpj2sj120.apps.googleusercontent.com"
          MINIO_IDENTITY_OPENID_CLIENT_SECRET="{{ .rawClientSecret | trim }}"
          MINIO_IDENTITY_OPENID_SCOPES="openid,profile,email"
          MINIO_IDENTITY_OPENID_ROLE_POLICY="consoleAdmin"
          MINIO_IDENTITY_OPENID_DISPLAY_NAME="Sign in with Google"
  data:
    - secretKey: rawClientSecret
      remoteRef:
        key: GoogleOauthClient
        property: GoogleOauthSecretId.txt
