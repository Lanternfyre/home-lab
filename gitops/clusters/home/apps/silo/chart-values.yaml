# Silo — S3-compatible object store: CI artifacts, and the game's asset sources.
#
# Two buckets, three access needs, which is what most of the configuration
# below is about:
#
#   ci-reports/reports/   rendered HTML quality reports (NDepend, Stryker,
#              BADASS). ANONYMOUSLY READABLE so a browser can open them: an
#              HTML report pulls its CSS and JS through relative links, and a
#              presigned URL signs exactly one object, so every sub-request
#              would 403 and the page would render broken.
#   ci-reports/baseline/  the .ndar analysis result, the trend history, the
#              Stryker baseline. PRIVATE, and NOT regenerable — see
#              protected-volumes.yaml.
#   necronia-assets/      the NecroniaAssets repo's large files (git-annex
#              objects, named by their SHA-256). PRIVATE, published on the
#              internet as s3.lanternfyre.dev for SIGNED requests only
#              (manifests/silo-s3-tunnel.httproute.yaml). Teammates sign with
#              credentials Silo's STS mints from an authentik login; CI signs
#              as `necronia-ci`. Runbook: docs/operate/necronia-assets-on-silo.md.
#
# In ci-reports the access scope is the FIRST key segment on purpose.
# `mc anonymous set` takes a literal prefix and cannot wildcard, so scope-first
# makes "every report is readable" one fixed prefix that never changes as
# projects are added.

# ── Rollout strategy ─────────────────────────────────────────────────────────
# ⚠️ Recreate, NOT RollingUpdate, and this is load-bearing with an RWO volume —
# the same rule ../pihole/chart-values.yaml documents.
#
# The chart defaults to RollingUpdate with maxSurge 100%, which starts the new
# pod BEFORE terminating the old one. Two pods cannot mount one ReadWriteOnce
# iSCSI volume, so the new pod sits in ContainerCreating with
#
#   Multi-Attach error for volume "pvc-..." Volume is already used by pod(s) ...
#
# while the old pod refuses to die. Every future change to this app would
# deadlock. Observed here on 2026-08-27, exactly as pihole predicted.
deploymentUpdate:
  type: Recreate

mode: standalone          # one node; this is a CI artifact store, not a fleet
replicas: 1

# ── Credentials ──────────────────────────────────────────────────────────────
# From 1Password via manifests/silo-auth.external-secret.yaml. NEVER let the
# chart generate these: it writes them into a Secret it owns, so an upgrade can
# regenerate them and every stored credential elsewhere stops matching.
existingSecret: silo-auth
rootUser: ""
rootPassword: ""

# ── Storage ──────────────────────────────────────────────────────────────────
# The PVC is declared in manifests/, not by the chart, because a chart cannot put
# LABELS on its own PVC and `homelab.techyon.dev/protect` must be declarative —
# the same reason pihole and mealie do it this way.
persistence:
  enabled: true
  existingClaim: silo-data
  accessMode: ReadWriteOnce

# ── Buckets ──────────────────────────────────────────────────────────────────
# policy: none — the chart's bucket policies are BUCKET-WIDE, which would expose
# baseline/ alongside reports/. The prefix-scoped grant is in customCommands.
buckets:
  - name: ci-reports
    policy: none
    purge: false
    versioning: false
  # The NecroniaAssets large files, as git-annex objects. Every version that
  # was ever pushed is a whole object here until the repo's weekly prune job
  # drops what no release tag, main or open PR points at. versioning stays
  # off: git-annex names objects by content, so an overwrite never happens.
  #
  # Its hard quota is NOT set here: the custom-command container runs
  # CONCURRENTLY with the one that creates this bucket, so a `quota set` there
  # could run before the bucket exists. The runbook sets it in-pod once
  # (`mc quota set local/necronia-assets --size 30GiB`).
  #
  # 🔴 NEVER `anonymous set` anything on this bucket. It is reachable from the
  # internet; the only thing between the objects and the world is the
  # signature on every request. (The post-job re-applies `anonymous set none`
  # on every sync, so a stray grant would be undone, but do not rely on it.)
  - name: necronia-assets
    policy: none
    purge: false
    versioning: false

# Runs as a post-install/upgrade Job. Idempotent, so re-running on every sync is
# harmless.
#
# ⚠️ This one line is what makes report links openable in a browser. Remove it
# and every link 403s while the pipeline stays green — the failure only shows up
# when somebody clicks one.
customCommands:
  - command: "anonymous set download mysilo/ci-reports/reports"

# ── Least privilege for CI ───────────────────────────────────────────────────
# CI gets a scoped account, never the root credential. The root key can create
# and delete buckets and rewrite policies; the pipeline only ever needs to read
# and write objects in one bucket, and that key is copied into GitHub org secrets
# where more people and more machines can see it.
policies:
  - name: ci-reports-rw
    statements:
      # Objects: read/write/delete plus the multipart verbs, because rclone
      # switches to multipart for anything sizeable and a partial grant fails
      # only on large uploads -- the worst kind of intermittent.
      - resources:
          - "arn:aws:s3:::ci-reports/*"
        actions:
          - "s3:GetObject"
          - "s3:PutObject"
          - "s3:DeleteObject"
          - "s3:AbortMultipartUpload"
          - "s3:ListMultipartUploadParts"
      # Bucket-level: listing is not optional. The store probes reachability with
      # a bucket list before every operation, precisely so an unreachable store
      # fails the build loudly instead of skipping silently.
      - resources:
          - "arn:aws:s3:::ci-reports"
        actions:
          - "s3:ListBucket"
          - "s3:GetBucketLocation"
          - "s3:ListBucketMultipartUploads"

  # Everything git-annex and the prune job need on the assets bucket, and
  # nothing on any other bucket. Two holders: the `necronia-ci` user below,
  # and every teammate whose authentik account is in the group
  # `silo-necronia-assets-rw` -- the name of this policy is what that group's
  # suffix means (apps/authentik/manifests/blueprint-groups.configmap.yaml).
  # ⚠️ Removing this policy FROM SILO is the kill switch: STS credentials carry
  # the policy NAME they were minted with, so once the name grants nothing
  # every outstanding credential is dead until its holder logs in again. A
  # rename here is NOT enough -- the post-job only creates, never deletes --
  # so the runbook's cut-off ends with `mc admin policy rm` in-pod.
  - name: necronia-assets-rw
    statements:
      - resources:
          - "arn:aws:s3:::necronia-assets/*"
        actions:
          - "s3:GetObject"
          - "s3:PutObject"
          - "s3:DeleteObject"          # the prune job drops unused objects
          - "s3:AbortMultipartUpload"
          - "s3:ListMultipartUploadParts"
      - resources:
          - "arn:aws:s3:::necronia-assets"
        actions:
          - "s3:ListBucket"
          - "s3:GetBucketLocation"
          - "s3:ListBucketMultipartUploads"

# ⚠️ This list REPLACES the chart default, and it must. The shipped default
# creates a user `console` with password `console123` and the consoleAdmin
# policy -- a well-known admin credential, on an admin console, that nobody would
# think to look for.
# ⚠️ accessKey must be 3-20 characters. MinIO rejects anything shorter with
# "The access key is invalid. (access key length should be between 3 and 20)",
# and because the make-user container is one of several running CONCURRENTLY in
# the post-job pod, the bucket and the anonymous grant are created successfully
# while the job as a whole sits in Error — the store looks half-working rather
# than plainly broken. `ci` was two characters and did exactly that.
users:
  - accessKey: github-ci
    existingSecret: silo-auth
    existingSecretKey: ciPassword
    policy: ci-reports-rw
  # The NecroniaAssets CI jobs (ARC runners, in-cluster): `git annex get` for
  # a build, and the weekly prune. Static key; the secret is in 1Password and
  # in that repo's Actions secrets SILO_ACCESS_KEY_ID / SILO_SECRET_ACCESS_KEY.
  # ⚠️ The chart creates a user only if it is ABSENT and never updates its
  # secret (_helper_create_user.txt). Rotation is: change 1Password, then
  # `mc admin user rm local necronia-ci` in-pod, then a sync recreates it.
  - accessKey: necronia-ci
    existingSecret: silo-auth
    existingSecretKey: necroniaCiPassword
    policy: necronia-assets-rw

# ── Services ─────────────────────────────────────────────────────────────────
# ClusterIP both: exposure is via HTTPRoutes in manifests/, not LoadBalancers.
service:
  type: ClusterIP
  port: 9000
consoleService:
  type: ClusterIP
  port: 9001

# Routing lives in manifests/*.httproute.yaml, on Envoy Gateway. The chart's own
# Ingress objects would be a second, conflicting source of truth.
ingress:
  enabled: false
consoleIngress:
  enabled: false

resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 2Gi

# ── Console login: Google, not a shared password ─────────────────────────────
# Without this the console asks for the ROOT credential, so the admin key gets
# typed into a browser regularly and shared with whoever needs console access.
# With it, sign-in is per-person against Google and root stays in 1Password as
# break-glass — it still works the day Google is unreachable.
#
# ⚠️ Configured through extraSecret / config.env, NOT the chart's `oidc:` block.
# That block has no key for MINIO_IDENTITY_OPENID_ROLE_POLICY, and it always
# emits MINIO_IDENTITY_OPENID_CLAIM_NAME (defaulting to "policy"). Role policy
# and claim name are MUTUALLY EXCLUSIVE — MinIO rejects both at startup — and
# Google never emits a `policy` claim, so the chart's path leads to users who
# authenticate successfully and then have no permissions at all. config.env sets
# exactly the variables we want and no others.
extraSecret: silo-oidc-config

# ⚠️ The MINIO_* variable names are correct and are not leftovers. Silo keeps
# them deliberately — renaming the product's delivery surfaces, not its protocol
# or its configuration contract.
environment:
  TZ: "Europe/Warsaw"
  # Tells the console which public URL it is served on, so it builds the OIDC
  # callback as <this>/oauth_callback. Behind a Gateway the console cannot infer
  # it from the request, and gets the redirect wrong without this.
  MINIO_BROWSER_REDIRECT_URL: "https://silo.lab.techyon.dev"
  # Path-style addressing only. The wildcard cert covers *.lab.techyon.dev, which
  # is ONE label — bucket.s3.lab.techyon.dev would need a new cert and a new
  # listener. Leaving MINIO_DOMAIN unset keeps MinIO on s3.lab.techyon.dev/<bucket>.
