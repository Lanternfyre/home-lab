# Destination for logical backups of the postgres-ha cluster.
#
# Deliberately on qnap-samba (SMB) rather than qnap-iscsi. The QNAP CSI driver
# v1.6.1 release notes fix a bug where the driver could run mkfs on a volume
# that already had a filesystem -- and this cluster still runs v1.6.0 while
# facing ~20 node re-attachments during the upgrade and CNI migration. SMB
# shares are not block devices and are never formatted, so a backup here does
# not share a failure mode with the iSCSI volumes it is protecting.
#
# It is also browsable directly from the QNAP GUI, so a restore does not
# depend on the cluster being healthy.
#
# ⚠️ The pg-backup CronJob that wrote here was REMOVED 2026-08-15 in favour of
# Velero. This PVC is deliberately kept: it holds the only dumps that exist,
# including postgres-ha-20260807 (the last one before the storage incident) and
# postgres-ha-20260815 (taken by hand once the cluster was recovered). Nothing
# writes to it now. Do not delete it until Velero has a proven restore --
# reclaimPolicy is Retain, so removing the PVC leaks the PV *and* the QNAP
# volume, and `tridentctl delete volume` is then the only cleanup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backup
  labels:
    homelab.techyon.dev/protect: "true"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteMany]
  storageClassName: qnap-samba
  resources:
    requests:
      storage: 10Gi
