apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-admin
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: pg-role-admin
    creationPolicy: Owner
    template:
      data:
        username: tarjei
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: PostgresHAAdmin
        property: password
---
