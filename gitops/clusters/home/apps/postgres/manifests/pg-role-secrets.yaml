---
# Owner of the `reportportal` database (reportportal.database.yaml).
#
# Reuses the shared PostgresHA `password` property, exactly as the necronia and
# techyon roles above do — no new operator field. Rotating it rotates all three
# roles together, which is the existing convention here.
#
# ⚠️ The SAME field is read a second time by
# ../../reportportal/manifests/reportportal-db.external-secret.yaml, which
# materialises it into the reportportal namespace under the key name RP's chart
# expects. Rotate it and both follow; change one side alone and RP cannot
# connect.
#
# No character restrictions apply here: RP consumes this as a discrete env var
# (RP_DB_PASS / POSTGRES_PASSWORD), never interpolated into a connection URI.
# That is NOT true of the RabbitMQ credential — see
# ../../rabbitmq/manifests/rabbitmq-auth.external-secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-reportportal
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: pg-role-reportportal
    creationPolicy: Owner
    template:
      data:
        username: reportportal
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: PostgresHA
        property: password
