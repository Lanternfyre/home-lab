# Nightly logical backup of every database in the postgres-ha cluster.
#
# This is deliberately the simple option: pg_dumpall to a compressed file on an
# SMB share. It gives no point-in-time recovery -- that needs CNPG's
# barmanObjectStore against real object storage, which is the follow-up once an
# off-site target exists. What it does give is a restorable copy, today, before
# any node is rebooted, using no infrastructure that does not already exist.
#
# Restore:
#   gunzip -c /backup/postgres-ha-<ts>.sql.gz | psql -h postgres-ha-rw -U tarjei postgres
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  # 02:15 Europe/Warsaw. Offset from immich-db-backup so the two do not contend
  # for the same SMB share at the same moment.
  schedule: "15 2 * * *"
  timeZone: "Europe/Warsaw"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
        spec:
          restartPolicy: OnFailure
          # MUST run as uid 0. The QNAP CSI driver mounts SMB shares with
          # hardcoded uid=0,gid=0,file_mode=0755 and IGNORES StorageClass
          # mountOptions -- verified empirically: a StorageClass carrying
          # mountOptions [uid=26,gid=26,...] produced a byte-identical mount.
          # fsGroup does not apply to CIFS either. So a non-root container
          # simply cannot write here, and uid 0 is the only option.
          #
          # Confined instead by: no privilege escalation, all capabilities
          # dropped, and a job that only runs pg_dumpall and writes one file.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: dump
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              # Same image as the cluster: pg_dump must be >= the server
              # version, and postgres-ha runs PostgreSQL 18.
              image: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgres-ha-rw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: pg-role-admin, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: pg-role-admin, key: password }
                - name: RETENTION_DAYS
                  value: "14"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backup/postgres-ha-${ts}.sql.gz"
                  tmp="${out}.partial"

                  echo "[$(date -uIs)] dumping all databases from ${PGHOST} as ${PGUSER}"
                  # --clean --if-exists so the dump is replayable onto a live
                  # cluster. Write to .partial first so an interrupted run can
                  # never be mistaken for a complete backup.
                  pg_dumpall --clean --if-exists | gzip -9 > "${tmp}"
                  mv "${tmp}" "${out}"

                  size=$(stat -c %s "${out}")
                  echo "[$(date -uIs)] wrote ${out} (${size} bytes)"
                  # A gzip of an empty dump is ~20 bytes. Anything under 1 KiB
                  # means the dump failed silently; fail loudly instead.
                  if [ "${size}" -lt 1024 ]; then
                    echo "ERROR: backup is implausibly small (${size} bytes)" >&2
                    exit 1
                  fi
                  gzip -t "${out}"
                  echo "[$(date -uIs)] gzip integrity check passed"

                  echo "[$(date -uIs)] pruning backups older than ${RETENTION_DAYS} days"
                  find /backup -name 'postgres-ha-*.sql.gz' -type f \
                       -mtime "+${RETENTION_DAYS}" -print -delete
                  # Clean up any .partial left by a previously killed run.
                  find /backup -name '*.partial' -type f -mtime +1 -print -delete

                  echo "[$(date -uIs)] current backups:"
                  ls -lh /backup/postgres-ha-*.sql.gz
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { memory: 512Mi }
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: pg-backup
