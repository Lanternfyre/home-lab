apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ha
spec:
  instances: 3

  # Propagates the delete-protection label onto the controller-generated
  # per-instance PVCs, which cannot be labelled in git directly.
  # See gitops/clusters/home/protected-volumes.yaml.
  inheritedMetadata:
    labels:
      homelab.techyon.dev/protect: "true"

  storage:
    size: 8Gi
    storageClass: qnap-iscsi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: tarjei
        ensure: present
        login: true
        superuser: true
        createdb: true
        createrole: true
        passwordSecret:
          name: pg-role-admin
      - name: necronia
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: pg-role-necronia
      - name: techyon
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: pg-role-techyon

  bootstrap:
    initdb:
      postInitSQL:
        - CREATE DATABASE necronia;
        - CREATE DATABASE techyon;
