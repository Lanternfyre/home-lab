apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ha
spec:
  instances: 3

  # Propagates the delete-protection label onto the controller-generated
  # per-instance PVCs, which cannot be labelled in git directly.
  # See gitops/clusters/home/protected-volumes.yaml.
  inheritedMetadata:
    labels:
      homelab.techyon.dev/protect: "true"

  storage:
    size: 8Gi
    storageClass: qnap-iscsi

  postgresql:
    parameters:
      max_connections: "100"
      # Reap a vanished client in ~90 s instead of the kernel's 2 h. Measured
      # 2026-09-07: the Cilium kube-proxy-replacement roll reset every
      # established pod connection; clients reconnected, the server never saw
      # a FIN, and 75 idle zombie backends sat against max_connections until
      # authentik could not get a slot and crash-looped. These three are
      # reload-level settings (no restart).
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "3"
      shared_buffers: "128MB"

  monitoring:
    # Off deliberately -- NOT "monitoring disabled". The instance exporter on
    # :9187 keeps running; only the operator's PodMonitor is suppressed. That
    # object cannot carry `release: prometheus-operator`, which is what this
    # cluster's Prometheus CR selects on, so it collected nothing for 132 days.
    # The working monitor is
    # ../../prometheus/manifests/cnpg.podmonitor.yaml.
    enablePodMonitor: false

  managed:
    roles:
      - name: tarjei
        ensure: present
        login: true
        superuser: true
        createdb: true
        createrole: true
        passwordSecret:
          name: pg-role-admin
      - name: necronia
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: pg-role-necronia
      - name: techyon
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: pg-role-techyon
      # Owner of the `reportportal` database (reportportal.database.yaml).
      # Not a superuser and cannot createdb: ReportPortal's migrations service
      # only ever needs DDL inside its own database, which ownership grants.
      - name: reportportal
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: pg-role-reportportal
      # Owner of the `authentik` database (authentik.database.yaml). Same shape
      # as reportportal: ownership is enough for authentik to run its own
      # migrations, and nothing beyond its own database is reachable.
      - name: authentik
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: pg-role-authentik

  bootstrap:
    # ⚠️ postInitSQL runs EXACTLY ONCE, at initdb, and this cluster bootstrapped
    # long ago -- adding a line here now is a no-op that would only take effect
    # if the cluster were rebuilt from scratch. New databases are declared as
    # Database objects instead (reportportal.database.yaml), which the operator
    # reconciles continuously against a running cluster.
    initdb:
      postInitSQL:
        - CREATE DATABASE necronia;
        - CREATE DATABASE techyon;
