# A3 -- ArgoCD's authentik OIDC client credentials.
#
# Read out of the authentik namespace through the authentik-oidc store, so the
# credential authentik generated for the `argocd` provider is the one ArgoCD
# presents.
#
# ⚠️ The `app.kubernetes.io/part-of: argocd` label is LOAD-BEARING. ArgoCD's
# `$<secret-name>:<field>` reference syntax in argocd-cm resolves ONLY against
# Secrets carrying it. Without the label the reference silently stays an
# unresolved literal and login fails with an opaque error.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-authentik-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: argocd-authentik-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        clientID:     "{{ .clientID }}"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: oidc-argocd
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: oidc-argocd
        property: client_secret
