# Reads OIDC client secrets out of the `authentik` namespace so a consumer can
# receive the same client secret authentik was configured with, without any
# credential passing through a human or leaving the cluster.
#
# Scope is deliberately narrow: one remote namespace, and a ServiceAccount whose
# Role names the individual Secrets it may read (see
# apps/authentik/manifests/eso-oidc-reader.rbac.yaml). An ExternalSecret
# pointing here cannot reach anything else.
#
# ⚠️ `server.caProvider` is REQUIRED even for the local cluster. Omitting the
# whole `server` block is rejected by the validating webhook with "a CABundle or
# CAProvider is required" -- the store is simply never created, and every
# ExternalSecret pointing at it fails with "could not get secret data from
# provider". The CA comes from `kube-root-ca.crt`, which the API server
# publishes into every namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: authentik-oidc
spec:
  provider:
    kubernetes:
      remoteNamespace: authentik
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: authentik
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-oidc-reader
          namespace: authentik
