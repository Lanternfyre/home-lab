# Stop LoadBalancer Services from opening a second door on every node.
#
# A LoadBalancer Service allocates a NodePort by DEFAULT, so each one answers on
# its MetalLB address AND on all five node IPs somewhere in 30000-32767. Audited
# 2026-08-17: eleven services, fifteen such ports, none of it mentioned anywhere
# in the repo. Postgres, Immich's Postgres and Redis each had one.
#
# The NodePort is not the weaker door -- it reaches the same pg_hba, the same
# Envoy SecurityPolicy. What makes it worth closing is that a firewall rule
# written against the 192.168.32.x LoadBalancer addresses silently misses the
# 192.168.33.x:3xxxx path, which is this repo's recurring failure shape: a
# control that looks complete and has a hole invisible from the config.
#
# ── Why a policy and not chart values ────────────────────────────────────────
# Four services could set allocateLoadBalancerNodePorts: false directly in git.
# The other seven cannot:
#   - pihole 2.35.0, argo-cd 10.2.2 and mealie 0.1.2 do not expose the field
#     (checked against the published values of each chart).
#   - The two Envoy Gateway Services are generated by the controller, so the
#     alternative was an EnvoyProxy CR plus a parametersRef from each Gateway.
# Declaring the Services again in manifests/ is not an option either: the chart
# Application and the manifests Application would both own the same object and
# fight over it forever.
#
# A cluster-wide default also fixes the durability hole in the four that CAN be
# set in git -- a chart upgrade that recreates a Service would otherwise quietly
# re-open its port.
#
# ── What this does NOT do ────────────────────────────────────────────────────
# It stops ports being ALLOCATED. It does not release ones already allocated:
# upstream keeps existing node ports when the flag flips, verified here by
# server-side dry-run (the flag read false while nodePort: 30669 stayed put).
# Clearing those is a one-time patch per service -- MANUAL-STEPS.md step 0c.
#
# ── failurePolicy: Ignore, deliberately ──────────────────────────────────────
# This matches every Service in the cluster. With Fail, Kyverno being unhealthy
# would block Service creation cluster-wide -- an outage far worse than the
# thing being prevented. Ignoring means a Service created while Kyverno is down
# gets a node port; the audit query in MANUAL-STEPS.md step 0c is what catches
# that, and reopening a port is recoverable where a wedged admission path is not.
#
# ⚠️ Unlike protect-volumes.validatingpolicy.yaml, this canNOT be compiled to a
# native policy: the API server exposes ValidatingAdmissionPolicy but NOT
# MutatingAdmissionPolicy (checked -- it is still alpha and k3s does not enable
# it). So there is no autogen block here; it would only produce
# "skip generating" in the status. This policy lives and dies with the Kyverno
# webhook, which is precisely why the failure mode above had to be the harmless
# one.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: loadbalancer-no-nodeports
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: is-loadbalancer
      expression: "object.spec.type == 'LoadBalancer'"
    # Escape hatch. Phrased the same "allow unless" way as the volume policy:
    # the match proceeds unless the annotation is explicitly "true", so a
    # missing annotations map cannot error the expression.
    - name: not-opted-out
      expression: >-
        !has(object.metadata.annotations) ||
        !('homelab.techyon.dev/allow-nodeport' in object.metadata.annotations) ||
        object.metadata.annotations['homelab.techyon.dev/allow-nodeport'] != 'true'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{ spec: Object.spec{ allocateLoadBalancerNodePorts: false } }
