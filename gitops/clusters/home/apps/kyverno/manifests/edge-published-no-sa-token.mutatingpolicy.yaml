# H3 -- strip the API credential from every pod in a published namespace.
#
# ── Why this exists: the contract met a real chart and the chart won ────────
#
# `edge-published-pod-constraints` REQUIRES `automountServiceAccountToken:
# false` on every pod in an `edge-publish` namespace, because a workload anyone
# on the internet can reach must not carry a live API credential on its
# filesystem. That requirement is right and stays.
#
# The first real workload to meet it was the NetBird chart (netbirdio/helms
# 1.9.0), and it CANNOT satisfy it. Measured 2026-09-06 by rendering the chart
# and reading the output: it templates `automountServiceAccountToken` NOWHERE --
# not on the pod spec, not on the ServiceAccount. Its `serviceAccount:` values
# block does not accept the field, so setting it there is silently ignored,
# which is worse than unsupported. All four components were DENIED at admission:
#
#   vpol-edge-published-pod-constraints denied request: A published pod must
#   set automountServiceAccountToken: false.
#
# ot-demo satisfies the contract because someone hand-wrote its manifests. Any
# upstream chart is a coin flip, and the answer cannot be "relax the rule" --
# that is the rule that keeps an API token out of a pod strangers can reach.
#
# 🔴 SO IT IS MUTATED, NOT DEMANDED. This sets the field on the way in, and the
# validating policy then confirms it. That is deliberately stronger than
# validation alone: it cannot be forgotten by whoever adds the next namespace,
# and it removes the credential even from a chart that has never heard of this
# cluster.
#
# ⚠️ Mutation runs BEFORE validation, which is the only reason these two
# policies can coexist. If Kyverno's ordering ever changed, every published pod
# would be denied -- loudly, not silently, which is the right direction.
#
# ⚠️ `failurePolicy: Fail`, unlike loadbalancer-no-nodeports which uses Ignore.
# That policy prevents a wasteful NodePort; this one removes a credential from
# an internet-facing pod. Admitting pods unmutated while the webhook is down
# would silently reintroduce exactly what it exists to prevent.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: edge-published-no-sa-token
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        homelab.techyon.dev/edge-publish: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # Only act when it is not already correct, so a hand-written manifest that
    # states it -- ot-demo does -- is left exactly as its author wrote it.
    - name: not-already-disabled
      expression: >-
        !has(object.spec.automountServiceAccountToken) ||
        object.spec.automountServiceAccountToken != false
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{ spec: Object.spec{ automountServiceAccountToken: false } }
