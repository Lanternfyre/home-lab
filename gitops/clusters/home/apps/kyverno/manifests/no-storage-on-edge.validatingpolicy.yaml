# Keep the storage stack off the public edge node.
#
# ── Why a policy and not a nodeSelector ─────────────────────────────────────
# `trident-node-linux` tolerates EVERYTHING:
#
#   [{"effect":"NoExecute","operator":"Exists"},
#    {"effect":"NoSchedule","operator":"Exists"}]
#
# `operator: Exists` with no key tolerates every taint of that effect, so the
# `infrastructure.techyon.dev/edge` taint does not repel it. That is deliberate
# upstream -- a CSI node plugin is meant to run everywhere -- and it means the
# taint that keeps ordinary workloads off this node cannot keep the driver off.
#
# Three routes were checked and rejected before this one:
#
#   * a nodeSelector in qnap-trident/chart-values.yaml -- the DaemonSet is owned
#     by a TridentOrchestrator CR, not the chart, so no chart value reaches it.
#   * `kubectl patch` on the DaemonSet -- the operator reconciles it straight
#     back, which is CLAUDE.md's "never patch chart-managed resources" one layer
#     down.
#   * `nodePluginNodeSelector` on the CR -- upstream NetApp Trident supports it
#     and QNAP's v1.6.2 is a fork, but the CRD is SCHEMALESS
#     (x-kubernetes-preserve-unknown-fields), so the cluster cannot say whether
#     the field is honoured, and the CR itself is ArgoCD-managed by a private
#     chart. An unverifiable field that silently does nothing is worse than no
#     control at all: it would look like protection.
#
# ── What this actually protects ────────────────────────────────────────────
# trident-node-linux mounts `trident-csi` and `trident-encryption-keys` and runs
# hostNetwork. The edge node has a public IP, so those keys would be sitting on
# an internet-facing machine.
#
# It could not reach the NAS from there -- the WireGuard AllowedIPs cover node
# /32s only, not 192.168.33.14 -- so this is about the SECRETS, not about
# connectivity. That is still worth a hard stop.
#
# ── The cost, stated ───────────────────────────────────────────────────────
# The DaemonSet controller will retry the denied pod forever, so
# `kubectl -n storage get events` will show a steady trickle of FailedCreate on
# this one node. That noise is the price of a deterministic control, and it is
# preferable to a nodeSelector that may or may not be honoured. If the QNAP
# chart ever gains a nodePluginNodeSelector passthrough -- it is our chart, so
# that is a small change -- prefer it and delete this file.
#
# ⚠️ failurePolicy is left at the default (Fail). This matches ONE namespace and
# one label, so Kyverno being down blocks storage pods in `storage` alone. For a
# rule whose whole job is keeping keys off a public box, refusing to create the
# pod while the guard is down is the correct direction.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-storage-on-edge
spec:
  validationActions: [Deny]
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    # 🔴 A DAEMONSET POD HAS NO spec.nodeName AT ADMISSION TIME.
    #
    # The first version of this condition tested only `object.spec.nodeName`,
    # on the belief that the DaemonSet controller assigns the node directly.
    # It did until Kubernetes 1.12; since then the controller creates the pod
    # with a nodeAffinity `matchFields` term and lets the DEFAULT SCHEDULER
    # bind it. So at CREATE -- the only operation this policy matches --
    # spec.nodeName is EMPTY, the condition was false, and the policy never
    # applied to the one workload it exists to stop.
    #
    # It failed silently and looked healthy: the policy was Ready, its webhook
    # was registered (vpol.validate.kyverno.svc-fail-finegrained-...) and
    # `kubectl get validatingpolicy` showed nothing wrong. The QNAP CSI driver
    # simply registered on the public node, and only node_verify's inverted
    # csinode assertion caught it:
    #
    #   k8s-edge1 has registered CSI driver(s): 'csi.trident.qnap.io'
    #
    # Verified on the live pod -- this is what the DaemonSet actually writes:
    #   nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.
    #     nodeSelectorTerms[0].matchFields[0] =
    #       {key: metadata.name, operator: In, values: [k8s-edge1]}
    #
    # Both forms are matched below. nodeName still appears because a static pod
    # or anything setting it explicitly bypasses the scheduler entirely, and
    # that path must not become the hole.
    #
    # ⚠️ Matched by NODE NAME, not by node label. A label is set by the kubelet
    # from config we control, so a policy keyed on it would stop protecting the
    # node the moment the label were removed -- precisely when protection
    # matters.
    - name: is-targeted-at-an-edge-node
      expression: >-
        (has(object.spec.nodeName) &&
         object.spec.nodeName.startsWith('k8s-edge'))
        ||
        (has(object.spec.affinity) &&
         has(object.spec.affinity.nodeAffinity) &&
         has(object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution) &&
         object.spec.affinity.nodeAffinity
           .requiredDuringSchedulingIgnoredDuringExecution
           .nodeSelectorTerms.exists(term,
             has(term.matchFields) &&
             term.matchFields.exists(f,
               f.key == 'metadata.name' &&
               f.values.exists(v, v.startsWith('k8s-edge')))))

  validations:
    - expression: >-
        !has(object.metadata.labels) ||
        !('app' in object.metadata.labels) ||
        object.metadata.labels['app'] != 'node.csi.trident.qnap.io'
      message: >-
        The QNAP CSI node plugin may not run on an edge node. It mounts
        trident-csi and trident-encryption-keys and runs hostNetwork, and an
        edge node has a PUBLIC IP -- those keys must not be on it. The
        infrastructure.techyon.dev/edge taint does not stop this DaemonSet
        because it tolerates every taint (operator: Exists), which is why this
        policy exists. If the node genuinely needs storage, it is not an edge
        node.
