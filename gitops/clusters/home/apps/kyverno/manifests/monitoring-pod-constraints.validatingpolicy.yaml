# H3 -- privilege containment in the `monitoring` namespace.
#
# `monitoring` is PSA `privileged` for TWO workloads out of fifteen. Measured,
# not assumed:
#
#   smartctl-exporter    privileged (container `main`) + hostPath  -- reads SMART
#                        data straight off the block devices
#   node-exporter        hostNetwork + hostPID + hostPath          -- not privileged
#   volume-health-export hostPath
#   the other twelve     clean: no privilege, no host namespaces, no hostPath
#
# Twelve clean workloads currently sit in a namespace where PSA asserts nothing,
# because two of their neighbours need host access. This narrows that back down.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: monitoring-pod-constraints
spec:
  # ⚠️ PER-POLICY OPT-IN, or enforcement silently falls back to the Kyverno
  # webhook and dies with Kyverno.
  autogen:
    validatingAdmissionPolicy:
      enabled: true

  validationActions:
    - Deny

  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: sa
      expression: >-
        has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : ''

  validations:
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.privileged) ||
          c.securityContext.privileged == false ||
          (variables.sa == 'smartctl-exporter-prometheus-smartctl-exporter' &&
           c.name == 'main'))
      message: >-
        Only smartctl-exporter may run privileged in `monitoring`, and only its
        `main` container -- it reads SMART data directly from block devices.
        Nothing else in this namespace has ever needed privilege; if a chart
        update introduced it, that is the bug.

    - expression: >-
        variables.sa == 'prometheus-operator-prometheus-node-exporter' ||
        ((!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
         (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
         (!has(object.spec.hostIPC) || object.spec.hostIPC == false))
      message: >-
        Only node-exporter may join host namespaces in `monitoring`. A metrics
        scraper with hostPID can see every process on the node.

    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath)) ||
        variables.sa in [
          'prometheus-operator-prometheus-node-exporter',
          'smartctl-exporter-prometheus-smartctl-exporter',
          'volume-health-exporter'
        ]
      message: >-
        Only node-exporter, smartctl-exporter and volume-health-exporter may
        mount hostPath in `monitoring`. Those three read the node deliberately
        -- block devices, /proc, and the kubelet mount table. A hostPath from
        anything else is a scraper reaching into the host filesystem, which is
        how a read-only metrics component becomes a way off the node.

# hostPath measured, not assumed. Every pod in the namespace, walked for
# `spec.volumes[*].hostPath`:
#
#   node-exporter          /  /proc  /sys
#   smartctl-exporter      /dev
#   volume-health-exporter /dev  /proc  /sys  /var/lib/kubelet
#                          /var/lib/node-exporter/textfile_collector
#   the other twelve       none -- alloy and speedtest-exporter included,
#                          both of which look like they ought to have some
#
# This rule was impossible to write honestly until volume-health-exporter got
# its own ServiceAccount. It ran as `default`, a name every pod in the
# namespace takes by omission, so an allow-list that permitted `default` would
# have permitted everything while reading as protective.
#
# Proving the negative matters more here than proving the positive: a pod with
# a hostPath volume and no allow-listed ServiceAccount must be REJECTED. A test
# that only confirms the three exporters still run passes just as happily
# against a rule that denies nothing.
