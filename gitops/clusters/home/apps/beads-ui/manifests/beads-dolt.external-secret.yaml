# The board's Dolt password: the SAME `beads` user every box and the operator's
# machine connect as, from the same 1Password item as the server
# (apps/beads/manifests/beads-dolt.external-secret.yaml).
#
# ⚠️ Rotation: the board's pod is a Deployment, so a changed password needs a
# pod restart here too -- `kubectl -n beads-ui rollout restart deploy`. Until
# then every page shows bd's "Access denied".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beads-dolt
  namespace: beads-ui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore
  target:
    name: beads-dolt
    creationPolicy: Owner
    template:
      data:
        password: "{{ .raw | trim }}"
  data:
    - secretKey: raw
      remoteRef: {key: Beads Dolt, property: beads-password}
