# Headlamp behind oauth2-proxy, matching the pattern used by pihole, homepage,
# prometheus and pyroscope.
#
# ⚠️ THESE TWO auth ANNOTATIONS ARE LOAD-BEARING SECURITY, not convenience.
# Headlamp is a full cluster UI. Without them it is reachable by anything on the
# LAN. They fail CLOSED — if oauth2-proxy is down, nginx's auth_request gets no
# 2xx and returns 500 rather than passing the request through — so an outage
# locks you out rather than opening the cluster up. That is the correct
# direction, and it is worth knowing before you debug a 500 here.
#
# Google Workspace SSO restricted to techyon.dev by the `hd` claim, same as
# every other app here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: cloudflare-ca
    nginx.ingress.kubernetes.io/auth-url: "https://oauth.lab.techyon.dev/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth.lab.techyon.dev/oauth2/start?rd=https://$host$escaped_request_uri"
    gethomepage.dev/description: Kubernetes Dashboard
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: kubernetes.png
    gethomepage.dev/name: Headlamp
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - headlamp.lab.techyon.dev
      secretName: headlamp-tls
  rules:
    - host: headlamp.lab.techyon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
