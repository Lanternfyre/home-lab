# Headlamp's OIDC credentials, from the SAME 1Password item oauth2-proxy uses
# (`GoogleOauthClient`). Reusing that Google client was a deliberate choice:
# one consent screen, one client to revoke, and it is already proven against
# this Workspace.
#
# The chart consumes this with `envFrom: secretRef`, so the KEYS below become
# environment variables verbatim — they must be named exactly as Headlamp's
# backend expects, which is why they are SCREAMING_CASE rather than the
# kebab-case used in oauth2-proxy's copy of the same credentials.
#
# ⚠️ `| trim` is not cosmetic. The Phase 4 Pushover work found 1Password items
# arrive with trailing whitespace that silently breaks exact-match consumers;
# an OIDC client secret with a trailing newline fails authentication with an
# error that says nothing about whitespace.
#
# ⚠️ `openid email profile` — the `email` scope is LOAD-BEARING. The API server
# is configured with `oidc-username-claim=email`, so without that scope Google
# omits the claim, the username is empty, and the ClusterRoleBinding in
# oidc-admin.clusterrolebinding.yaml matches nothing. It fails closed and looks
# exactly like a broken RBAC rule.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: one-password
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        OIDC_CLIENT_ID: '{{ .rawClientID | trim }}'
        OIDC_CLIENT_SECRET: '{{ .rawClientSecret | trim }}'
        OIDC_ISSUER_URL: "https://accounts.google.com"
        OIDC_SCOPES: "openid email profile"
        OIDC_CALLBACK_URL: "https://headlamp.lab.techyon.dev/oidc-callback"
  data:
    - secretKey: rawClientID
      remoteRef:
        key: GoogleOauthClient
        property: GoogleOauthClientId.txt
    - secretKey: rawClientSecret
      remoteRef:
        key: GoogleOauthClient
        property: GoogleOauthSecretId.txt
