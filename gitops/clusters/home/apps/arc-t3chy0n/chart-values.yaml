# t3chy0n org runner scale set (gha-runner-scale-set 0.14.2).
# Workflows target it with `runs-on: arc-linux`.
#
# Cloned from ../arc-lanternfyre. Every comment there still applies; the notes
# below cover only what DIFFERS, because this scale set exists for a different
# repo with a different problem.

githubConfigUrl: "https://github.com/t3chy0n"

# The 3-key Secret materialized by manifests/github-app.external-secret.yaml.
# Same GitHub App as Lanternfyre (same app-id, same private key) installed on a
# SECOND org, so only the installation-id differs -- see that file.
githubConfigSecret: gha-runner-github-app

runnerScaleSetName: "arc-linux"

minRunners: 0
maxRunners: 3

# 🔴 P0 #3 -- the chart auto-discovers the controller SA via a Helm `lookup`,
# and ArgoCD renders with `helm template`, which has NO cluster access: the
# lookup silently returns empty, the RoleBinding binds to nothing, and the
# scale set sits at zero runners with no error. Always explicit.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  spec:
    # Arbitrary PR code executes in this pod.
    automountServiceAccountToken: false
    priorityClassName: ci-runner
    # ── CI I/O spreading (2026-09-06, the k8s-lab5 disk-saturation incident) ──
    # All 5 arc-linux runners landed on k8s-lab5 at once and pinned its root
    # disk: 100% util, w_await 478 ms, aqu-sq 93, io PSI `full avg10=35`.
    # Prometheus, the ArgoCD application-controller, Redis, RabbitMQ and a
    # CoreDNS replica share that node and were all stalling behind CI.
    #
    # This is NOT a scheduler bug. k8s-lab5 has 20 CPU allocatable against
    # lab4=4, lab6=2, lab7=6, so at `cpu: 2` per runner it is the ONLY node
    # that fits five -- the scheduler packed them there correctly. The trap is
    # that the node with the most CPU has by far the worst disk: its root LVM
    # is on a `BC501A NVMe SK hynix 128GB`, a DRAM-less OEM laptop drive that
    # saturates around 37 MB/s of sustained writes. `_work` is an emptyDir, so
    # every runner's build traffic lands on exactly that device.
    #
    # ⚠️ ephemeral-storage requests/limits do NOT help here. They bound
    # CAPACITY, not throughput -- the node had 29 GB free while stalling.
    #
    # ScheduleAnyway, not DoNotSchedule: lab6 cannot fit even one runner at
    # `cpu: 2`, so a hard constraint would strand runners Pending and cap CI
    # concurrency. This is a scoring preference -- PodTopologySpread carries
    # weight 2 against ImageLocality's 1, so it wins without ever blocking.
    #
    # The selector is `part-of: gha-runner-scale-set`, the label ARC stamps on
    # every runner pod, so the three lanternfyre scale sets spread against each
    # OTHER too, not just within one set. Runner pods come from ARC's
    # EphemeralRunner controller rather than a ReplicaSet, so the default
    # k8s spread rules do not apply and this selector must be explicit --
    # a selector matching nothing is a constraint with no effect and no error.
    topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: gha-runner-scale-set
    # ⚠️ LOAD-BEARING, and the reason the spread above is safe to add.
    # k8s-lab1/2/3 carry NO taints, so "cluster-wide" has always included the
    # etcd servers -- runners simply never scored there while lab5 won on
    # capacity. Spreading changes that: without this guard the first thing the
    # new constraint does is push CI onto an etcd node, where the emptyDir
    # shares a filesystem with the etcd WAL. Spreading CI I/O and letting it
    # reach etcd are the same change unless both land together.
    #
    # ⚠️ This guard and ansible/playbooks/50-ci-taint.yml contradict each other
    # if that switch is ever pointed at a SERVER: the node would be tainted FOR
    # CI and simultaneously forbidden TO CI, and the only symptom is runners
    # stuck Pending with no event naming either half. Dedicate agents, or drop
    # this guard in the same change.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    imagePullSecrets:
      - name: ghcr-pull
    containers:
      - name: runner
        # ── Toolchains: four stacks, one existing image, two downloads ───────
        # claude-workbench builds .NET, Rust, Node and Python. Reusing
        # Lanternfyre's actions-runner-dotnet image covers TWO of the four for
        # free (python3 and the dotnet SDK are already baked, along with
        # gh/oras/trivy). Node and Rust are fetched per job by setup-node and
        # rustup.
        #
        # The alternative was a new four-toolchain image in docker-compedium.
        # Rejected for now: it is a second image to build, publish and keep
        # current, in exchange for saving a couple of minutes on a suite that
        # runs a handful of times a day. If Rust toolchain downloads become the
        # dominant cost, that is the moment to bake them -- and the measurement
        # to make that call is the job timings, not a guess made here.
        #
        # ⚠️ Those two downloads are the reason the egress policy in manifests/
        # is WIDER than Lanternfyre's. Removing an entry there does not slow a
        # job down; it hangs it until timeout.
        image: ghcr.io/lanternfyre/actions-runner-dotnet:latest
        command: ["/home/runner/run.sh"]
        resources:
          # Lighter than Lanternfyre's: that scale set is sized for the
          # Necronia suites whose hosted-runner OOM kills created it. The
          # workbench suites are a .NET test project, a Rust workspace and a
          # jest run -- none of which approached the hosted 7GB limit.
          # ephemeral-storage in BOTH requests and limits, for the reason given
          # in ../arc-lanternfyre/chart-values.yaml (emptyDir shares a
          # filesystem with the containerd image store and the etcd WAL).
          #
          # Rust is the one to watch: a cargo target/ directory plus the
          # registry cache is the largest ephemeral consumer of the four.
          requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
          # NO cpu limit -- repo standing rule (CFS throttling).
          limits: {memory: 6Gi, ephemeral-storage: 12Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
    volumes:
      - {name: work, emptyDir: {sizeLimit: 10Gi}}
