# GitHub App credentials for the t3chy0n runner scale set.
#
# ── One App, two orgs, two installation IDs ──────────────────────────────────
# A GitHub App is installed per-organisation, and each installation gets its own
# id -- but the App ID and private key are properties of the App itself and are
# shared. So this reads the SAME 1Password item as
# ../../arc-lanternfyre/manifests/github-app.external-secret.yaml and differs in
# exactly one property.
#
# Operator side: on the EXISTING 1Password item "ARC-GitHub-App", add one field
#   installation-id-t3chy0n  -- the t3chy0n installation ID (numeric)
# Leave `installation-id` alone: it is Lanternfyre's and that scale set still
# reads it. Naming the new field for its org rather than renaming the old one
# keeps a working deployment working, at the cost of the original field being
# the only one whose name does not say which org it belongs to.
#
# Where to find the id: install the App on the t3chy0n org, then read the number
# at the end of the settings URL
#   https://github.com/organizations/t3chy0n/settings/installations/<id>
#
# ⚠️ The private key must keep its trailing newline (tail -c1 key.pem | xxd -> 0a).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-runner-github-app
  namespace: arc-runners-t3chy0n
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: gha-runner-github-app
    creationPolicy: Owner

  data:
    - secretKey: github_app_id
      remoteRef:
        key: ARC-GitHub-App
        property: app-id
    - secretKey: github_app_installation_id
      remoteRef:
        key: ARC-GitHub-App
        # ⚠️ NOT `installation-id` -- that one is Lanternfyre's.
        property: installation-id-t3chy0n
    - secretKey: github_app_private_key
      remoteRef:
        key: ARC-GitHub-App
        property: private-key
