# Kubelet pull credentials for the private t3chy0n GHCR packages
# (actions-runner-dotnet — the custom runner image this scale set reuses from
# ../../arc-lanternfyre). Same 1Password source, no new operator fields.
#
# A duplicate of ../../arc-lanternfyre/manifests/ghcr-pull.external-secret.yaml
# and necessarily so: an imagePullSecret is a namespaced Secret and the kubelet
# resolves it in the POD's namespace, so a scale set in
# arc-runners-t3chy0n cannot borrow the one in arc-runners-lanternfyre.
#
# ⚠️ If the GHCR PAT is rotated in 1Password, ESO updates both automatically --
# but only because both read the same item. Keep it that way.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: arc-runners-t3chy0n
spec:
  secretStoreRef:
    name: one-password
    kind: ClusterSecretStore

  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"t3chy0n","password":"{{ .ghcrToken }}","auth":"{{ printf "t3chy0n:%s" .ghcrToken | b64enc }}"}}}

  data:
    - secretKey: ghcrToken
      remoteRef:
        key: GHCR
        property: password
