#Notice chart name has to be a part of repoURL for oci
# Large-memory runner scale set (runs-on: arc-linux-xl). Exists so the weekly
# hours-long Stryker job stops camping on the SINGLE docker-capable runner that
# every Quality run needs (operator request, 2026-08-21). Same 0.14.2 pin +
# chart-bump warning as arc-controller/app.yaml. Shares
# ns arc-runners-lanternfyre (github-app + ghcr-pull secrets owned by the
# arc-lanternfyre app dir).
#
# ⚠️ REPLACES arc-lanternfyre-mutation, WHICH STILL EXISTS. Both are registered
# during the migration on purpose -- see arc-lanternfyre-dind/app.yaml for why
# a runnerScaleSetName change cannot be done in place.
#
# ⚠️ Named for the CAPACITY it provides, not the job that asked for it.
# Mutation testing is one consumer of a big serialized runner; naming the pool
# after it made every later consumer look like it was in the wrong place.
repoURL: "ghcr.io/actions/actions-runner-controller-charts"
chart: "gha-runner-scale-set"
targetRevision: "0.14.2"
releaseName: "arc-lanternfyre-xl"
namespace: "arc-runners-lanternfyre"
