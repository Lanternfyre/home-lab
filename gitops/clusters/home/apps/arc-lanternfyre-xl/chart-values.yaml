# Large-memory runner scale set (gha-runner-scale-set 0.14.2).
# Workflows target it with `runs-on: arc-linux-xl`.
#
# REPLACED arc-lanternfyre-mutation (deleted 2026-09-16). This file began as
# that one with a new runnerScaleSetName; everything else was kept
# byte-identical, because every comment below was paid for by an incident.
# Do not "tidy" them.
#
# Why a separate set: mutation (Stryker) is plain dotnet — no docker — but needs
# the big-runner sizing (the 8Gi arc-linux runner was OOM-killed on both
# pilot attempts), and parking it on the docker-capable set starved every
# Quality run of the single dind slot for hours. This set = that memory
# envelope WITHOUT the dind sidecar. It was maxRunners 1 (one long campaign at
# a time) until 2026-11-13; maxRunners below says why it is 4 now.
#
# ⚠️ This is the CAPACITY pool, not a toolchain. It runs the same
# actions-runner-base image as arc-linux; the only differences are the
# envelope and the concurrency cap. Anything that needs docker as well belongs
# on arc-linux-dind, which carries this same envelope plus a daemon.

githubConfigUrl: "https://github.com/Lanternfyre"
githubConfigSecret: gha-runner-github-app

runnerScaleSetName: "arc-linux-xl"

# The migration is over -- arc-lanternfyre-mutation was deleted 2026-09-16.
# (While both were registered the ceiling was briefly 2, harmless only because
# one label was ever referenced at a time.)
#
# 1 -> 4 on 2026-11-13 (Necronia core-v2 R463): a full run's mutation is now
# split into parallel jobs, a group of projects each, that all target this
# label beside the verify job on arc-linux-dind. One runner would run them in
# series. 4 is one per worker; the spread below puts them on different nodes
# when it can, and the cpu request was lowered in the same change so that a
# runner fits k8s-lab4, lab6 and lab7, not only lab5.
minRunners: 0
maxRunners: 4

# P0 #3 — explicit, helm-template lookup returns empty under ArgoCD.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  # The label the dind set's pods carry beside this one names each set's pods
  # for the anti-affinity below (2026-11-13).
  metadata:
    labels:
      lanternfyre.dev/ci-runner: mutation
  spec:
    automountServiceAccountToken: false
    priorityClassName: ci-runner
    # ── CI I/O spreading (2026-09-06, the k8s-lab5 disk-saturation incident) ──
    # All 5 arc-linux runners landed on k8s-lab5 at once and pinned its root
    # disk: 100% util, w_await 478 ms, aqu-sq 93, io PSI `full avg10=35`.
    # Prometheus, the ArgoCD application-controller, Redis, RabbitMQ and a
    # CoreDNS replica share that node and were all stalling behind CI.
    #
    # This is NOT a scheduler bug. k8s-lab5 has 20 CPU allocatable against
    # lab4=4, lab6=2, lab7=6, so at `cpu: 2` per runner it is the ONLY node
    # that fits five -- the scheduler packed them there correctly. The trap is
    # that the node with the most CPU has by far the worst disk: its root LVM
    # is on a `BC501A NVMe SK hynix 128GB`, a DRAM-less OEM laptop drive that
    # saturates around 37 MB/s of sustained writes. `_work` is an emptyDir, so
    # every runner's build traffic lands on exactly that device.
    #
    # ⚠️ ephemeral-storage requests/limits do NOT help here. They bound
    # CAPACITY, not throughput -- the node had 29 GB free while stalling.
    #
    # ScheduleAnyway, not DoNotSchedule: lab6 cannot fit even one runner at
    # `cpu: 2`, so a hard constraint would strand runners Pending and cap CI
    # concurrency. This is a scoring preference -- PodTopologySpread carries
    # weight 2 against ImageLocality's 1, so it wins without ever blocking.
    #
    # The selector is `part-of: gha-runner-scale-set`, the label ARC stamps on
    # every runner pod, so the lanternfyre scale sets spread against each
    # OTHER too, not just within one set. Runner pods come from ARC's
    # EphemeralRunner controller rather than a ReplicaSet, so the default
    # k8s spread rules do not apply and this selector must be explicit --
    # a selector matching nothing is a constraint with no effect and no error.
    topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: gha-runner-scale-set
    # ⚠️ LOAD-BEARING, and the reason the spread above is safe to add.
    # k8s-lab1/2/3 carry NO taints, so "cluster-wide" has always included the
    # etcd servers -- runners simply never scored there while lab5 won on
    # capacity. Spreading changes that: without this guard the first thing the
    # new constraint does is push CI onto an etcd node, where the emptyDir
    # shares a filesystem with the etcd WAL. Spreading CI I/O and letting it
    # reach etcd are the same change unless both land together.
    #
    # ⚠️ This guard and ansible/playbooks/50-ci-taint.yml contradict each other
    # if that switch is ever pointed at a SERVER: the node would be tainted FOR
    # CI and simultaneously forbidden TO CI, and the only symptom is runners
    # stuck Pending with no event naming either half. Dedicate agents, or drop
    # this guard in the same change.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
      # 2026-11-13, the operator's guard after k8s-lab5 rebooted: a mutation
      # pod never shares a node with a dind runner pod. A full run's verify
      # job (dind) and its mutation jobs (this set) start together, and with
      # both on lab5 the node went down; the CPU limits bound each pod, this
      # keeps the two heaviest kinds of CI apart. Required, so it binds both
      # ways: the scheduler also keeps a new dind pod off a node holding a
      # mutation pod. The cost: a dind pod can wait while mutation pods hold
      # every node with room for its 4-CPU request (lab5 and lab7), and a
      # mutation pod waits rather than join the dind pod's node.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                lanternfyre.dev/ci-runner: dind
    # v4 posture: cluster-wide, no nodeSelector/tolerations (reserve switch:
    # ansible/playbooks/50-ci-taint.yml).
    imagePullSecrets:
      - name: ghcr-pull
    containers:
      - name: runner
        # Custom image: gh/oras/trivy/python3 + dotnet SDK baked.
        image: ghcr.io/lanternfyre/actions-runner-base:latest
        command: ["/home/runner/run.sh"]
        resources:
          # Memory: the same envelope that let the Debug build + full test
          # suites survive on the docker-capable set. No CPU limit — standing
          # rule.
          #
          # cpu 4 -> 1 on 2026-11-13 (Necronia core-v2 R463), with maxRunners
          # 1 -> 4. At 4 only k8s-lab5 could take a runner. Measured that day,
          # less the requests of the eight claude boxes parked in the same PR,
          # the workers have lab4 3.3, lab6 1.66, lab7 4.57 and lab5 15.8
          # cores of requests free (no runner up). 1 fits every worker with
          # room for drift, and still fits lab6 if bravo (520m) comes back.
          # The request only places the pod and weights it under contention:
          # with no limit a runner uses what the node has idle, and .NET
          # reports the node's cores, so Stryker's default concurrency follows
          # the node. A group that lands on lab6 (2 cores) is the slow one.
          #
          # cpu limit 2 on 2026-11-13, an exception to the no-CPU-limit rule
          # for this set (the operator: "limit cpus please"). The day #320
          # merged, Necronia core-v2's first split full run put mutation pods
          # on lab4, lab5 and lab7 while a full run still mutated everything in
          # the dind runner on lab5; with no limit each Stryker sized itself
          # from the node's cores (8 test hosts a pod on lab5) and k8s-lab5
          # rebooted at about 12:52Z. A limit is a CFS quota: a pod gets 2
          # cores' time whatever the node has, so four runners use at most 8
          # cores of the workers. Stryker reads the quota for its concurrency
          # (core-v2 T21), so it starts 2 test hosts, not 8, and stays inside
          # the 16Gi memory limit. Request 1 still fits lab6.
          requests: {cpu: "1", memory: 8Gi, ephemeral-storage: 4Gi}
          limits: {cpu: "2", memory: 16Gi, ephemeral-storage: 16Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
    volumes:
      - {name: work, emptyDir: {sizeLimit: 20Gi}}
