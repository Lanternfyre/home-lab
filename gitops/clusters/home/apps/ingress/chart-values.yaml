controller:
  config:
    disable-access-log: "false"

  service:
    # A LoadBalancer Service allocates a NodePort by default, so this
    # controller answered on 192.168.32.13:80/443 AND on
    # 192.168.33.{2,3,7,21,22}:32745/:32137 -- five undeclared doors per port.
    # Same reasoning as postgres-ha-lb; full note in
    # ../postgres/manifests/pg-lb-service.yaml.
    #
    # This one is still load-bearing despite the Envoy Gateway migration: two
    # Ingresses (auth/oauth2-proxy, mcp/github-mcp-proxy) still route through
    # it. Verified against the live cluster rather than assumed from the
    # migration's phase notes.
    #
    # ⚠️ Does not release the already-allocated ports. See MANUAL-STEPS.md.
    allocateLoadBalancerNodePorts: false

  # maxUnavailable MUST be an absolute 1, not the chart default of 25%.
  # With 3 replicas, 25% floors to 0, so the old ReplicaSet can never scale
  # down and the new one can only surge by 1. Combined with the anti-affinity
  # change below that produced a hard deadlock: the surged pod could not
  # schedule (every node already hosted an old pod whose REQUIRED anti-affinity
  # forbade a second controller), and deleting an old pod just got it recreated
  # because the old RS was pinned at 3.
  #
  # maxUnavailable: 1 lets the old RS drop a pod first, freeing a node.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  autoscaling:
    enabled: true
    # minReplicas is never 1: the chart only renders its PodDisruptionBudget
    # when replicas > 1 (a `gt $replicas 1` gate in the template). At
    # minReplicas: 1 there is no PDB at all, so a drain can evict the last
    # controller and take all 13 Ingresses down.
    #
    # ── Why the memory target is GONE, 2026-08-03 ────────────────────────────
    # It was unsatisfiable by construction, and `KubeHpaMaxedOut` fired the
    # moment real alerting was wired up. The note here used to read "the HPA
    # currently sits pinned at 3 anyway (memory 97%/80%)" — it had drifted to
    # **149%/80%** by the time it was measured properly.
    #
    # nginx allocates worker buffers and does not release them, so its memory
    # is roughly constant per replica and says nothing about load. Scaling on
    # it therefore ratchets to maxReplicas and stays there forever, which is
    # not autoscaling — it is a fixed replica count with an alert attached.
    # Measured while deciding this: memory 121Mi / 123Mi / 291Mi per pod
    # against a 120Mi request, while **CPU sat at 3%**. There was no load at
    # all; the only thing keeping three replicas alive was a bad metric.
    #
    # CPU is the correct signal for an ingress controller (RPS would be better
    # still, but needs a custom-metrics adapter we do not run).
    #
    # minReplicas raised 2 -> 3 DELIBERATELY, so that fixing the alert does not
    # quietly reduce availability: the cluster is effectively running 3
    # controllers today and this keeps it there. maxReplicas 3 -> 5 gives one
    # per node and real headroom — and is also what clears the alert, since
    # KubeHpaMaxedOut fires on `desired == max` and desired now sits at 3.
    minReplicas: 3
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    # ⚠️ MUST be an explicit 0, NOT omitted. Helm merges these values over the
    # chart's own defaults, and this chart defaults it to 50 — so deleting the
    # line does not disable memory scaling, it silently sets it to 50, which is
    # STRICTER than the 80 being removed and would scale straight to max.
    # Caught by rendering the chart; the edit looked obviously correct and was
    # exactly backwards. The template guards with `{{- with ... }}`, which skips
    # on an empty value, so 0 is what actually removes the metric.
    targetMemoryUtilizationPercentage: 0

  # topologySpreadConstraints, NOT podAntiAffinity.
  #
  # The original `requiredDuringScheduling` anti-affinity meant exactly one pod
  # per node, so with k8s-lab4/lab5 cordoned every drain left a replica
  # permanently Pending. Relaxing it to `preferred` fixed the drain but proved
  # too weak in practice: when all three replacement pods were scheduled in the
  # same instant, none of them saw the others placed yet, and ALL THREE landed
  # on k8s-lab2 -- strictly worse for availability than what we started with.
  #
  # maxSkew 1 + whenUnsatisfiable: ScheduleAnyway is the combination that
  # actually wants: the scheduler spreads across nodes, but never refuses to
  # place a pod, so a drain still succeeds.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
          # instance is "ingress-nginx" (the Helm releaseName), NOT "ingress"
          # (the app directory name). Verified against the live pod labels --
          # guessing "ingress" here matched zero pods, which would have made
          # this whole constraint a silent no-op.
          app.kubernetes.io/instance: ingress-nginx


  resources:
    requests:
      cpu: 100m
      # 120Mi -> 256Mi, 2026-08-03. The old value was simply wrong: measured
      # usage is 121Mi / 123Mi / 291Mi per pod, so every replica ran above its
      # request permanently. That misleads the scheduler about how much memory
      # the node actually has committed, and it is what made the (now removed)
      # memory-based HPA target unreachable.
      memory: 256Mi
    # Deliberately NO limits. A memory limit here would OOM-kill the 291Mi pod;
    # a CPU limit would throttle it. See the trident-operator entry in
    # MODERNIZATION.md for what a too-low CPU limit actually costs — 70%
    # throttling on the storage operator, from a 20m cap.