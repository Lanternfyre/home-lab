controller:
  config:
    disable-access-log: "false"

  # maxUnavailable MUST be an absolute 1, not the chart default of 25%.
  # With 3 replicas, 25% floors to 0, so the old ReplicaSet can never scale
  # down and the new one can only surge by 1. Combined with the anti-affinity
  # change below that produced a hard deadlock: the surged pod could not
  # schedule (every node already hosted an old pod whose REQUIRED anti-affinity
  # forbade a second controller), and deleting an old pod just got it recreated
  # because the old RS was pinned at 3.
  #
  # maxUnavailable: 1 lets the old RS drop a pod first, freeing a node.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  autoscaling:
    enabled: true
    # minReplicas 2, not 1: the chart only renders its PodDisruptionBudget when
    # replicas > 1 (a `gt $replicas 1` gate in the template). At minReplicas: 1
    # there is no PDB at all, so a drain can evict the last controller and take
    # all 13 Ingresses down. The HPA currently sits pinned at 3 anyway
    # (memory 97%/80%), so this changes no pod count today.
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  affinity:
    podAntiAffinity:
      # PREFERRED, not required. With `required` and topologyKey hostname, three
      # replicas mean exactly one pod per node -- and with k8s-lab4/lab5
      # cordoned there are only three usable nodes, so draining ANY of them
      # leaves a pod permanently Pending and the drain hangs.
      #
      # `preferred` keeps the pods spread in normal operation but lets them
      # co-locate during a drain, which is precisely the behaviour the upgrade
      # and the CNI migration need.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
                app.kubernetes.io/component: controller
            topologyKey: kubernetes.io/hostname


  resources:
    requests:
      cpu: 100m
      memory: 120Mi