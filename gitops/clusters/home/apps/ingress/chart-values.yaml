controller:
  config:
    disable-access-log: "false"

  # maxUnavailable MUST be an absolute 1, not the chart default of 25%.
  # With 3 replicas, 25% floors to 0, so the old ReplicaSet can never scale
  # down and the new one can only surge by 1. Combined with the anti-affinity
  # change below that produced a hard deadlock: the surged pod could not
  # schedule (every node already hosted an old pod whose REQUIRED anti-affinity
  # forbade a second controller), and deleting an old pod just got it recreated
  # because the old RS was pinned at 3.
  #
  # maxUnavailable: 1 lets the old RS drop a pod first, freeing a node.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  autoscaling:
    enabled: true
    # minReplicas 2, not 1: the chart only renders its PodDisruptionBudget when
    # replicas > 1 (a `gt $replicas 1` gate in the template). At minReplicas: 1
    # there is no PDB at all, so a drain can evict the last controller and take
    # all 13 Ingresses down. The HPA currently sits pinned at 3 anyway
    # (memory 97%/80%), so this changes no pod count today.
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # topologySpreadConstraints, NOT podAntiAffinity.
  #
  # The original `requiredDuringScheduling` anti-affinity meant exactly one pod
  # per node, so with k8s-lab4/lab5 cordoned every drain left a replica
  # permanently Pending. Relaxing it to `preferred` fixed the drain but proved
  # too weak in practice: when all three replacement pods were scheduled in the
  # same instant, none of them saw the others placed yet, and ALL THREE landed
  # on k8s-lab2 -- strictly worse for availability than what we started with.
  #
  # maxSkew 1 + whenUnsatisfiable: ScheduleAnyway is the combination that
  # actually wants: the scheduler spreads across nodes, but never refuses to
  # place a pod, so a drain still succeeds.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
          # instance is "ingress-nginx" (the Helm releaseName), NOT "ingress"
          # (the app directory name). Verified against the live pod labels --
          # guessing "ingress" here matched zero pods, which would have made
          # this whole constraint a silent no-op.
          app.kubernetes.io/instance: ingress-nginx


  resources:
    requests:
      cpu: 100m
      memory: 120Mi