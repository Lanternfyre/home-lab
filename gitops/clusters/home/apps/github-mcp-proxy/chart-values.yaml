replicaCount: 1

image:
  repository: ghcr.io/t3chy0n/github-mcp-proxy
  tag: "0.1.1"
  pullPolicy: IfNotPresent

# Pull from GHCR via the `ghcr-docker` Secret rendered by the
# ghcr-docker.external-secret.yaml manifest in this dir. (Without this the
# pod hits ImagePullBackOff because the `mcp` namespace doesn't inherit
# pull secrets from elsewhere — each namespace gets its own.)
imagePullSecrets:
  - name: ghcr-docker

envFromSecret:
  name: github-mcp-pat-secret

service:
  type: ClusterIP
  port: 8080

# ── Migrated to Envoy Gateway (Phase 6) ──────────────────────────────────────
# Routing is manifests/github-mcp.httproute.yaml; basic auth is now an Envoy
# Gateway SecurityPolicy rather than an nginx annotation.
ingress:
  enabled: false

# Probes target /status (returns 200) instead of /sse — the SSE stream never
# completes within the probe timeout, so the default /sse path leaves the pod
# stuck NotReady and the Service publishes no endpoints (ingress returns 503).
probes:
  readiness:
    path: /status
  liveness:
    path: /status

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
