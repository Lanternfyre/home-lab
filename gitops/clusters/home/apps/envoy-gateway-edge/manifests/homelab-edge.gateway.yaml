# THE INTERNET-FACING TCP/UDP GATEWAY. This is what necronia's players connect
# to, and it is the one path in this cluster with no authentication in front of
# it at all -- by design, because a game client cannot sign in to authentik.
#
#   homelab         *.lab.techyon.dev   LAN, open            192.168.32.18
#   homelab-gated   *.lab.techyon.dev   LAN, authentik       192.168.32.19
#   homelab-tunnel  *.techyon.dev       INTERNET, ungated    via cloudflared
#   homelab-edge    raw TCP/UDP         INTERNET, ungated    edge-1 public IP
#
# 🔴 ATTACHING A ROUTE HERE PUBLISHES A PORT TO THE ENTIRE INTERNET, with no
# gate, no TLS termination and no Cloudflare in front of it. Cloudflare's proxy
# carries HTTP; it cannot carry a game protocol. There is nothing between a
# stranger and the backend Service except this Gateway.
#
# The containment is `allowedRoutes` below: a namespace must opt IN by carrying
# a label, which is a reviewable commit to bootstrap/namespaces/, not a side
# effect of deploying an app.
---
# The proxy's shape. Namespace-local to the Gateway, which is why it lives here
# rather than with the LAN EnvoyProxy CRs (there are none -- this is the first
# in the repo).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: edge
  namespace: gateway-edge
spec:
  # 🔴 TWO hostNetwork ENVOYS CANNOT SHARE base-id 0.
  #
  # Envoy binds an ABSTRACT unix domain socket for hot restart, named after its
  # base-id. Abstract sockets are scoped to the NETWORK NAMESPACE -- and
  # `cilium-envoy` also runs hostNetwork on every node, including this one. Both
  # default to base-id 0, so the second one to start loses:
  #
  #   unable to bind domain socket with base_id=0, id=0, errno=98
  #
  # errno 98 is EADDRINUSE. The pod then CrashLoopBackOffs while the Gateway
  # reports `Programmed: False` with reason `NoResources: Envoy replicas
  # unavailable` -- which reads like a scheduling problem, not a name clash.
  #
  # This is a direct consequence of choosing hostNetwork, and it bites ONLY
  # here: the three LAN Envoys are ordinary pods with their own network
  # namespaces, so their base-ids never meet cilium-envoy's.
  #
  # `extraArgs` is the supported way to append to the generated command line --
  # the args list otherwise carries the entire bootstrap config inline, so a
  # strategic-merge patch on it would have to restate all of it.
  extraArgs:
    - --base-id
    - "1"

  provider:
    type: Kubernetes
    kubernetes:
      # 🔴 FALSE, DELIBERATELY, AND THIS IS NOW LOAD-BEARING.
      #
      # This was `true`, with a comment saying it was there so that adding a low
      # port later would fail LOUDLY rather than quietly listening somewhere
      # nobody connects to. That warning did its job: a low port was needed
      # (NetBird wants :443), and the loud failure would have been Envoy
      # refusing to bind without NET_BIND_SERVICE.
      #
      # Granting that capability was the wrong answer.
      # `gateway-edge-pod-constraints` forbids added capabilities
      # UNCONDITIONALLY -- it is the containment on an internet-facing
      # namespace, and weakening it to change a port number is a bad trade.
      #
      # So the shift is now used ON PURPOSE. With this false, Envoy Gateway
      # offsets PRIVILEGED listener ports by +10000: a :443 listener binds
      # :10443 on the host, which needs no capability at all. nftables on the
      # edge rewrites public :443 -> :10443 at prerouting
      # (`edge_fw_service_tcp_dnat` in roles/edge_firewall).
      #
      # ⚠️ 7171/7172/7173 are above 1023 and are NOT shifted, so this flip does
      # not move any existing listener. Verified by reading Envoy Gateway's
      # behaviour, and it MUST be re-verified against the running proxy after
      # this lands -- `ss -lntp` on the edge should show :10443, :7171, :7172.
      #
      # ⚠️ THE TWO HALVES ARE NOT RECONCILED BY ANYTHING. If Envoy Gateway ever
      # changes the offset, or a listener port is added without its DNAT entry,
      # nftables and Envoy disagree about where traffic goes and NOTHING reports
      # it -- the port simply stops answering. `scripts/audit-edge-exposure.py`
      # checks the pairing; run it after any listener change.
      useListenerPortAsContainerPort: false

      # Pinned so the Kyverno policy can name it. Left unset, Envoy Gateway
      # generates `envoy-gateway-envoy-<gateway>-<hash>`, and the hash changes
      # if the Gateway is ever renamed -- which would silently turn the
      # hostNetwork exemption into a deny and take the public path down.
      envoyServiceAccount:
        name: envoy-edge

      envoyService:
        # MetalLB is L2 on 192.168.32.0/23 and this node is not on that segment,
        # so a LoadBalancer would sit <pending> forever. hostNetwork is how this
        # proxy reaches the network; the Service exists only because Envoy
        # Gateway requires one.
        #
        # Also outside the `loadbalancer-no-nodeports` Kyverno policy, which
        # matches `type == 'LoadBalancer'` only -- so no opt-out annotation is
        # needed here.
        type: ClusterIP

      envoyDeployment:
        replicas: 1

        # 🔴🔴 MANDATORY, AND NOT FOR TIDINESS.
        #
        # Under hostNetwork the API SERVER DEFAULTS hostPort = containerPort,
        # and Envoy Gateway declares containerPorts 19001 (metrics) and 19003
        # (readiness). With the default RollingUpdate, a surge pod needs those
        # same host ports on the node the running pod already holds -- so it
        # sits Pending FOREVER. The rollout never completes and never errors,
        # and `kubectl get deploy` just shows 1/2 indefinitely.
        #
        # Cost: ~60s of downtime on the public path per rollout. That is the
        # correct trade for a path that otherwise cannot be updated at all.
        #
        # ⚠️ This is also why TWO hostNetwork Gateways cannot share this node.
        # Scale to N game worlds by adding LISTENERS below, never by adding
        # Gateways.
        strategy:
          type: Recreate

        pod:
          # The taint repels; the label attracts. Both are required and both
          # come from group_vars/k3s_edge.yml, rendered into the kubelet's
          # config at REGISTRATION so there is never a schedulable window.
          nodeSelector:
            infrastructure.techyon.dev/location: edge
          tolerations:
            - key: infrastructure.techyon.dev/edge
              operator: Equal
              value: "true"
              effect: NoSchedule

        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

        # hostNetwork and dnsPolicy are not first-class fields on this CRD, so
        # they go through a strategic-merge patch of the whole Deployment.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  # 🔴 WITHOUT THIS THE PROXY IS INERT AND LOOKS HEALTHY.
                  # dnsPolicy defaults to ClusterFirst, which kubelet degrades
                  # to the HOST's /etc/resolv.conf under hostNetwork. Envoy's
                  # bootstrap xDS cluster is STRICT_DNS on
                  # envoy-gateway.<ns>.svc.cluster.local., so the pod would
                  # start, resolve nothing, receive no configuration and serve
                  # no listeners -- while Running and Ready in `get pods`.
                  dnsPolicy: ClusterFirstWithHostNet
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-edge
  namespace: gateway-edge
  annotations:
    # AFTER the GatewayClass (wave 0). A Gateway cannot go healthy without its
    # class, and ArgoCD blocks on health between waves -- so the class must be
    # in an earlier wave or the two deadlock. See gateway-class.yaml.
    argocd.argoproj.io/sync-wave: "5"
    # 🔴 LOAD-BEARING. external-dns takes its target from this annotation and,
    # ABSENT IT, falls back to the Gateway's Status.Addresses -- which for a
    # ClusterIP Service is 10.43.x.y. It would publish an RFC1918 address for a
    # public game port, and because `policy: upsert-only` it could never take
    # the record back; the only fix would be deleting it by hand in Cloudflare.
    #
    # The VPS's public IP is not discoverable from inside the cluster, so this
    # is the one place in git where it appears.
    external-dns.alpha.kubernetes.io/target: "167.86.81.59"
    #
    # ⚠️ NO `cloudflare-proxied` anywhere on this path. Cloudflare's proxy
    # carries HTTP; proxying a raw game port would break it while looking
    # configured. The record must be a plain unproxied A record.
spec:
  gatewayClassName: envoy-edge
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: edge          # namespace-local -- hence the CR above lives here

  listeners:
    # ⚠️ No `hostname:` on any listener -- Gateway API permits it only on
    # HTTP/HTTPS/TLS. No `tls:` either: this is raw TCP, terminated nowhere.
    #
    # ⚠️ Every listener added here needs a matching entry in
    # `edge_fw_service_tcp` / `edge_fw_service_udp` in
    # ansible/roles/edge_firewall/defaults/main.yml. A listener with no firewall
    # rule is a service that silently does not work; a firewall rule with no
    # listener is a port that answers nothing.
    - name: ot-login
      protocol: TCP
      port: 7171
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          # Opt-IN by label, not `from: All`. This is what stops a route being
          # attached here by accident and publishing something to the internet.
          # The controller enforces it, so a mis-attached route reports
          # `Accepted: False` in its own status where its author will look --
          # unlike a Kyverno rule, which would be a second copy of a constraint
          # Gateway API already expresses natively.
          from: Selector
          selector:
            matchLabels:
              homelab.techyon.dev/edge-publish: "true"

    - name: ot-game
      protocol: TCP
      port: 7172
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.techyon.dev/edge-publish: "true"

    - name: ot-udp
      protocol: UDP
      port: 7173
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.techyon.dev/edge-publish: "true"

    # ── THE ONE PRIVILEGED LISTENER ──────────────────────────────────────────
    #
    # 🔴 DECLARED AS 443; BINDS 10443 ON THE HOST. That is not a typo and not
    # drift. `useListenerPortAsContainerPort: false` above makes Envoy Gateway
    # offset privileged ports by +10000, and nftables on the edge rewrites
    # public :443 -> :10443 at prerouting. Gateway API describes the port the
    # CLIENT connects to; the host bind is an implementation detail of how it is
    # reached without NET_BIND_SERVICE.
    #
    # ⚠️ Its firewall entry is therefore NOT in `edge_fw_service_tcp` with the
    # others -- it is in `edge_fw_service_tcp_dnat`, which emits both the
    # redirect and an input accept on 10443 (accepting 443 would never match,
    # because DNAT has already rewritten the port by the time the filter chain
    # runs).
    #
    # ⚠️ TLS TERMINATES HERE, unlike every other listener on this Gateway. The
    # others are raw TCP/UDP passed through untouched. This one must terminate,
    # because NetBird multiplexes an HTTP dashboard, a REST API, TWO gRPC
    # services and a relay WebSocket onto one endpoint and they can only be
    # separated by path -- which requires reading the request. Envoy is a
    # first-class gRPC proxy, so this is the right place for it; Cloudflare
    # Tunnel is not, because it does not support gRPC on a public hostname.
    - name: netbird-https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          # 🔴 SAME NAMESPACE, DELIBERATELY. This first shipped pointing at
          # `netbird/netbird-public-tls` -- a Secret in a namespace that did not
          # exist yet -- on the theory that the cert belongs with the service.
          # The listener went `ResolvedRefs=False (RefNotPermitted)` and
          # `Programmed=False (Invalid)`, so Envoy never bound it and nothing
          # answered on :443. The other three listeners were unaffected, so the
          # Gateway still reported `Programmed=True` at the top level and
          # nothing looked wrong.
          #
          # A cross-namespace certificateRef also needs a ReferenceGrant in the
          # TARGET namespace, which is a second object in a second Application
          # with no sync-wave between them -- the same ordering trap the
          # GatewayClass comment above describes.
          #
          # `*.techyon.dev` already exists as a wildcard, so the Gateway can own
          # its own copy and depend on nothing.
          - kind: Secret
            group: ""
            name: wildcard-techyon-dev-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
          - kind: GRPCRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.techyon.dev/edge-publish: "true"
---
# The public cert for this Gateway's one terminating listener.
#
# Same shape as `wildcard-techyon-dev` in `gateway-envoy` (see
# apps/envoy-gateway/manifests/homelab-tunnel.gateway.yaml) -- deliberately a
# SECOND Certificate for the same names rather than a shared Secret, because a
# Gateway may only reference a Secret in its own namespace without a
# ReferenceGrant, and cert-manager is perfectly happy to issue twice.
#
# ⚠️ DNS-01 through `cloudflare-ca`, so this does NOT require the name to
# resolve to this node or port 80 to be reachable -- which matters here, because
# the edge firewall drops everything except the published ports.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-techyon-dev
  namespace: gateway-edge
spec:
  secretName: wildcard-techyon-dev-tls
  dnsNames:
    - "*.techyon.dev"
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-ca
