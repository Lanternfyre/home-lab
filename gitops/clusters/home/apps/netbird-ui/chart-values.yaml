# The SAME chart as apps/netbird, with only the dashboard enabled.
#
# Two releases of one chart rather than one release, because the two halves have
# genuinely different exposure:
#
#   apps/netbird      management + signal + relay + routing peer, in an
#                     `edge-publish` namespace, reachable from the internet
#                     because VPN CLIENTS must reach them
#   apps/netbird-ui   the dashboard, on the LAN's authentik-gated Gateway,
#                     because only an operator's browser needs it
#
# That split is what lets the published half satisfy
# `edge-published-pod-constraints` in full while the dashboard runs the
# root-requiring image upstream ships.
global:
  namespace: netbird-ui

management: { enabled: false }
signal:     { enabled: false }
relay:      { enabled: false }
routingPeer: { enabled: false }

dashboard:
  enabled: true
  image:
    tag: "v2.92.0@sha256:fa2d8b02a81761e4d2a22df4041d13316b7635f1e93273eafeb53d4991e55b5a"

  # 🔴 THE HARDENING IS DELIBERATELY RELAXED HERE, AND ONLY HERE.
  #
  # Measured from the image, not assumed: supervisord.conf declares `user=root`
  # for [supervisord] and for every program, and nginx binds :80. Under
  # runAsNonRoot supervisord aborts with "Can't drop privilege as nonroot user";
  # under a non-root UID nginx cannot bind :80 without NET_BIND_SERVICE; and
  # `init_react_envs.sh` writes the rendered config into the served root, so the
  # filesystem cannot be read-only either.
  #
  # This is upstream's image being root-shaped. The honest response is to put it
  # where its exposure justifies -- this namespace is LAN-only and PSA
  # `baseline` -- not to weaken the contract in the namespace facing the
  # internet.
  #
  # 🔴 EVERY KEY BELOW IS `null`, AND THAT IS THE ONLY THING THAT WORKS.
  #
  # This block was first written as `podSecurityContext: {}` and the pod kept
  # crashlooping with the same error, because HELM MERGES MAPS: an empty map is
  # a NO-OP against a chart default, not a reset. Rendering it showed the chart
  # values surviving untouched --
  #
  #   pod: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, ...}
  #   ctr: {readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, ...}
  #
  # -- which reads exactly like the override was ignored, because it was. Only
  # an explicit `null` per key removes an inherited value.
  #
  # What is still enforced, and it is not nothing: PSA `baseline` on the
  # namespace forbids privileged containers, host namespaces and hostPath, and
  # the seccomp profile is kept below because it costs this image nothing.
  podSecurityContext:
    runAsNonRoot: null
    runAsUser: null
    runAsGroup: null
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: null
    readOnlyRootFilesystem: null
    allowPrivilegeEscalation: null
    # nginx forks workers and setuids to its own user, which needs the default
    # capability set. `drop: [ALL]` prevents that -- the master starts and the
    # workers never appear.
    capabilities: null

  # Still required even here: a mutable tag on any workload is how what runs
  # changes without a commit.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

  envRaw:
    - name: NETBIRD_MGMT_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
      value: "https://vpn.techyon.dev"
    # ⚠️ The PUBLIC authentik name, not the `.lab` one, even though this page is
    # served on the LAN. The browser redirects to authentik and the token it
    # receives is presented to the MANAGEMENT API, which validates against the
    # public issuer. Two hostnames mint two different issuers -- EDGE-NODE.md
    # finding 12 -- and the API is the side that must match.
    - name: AUTH_AUTHORITY
      value: "https://authentik.techyon.dev/application/o/netbird/"
    - name: AUTH_CLIENT_ID
      value: "netbird"
    - name: AUTH_SUPPORTED_SCOPES
      value: "openid profile email offline_access"
    # 🔴 REQUIRED, and its absence is a startup abort, not a warning:
    #   "AUTH_AUDIENCE or AUTH0_AUDIENCE environment variable must be set"
    # For a public PKCE client the audience IS the client id.
    - name: AUTH_AUDIENCE
      value: "netbird"
    - name: USE_AUTH0
      value: "false"

  # 🔴 THE CHART'S SCRATCH VOLUMES ARE REMOVED HERE, and removing them is the
  # fix rather than an optimisation.
  #
  # They exist because the chart defaults to a read-only root filesystem. This
  # release does not have one, so they are unnecessary -- and the `/var/run` one
  # is actively harmful: on this image `/var/run` is a SYMLINK to `/run`, so
  # mounting an emptyDir over it replaces the directory nginx keeps its own
  # state in. nginx then dies with
  #
  #   open() "/run/nginx/nginx.pid" failed (2: No such file or directory)
  #
  # which looks like a permissions problem and is actually a mount erasing a
  # directory that shipped in the image.
  #
  # ⚠️ Lists REPLACE on merge in Helm, unlike maps. That is why `[]` works here
  # while `{}` did nothing for securityContext above -- the same values file
  # needs both idioms, for the same reason, in opposite directions.
  volumes: []
  volumeMounts: []
