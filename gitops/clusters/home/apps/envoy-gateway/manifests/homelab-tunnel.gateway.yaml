# THE INTERNET-FACING GATEWAY. Attaching a route here IS the act of publishing
# it, and that is the entire point of a third Gateway rather than a third
# listener on an existing one.
#
#   homelab         *.lab.techyon.dev   LAN, open            192.168.32.18
#   homelab-gated   *.lab.techyon.dev   LAN, authentik       192.168.32.19
#   homelab-tunnel  *.techyon.dev       INTERNET, authentik  via cloudflared
#
# ── Why the public names are ONE level deep ─────────────────────────────────
# Cloudflare's Universal SSL covers the root domain and FIRST-level subdomains
# only -- `techyon.dev` and `*.techyon.dev`. It does NOT cover
# `*.lab.techyon.dev`. Proven rather than read: `openssl s_client` against a
# proxied `canary-public.lab.techyon.dev` returns TLS alert 40 and
# `no peer certificate available`, while the same name straight to the LAN
# Gateway serves the real Let's Encrypt cert. The handshake fails at the edge,
# before any tunnel is consulted.
#
# The alternative was Advanced Certificate Manager at ~$10/month to cover
# `*.lab.techyon.dev` at the edge. Rejected as disproportionate for a homelab.
#
# So a service has TWO names: `app.lab.techyon.dev` on the LAN, unchanged, and
# `app.techyon.dev` from the internet. They do not collide, and the LAN path
# stays available as a control when the public one misbehaves.
#
# ⚠️ `*.techyon.dev` is SHARED SPACE. The apex serves something else entirely
# -- `techyon.dev:443` presents a `*.cyber-folks.pl` certificate -- so a public
# name here must not collide with anything already living on that domain.
---
# The origin certificate: what Envoy presents to cloudflared.
#
# Not to be confused with the EDGE certificate, which is Cloudflare's, covers
# `*.techyon.dev` under Universal SSL, and is what the visitor's browser sees.
# This one is ours, and cloudflared validates it using `originServerName`.
#
# Same issuer, same Cloudflare API token, same DNS-01 flow as
# wildcard-lab-techyon-dev in homelab.gateway.yaml -- adding it costs nothing
# but the ten lines.
#
# ⚠️ The apex `techyon.dev` is deliberately NOT in dnsNames. `*.techyon.dev`
# matches exactly one label, so the apex would need listing explicitly -- and
# it is served by someone else. Issuing for it would let this cluster answer
# for a name it has no business answering for.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-techyon-dev
  namespace: gateway-envoy
spec:
  secretName: wildcard-techyon-dev-tls
  issuerRef:
    name: cloudflare-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.techyon.dev"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-tunnel
  namespace: gateway-envoy
  annotations:
    # 🔴 THIS is why it is a separate Gateway and not a listener.
    #
    # external-dns reads `target` from the GATEWAY and nowhere else -- upstream:
    # "Gateway resource reads only the `target` annotation, while Route
    # resources read all other annotations." Putting it on an HTTPRoute is
    # silently ignored, which cost a debugging session: external-dns fell back
    # to the Gateway's LoadBalancer address and tried to publish a proxied A
    # record to 192.168.32.19, which Cloudflare rejected outright with
    # `9003 Target ... is not allowed for a proxied record`.
    #
    # Here it works as intended: every route attached to this Gateway gets a
    # proxied CNAME to the tunnel, reconciled from git, with no per-route
    # annotations and no records created by hand.
    #
    # ⚠️ Must match `tunnel:` in cloudflare-tunnel/cloudflared.configmap.yaml.
    # A mismatch is a Cloudflare 1033 and nothing at all in-cluster.
    external-dns.alpha.kubernetes.io/target: "69f49aa0-f301-4aa0-9fb1-40025f21a963.cfargotunnel.com"
    #
    # ⚠️ `cloudflare-proxied` is NOT here, and must not be moved here. The split
    # is exact and cuts both ways: the Gateway supplies ONLY `target`, and every
    # OTHER annotation is read from the ROUTE. Both halves were learned by
    # getting them backwards --
    #   `target` on a route  -> ignored; external-dns published a proxied A
    #                           record to 192.168.32.19 and Cloudflare said
    #                           `9003 not allowed for a proxied record`
    #   `proxied` on the Gateway -> ignored; the CNAME was created UNPROXIED and
    #                           `dig` returned the raw cfargotunnel.com target
    #                           instead of Cloudflare's anycast addresses,
    #                           which resolves to nothing a client can reach.
    # See canary/canary-tunnel.httproute.yaml for where it lives.
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.techyon.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-techyon-dev-tls
      allowedRoutes:
        namespaces:
          from: All
  # ⚠️ NO plain-HTTP listener, deliberately. The other two Gateways need one to
  # redirect LAN browsers to https. Nothing reaches this Gateway except
  # cloudflared, which always speaks https to the origin, and Cloudflare
  # already handles http->https at the edge. A listener nothing uses is a
  # listener nobody checks.
  #
  # It still gets a MetalLB LoadBalancer, like the other two. ClusterIP would
  # be tighter -- no LAN listener at all -- but that needs an EnvoyProxy CR.
  #
  # ⚠️ REASSESSED 2026-09-05, because the argument that used to close this
  # paragraph is now WRONG. It read: "the listener is authentik-gated either
  # way and no LAN name resolves to it". The first half died with `tunnel-gate`
  # below -- this LoadBalancer is now an UNGATED path to authentik from
  # anywhere on 192.168.32.0/23, reachable by IP without any name at all.
  #
  # That is judged acceptable and not ignored: `authentik.lab.techyon.dev`
  # already serves the same application ungated on the open `homelab` Gateway,
  # so the LAN could always reach authentik's login page. This adds a second
  # address for something already LAN-reachable, not a new exposure.
  #
  # It is worth tightening when the edge node lands, because that work
  # introduces the EnvoyProxy CR anyway and the "concept this repo does not
  # use" objection disappears with it.

# ⚠️⚠️ THERE IS DELIBERATELY NO SecurityPolicy ON THIS GATEWAY. ⚠️⚠️
#
# It used to carry `tunnel-gate` -- an authentik OIDC gate, `defaultAction:
# Deny`, cascading to every attached route. That was REMOVED on 2026-09-05, and
# removing it inverted what this Gateway means. Read this before attaching
# anything.
#
# ── Why it had to go ────────────────────────────────────────────────────────
# The first thing to publish here is authentik itself, so that NetBird (and any
# future client) can complete an OIDC login from the internet. A gate that
# authenticates against authentik cannot stand in front of authentik: the
# unauthenticated request is redirected to the IdP, which is the very host
# being requested, which redirects again. A loop, not an error page.
#
# This is the same constraint that already put `authentik.lab.techyon.dev` on
# the OPEN `homelab` Gateway rather than on `homelab-gated`. The public side now
# mirrors the LAN side, which is the tidier outcome: in BOTH cases the IdP is
# reached ungated and everything else sits behind it.
#
# ── 🔴 WHAT THIS CHANGES FOR YOU ────────────────────────────────────────────
# Before: attaching a route here published it, BEHIND authentik.
# Now:    attaching a route here publishes it, TO THE ENTIRE INTERNET, ungated.
#
# The safety that used to be structural is now a matter of remembering. So:
#
#   * Attach ONLY things that are safe unauthenticated, and say why in the
#     route's own file.
#   * Anything needing the gate goes on a NEW `homelab-tunnel-gated` Gateway
#     with its own SecurityPolicy, its own MetalLB address and its own
#     cloudflared ingress entry. Do NOT reintroduce a policy here and expect
#     authentik to keep working -- that is the loop above.
#
# ── What is attached today ──────────────────────────────────────────────────
#   authentik.techyon.dev -> authentik/authentik-tunnel  (the IdP; ungated by
#                            necessity, and authentik owns its own auth anyway)
#
# `canary.techyon.dev` was the only other route and was retired with the canary
# on 2026-09-05. It had served its purpose: proving the tunnel path end to end
# before anything real depended on it.
