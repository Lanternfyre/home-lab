# THE `//` ROOT-PATH FIX, HOST-AGNOSTIC. Replaced the index-based
# EnvoyPatchPolicy of the same name on 2026-10-22; its evidence follows,
# unchanged, because it is the only record of WHY this exists.
#
# 🔴 THE ROOT PATH ARRIVES AS `//` THROUGH THE TUNNEL, AND IT LOOPS.
#
# Established by experiment, in this order, and none of it by reading docs:
#
#  1. The tunnel doubles ONLY the empty path. From Envoy's own access log
#     (`x-envoy-origin-path`): `/` -> `//` and `/?probe=1` -> `//?probe=1`,
#     while `/a` and `/foo/bar` arrive untouched.
#  2. Envoy merges INTERIOR adjacent slashes but NOT a bare `//`. Proven with
#     MinIO's XML `<Resource>`, which echoes the path it parsed, needing no
#     cluster change at all: `/a//b` arrives as `/a/b`, `//` arrives as `//`.
#     That is why `merge_slashes: true` is in the listener config and did not
#     save us.
#  3. Go's net/http ServeMux redirects `//` to `/`. Proven by port-forwarding
#     straight to a canary pod: `/` -> 200, `//` -> 307.
#  So the browser asks `/`, the tunnel makes it `//`, the app sends it back to
#  `/`, and round it goes. ERR_TOO_MANY_REDIRECTS, with every in-cluster signal
#  green.
#
# ── Why this is an EnvoyPatchPolicy and not something supported ─────────────
# Gateway API REFUSES to express it:
#     spec.rules[0].matches[0].path: Invalid value: must not contain '//'
# which is the API assuming a normalisation that does not happen here. There is
# no ClientTrafficPolicy field for it either -- `disableMergeSlashes` only
# turns OFF the merging that is already on and already insufficient.
#
# The alternative was a Cloudflare Transform Rule, rejected for a specific
# reason rather than taste: it would fix this ONLY if Cloudflare's edge is what
# doubles the path, and if `cloudflared` does it afterwards the rule never
# matches. That question cannot be answered from inside the cluster -- it needs
# an observation point BETWEEN the edge and the connector. This patch works
# either way, which is the whole argument for it.
#
# ── What it does ────────────────────────────────────────────────────────────
# Rewrites `//` to `/` in place before proxying. No redirect is issued, so
# there is nothing for a client to loop on.
#
# ── Why the patch policy was replaced ───────────────────────────────────────
# It inserted a route at `/virtual_hosts/0/routes/0` naming ONE backend cluster
# (authentik-tunnel), so it protected exactly one hostname -- and since
# 2026-10-22 this Gateway serves two domains. This Lua filter runs on every
# route through `homelab-tunnel`, whatever the host: if `:path` is exactly `//`
# or `//?<query>`, it drops the first slash, then `clearRouteCache()` makes the
# router re-select on the rewritten path. No backend is named, no index.
#
# ── 🔴 The two could NOT be staged side by side -- measured, not assumed ────
# Envoy Gateway does not run this filter globally: it is in the connection
# manager DISABLED, and switched on per route through `typed_per_filter_config`
# on every route Envoy Gateway generates. The patch's injected `//` route was
# not generated by Envoy Gateway, so it had no such entry. Route selection
# happens before the filter chain consults per-route config, so for `//` the
# patch route won and this filter was skipped -- live on 2026-10-22,
# `lua.executions` counted up on normal requests with `lua.errors: 0`, yet `//`
# never carried the marker header. A rewrite patch and a per-route filter
# cannot verify each other; only removing the patch can.
#
# ── Verify, after any change ────────────────────────────────────────────────
#   curl -sk --path-as-is -D- -o /dev/null \
#     --resolve authentik.techyon.dev:443:<homelab-tunnel LB IP> \
#     'https://authentik.techyon.dev//?probe=1'
# must show `x-homelab-root-path: rewritten` and a 302 to the login flow.
# Missing header = this filter did not run on that request.
#
# Status, per ANCESTOR as with every policy here (`.status.conditions` is empty):
#   kubectl -n gateway-envoy get envoyextensionpolicy tunnel-root-path \
#     -o jsonpath='{.status.ancestors[*].conditions}'
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: tunnel-root-path
  namespace: gateway-envoy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-tunnel
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(request_handle)
          local path = request_handle:headers():get(":path")
          if path == "//" or (path ~= nil and path:sub(1, 3) == "//?") then
            request_handle:headers():replace(":path", path:sub(2))
            request_handle:clearRouteCache()
            request_handle:streamInfo():dynamicMetadata():set("homelab", "root_path", "rewritten")
          end
        end

        function envoy_on_response(response_handle)
          local md = response_handle:streamInfo():dynamicMetadata():get("homelab")
          if md ~= nil and md["root_path"] == "rewritten" then
            response_handle:headers():add("x-homelab-root-path", "rewritten")
          end
        end
