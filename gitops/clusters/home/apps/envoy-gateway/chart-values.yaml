config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
    # EnvoyPatchPolicy is an EXTENSION API and is off by default. It is enabled
    # here for manifests/gated-header-size.envoypatchpolicy.yaml, which raises
    # the gate's header limit for oauth cookies -- a listener field no supported
    # API exposes. (It was first enabled for the tunnel's `//` root-path patch;
    # that became a Lua EnvoyExtensionPolicy on 2026-10-22, which needs no flag.)
    #
    # ⚠️ It is an escape hatch that patches generated xDS directly, so it is
    # coupled to the SHAPE of what Envoy Gateway generates and can break on an
    # upgrade rather than at write time. The policy's own status reports
    # whether it applied; treat that as the thing to check after any
    # envoy-gateway version bump, and delete both if this is ever fixed
    # upstream.
    extensionApis:
      enableEnvoyPatchPolicy: true
    logging:
      level:
        default: debug