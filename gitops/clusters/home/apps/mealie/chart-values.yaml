replicaCount: 1

service:
  type: LoadBalancer
  port: 9000

# ── Migrated to Envoy Gateway (Phase 6) ──────────────────────────────────────
# The Ingress is off; routing now lives in manifests/mealie.httproute.yaml.
#
# The chart exposes an `httpRoute:` block, but it is a STUB -- rendering with
# httpRoute.enabled=true produces no object at all, so it cannot be used.
#
# The old annotations and where they went:
#   proxy-body-size: 100m   -> NOT needed. Measured 2026-08-04: Envoy streams
#                              request bodies and accepted a 400 MB POST. That
#                              annotation existed only because nginx defaults
#                              to 1 MB. Migrating relaxes this to unlimited,
#                              accepted knowingly -- LAN-only.
#   cert-manager cluster-issuer -> the Gateway serves one wildcard cert.
#   gethomepage.dev/*       -> moved onto the HTTPRoute, or the app silently
#                              disappears from the homepage dashboard.
ingress:
  enabled: false

httpRoute:
  enabled: false

resources:
  limits:
    memory: 1000Mi
  requests:
    cpu: 100m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false

# --- Mealie specific ---

env:
  ALLOW_SIGNUP: "false"
  PUID: "1000"
  PGID: "1000"
  TZ: "Europe/Warsaw"
  BASE_URL: "https://mealie.lab.techyon.dev"

persistence:
  enabled: false
  existingClaim: qnap-mealie
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""
  mountPath: /app/data

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
