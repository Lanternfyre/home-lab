# H1 -- INGRESS restriction for the home-utils namespace (mealie).
#
# ⚠️ This is the one namespace where the INGRESS direction is the point, and
# egress is deliberately left alone.
#
# Mealie's recipe import fetches arbitrary URLs -- that is a core feature, so an
# egress allow-list would either break it or permit the whole internet, which is
# no restriction at all. Accepted by decision: mealie may talk out.
#
# What it should NOT accept is traffic from other workloads. Mealie is reached
# by a human through the Gateway; nothing else in the cluster has any business
# connecting to it. That is the containment that is actually available here.
#
# From a live capture across all six agents (91 flows): the only ingress was
# 10.245.0.3, a node address -- kubelet probes. Nobody was browsing at the time,
# so the Gateway rule below is from configuration: mealie's HTTPRoute names the
# `homelab` Gateway, whose Envoy pods run in gateway-envoy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mealie-ingress
  namespace: home-utils
spec:
  endpointSelector: {}

  ingress:
    # 🔴 THE PROBE PATH. `world` is deliberate -- read this before "tightening" it.
    #
    # An earlier version used only `fromEntities: [host, remote-node]` and put
    # mealie into CrashLoopBackOff: the kubelet probe was denied and the
    # container killed on liveness, eight times, while the app itself was
    # healthy ("Application startup complete, Uvicorn running on 0.0.0.0:9000").
    #
    # Two things were established by experiment in a scratch namespace, with a
    # real probed pod -- NOT by reasoning, and not on mealie:
    #
    # 1. The same connection is classified DIFFERENTLY BY DIRECTION. Policy is
    #    evaluated on the ingress path, where the node's cilium_host address
    #    resolves as `world`:
    #        10.245.0.3:51338 (world) -> mealie:9000   ingress  <- policy uses this
    #        10.245.0.3:51338 (host)  <- mealie:9000   return
    #    `cilium-dbg ip list` also calls it reserved:host, which is what made
    #    `fromEntities: host` look correct. It is not.
    #
    # 2. A `fromCIDR` allow-list of the six cilium_host addresses ALSO fails,
    #    silently. Cilium CIDR rules do not apply to addresses inside the
    #    cluster pod CIDR, so the rule is inert -- it looks precise and matches
    #    nothing. That attempt crashlooped the test pod identically.
    #
    # `world` is broader than it reads. Pods carry their own cluster identities,
    # so `world` does NOT admit pod-to-pod traffic -- proven: an unrestricted pod
    # in another namespace gets HTTP 000 against this policy, while the kubelet
    # probe passes and the pod reaches 1/1 Running. That is exactly the intent:
    # reachable by a human through the Gateway and by the node, not by other
    # workloads.
    #
    # ⚠️ Replacing `world` with a "tighter" host/CIDR rule will crashloop this
    # pod. Both alternatives were tried and both failed.
    - fromEntities:
        - host
        - remote-node
        - world

    # The Envoy data plane for the `homelab` Gateway. This is how a human
    # reaches mealie, and the only path that should exist.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gateway-envoy

    # Prometheus scraping. Not observed in the capture -- mealie may not be
    # scraped today -- but allowed so that adding a ServiceMonitor later does
    # not fail as a silent metrics gap.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
