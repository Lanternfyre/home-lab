# PSA for this namespace, declared explicitly rather than left to ArgoCD's
# CreateNamespace=true, which makes a BARE namespace with no labels -- and the
# label is the whole point. Same pattern as apps/buildkit/manifests/namespace.yaml.
#
# Level chosen by MEASURING this namespace's running pods against the PSA rules,
# not by guessing: no container is privileged, uses host namespaces, hostPath or
# unconfined profiles -- but they do not all meet `restricted` (capabilities are
# not dropped and seccomp is unset), so that is a later step, not this one.
#
# ⚠️ warn and audit are set to the SAME level as enforce, deliberately. PSA only
# reports at the level you ask for, so a HIGHER warn hides violations of a lower
# enforce -- that is exactly how buildkit's baseline violation stayed invisible
# until it failed to create a pod.
#
# ⚠️ PSA enforces at POD creation, not on the workload template. `kubectl apply
# --dry-run=server` on a Deployment proves nothing here; the acceptance test is
# a real pod.
apiVersion: v1
kind: Namespace
metadata:
  name: home-utils
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.35
