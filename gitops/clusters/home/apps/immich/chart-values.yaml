# Immich v3.0.1 — self-hosted photo library. Chart 0.12.0 is built on
# the bjw-s common library (not the old sub-chart pattern from 0.9.x).
# The chart's appVersion still pins v2.6.3, so the image tag is overridden
# below (shared controllers block) to run the latest Immich release.
#
# External dependencies:
#   - Postgres: dedicated CNPG Cluster in this namespace (see manifests/immich-db.cluster.yaml)
#   - Redis: shared cluster in the redis namespace (see ../redis/)
#   - OAuth: config file from ExternalSecret (see manifests/immich-config.external-secret.yaml)
#   - Library storage: 100Gi SMB PVC on QNAP NAS (see manifests/immich-library.pvc.yaml)

# --- Shared env vars (applied to all Immich components) ---
controllers:
  main:
    annotations:
      # Reloader rolls the Deployment when redis-auth-replicated or
      # immich-config Secrets change. Does NOT roll on immich-db password
      # changes (Postgres stores the password in the DB on first init).
      reloader.stakater.com/auto: "true"
    containers:
      main:
        # Run Immich v3.0.1 (chart 0.12.0 defaults to appVersion v2.6.3).
        # This shared block applies to both server and machine-learning.
        image:
          tag: v3.0.1
        env:
          # --- Dedicated CNPG Postgres (cluster-internal) ---
          DB_HOSTNAME: immich-db-rw.immich.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: pg-role-immich
                key: password

          # --- Shared Redis (plain replication, no Sentinel) ---
          # Connect to the master-only Service. Bitnami's chart creates
          # redis-master (component=master) separate from redis-replicas,
          # so writes always reach the correct pod.
          REDIS_HOSTNAME: redis-master.redis.svc.cluster.local
          REDIS_PORT: "6379"
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: redis-auth-replicated
                key: password

        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits:   { cpu: 2000m, memory: 1536Mi }

# --- Immich-level config ---
immich:
  persistence:
    library:
      existingClaim: immich-library

  # OAuth config from ExternalSecret (see manifests/immich-config.external-secret.yaml).
  # The Secret's key is "immich-config.json" which the chart mounts
  # as the Immich config file. configurationKind must be Secret since
  # the OAuth client credentials are sensitive.
  existingConfiguration: immich-config
  configurationKind: Secret

# --- Bundled Valkey (Redis-compatible cache) OFF ---
# Immich uses the shared Redis from Phase 1 via REDIS_HOSTNAME above.
valkey:
  enabled: false

# --- Immich Server ---
server:
  enabled: true
  # ── Migrated to Envoy Gateway (Phase 6) ────────────────────────────────────
  # Routing is now manifests/immich.httproute.yaml, on the OPEN Gateway --
  # Immich has native Google OAuth, so it must NOT be wrapped a second time.
  #
  # ⚠️ The old `proxy-body-size: "0"` meant UNLIMITED, for large photo uploads.
  # Dropping it is NOT a tightening: measured 2026-08-04, Envoy streams request
  # bodies and accepted a 400 MB POST with HTTP 200, so unlimited is Envoy's
  # behaviour anyway. Setting a "conservative" cap here would have been the
  # change that broke uploads.
  ingress:
    main:
      enabled: false

# --- Machine Learning ---
machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits:   { cpu: 2000m, memory: 3Gi }
  persistence:
    cache:
      enabled: true
      size: 10Gi
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: qnap-iscsi
