# Dedicated CNPG Cluster for Immich, fully isolated from postgres-ha.
# Uses the tensorchord/cloudnative-vectorchord image which is a drop-in
# for CloudNativePG with the VectorChord extension pre-installed —
# required for Immich's smart search / face recognition embeddings.
#
# 3 instances (1 primary + 2 replicas) with modest resources. The existing
# CNPG operator (deployed via the "postgres" ArgoCD app in the databases
# namespace) manages this Cluster CR — no second operator needed.
#
# Why 3 and not 2 — this is an upgrade-safety change, not a capacity one.
# At 2 instances there is exactly ONE switchover target, so every drain in the
# rolling k3s upgrade (three hops, five nodes each) has a single candidate to
# land on. If that node is the one being drained, or is unhealthy, the drain
# stalls against the CNPG PDB — and the correct response to a stalled drain is
# NEVER --force or --disable-eviction, which would kill a primary bypassing its
# PDB. A third instance removes the pinch point instead of creating pressure to
# bypass the safety.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
spec:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3

  # CNPG creates the per-instance PVCs itself, so they cannot be labelled in
  # git directly. inheritedMetadata propagates to "all objects related to the
  # Cluster", which is how the delete-protection label reaches them without
  # needing a Kyverno mutate rule (mutation would fight ServerSideApply).
  # Immich's photo library is worthless without this database: it holds the
  # albums, faces, and smart-search embeddings.
  inheritedMetadata:
    labels:
      homelab.techyon.dev/protect: "true"

  storage:
    size: 20Gi
    storageClass: qnap-iscsi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
    shared_preload_libraries:
      - "vchord.so"

  monitoring:
    # Off deliberately -- see the same note on postgres-ha. The exporter still
    # runs; the operator's PodMonitor cannot carry the `release` label
    # Prometheus selects on, so it was never scraped. This cluster is covered by
    # ../../prometheus/manifests/cnpg.podmonitor.yaml instead.
    enablePodMonitor: false

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: pg-role-immich
      postInitSQL:
        # Immich's migrations create several extensions (vector, vchord,
        # earthdistance, cube, pg_trgm, unaccent, etc.) using CREATE
        # EXTENSION. This requires superuser privileges. Since this is a
        # dedicated single-tenant cluster for Immich only, granting
        # superuser is safe and avoids chasing every new extension Immich
        # adds across versions.
        - ALTER USER immich SUPERUSER;
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
