# Nightly logical backup of the immich-db cluster.
#
# This database holds albums, face recognition and smart-search embeddings.
# The photo files themselves are worth far less without it -- restoring the
# library alone gives you an unindexed pile of images.
#
# Restore:
#   gunzip -c /backup/immich-db-<ts>.sql.gz | psql -h immich-db-rw -U immich postgres
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-backup
spec:
  # 02:45 Europe/Warsaw -- offset from pg-backup (02:15) so the two jobs do not
  # write to the same SMB share simultaneously.
  schedule: "45 2 * * *"
  timeZone: "Europe/Warsaw"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-db-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            fsGroup: 26
          containers:
            - name: dump
              # MUST match the cluster image: immich-db runs PostgreSQL 17 with
              # the VectorChord extension, and pg_dump cannot be older than the
              # server. Do not "helpfully" bump this to the 18 image used by
              # the postgres-ha backup job.
              image: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: immich-db-rw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: pg-role-immich, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: pg-role-immich, key: password }
                - name: RETENTION_DAYS
                  value: "14"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backup/immich-db-${ts}.sql.gz"
                  tmp="${out}.partial"

                  echo "[$(date -uIs)] dumping all databases from ${PGHOST} as ${PGUSER}"
                  pg_dumpall --clean --if-exists | gzip -9 > "${tmp}"
                  mv "${tmp}" "${out}"

                  size=$(stat -c %s "${out}")
                  echo "[$(date -uIs)] wrote ${out} (${size} bytes)"
                  if [ "${size}" -lt 1024 ]; then
                    echo "ERROR: backup is implausibly small (${size} bytes)" >&2
                    exit 1
                  fi
                  gzip -t "${out}"
                  echo "[$(date -uIs)] gzip integrity check passed"

                  echo "[$(date -uIs)] pruning backups older than ${RETENTION_DAYS} days"
                  find /backup -name 'immich-db-*.sql.gz' -type f \
                       -mtime "+${RETENTION_DAYS}" -print -delete
                  find /backup -name '*.partial' -type f -mtime +1 -print -delete

                  echo "[$(date -uIs)] current backups:"
                  ls -lh /backup/immich-db-*.sql.gz
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { memory: 512Mi }
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: immich-db-backup
