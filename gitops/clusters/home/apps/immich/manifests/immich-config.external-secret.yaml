# Immich server configuration (immich-config.json) rendered from a template
# that injects the authentik OIDC client credentials, read out of the authentik
# namespace through the authentik-oidc store. The resulting Secret is referenced
# by the Immich Helm chart via immich.existingConfiguration.
#
# A4 -- was Google Workspace OIDC from the shared GoogleOauthClient 1Password
# item. Credentials are now generated in-cluster and never leave it.
#
# ⚠️ Immich has THREE redirect URIs, not one: the web callback, the mobile
# override, and the app.immich:/// deep link the mobile client uses. All three
# are declared in the blueprint -- dropping the deep link breaks the phone app
# while the browser keeps working, which is easy to miss.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik-oidc
    kind: ClusterSecretStore
  target:
    name: immich-config
    creationPolicy: Owner
    template:
      data:
        immich-config.yaml: |
          {
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://authentik.lab.techyon.dev/application/o/immich/",
              "clientId": "{{ .rawClientID }}",
              "clientSecret": "{{ .rawClientSecret }}",
              "scope": "openid email profile",
              "signingAlgorithm": "RS256",
              "buttonText": "Login with authentik",
              "autoRegister": true,
              "autoLaunch": false,
              "mobileOverrideEnabled": true,
              "mobileRedirectUri": "https://photos.lab.techyon.dev/api/oauth/mobile-redirect",
              "defaultStorageQuota": 0
            },
            "passwordLogin": {
              "enabled": true
            }
          }
  data:
    - secretKey: rawClientID
      remoteRef:
        key: oidc-immich
        property: client_id
    - secretKey: rawClientSecret
      remoteRef:
        key: oidc-immich
        property: client_secret
