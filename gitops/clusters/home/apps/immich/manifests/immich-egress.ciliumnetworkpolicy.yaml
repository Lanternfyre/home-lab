# H1 -- default-deny EGRESS for the immich namespace.
#
# Internet egress is ACCEPTED by decision: immich fetches map tiles and machine
# learning models, and blocking that breaks visible features. The containment
# here is therefore about the CLUSTER -- immich may reach the internet, but not
# wander sideways into other namespaces.
#
# From a live capture across all six agents, 469 flows:
#   -> redis/*:6379        117 flows  (the session/queue store)
#   -> immich/*:5432                  (its own CNPG database)
#   -> immich/*:8000, :3003           (machine-learning and internal APIs)
#   -> kube-system/coredns:53
#
# ⚠️ The capture missed one thing entirely: the CNPG instance manager's
# calls to the kube-apiserver, which this policy dropped from the moment it
# landed. That allowance lives in cnpg-instance-egress.ciliumnetworkpolicy.yaml,
# scoped to the database pods -- do not widen this one to cover it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-egress
  namespace: immich
spec:
  endpointSelector: {}

  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # Its own namespace: database, machine learning, internal APIs.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: immich

    # 🟢 OBSERVED, and the single busiest destination in the capture. immich is
    # the reason the redis namespace has a consumer at all.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

    # 🟡 ACCEPTED BY DECISION, not observed idle: map tiles and ML model
    # downloads. `world` is everything outside the cluster -- deliberately broad,
    # because an allow-list of tile and model CDNs would break the first time one
    # changed hostname, and would do so as a hang.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP

    # 🔴 AUTHENTIK, AS THE DATAPATH SEES IT. Immich's OAuth discovery fetches
    # https://authentik.lab.techyon.dev/application/o/immich/..., which resolves
    # to the `homelab` Gateway's LoadBalancer (192.168.32.18). Since kube-proxy
    # replacement (B4, 2026-09-07) Cilium socket LB rewrites that connection to
    # the Envoy BACKEND pod before this policy runs -- so it is no longer
    # `world:443` and the rule above does not match. Envoy binds privileged
    # listeners +10000: the Gateway's :443 is :10443 in the pod.
    #
    # Measured 2026-10-25: login failed with "Unable to login with OAuth"; the
    # server logged `Error in OAuth discovery: TypeError: fetch failed`, and
    # Hubble showed `immich-server -> gateway-envoy/...homelab...:10443 EGRESS
    # DENIED`. A standalone allow CNP with exactly this rule took the fetch to
    # `200 in 324ms`. Same rule, same reason as silo-egress (the 2026-09-08 audit
    # missed this policy: its broad `world` rule hid the exposure).
    - toServices:
        - k8sServiceSelector:
            namespace: gateway-envoy
            selector:
              matchExpressions:
                - key: gateway.envoyproxy.io/owning-gateway-name
                  operator: In
                  values:
                    - homelab
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
