# 100 Gi SMB-backed PVC for the Immich photo library. Using qnap-samba
# so the library is directly browsable from the QNAP NAS GUI and
# mountable from any LAN laptop via SMB — you can drop photos into
# the share and Immich picks them up via external library scan.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  labels:
    # Highest-value data in the cluster: irreplaceable photos. Kyverno denies
    # DELETE on anything carrying this label (see apps/kyverno/manifests/).
    # Registered in gitops/clusters/home/protected-volumes.yaml.
    homelab.techyon.dev/protect: "true"
  annotations:
    # Belt and braces alongside the label: even if this file is deleted or
    # renamed, Argo must not prune or cascade-delete the claim.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteMany]
  storageClassName: qnap-samba
  resources:
    requests:
      storage: 100Gi
