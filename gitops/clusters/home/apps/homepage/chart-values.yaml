replicaCount: 1

image:
  registry: ghcr.io
  repository: gethomepage/homepage
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Environment variables to add to the kea-exporter pods
extraEnv: []
# -- Environment variables from secrets or configmaps to add to the kea-exporter pods
extraEnvFrom: []

config:
  # -- List of allowed hosts (sometimes with the port) that can host your homepage install
  # -- see https://gethomepage.dev/installation/#homepage_allowed_hosts
  # ⚠️ THE HOSTNAME MUST BE LISTED EXPLICITLY NOW. The chart derives the
  # allowed hosts from `ingress.hosts`, so disabling the Ingress for the
  # Gateway migration silently DROPPED home.lab.techyon.dev from this list and
  # every request started failing "Host validation failed" -- a breakage with
  # nothing to do with routing, caused by turning off a block that looked
  # unrelated. Migrating to an HTTPRoute gives the chart nothing to derive
  # from, so it is spelled out here. Chart 4.14.0 also appends `$(POD_IP):3000` itself, which
  # is what lets the kubelet's health probes past this check -- before that,
  # probing by pod IP hit "Host validation failed".
  #
  # ⚠️ UPDATED WITH THE MIGRATION: this is now the GATED Gateway's address
  # (192.168.32.19), not ingress-nginx's 192.168.32.13. Homepage validates the
  # Host header, so leaving the old IP here would have made direct-by-IP access
  # fail with "Host validation failed" -- a silent breakage that has nothing to
  # do with routing and would have been hunted for in the wrong place.
  allowedHosts:
    - home.lab.techyon.dev
    - 192.168.32.19

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80


# ── Migrated to Envoy Gateway (Phase 6) ──────────────────────────────────────
# Routing is manifests/homepage.httproute.yaml, on the GATED Gateway.
#
# Homepage has NO native auth of its own, and it links to every lab URL, so the
# gate is load-bearing rather than decorative -- that is exactly why its
# Ingress carried the oauth2-proxy annotations. Envoy Gateway now performs the
# Google flow directly, so the oauth2-proxy hop disappears.
ingress:
  enabled: false

rbac:
  enabled: true

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi


# -- Additional volumeMounts on the output Deployment definition.
volumes:
  - name: homepage-config
    configMap:
      name: homepage-config

volumeMounts:
  - mountPath: /app/config/bookmarks.yaml
    name: homepage-config
    subPath: bookmarks.yaml
  - mountPath: /app/config/docker.yaml
    name: homepage-config
    subPath: docker.yaml
  - mountPath: /app/config/kubernetes.yaml
    name: homepage-config
    subPath: kubernetes.yaml
  - mountPath: /app/config/services.yaml
    name: homepage-config
    subPath: services.yaml
  - mountPath: /app/config/settings.yaml
    name: homepage-config
    subPath: settings.yaml
  - mountPath: /app/config/widgets.yaml
    name: homepage-config
    subPath: widgets.yaml
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}