replicaCount: 1

image:
  registry: ghcr.io
  repository: gethomepage/homepage
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Environment variables to add to the kea-exporter pods
extraEnv: []
# -- Environment variables from secrets or configmaps to add to the kea-exporter pods
extraEnvFrom: []

config:
  # -- List of allowed hosts (sometimes with the port) that can host your homepage install
  # -- see https://gethomepage.dev/installation/#homepage_allowed_hosts
  # The chart already appends the ingress domain (home.lab.techyon.dev) and the
  # in-cluster Service names, so this list only needs the RAW IP anyone might
  # browse directly. Chart 4.14.0 also appends `$(POD_IP):3000` itself, which
  # is what lets the kubelet's health probes past this check -- before that,
  # probing by pod IP hit "Host validation failed".
  #
  # ⚠️ 192.168.32.13 is INGRESS-NGINX's address, and it is correct only while
  # homepage is still served by nginx. When home.lab.techyon.dev migrates to
  # Envoy Gateway (Phase 6) this must become the gated Gateway's IP
  # (192.168.32.19) or direct-by-IP access starts failing host validation.
  # Deliberately left as-is until that migration, so it is right now rather
  # than right later.
  allowedHosts: ['192.168.32.13']

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80


ingress:
  enabled: true
  ingressClassName: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: cloudflare-ca
    # Google Workspace SSO gate — oauth2-proxy sits in front of the dashboard.
    # Homepage has no native auth, so without this every lab URL it links
    # to would be publicly reachable. rd= must include https://$host because
    # oauth2-proxy lives on a different subdomain; without it oauth2-proxy
    # redirects back to its own success page after auth instead of here.
    nginx.ingress.kubernetes.io/auth-url: "https://oauth.lab.techyon.dev/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth.lab.techyon.dev/oauth2/start?rd=https://$host$escaped_request_uri"
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: home.lab.techyon.dev
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: homepage-tls
      hosts:
        - home.lab.techyon.dev

rbac:
  enabled: true

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi


# -- Additional volumeMounts on the output Deployment definition.
volumes:
  - name: homepage-config
    configMap:
      name: homepage-config

volumeMounts:
  - mountPath: /app/config/bookmarks.yaml
    name: homepage-config
    subPath: bookmarks.yaml
  - mountPath: /app/config/docker.yaml
    name: homepage-config
    subPath: docker.yaml
  - mountPath: /app/config/kubernetes.yaml
    name: homepage-config
    subPath: kubernetes.yaml
  - mountPath: /app/config/services.yaml
    name: homepage-config
    subPath: services.yaml
  - mountPath: /app/config/settings.yaml
    name: homepage-config
    subPath: settings.yaml
  - mountPath: /app/config/widgets.yaml
    name: homepage-config
    subPath: widgets.yaml
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}