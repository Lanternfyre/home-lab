replicaCount: 1

#antiaff:
#  enabled: true
#  avoidRelease: pihole
#  strict: false

serviceDns:
  type: LoadBalancer
  loadBalancerIP: 192.168.32.53
  port: 53

  annotations:
    metallb.io/allow-shared-ip: pihole-svc

serviceWeb:

  type: LoadBalancer
  port: 80
  annotations:
    metallb.io/allow-shared-ip: pihole-svc

ingress:
  enabled: true
  ingressClassName: nginx

  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: cloudflare-ca
    # Google Workspace SSO gate — handled by oauth2-proxy at oauth.lab.techyon.dev.
    # Pi-hole has no native OIDC, so nginx authenticates every request against
    # oauth2-proxy first and only then forwards to the Pi-hole admin UI
    # (which still has its own local password as a second layer).
    # rd= must be a full URL (https://$host$escaped_request_uri) because
    # oauth2-proxy lives on a different subdomain than the protected service;
    # without the scheme+host prefix it redirects back to oauth.lab.techyon.dev
    # instead of the originally requested URL.
    nginx.ingress.kubernetes.io/auth-url: "https://oauth.lab.techyon.dev/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth.lab.techyon.dev/oauth2/start?rd=https://$host$escaped_request_uri"
    gethomepage.dev/description: PIHole Administration Panel
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Administration
    gethomepage.dev/icon: pi-hole.png
    gethomepage.dev/name: PIHole DNS

  hosts:
    - pihole.lab.techyon.dev

  tls:
    - secretName: pihole-tls
      hosts:
        - pihole.lab.techyon.dev
dnsmasq:
  customDnsEntries:
    - address=/k8s-1.home/192.168.33.3
    - address=/k8s-2.home/192.168.33.2
    - address=/k8s-3.home/192.168.33.7
    - address=/k8s-4.home/192.168.33.21
    - address=/k8s-5.home/192.168.33.22
    - address=/mikrotik.home/192.168.33.19
    - address=/nas.home/192.168.33.14
    - address=/pc.home/192.168.33.8
    - address=/router.home/192.168.33.1

env:
  TZ: "Europe/Warsaw"
  DNSMASQ_LISTENING: "all"
  PIHOLE_DNS_: "1.1.1.1;8.8.8.8"

# ── Phase 0.D: off local-path, onto QNAP iSCSI (2026-08-02) ──────────────────
# The old chart-generated claim was `local-path`, whose PV carries nodeAffinity
# pinning it to ONE machine (k8s-lab3). Cordoning that node left Pi-hole
# Pending with "4 node(s) had volume node affinity conflict" — unable to
# reschedule anywhere until that exact machine returned. It took LAN DNS down
# during the first k3s upgrade hop, and because Pi-hole serves the .home names
# the Ansible inventory resolved, it also broke Ansible's reach to the node it
# was mid-upgrade on.
#
# The claim is now declared explicitly at manifests/pihole-data.pvc.yaml, which
# also makes the protect LABEL declarative — the chart supports annotations but
# not labels on its own PVC, so that label used to be applied imperatively.
#
# The old `pihole` PVC is deliberately left in place as a rollback point: it
# carries Prune=false,Delete=false and its PV is reclaimPolicy: Retain.
persistentVolumeClaim:
  enabled: true
  existingClaim: pihole-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

# ⚠️ Recreate, NOT RollingUpdate, and this is load-bearing with an RWO volume.
# The chart defaults to RollingUpdate with maxSurge: 1, which starts a second
# pod BEFORE terminating the first. Two pods cannot mount one ReadWriteOnce
# iSCSI volume from different nodes, so the new pod would sit in
# ContainerCreating while the old one refused to die — a self-inflicted DNS
# outage on every future config change. Recreate stops the old pod first.
strategyType: Recreate

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi