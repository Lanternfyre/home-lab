# Nightly backup of Pi-hole's /etc/pihole config directory: blocklists,
# custom DNS entries (including the k8s-N.home records every Ansible playbook
# depends on), and the query database.
#
# This one matters more than its size suggests. Pi-hole serves *.home for the
# whole LAN, and gitops/clusters/home/apps/pihole/chart-values.yaml is the only
# other place those node records exist. Losing lab3's disk without this backup
# means rebuilding DNS by hand before anything else can be fixed.
#
# WHY POD AFFINITY: the pihole PVC is ReadWriteOnce on local-path, pinned to
# whichever node holds the path (currently k8s-lab3). The job can only attach
# it by landing on that same node.
#
# Restore:
#   kubectl -n dns scale deploy pihole --replicas=0
#   # extract the tarball over /etc/pihole, then scale back to 1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pihole-backup
spec:
  # 03:45 Europe/Warsaw -- last in the nightly chain.
  schedule: "45 3 * * *"
  timeZone: "Europe/Warsaw"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # uid 0 required for the SMB write -- the QNAP CSI driver mounts with
          # hardcoded uid=0 and ignores StorageClass mountOptions.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: pihole
          containers:
            - name: tar
              image: alpine:3.21
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: RETENTION_DAYS
                  value: "14"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backup/pihole-${ts}.tar.gz"
                  tmp="${out}.partial"

                  echo "[$(date -u +%FT%TZ)] archiving /etc-pihole"
                  # Exclude the query-log database: it is large, churns
                  # constantly, and is worthless for recovery. Config, custom
                  # DNS and blocklists are the parts worth keeping.
                  #
                  # NOTE: tar writes to STDOUT and the shell creates the file.
                  # Do not "simplify" this to `tar czf "${tmp}"` -- busybox tar
                  # stats its own output file to avoid archiving itself, and on
                  # a CIFS mount that stat returns ESTALE:
                  #   tar: can't stat tar file: Stale file handle
                  # which leaves a 0-byte file behind and exits 1.
                  tar czf - -C /etc-pihole \
                      --exclude='pihole-FTL.db' \
                      --exclude='*.db-wal' \
                      --exclude='*.db-shm' \
                      . > "${tmp}"
                  mv "${tmp}" "${out}"

                  size=$(stat -c %s "${out}")
                  echo "[$(date -u +%FT%TZ)] wrote ${out} (${size} bytes)"
                  if [ "${size}" -lt 1024 ]; then
                    echo "ERROR: backup implausibly small (${size} bytes)" >&2
                    exit 1
                  fi
                  gzip -t "${out}"
                  tar tzf "${out}" >/dev/null
                  echo "[$(date -u +%FT%TZ)] gzip + tar integrity checks passed"

                  # Prove the custom DNS records actually made it in -- they are
                  # the reason this backup exists.
                  if tar tzf "${out}" | grep -q 'custom.list\|dnsmasq.d'; then
                    echo "[$(date -u +%FT%TZ)] custom DNS records present in archive"
                  else
                    echo "[$(date -u +%FT%TZ)] NOTE: no custom.list in archive (records may live only in the ConfigMap)"
                  fi

                  echo "[$(date -u +%FT%TZ)] pruning older than ${RETENTION_DAYS} days"
                  find /backup -name 'pihole-*.tar.gz' -type f \
                       -mtime "+${RETENTION_DAYS}" -print -delete
                  find /backup -name '*.partial' -type f -mtime +1 -print -delete

                  echo "[$(date -u +%FT%TZ)] current backups:"
                  ls -lh /backup/pihole-*.tar.gz
              volumeMounts:
                - { name: config, mountPath: /etc-pihole, readOnly: true }
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { memory: 256Mi }
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: pihole
                readOnly: true
            - name: backup
              persistentVolumeClaim:
                claimName: pihole-backup
