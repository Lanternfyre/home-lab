# grafana/loki chart — SingleBinary mode, filesystem backend on Trident iSCSI.
# Goal: lightweight single-pod Loki that pairs with the existing kube-prometheus-stack
# Grafana via the Loki datasource wired in prometheus/chart-values.yaml.
# Chart reference: https://github.com/grafana/loki/tree/main/production/helm/loki

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
    enabled: false
  limits_config:
    retention_period: 336h       # 14 days
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  ingester:
    chunk_encoding: snappy

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: qnap-iscsi

# Disable all the distributed components — SingleBinary covers them.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# No memcached — not needed at home-lab scale.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Cluster-internal access only. Grafana talks to the loki service directly.
gateway:
  enabled: false

# Skip test harness and canary.
test:
  enabled: false
lokiCanary:
  enabled: false

# Self-monitoring (Grafana Agent Operator) off -- kube-prometheus-stack scrapes
# Loki through the ServiceMonitor below instead.
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  # Off until 2026-10-25, and Loki's own counters held the numbers that
  # mattered: over 31 days loki_discarded_samples_total showed 471k lines
  # rate_limited, 326k too_far_behind and 127k greater_than_max_sample_age.
  # Alloy cannot tell those apart -- every 400 is reason=ingester_error, and it
  # counts the WHOLE batch (5.3M "dropped" across 53k 400s, for the ~450k lines
  # Loki actually refused). Loki is the only place that says which lines and why.
  #
  # The chart renders this only if the API list Helm is given contains
  # monitoring.coreos.com/v1/ServiceMonitor. ArgoCD passes kind-qualified
  # versions; a local `helm template` needs
  # --api-versions monitoring.coreos.com/v1/ServiceMonitor or shows nothing.
  serviceMonitor:
    enabled: true
    labels:
      # Mandatory -- the Prometheus CR's serviceMonitorSelector matches on this.
      # Without it the object exists, reads correctly, and is loaded by nobody.
      release: prometheus-operator
