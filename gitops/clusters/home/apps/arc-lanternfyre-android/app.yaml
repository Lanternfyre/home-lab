#Notice chart name has to be a part of repoURL for oci
# Android runner scale set (runs-on: arc-linux-android). Exists because the
# Android SDK plus a JDK is ~1.5 GB with exactly ONE consumer -- auq-mobile's
# APK build -- while the general pool runs 30-second gate jobs on ephemeral
# pods at maxRunners 5. Bulk with a single consumer earns its own image and
# pool; node and rust do NOT, because setup-node and rustup fetch those per job
# cheaply.
#
# ⚠️ Named for the TOOLCHAIN it carries -- the third axis after capability
# (-dind) and capacity (-xl). The label is DERIVED from CI_RUNNER by suffix,
# format('{0}-android', vars.CI_RUNNER), so adding this stack added no new
# variable. That is the property the one-variable scheme exists to keep.
#
# Same 0.14.2 pin + chart-bump warning as arc-controller/app.yaml. Shares
# ns arc-runners-lanternfyre (github-app + ghcr-pull secrets are owned by the
# arc-lanternfyre app dir, which holds the namespace-wide objects).
repoURL: "ghcr.io/actions/actions-runner-controller-charts"
chart: "gha-runner-scale-set"
targetRevision: "0.14.2"
releaseName: "arc-lanternfyre-android"
namespace: "arc-runners-lanternfyre"
