replicaCount: 1

# v1.6.2 (2026-07-31), up from v1.6.0. Two fixes matter here:
#
#   v1.6.1 - filesystem-detection hardening before formatting an iSCSI volume:
#            a device-readiness gate plus a second blkid confirmation before
#            mkfs. Without it the driver can format a volume that ALREADY has a
#            filesystem. This is the single documented data-destruction path in
#            our storage layer, and the modernization plan performs ~20 node
#            re-attachments across the k3s upgrade and the CNI migration.
#
#   v1.6.2 - volume attach no longer fails with "no interface is available"
#            when the NAS has multiple IP-bearing interfaces. (Release notes
#            scope this to QuTS hero h6.0.0; our TS-231K runs QTS, so it may
#            not apply -- taken as a bonus, not the reason for the bump.)
#
# v1.6.2 still declares support only up to Kubernetes 1.35, which is why the
# k3s upgrade stops at v1.35.6 rather than going to 1.36.
tridentOperator:
  image: qnapsystem/qnap-csi-operator:v1.6.2
  cgiServerImage : qnapsystem/qnap-csi-backend-qts-sidecar:v1.6.2
  imagePullPolicy: IfNotPresent
  logLevel: debug

  # ── Operator resources, set EXPLICITLY rather than inherited ───────────────
  # The chart (0.1.3+) ships these same numbers as defaults, so this is not a
  # divergence — it is this cluster stating its own resource policy where the
  # policy applies. Worth the duplication for two reasons:
  #   1. A chart knob nothing exercises is a knob nothing has VERIFIED. This
  #      key was added on 2026-08-03; if the only consumer relied on defaults,
  #      a template change that silently stopped honouring it would go unseen.
  #      Standing rule in this repo: assert values, never presence.
  #   2. A chart-default bump would otherwise change this cluster's resource
  #      policy invisibly, inside an upgrade nobody read as a policy change.
  #
  # All MEASURED here, not guessed. These used to be HARDCODED in the chart at
  # `limits.cpu: 20m`, and `CPUThrottlingHigh` fired at **70.2% throttling** the
  # moment real alerting was wired up — on the component that reconciles the
  # storage driver.
  #
  # ⚠️ The instructive part: peak CPU over 24h was **7.7–11.4m**, so it never
  # approached 20m ON AVERAGE and was throttled anyway. CFS enforces quota **per
  # 100ms period**, not as an average — 20m grants 2ms per slice, so a reconcile
  # burst is chopped across many periods while the 2-minute average still reads
  # 2m. **Size a CPU limit for instantaneous burst, not average usage.** 500m
  # allows a 50ms burst per period and still bounds a runaway loop to half a
  # core.
  #
  # Memory: peak working set was **79.4 MiB against the old 80Mi limit** — a
  # rounding error from OOM-kill, unreported because there was no alerting.
  # Requests 64Mi because steady state is ~26Mi but it demonstrably climbs, and
  # 40Mi under-reported the pod to the scheduler.
  #
  # ⚠️ To remove these entirely use `resources: null`, NOT `resources: {}` —
  # Helm MERGES maps rather than replacing them, so `{}` silently does nothing.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 192Mi

tridentOrchestrator:
  image: qnapsystem/qnap-csi:v1.6.2
  debug: true

forceInstallRancherClusterRoles: false
# ── Operator resources ───────────────────────────────────────────────────────
# Deliberately NOT overridden here: chart 0.1.3 made these configurable and its
# defaults are already what this cluster wants (requests 10m/64Mi, limits
# 500m/192Mi). Left to the chart so there is one source of truth rather than
# two values that drift.
#
# Why it changed: the operator's resources used to be HARDCODED in the chart's
# bundle.yaml with `limits.cpu: 20m`. The operator idles at ~2m but bursts while
# reconciling, so the cap was hit constantly -- `CPUThrottlingHigh` fired at
# **70.2% throttling** the moment real alerting was wired up on 2026-08-03, on
# the component that reconciles the storage driver.
#
# ⚠️ The instructive part, measured: peak CPU over 24h was 7.7-11.4m, so the
# operator never approached 20m ON AVERAGE and was throttled anyway. CFS
# enforces quota per 100ms period, not as an average -- 20m grants 2ms per
# 100ms slice, so a reconcile burst gets chopped across many periods while the
# 2-minute average still reads 2m. A CPU limit must be sized for INSTANTANEOUS
# BURST, not average usage. 500m allows a 50ms burst per period and still
# bounds a runaway loop to half a core.
#
# Memory went 80Mi -> 192Mi for a separate measured reason: peak working set
# was 79.4 MiB against the old 80Mi limit -- a rounding error away from being
# OOM-killed.
#
# To override anyway, set tridentOperator.resources here. ⚠️ Use
# `resources: null` to remove them entirely -- `resources: {}` silently does
# nothing, because Helm MERGES maps rather than replacing them.
