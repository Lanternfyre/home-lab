apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qnap-samba # Required. Name your storageclass.
  annotations:
    # See iscsi.storage-class.yaml for why Force=true,Replace=true is required.
    argocd.argoproj.io/sync-options: Force=true,Replace=true

provisioner: csi.trident.qnap.io
# Retain, not Delete. This class backs immich-library (100Gi, irreplaceable).
reclaimPolicy: Retain
parameters:
  selector: "performance=performance1" # Required. Corresponds to the labels in the virtual pool.
  trident.qnap.io/fileProtocol: "smb"
  csi.storage.k8s.io/node-stage-secret-name: "qnap" # Required. It must match the metadata.name in the Secret file.
  csi.storage.k8s.io/node-stage-secret-namespace: "storage" # Required. It must match the metadata.namespace in the Secret file.
allowVolumeExpansion: true