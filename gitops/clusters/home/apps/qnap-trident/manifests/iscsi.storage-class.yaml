apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qnap-iscsi # Required. Name your storageclass.
  annotations:
    # reclaimPolicy is IMMUTABLE on an existing StorageClass, so a plain apply
    # fails with "updates to reclaimPolicy are forbidden".
    #
    # Force=true AND Replace=true together are required: Replace alone maps to
    # `kubectl replace`, which is still an update and hits the same wall. The
    # pair maps to `kubectl replace --force`, i.e. delete + recreate.
    #
    # That is safe here: deleting a StorageClass does not touch existing PVs or
    # PVCs — they reference it by name and bound volumes never consult it. The
    # only gap is that new PVC provisioning fails for the seconds between delete
    # and create. Neither class is the cluster default (local-path is).
    argocd.argoproj.io/sync-options: Force=true,Replace=true
provisioner: csi.trident.qnap.io
# Retain, not Delete: a deleted PVC must never destroy the backing volume on the
# NAS. Existing PVs were patched to Retain imperatively (they are not chart-managed);
# this line governs every volume created from here on.
reclaimPolicy: Retain
parameters:
  selector: "performance=performance1" # Required. Corresponds to the labels in the virtual pool.
  fsType: "ext4" # Optional. You can choose to enter ext4 (default), xfs, or ext3.
  replacementTimeout: '120' # Optional. Define the iSCSI timeout, with a default value of 120 seconds
allowVolumeExpansion: true